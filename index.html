<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .legend .foot{display:block;line-height:1.55}
  .legend{max-width:520px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}

  /* ---------- date picker (restored 03/08) ---------- */
  .pk-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .pk-head{font-size:14px;font-weight:700;color:var(--accent-dk);margin:0 0 4px;
    display:flex;align-items:center;gap:8px}
  .pk-head .bar{width:4px;height:15px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  .pk-sub{font-size:12.5px;color:var(--muted);margin:0 0 13px;line-height:1.5}
  .pk-bar{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .dpwrap{position:relative}
  .dpbtn{display:inline-flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid #cfc6b3;border-radius:9px;padding:9px 14px;font-family:inherit;
    font-size:13px;font-weight:700;line-height:1.2;color:var(--ink);cursor:pointer;transition:.15s}
  .dpbtn:hover{border-color:var(--accent)}
  .dpbtn .cal{font-size:13px}
  .dpbtn .car{color:var(--muted);font-size:9px}
  .dppane{position:absolute;top:calc(100% + 7px);left:0;z-index:60;min-width:330px;
    background:var(--card);border:1px solid var(--line);border-radius:11px;
    box-shadow:0 8px 26px rgba(70,55,30,.16);padding:9px;display:none}
  .dppane.open{display:block}
  .dpitem{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
    background:transparent;border:none;border-radius:8px;padding:9px 11px;cursor:pointer;
    font-family:inherit;color:var(--ink);transition:.12s}
  .dpitem:hover{background:var(--cream2)}
  .dpitem.cur{background:var(--accent-soft,#efe4d2);cursor:default}
  .dpitem .dt{font-size:13px;font-weight:700;white-space:nowrap;flex:0 0 auto;min-width:86px}
  .dpitem .lb{font-size:11.5px;color:var(--muted);line-height:1.45}
  .dpitem.cur .lb{color:#7a6b4d}
  .dpnow{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.4px;
    background:var(--accent);color:#2c2620;border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:1px}
  .pk-note{font-size:11.5px;color:var(--muted);margin-top:11px;line-height:1.55}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 17 trang gốc + 45 bài /articles + 6 trang dự án + sitemap" data-en="Source: Chrome live crawl · 17 core pages + 45 /articles + 6 project pages + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>03/08/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>03 Aug 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>68 trang</b> · Sitemap: <b>67 URL</b>" data-en="Directly measured: <b>68 pages</b> · Sitemap: <b>67 URLs</b>"></span><br>
        Method: Chrome fetch · AbortController 12–15s
      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <!-- date picker -->
  <div class="pk-card">
    <div class="pk-head"><span class="bar"></span><span class="t" data-vi="Chọn ngày audit" data-en="Choose an audit day"></span></div>
    <p class="pk-sub t" data-vi="Mỗi ngày crawl được đóng băng thành một bản báo cáo riêng. Chọn một ngày để mở đúng bản đã lưu của ngày đó." data-en="Each crawl day is frozen as its own report. Pick a day to open that day's saved snapshot."></p>
    <div class="pk-bar">
      <div class="dpwrap">
        <button class="dpbtn" id="dpBtn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="cal">&#128197;</span><span id="dpLabel">03/08/2026</span><span class="car">&#9660;</span>
        </button>
        <div class="dppane" id="dpPane"></div>
      </div>
      <span class="pk-note" style="margin:0" id="dpCount"></span>
    </div>
    <div class="pk-note t" data-vi="Ghi chú: hai ngày 01/08 và 02/08 không có bản đóng băng trên GitHub (lần chạy hôm đó không đẩy archive), nên picker chỉ liệt kê các ngày thực sự đã lưu." data-en="Note: 01 and 02 Aug have no frozen snapshot on GitHub (those runs did not push an archive), so the picker only lists days that were actually saved."></div>
  </div>

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi">
      <div class="lbl t" data-vi="Health Score" data-en="Health Score"></div>
      <div class="score-ring">
        <div class="val" style="color:var(--accent-dk)">84<span style="font-size:15px;color:var(--muted)">/100</span></div>
      </div>
      <div class="note"><span class="tag green t" data-vi="Tốt — site ổn định, phát hiện lỗi mới" data-en="Good — site stable, new defect found"></span></div>
      <div class="delta down t" data-vi="▼ −1 so 02/08 (85) · nguyên nhân: phát hiện schema bị lặp 14 lần/trang, KHÔNG phải site xấu đi" data-en="▼ −1 vs 02 Aug (85) · cause: discovered schema duplicated 14× per page, NOT a site regression"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Trang crawl được" data-en="Pages crawled"></div>
      <div class="val" style="color:var(--green)">68</div>
      <div class="note t" data-vi="17 gốc + 45 bài + 6 dự án · 68/68 trả 200" data-en="17 core + 45 articles + 6 projects · 68/68 return 200"></div>
      <div class="delta flat t" data-vi="= không đổi (68) · 0 timeout, 0 lỗi 4xx/5xx" data-en="= unchanged (68) · 0 timeouts, 0 4xx/5xx errors"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="TTFB TB — trang gốc" data-en="Avg TTFB — core"></div>
      <div class="val" style="color:var(--green)">0,81<span style="font-size:15px">s</span></div>
      <div class="note t" data-vi="12/17 trang gốc &lt;1s · trang chủ 1,32s · /model 1,63s" data-en="12/17 core pages &lt;1s · homepage 1.32s · /model 1.63s"></div>
      <div class="delta down t" data-vi="▼ +0,09s so 02/08 (0,72s) · dao động mạng, vẫn trong ngưỡng tốt" data-en="▼ +0.09s vs 02 Aug (0.72s) · network jitter, still well within a healthy band"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="TTFB TB — bài viết" data-en="Avg TTFB — articles"></div>
      <div class="val" style="color:var(--green)">0,87<span style="font-size:15px">s</span></div>
      <div class="note t" data-vi="Toàn bộ 45 bài · 0,56–2,96s · 36/45 bài &lt;1s" data-en="All 45 articles · 0.56–2.96s · 36/45 under 1s"></div>
      <div class="delta down t" data-vi="▼ +0,09s so 02/08 (0,78s) · 1 bài lẻ 2,96s kéo trung bình lên" data-en="▼ +0.09s vs 02 Aug (0.78s) · a single 2.96s outlier lifts the mean"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Schema (JSON-LD)" data-en="Schema (JSON-LD)"></div>
      <div class="val" style="color:var(--accent-dk)">59/68</div>
      <div class="note t" data-vi="Trang chủ 24 · 13 trang gốc 14–15 · Bài 31–32 · Dự án 0" data-en="Home 24 · 13 core pages 14–15 · Articles 31–32 · Projects 0"></div>
      <div class="delta down t" data-vi="⚠ Đính chính: bài viết là 31–32 (không phải 34 như báo cáo 02/08). Toàn bộ bị lặp 14×" data-en="⚠ Correction: articles carry 31–32 (not 34 as reported 02 Aug). All are duplicated 14×"></div>
    </div>
  </div>

  <!-- Charts -->
  <h2 class="sec t" data-vi="Điểm sức khỏe theo hạng mục &amp; phân bố tốc độ" data-en="Health sub-scores &amp; speed distribution"></h2>
  <div class="grid2">
    <div class="card">
      <h3 class="t" data-vi="5 điểm thành phần (/100)" data-en="5 sub-scores (/100)"></h3>
      <div class="bar-row"><span class="name t" data-vi="Crawlability" data-en="Crawlability"></span><div class="bar-track"><div class="bar-fill" style="width:89%;background:var(--green)">89</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Performance / TTFB" data-en="Performance / TTFB"></span><div class="bar-track"><div class="bar-fill" style="width:90%;background:var(--green)">90</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Structured Data / AEO" data-en="Structured Data / AEO"></span><div class="bar-track"><div class="bar-fill" style="width:80%;background:var(--accent)">80</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="On-page / Meta" data-en="On-page / Meta"></span><div class="bar-track"><div class="bar-fill" style="width:76%;background:var(--blue)">76</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Content" data-en="Content"></span><div class="bar-track"><div class="bar-fill" style="width:77%;background:var(--blue)">77</div></div></div>
      <div class="foot t" data-vi="Health tổng <b>84/100</b> (▼ −1 so 02/08: 85). Điểm giảm <b>không</b> vì site xấu đi mà vì audit hôm nay lần đầu kiểm tra nội dung từng khối JSON-LD và phát hiện <b>toàn bộ schema bị lặp y hệt 14 lần trên mỗi trang</b> — lỗi này đã tồn tại từ trước nhưng chưa được đo. Chi tiết: Crawlability 89 (68/68 trả 200; sitemap 67 URL; listing <code>/articles</code> vẫn chỉ lộ 16/45 link bài trong HTML thô), Performance 90 (53/68 trang &lt;1s = 77,9%, chậm nhất 2,96s — vẫn không trang nào &gt;3s), Structured Data 80 (▼ từ 83; 59/68 trang có schema = 87% nhưng nội dung bị nhân bản 14×), On-page 76 (7/11 ảnh trang chủ thiếu alt sang ngày thứ tư; <code>/projects/*</code> 15/19 ảnh thiếu alt; 0 ảnh dùng lazy-load), Content 77 (bài 1.033–2.896 từ, TB 2.023; 6 trang dự án ~161–178 từ). Trọng số: Crawl 25% · Perf 25% · Schema 20% · On-page 15% · Content 15%." data-en="Overall health <b>84/100</b> (▼ −1 vs 02 Aug: 85). The drop is <b>not</b> a site regression — today's audit inspected the contents of each JSON-LD block for the first time and found that <b>every schema block is repeated identically 14 times on every page</b>. The defect pre-existed but had never been measured. Detail: Crawlability 89 (68/68 return 200; sitemap 67 URLs; the <code>/articles</code> listing still exposes only 16 of 45 article links in raw HTML), Performance 90 (53/68 pages &lt;1s = 77.9%, slowest 2.96s — still nothing above 3s), Structured Data 80 (▼ from 83; 59/68 pages carry schema = 87%, but the payload is duplicated 14×), On-page 76 (7 of 11 homepage images lack alt for a fourth day; <code>/projects/*</code> 15 of 19 images missing alt; zero images use lazy-loading), Content 77 (articles 1,033–2,896 words, avg 2,023; 6 project pages at 161–178 words). Weights: Crawl 25% · Perf 25% · Schema 20% · On-page 15% · Content 15%."></div>
    </div>
    <div class="card">
      <h3 class="t" data-vi="Phân bố tốc độ (68 trang đo trực tiếp)" data-en="Speed distribution (68 pages measured)"></h3>
      <div class="donut-wrap">
        <svg width="150" height="150" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--cream2)" stroke-width="6"></circle>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--green)" stroke-width="6"
            stroke-dasharray="77.9 22.1" stroke-dashoffset="25"></circle>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--amber)" stroke-width="6"
            stroke-dasharray="22.1 77.9" stroke-dashoffset="-52.9"></circle>
          <text x="21" y="20" text-anchor="middle" font-size="7" font-weight="700" fill="#2c2620">68</text>
          <text x="21" y="26.5" text-anchor="middle" font-size="3.2" fill="#6f665a" class="tsvg" data-vi="trang" data-en="pages">trang</text>
        </svg>
        <div class="legend">
          <div><span class="dot" style="background:var(--green)"></span> <span class="t" data-vi="Nhanh &lt;1s: <b>53</b> · 77,9%" data-en="Fast &lt;1s: <b>53</b> · 77.9%"></span></div>
          <div><span class="dot" style="background:var(--amber)"></span> <span class="t" data-vi="1–3s: <b>15</b> · 22,1%" data-en="1–3s: <b>15</b> · 22.1%"></span></div>
          <div><span class="dot" style="background:var(--red)"></span> <span class="t" data-vi="Chậm &gt;3s: <b>0</b> · 0%" data-en="Slow &gt;3s: <b>0</b> · 0%"></span></div>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 MỚI · PHÁT HIỆN HÔM NAY (03/08)" data-en="NEW P1 · FOUND TODAY (03 Aug)"></div>
    <h4 class="t" data-vi="Mỗi trang phát ra 14 khối JSON-LD y hệt nhau — schema bị nhân bản, không phải phong phú" data-en="Every page emits 14 byte-identical JSON-LD blocks — schema is duplicated, not rich"></h4>
    <p class="t" data-vi="Audit hôm nay lần đầu <b>so sánh nội dung</b> từng khối JSON-LD thay vì chỉ đếm số lượng. Kết quả: trên <code>/about</code> có <b>14 khối JSON-LD nhưng chỉ 1 khối duy nhất về nội dung</b> — 13 khối còn lại là bản sao byte-for-byte. Kiểm chứng bằng <code>new Set(blocks).size === 1</code>. Mô hình này lặp trên toàn bộ trang gốc (14–15 khối), trang chủ (24 khối) và bài viết (31–32 khối, tương ứng ~2–3 schema thật nhân 14). Nghĩa là các con số schema ấn tượng trong báo cáo trước <b>đã bị thổi phồng ~14 lần</b>: bài viết thực chất chỉ có <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> + <code>FAQPage</code>, không phải 32 loại. Hệ quả: HTML phình vô ích, và Google có thể coi đây là tín hiệu cẩu thả khi parse structured data." data-en="Today's audit for the first time <b>compared the contents</b> of each JSON-LD block instead of merely counting them. Result: <code>/about</code> carries <b>14 JSON-LD blocks but only 1 distinct payload</b> — the other 13 are byte-for-byte copies, verified via <code>new Set(blocks).size === 1</code>. The pattern repeats across every core page (14–15 blocks), the homepage (24 blocks) and every article (31–32 blocks, i.e. roughly 2–3 real schemas multiplied by 14). This means the impressive schema counts in previous reports were <b>inflated by a factor of ~14</b>: an article genuinely carries <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> + <code>FAQPage</code>, not 32 distinct types. Consequences: needless HTML bloat and a sloppiness signal to Google's structured-data parser."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> đây gần như chắc chắn là lỗi component schema được mount lại trong mỗi layout/route wrapper. Tìm component render <code>&lt;script type=&quot;application/ld+json&quot;&gt;</code> và đảm bảo nó chỉ chạy <b>một lần ở cấp document/head</b> (dùng key duy nhất, hoặc di chuyển lên root layout và bỏ khỏi các layout con). Sau khi sửa, mong đợi: trang gốc còn 1–2 khối, bài viết còn 3–4 khối, HTML giảm 15–25 KB/trang." data-en="<b>Fix:</b> this is almost certainly a schema component being remounted inside every layout/route wrapper. Locate the component rendering <code>&lt;script type=&quot;application/ld+json&quot;&gt;</code> and ensure it executes <b>once at document/head level</b> (dedupe by key, or hoist it to the root layout and remove it from nested layouts). After the fix expect 1–2 blocks on core pages, 3–4 on articles, and 15–25 KB less HTML per page."></p>
  </div>

    <p class="t" data-vi="Sáu trang dự án — <code>/251-station-st</code>, <code>/20-head-street</code>, <code>/85-commodore-drive-surfers-paradise</code>, <code>/813-clarendon-street</code>, <code>/31-mcilwain-drive</code>, <code>/nagambie-project</code> — vẫn nằm trong sitemap, vẫn trả 200 (0,51–2,23s), và <b>vẫn y nguyên tình trạng của 31/07</b>: <b>0 JSON-LD</b>, chỉ <b>161–178 từ</b> HTML thô. Rendered-DOM của <code>/251-station-st</code> hôm nay xác nhận <b>15/19 ảnh vẫn thiếu alt</b>, <b>0 ảnh lazy-load</b>, heading nhảy bậc cả <b>1→3</b> và <b>2→4</b>, loadEvent 5,71s (nặng nhất site). Đây là nhóm trang đang bị Google mời index ở trạng thái chưa hoàn thiện — mỗi ngày trôi qua là thêm rủi ro bị đánh giá thin content." data-en="The six project pages — <code>/251-station-st</code>, <code>/20-head-street</code>, <code>/85-commodore-drive-surfers-paradise</code>, <code>/813-clarendon-street</code>, <code>/31-mcilwain-drive</code>, <code>/nagambie-project</code> — remain in the sitemap, still return 200 (0.51–2.23s), and are <b>exactly as they were on 31 Jul</b>: <b>0 JSON-LD</b> and only <b>161–178 words</b> of raw HTML. Today's rendered DOM of <code>/251-station-st</code> confirms <b>15 of 19 images still lack alt</b>, <b>zero images lazy-load</b>, headings skip both <b>1→3</b> and <b>2→4</b>, and loadEvent is 5.71s — the heaviest on the site. Google is being invited to index these pages in an unfinished state, and every further day raises the thin-content risk."></p>
    <p class="fix t" data-vi="<b>Cách sửa (không đổi):</b> thêm <code>CreativeWork</code>/<code>Place</code> + <code>BreadcrumbList</code> + <code>ImageObject</code>; server-render 250–400 từ mô tả (địa điểm, quy mô, vai trò DXL, kết quả); viết alt cho 15 ảnh gallery; bật <code>loading=&quot;lazy&quot;</code>. <b>Nếu tuần này chưa deploy được, hãy noindex 6 trang ngay</b> — để nguyên 3 ngày nữa sẽ tốn công recovery hơn." data-en="<b>Fix (unchanged):</b> add <code>CreativeWork</code>/<code>Place</code> + <code>BreadcrumbList</code> + <code>ImageObject</code>; server-render 250–400 words of narrative (location, scale, DXL's role, outcome); write alt text for the 15 gallery images; enable <code>loading=&quot;lazy&quot;</code>. <b>If this can't ship this week, noindex the six pages now</b> — leaving them another three days makes recovery more expensive."></p>

    <h4 class="t" data-vi="45 bài viết vẫn nhanh, đủ schema thật, đúng 1 H1 — và /faq vẫn là kho AEO mạnh nhất" data-en="45 articles stay fast with genuine schema and a single H1 — and /faq remains the strongest AEO asset"></h4>
    <p class="t" data-vi="Cả <b>45/45 bài</b> trả 200, TTFB <b>0,56–2,96s</b> với 36 bài &lt;1s, <b>đúng 1 H1</b> giàu từ khóa (đã hết lỗi 2×H1 cũ), 1.033–2.896 từ (TB 2.023), và <b>32/45 bài có <code>FAQPage</code></b>. Sau khi trừ nhân bản 14×, mỗi bài vẫn có bộ schema đúng chuẩn: <code>Article</code> + <code>BlogPosting</code> + <code>BreadcrumbList</code> (+ <code>FAQPage</code> ở 32 bài) — đây là schema <b>thật</b> và vẫn hợp lệ. Sự cố chậm 6,5–10,8s của <code>/articles/*</code> hồi tháng 7 <b>vẫn hết hẳn</b> sang ngày thứ tư. <b>68/68 trang</b> đều có title, meta description và canonical; <code>html lang=&quot;en-AU&quot;</code> đúng cho thị trường Úc; <code>robots.txt</code> sạch (<code>Disallow:</code> rỗng) và trỏ đúng sitemap. <code>/faq</code>: 1.315 từ + <code>FAQPage</code>, TTFB 0,48s." data-en="All <b>45/45 articles</b> return 200 at <b>0.56–2.96s</b> TTFB with 36 under 1s, <b>exactly one</b> keyword-rich H1 (the old 2×H1 defect is gone), 1,033–2,896 words (avg 2,023), and <b>32 of 45 carry <code>FAQPage</code></b>. Once the 14× duplication is discounted, each article still holds a correct schema set: <code>Article</code> + <code>BlogPosting</code> + <code>BreadcrumbList</code> (+ <code>FAQPage</code> on 32) — that schema is <b>real</b> and remains valid. July's 6.5–10.8s <code>/articles/*</code> slowdown <b>stays fully resolved</b> for a fourth day. <b>68 of 68 pages</b> carry a title, meta description and canonical; <code>html lang=&quot;en-AU&quot;</code> is correct for the AU market; <code>robots.txt</code> is clean (empty <code>Disallow:</code>) and points at the right sitemap. <code>/faq</code>: 1,315 words + <code>FAQPage</code> at 0.48s TTFB."></p>
    <p class="fix t" data-vi="<b>Giữ nguyên:</b> khi sửa lỗi nhân bản schema ở P1, <b>đừng gỡ nhầm schema thật</b> — mục tiêu là còn 3–4 khối/bài, không phải 0. Xác minh lại bằng Rich Results Test sau deploy." data-en="<b>Maintain:</b> when fixing the P1 duplication, <b>do not strip the genuine schema</b> — the target is 3–4 blocks per article, not zero. Re-verify with the Rich Results Test after deploying."></p>

let LANG = 'vi';

function applyLang(){
  document.querySelectorAll('.t').forEach(e=>{

  });

function setLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('btnVI').classList.toggle('active', l==='vi');
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  applyLang();
  render();
  if(typeof pkRender==='function') pkRender();
}

function renderRt(){
  const loaded = [...PAGES].sort((a,b)=>b.rt-a.rt);
  const max = 2960;
  const col = ms => ms<1000?'var(--green)':ms<3000?'var(--accent)':ms<6000?'var(--amber)':'var(--red)';
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let h='';
  loaded.forEach(p=>{
    const w=Math.max(2,(p.rt/max*100)).toFixed(1);
    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

const tbody=document.querySelector('#pt tbody');
let sortK='rt', sortDir=1, filt='all';
function render(){
  renderRt();
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let rows=[...PAGES];
  if(filt!=='all')rows=rows.filter(p=>p.grp===filt);
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}
    return sortDir*(x-y);
  });
  tbody.innerHTML=rows.map(p=>{
    const st='<span class="badge b200">200</span>';
    const sc=p.schema>0?`<span class="yes">${p.schema}</span>`:'<span class="no">0</span>';
    const sm=p.sm?'<span class="yes">✓</span>':'<span class="no">✗</span>';
    const rtc=p.rt<1000?'var(--green)':p.rt<3000?'var(--accent-dk)':p.rt<6000?'var(--amber)':'var(--red)';
    return `<tr>
      <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.url}">${p.url}</td>
      <td class="num">${st}</td>
      <td class="num" style="color:${rtc};font-weight:700">${p.rt.toLocaleString(loc)}</td>
      <td class="num">${p.words}</td>
      <td class="num">${sc}</td>
      <td class="num">${p.links}</td>
      <td>${sm}</td></tr>`;
  }).join('');
}

/* ---------- date picker (restored 03/08) ---------- */
const PK_BASE = '';
const PK_TODAY = '2026-08-03';
let PK_SNAPS = [];
function pkFmt(iso){ const [y,m,d]=iso.split('-'); return LANG==='vi' ? `${d}/${m}/${y}` : `${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`; }
function pkRender(){
  const pane=document.getElementById('dpPane'); if(!pane) return;
  document.getElementById('dpLabel').textContent = pkFmt(PK_TODAY);
  document.getElementById('dpCount').textContent = LANG==='vi'
    ? `${PK_SNAPS.length} ngày đã lưu` : `${PK_SNAPS.length} saved days`;
  pane.innerHTML = PK_SNAPS.slice().reverse().map(s=>{
    const cur = s.date===PK_TODAY;
    const lb = LANG==='vi' ? (s.label_vi||'') : (s.label_en||'');
    const now = cur ? `<span class="dpnow">${LANG==='vi'?'HÔM NAY':'TODAY'}</span>` : '';
    return `<button type="button" class="dpitem${cur?' cur':''}" data-href="${PK_BASE}${s.report}">
      <span class="dt">${pkFmt(s.date)}${now}</span><span class="lb">${lb}</span></button>`;
  }).join('');
  pane.querySelectorAll('.dpitem').forEach(b=>{
    b.addEventListener('click',()=>{
      const h=b.dataset.href;
      pane.classList.remove('open');
      document.getElementById('dpBtn').setAttribute('aria-expanded','false');
      if(!b.classList.contains('cur')) location.href = h;
    });
  });
}
(function pkInit(){
  const btn=document.getElementById('dpBtn'), pane=document.getElementById('dpPane');
  if(!btn) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=pane.classList.toggle('open');
    btn.setAttribute('aria-expanded', open?'true':'false');
  });
  document.addEventListener('click',e=>{
    if(!pane.contains(e.target) && e.target!==btn){ pane.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') pane.classList.remove('open'); });
  fetch(PK_BASE+'data/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    PK_SNAPS = j.snapshots||[]; pkRender();
  }).catch(()=>{
    PK_SNAPS = [{date:PK_TODAY, report:'index.html', label_vi:'Bản hiện tại', label_en:'Current report'}];
    pkRender();
  });
})();
