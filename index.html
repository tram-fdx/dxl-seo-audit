<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 16 trang gốc + 11 bài /articles mẫu + sitemap" data-en="Source: Chrome live crawl · 16 core pages + 11 sampled /articles + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>27/07/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>27 Jul 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>27 trang</b> · Sitemap: <b>67 URL</b>" data-en="Directly measured: <b>27 pages</b> · Sitemap: <b>67 URLs</b>"></span><br>
        Method: Chrome fetch · AbortController 9–18s
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi">
      <div class="lbl t" data-vi="Health Score" data-en="Health Score"></div>
      <div class="score-ring">
        <div class="val" style="color:var(--amber)">69<span style="font-size:15px;color:var(--muted)">/100</span></div>
      </div>
      <div class="note"><span class="tag amber t" data-vi="Khá — đang cải thiện" data-en="Fair — improving"></span></div>
      <div class="delta flat t" data-vi="= giữ nguyên 69 (so 24/07) · chưa phát hiện deploy mới" data-en="= flat at 69 (vs 24 Jul) · no new deploy detected"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Sitemap URL" data-en="Sitemap URLs"></div>
      <div class="val" style="color:var(--green)">67</div>
      <div class="note t" data-vi="16 gốc + 45 bài + 6 dự án" data-en="16 core + 45 articles + 6 projects"></div>
      <div class="delta flat t" data-vi="= không đổi · robots.txt sạch, trỏ đúng sitemap" data-en="= unchanged · robots.txt clean, points to sitemap"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="TTFB TB — trang gốc" data-en="Avg TTFB — core"></div>
      <div class="val" style="color:var(--green)">1,0<span style="font-size:15px">s</span></div>
      <div class="note t" data-vi="15/16 trang gốc &lt;2,3s (bỏ hub /articles)" data-en="15/16 core pages &lt;2.3s (excl. /articles hub)"></div>
      <div class="delta up t" data-vi="▲ nhanh hơn nhẹ (1,2s → 1,0s)" data-en="▲ marginally faster (1.2s → 1.0s)"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="TTFB TB — bài viết" data-en="Avg TTFB — articles"></div>
      <div class="val" style="color:var(--red)">7,5<span style="font-size:15px">s</span></div>
      <div class="note t" data-vi="11 bài mẫu · 6,5–8,2s · vẫn quá chậm" data-en="11 samples · 6.5–8.2s · still too slow"></div>
      <div class="delta down t" data-vi="▼ chậm hơn chút (7,3s → 7,5s) · chưa cache" data-en="▼ slightly slower (7.3s → 7.5s) · still uncached"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Schema (JSON-LD)" data-en="Schema (JSON-LD)"></div>
      <div class="val" style="color:var(--amber)">Bài ✓</div>
      <div class="note t" data-vi="Bài: BlogPosting+FAQPage · Trang gốc: 0" data-en="Articles: BlogPosting+FAQPage · Core: 0"></div>
      <div class="delta flat t" data-vi="= 16 trang gốc vẫn thiếu schema hoàn toàn" data-en="= 16 core pages still have zero schema"></div>
    </div>
  </div>

  <!-- Charts -->
  <h2 class="sec t" data-vi="Điểm sức khỏe theo hạng mục &amp; phân bố tốc độ" data-en="Health sub-scores &amp; speed distribution"></h2>
  <div class="grid2">
    <div class="card">
      <h3 class="t" data-vi="5 điểm thành phần (/100)" data-en="5 sub-scores (/100)"></h3>
      <div class="bar-row"><span class="name t" data-vi="Crawlability" data-en="Crawlability"></span><div class="bar-track"><div class="bar-fill" style="width:85%;background:var(--green)">85</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Performance / TTFB" data-en="Performance / TTFB"></span><div class="bar-track"><div class="bar-fill" style="width:58%;background:var(--amber)">58</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Structured Data / AEO" data-en="Structured Data / AEO"></span><div class="bar-track"><div class="bar-fill" style="width:56%;background:var(--amber)">56</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="On-page / Meta" data-en="On-page / Meta"></span><div class="bar-track"><div class="bar-fill" style="width:72%;background:var(--blue)">72</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Content" data-en="Content"></span><div class="bar-track"><div class="bar-fill" style="width:76%;background:var(--blue)">76</div></div></div>
      <div class="foot t" data-vi="Health tổng <b>69/100</b> (giữ nguyên so 24/07 — chưa có deploy sửa). Kéo điểm lên: <b>Crawlability 85</b> — mọi trang trả 200, sitemap đầy đủ 67 URL. Kéo điểm xuống: <b>Performance 58</b> (bài viết ~7,5s) và <b>Structured Data 56</b> (trang gốc 0 schema). Trọng số: Crawl 25% · Perf 25% · Schema 20% · On-page 15% · Content 15%." data-en="Overall health <b>69/100</b> (flat vs 24 Jul — no fix deployed yet). Lifting the score: <b>Crawlability 85</b> — every page returns 200, sitemap complete at 67 URLs. Dragging it down: <b>Performance 58</b> (articles ~7.5s) and <b>Structured Data 56</b> (core pages have 0 schema). Weights: Crawl 25% · Perf 25% · Schema 20% · On-page 15% · Content 15%."></div>
    </div>
    <div class="card">
      <h3 class="t" data-vi="Phân bố tốc độ (27 trang đo trực tiếp)" data-en="Speed distribution (27 pages measured)"></h3>
      <div class="donut-wrap">
        <svg width="150" height="150" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--cream2)" stroke-width="6"></circle>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--green)" stroke-width="6"
            stroke-dasharray="37 63" stroke-dashoffset="25"></circle>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--amber)" stroke-width="6"
            stroke-dasharray="18.5 81.5" stroke-dashoffset="-12"></circle>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--red)" stroke-width="6"
            stroke-dasharray="44.4 55.6" stroke-dashoffset="-30.5"></circle>
          <text x="21" y="20" text-anchor="middle" font-size="7" font-weight="700" fill="#2c2620">27</text>
          <text x="21" y="26.5" text-anchor="middle" font-size="3.2" fill="#6f665a" class="tsvg" data-vi="trang" data-en="pages">trang</text>
        </svg>
        <div class="legend">
          <div><span class="dot" style="background:var(--green)"></span> <span class="t" data-vi="Nhanh &lt;1s: <b>10</b> · 37,0%" data-en="Fast &lt;1s: <b>10</b> · 37.0%"></span></div>
          <div><span class="dot" style="background:var(--amber)"></span> <span class="t" data-vi="1–3s: <b>5</b> · 18,5%" data-en="1–3s: <b>5</b> · 18.5%"></span></div>
          <div><span class="dot" style="background:var(--red)"></span> <span class="t" data-vi="Chậm &gt;6s: <b>12</b> · 44,4%" data-en="Slow &gt;6s: <b>12</b> · 44.4%"></span></div>
          <div class="foot t" style="margin-top:10px" data-vi="Không còn trang nào timeout (status 0). Nhóm chậm &gt;6s = 11 bài /articles + hub /articles (1,86MB). Nhóm nhanh &lt;1s là các trang gốc dịch vụ + pháp lý. Chậm nhất trong trang gốc: /model 2,3s &amp; /studio 1,8s." data-en="No page times out anymore (status 0). The &gt;6s slow group = 11 /articles posts + the /articles hub (1.86MB). The &lt;1s fast group is core service + legal pages. Slowest core pages: /model 2.3s &amp; /studio 1.8s."></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Insights -->
  <h2 class="sec t" data-vi="Hướng đi &amp; Insight ưu tiên" data-en="Direction &amp; Priority insights"></h2>

  <div class="ins win">
    <div class="prio t" data-vi="✓ ỔN ĐỊNH — so với 24/07" data-en="✓ STABLE — vs 24 Jul"></div>
    <h4 class="t" data-vi="Nền tảng crawl vẫn khỏe: 27/27 trang trả 200, sitemap 67 URL, bài viết đủ schema" data-en="Crawl foundation holds: 27/27 pages return 200, sitemap 67 URLs, articles fully schema'd"></h4>
    <p class="t" data-vi="Crawl hôm nay xác nhận các thắng lợi trước đó <b>vẫn được giữ</b>: toàn bộ 16 trang gốc + 11 bài <code>/articles/*</code> mẫu <b>đều trả 200</b>, không trang nào timeout. 11/11 bài mang <b>BlogPosting + FAQPage schema</b> (đo thật 1–2 script JSON-LD/bài), nội dung SSR 1.455–3.042 từ, ~51 internal link/bài. Sitemap ổn định <b>67 URL</b> (45 bài + 6 dự án + 16 gốc), <code>robots.txt</code> sạch trỏ đúng sitemap. Không phát hiện regression nào." data-en="Today's crawl confirms the earlier wins <b>still hold</b>: all 16 core pages + 11 sampled <code>/articles/*</code> posts <b>return 200</b>, none time out. 11/11 posts carry <b>BlogPosting + FAQPage schema</b> (measured 1–2 JSON-LD scripts each), 1,455–3,042 words of SSR content, ~51 internal links each. Sitemap steady at <b>67 URLs</b> (45 articles + 6 projects + 16 core), <code>robots.txt</code> clean and pointing to the sitemap. No regressions detected."></p>
    <p class="fix t" data-vi="<b>Việc tiếp theo:</b> Vào GSC kiểm tra Coverage/Pages để xác nhận 45 bài + 6 dự án đã chuyển sang 'Indexed'. Nếu chưa, Request Indexing thủ công phần còn lại." data-en="<b>Next:</b> Check GSC Coverage/Pages to confirm the 45 articles + 6 projects have moved to 'Indexed'. If not, manually Request-Index the remainder."></p>
  </div>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 · Nghiêm trọng · CÒN LẠI" data-en="P1 · Critical · REMAINING"></div>
    <h4 class="t" data-vi="Bài viết vẫn quá chậm: TTFB TB 7,5s (6,5–8,2s) — chưa có cache/SSG" data-en="Articles still too slow: avg TTFB 7.5s (6.5–8.2s) — no cache/SSG yet"></h4>
    <p class="t" data-vi="11 bài mẫu có TTFB <b>6,5–8,2s</b> (TB 7,5s, nhích nhẹ từ 7,3s hôm 24/07) — vượt xa ngưỡng tốt &lt;2s. 2 bài vẫn abort ở ngưỡng 9s, phải nới lên 16s mới lấy được. Đây là dấu hiệu <b>chưa có deploy cache/SSG</b> nào cho <code>/articles/[slug]</code> kể từ lần audit trước. Trang hub <code>/articles</code> nặng <b>1,86MB / 6,8s</b> — điểm nghẽn riêng. Ngược lại trang gốc chứng minh &lt;1s hoàn toàn khả thi trên cùng hạ tầng." data-en="The 11 sampled posts have TTFB <b>6.5–8.2s</b> (avg 7.5s, up slightly from 7.3s on 24 Jul) — far past the good &lt;2s bar. 2 posts still abort at a 9s budget and needed 16s to capture. This signals <b>no cache/SSG deploy</b> has landed for <code>/articles/[slug]</code> since the last audit. The <code>/articles</code> hub is <b>1.86MB / 6.8s</b> — its own bottleneck. Meanwhile core pages prove &lt;1s is entirely achievable on the same infra."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> Chuyển <code>/articles/[slug]</code> sang SSG/ISR + cache CDN edge (nhân rộng cấu hình đã dùng cho trang gốc). Với hub <code>/articles</code>: phân trang/lazy-load danh sách, nén ảnh, cắt payload 1,86MB → &lt;500KB. Mục tiêu TTFB bài viết &lt;2s ổn định. File <code>DXL-DevHandoff-Articles-SSG-ISR-EdgeCache-EN.md</code> đã sẵn sàng." data-en="<b>Fix:</b> Move <code>/articles/[slug]</code> to SSG/ISR + edge CDN caching (replicate the core-page config). For the <code>/articles</code> hub: paginate/lazy-load the list, compress images, cut the payload from 1.86MB to &lt;500KB. Target stable article TTFB &lt;2s. The <code>DXL-DevHandoff-Articles-SSG-ISR-EdgeCache-EN.md</code> file is ready."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · Cảnh báo · cơ hội AEO" data-en="P2 · Warning · AEO opportunity"></div>
    <h4 class="t" data-vi="16 trang gốc có 0 JSON-LD — thiếu Organization / LocalBusiness / Service / Breadcrumb" data-en="16 core pages have 0 JSON-LD — missing Organization / LocalBusiness / Service / Breadcrumb"></h4>
    <p class="t" data-vi="Đo lại hôm nay: toàn bộ 16 trang gốc (trang chủ, <code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code>, <code>/modules</code>…) <b>vẫn 0 script JSON-LD</b>. Bài viết làm tốt schema (BlogPosting+FAQPage) — nhưng các trang thương mại ý định cao lại trống. Bỏ lỡ rich result và giảm khả năng được trích dẫn trong AI/AEO." data-en="Re-measured today: all 16 core pages (homepage, <code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code>, <code>/modules</code>…) <b>still have 0 JSON-LD scripts</b>. Articles nail schema (BlogPosting+FAQPage) — but the high-intent commercial pages are bare. This forfeits rich results and lowers the odds of being cited in AI/AEO answers."></p>

<script>
const PAGES = [

  {url:"/articles/architectural-rendering-melbourne-pre-construction-planning",status:200,rt:7095,words:2101,idx:1,links:51,sm:1,grp:"art"},

let LANG = 'vi';

function applyLang(){
  document.querySelectorAll('.t').forEach(e=>{
    const v = e.dataset[LANG];
    if(v!==undefined) e.innerHTML = v;
  });
  document.querySelectorAll('.tsvg').forEach(e=>{
    const v = e.dataset[LANG];
    if(v!==undefined) e.textContent = v;
  });
}

function setLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('btnVI').classList.toggle('active', l==='vi');
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  applyLang();
  render();
}

function renderRt(){
  const loaded = [...PAGES].sort((a,b)=>b.rt-a.rt);
  const max = 8210;
  const col = ms => ms<1000?'var(--green)':ms<3000?'var(--accent)':ms<6000?'var(--amber)':'var(--red)';
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let h='';
  loaded.forEach(p=>{
    const w=Math.max(2,(p.rt/max*100)).toFixed(1);
    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

const tbody=document.querySelector('#pt tbody');
let sortK='rt', sortDir=1, filt='all';
function render(){
  renderRt();
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let rows=[...PAGES];
  if(filt==='core')rows=rows.filter(p=>p.grp==='core');
  if(filt==='art')rows=rows.filter(p=>p.grp==='art');
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}
    return sortDir*(x-y);
  });
  tbody.innerHTML=rows.map(p=>{
    const st='<span class="badge b200">200</span>';
    const idx=p.idx?'<span class="yes">✓</span>':'<span class="no">✗</span>';
    const sm=p.sm?'<span class="yes">✓</span>':'<span class="no">✗</span>';
    const rtc=p.rt<1000?'var(--green)':p.rt<3000?'var(--accent-dk)':p.rt<6000?'var(--amber)':'var(--red)';
    return `<tr>
      <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.url}">${p.url}</td>
      <td class="num">${st}</td>
      <td class="num" style="color:${rtc};font-weight:700">${p.rt.toLocaleString(loc)}</td>
      <td class="num">${p.words}</td>
      <td>${idx}</td>
      <td class="num">${p.links}</td>
      <td>${sm}</td></tr>`;
  }).join('');
}
document.querySelectorAll('#pt th').forEach(th=>{
  th.addEventListener('click',()=>{
    const k=th.dataset.k;
    if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1;}
    render();
  });
});
document.querySelectorAll('.filter-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');filt=b.dataset.f;render();
  });
});
setLang('vi');
</script>
