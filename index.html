<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  .langfix{position:fixed;top:14px;right:14px;z-index:120;display:inline-flex;
    border:1px solid var(--accent);border-radius:20px;overflow:hidden;background:var(--card);
    box-shadow:0 2px 12px rgba(70,55,30,.2)}
  .langfix button{background:transparent;color:var(--muted);border:none;padding:6px 15px;
    font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px;font-family:inherit;line-height:1.5}
  .langfix button.active{background:var(--accent);color:#2c2620}
  .langfix button:not(.active):hover{color:var(--ink)}
  @media(max-width:700px){.langfix{top:8px;right:8px}
    .langfix button{padding:5px 12px;font-size:11px}}
  @media print{.langfix{display:none}}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .legend .foot{display:block;line-height:1.55}
  .legend{max-width:520px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}

  /* ---------- date picker v2 (sample-matched) ---------- */
  /* collapsible date picker */
  .pk-toggle{margin-top:24px;width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 20px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);
    text-align:left;transition:border-color .15s,box-shadow .15s}
  .pk-toggle:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(184,147,90,.13)}
  .pk-toggle .lft{display:flex;align-items:center;gap:11px;min-width:0}
  .pk-toggle .bar{display:inline-block;width:3px;height:17px;background:var(--accent);border-radius:2px;flex:none}
  .pk-toggle .cap{font-weight:600}
  .pk-toggle .sel{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
  .pk-toggle .chev{flex:none;transition:transform .2s;color:var(--muted);font-size:12px}
  .pk-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .pk-wrap[hidden]{display:none}
  .pk-wrap .pk-card{margin-top:10px}

  /* trend charts */
  .tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.tr-grid{grid-template-columns:1fr}}
  .tr-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 14px}
  .tr-card h3{margin:0 0 2px;font-size:14.5px;font-weight:700;color:var(--ink)}
  .tr-card .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
  .tr-lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .tr-lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .tr-svg{width:100%;height:auto;display:block;overflow:visible}
  .tr-dot{transition:r .12s}
  .tr-card:hover .tr-dot{r:3.2}
  .pk-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 16px;box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .pk-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;
    letter-spacing:.9px;text-transform:uppercase;color:var(--accent-dk);margin:0 0 8px}
  .pk-title .bar{width:26px;height:3px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  .pk-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;max-width:900px}
  .pk-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dpwrap{position:relative}
  .dpbtn{display:inline-flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid #cfc6b3;border-radius:10px;padding:10px 15px;font-family:inherit;
    font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink);cursor:pointer;transition:.15s}
  .dpbtn:hover{border-color:var(--accent)}
  .dpbtn .car{color:var(--muted);font-size:9px;margin-left:2px}
  .pk-now{display:inline-block;background:var(--accent-soft,#f3e7d3);color:var(--accent-dk);
    border:1px solid #e6d5b8;border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700}

  .dppane{position:absolute;top:calc(100% + 9px);left:0;z-index:80;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 40px rgba(70,55,30,.20);overflow:hidden}
  .dppane.open{display:flex}
  .dp-presets{width:196px;flex:0 0 auto;border-right:1px solid var(--line);
    padding:12px 8px;background:#fdfbf6;max-height:430px;overflow:auto}
  .dp-preset{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;
    font-size:12.5px;color:var(--ink);transition:.12s}
  .dp-preset:hover:not(:disabled){background:var(--cream2)}
  .dp-preset:disabled{color:#bdb4a6;cursor:not-allowed}
  .dp-preset .rd{width:13px;height:13px;border-radius:50%;border:1.5px solid #c3b9a6;flex:0 0 auto;position:relative}
  .dp-preset.on .rd{border-color:var(--accent)}
  .dp-preset.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
  .dp-preset .nm{flex:1}
  .dp-preset .ct{font-size:11.5px;color:var(--faint,#9a9186);font-weight:700}

  .dp-right{padding:14px 16px 12px;min-width:452px}
  .dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .dp-nav button{background:transparent;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
  .dp-nav button:hover:not(:disabled){background:var(--cream2);color:var(--ink)}
  .dp-nav button:disabled{opacity:.3;cursor:not-allowed}
  .dp-nav .mtitle{flex:1;display:flex;justify-content:space-around;font-size:13.5px;font-weight:700}
  .dp-months{display:flex;gap:26px}
  .dp-m{flex:1}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dp-dow{font-size:10.5px;color:var(--muted);text-align:center;padding:5px 0 3px;font-weight:700}
  .dp-d{position:relative;height:29px;border:none;background:transparent;border-radius:7px;
    font-family:inherit;font-size:12.5px;color:#bdb4a6;cursor:pointer;padding:0;transition:.1s}
  .dp-d.blank{cursor:default}
  .dp-d.has{color:var(--ink);font-weight:700}
  .dp-d:hover:not(.blank):not(.sel){background:var(--cream2)}
  .dp-d.inrange{background:var(--accent-soft,#f3e7d3);border-radius:0}
  .dp-d.sel{background:var(--accent);color:#2c2620;font-weight:800}
  .dp-d.sel.edge-l{border-radius:7px 0 0 7px}
  .dp-d.sel.edge-r{border-radius:0 7px 7px 0}
  .dp-d .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:3.5px;height:3.5px;border-radius:50%;background:var(--accent)}
  .dp-d.sel .dot{background:#2c2620}

  .dp-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-selinfo .d1{font-size:13.5px;font-weight:700}
  .dp-selinfo .d2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;max-width:300px}
  .dp-actions{display:flex;gap:9px;flex:0 0 auto}
  .dp-actions button{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:9px;
    padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .dp-actions .go{background:var(--accent);border-color:var(--accent);color:#2c2620}
  .dp-actions .go:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
  .dp-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
  .dp-legend .dotlg{display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-right:4px}

  .pk-quick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;
    padding-top:14px;border-top:1px solid var(--line)}
  .pk-quick-lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);
    text-transform:uppercase;flex:0 0 auto;margin-right:2px}
  .qchip{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--ink);transition:.13s;text-align:left}
  .qchip:hover{border-color:var(--accent);background:#fdfaf3}
  .qchip .qd{font-weight:700;flex:0 0 auto}
  .qchip .ql{font-size:11.5px;color:var(--muted)}
  .qchip.cur{background:var(--accent);border-color:var(--accent);color:#2c2620;cursor:default}
  .qchip.cur .ql{color:#5c4a24}

  .pk-trend{display:none;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .pk-trend.on{display:block}
  .pk-trend h4{margin:0 0 10px;font-size:13px;color:var(--accent-dk)}
  .trd{display:grid;grid-template-columns:88px 1fr 46px 62px;gap:9px;align-items:center;
    margin:6px 0;font-size:12.5px}
  .trd .tdate{font-weight:700}
  .trd .ttrack{background:var(--cream2);border-radius:6px;height:16px;overflow:hidden}
  .trd .tfill{height:100%;background:var(--accent);border-radius:6px}
  .trd .tval{font-weight:800;text-align:right}
  .trd .tlink{font-size:11px;color:var(--accent-dk);text-decoration:underline;cursor:pointer;text-align:right}
  @media(max-width:860px){.dppane.open{flex-direction:column}.dp-right{min-width:0}.dp-months{flex-direction:column;gap:14px}.dp-presets{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:none}}

</style>
</head>
<body>
<div class="langfix" role="group" aria-label="Language">
  <button type="button" data-l="vi" onclick="setLang('vi')">VI</button>
  <button type="button" data-l="en" onclick="setLang('en')">EN</button>
</div>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 17 trang gốc + 80 bài /articles + 6 trang dự án + sitemap" data-en="Source: Chrome live crawl · 17 core pages + 80 /articles + 6 project pages + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>09/09/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>9 Sep 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>103 trang</b> · Sitemap: <b>104 URL</b> · <b>quét lúc 06:00 giờ Việt Nam</b>" data-en="Directly measured: <b>103 pages</b> · Sitemap: <b>104 URLs</b> · <b>crawled at 06:00 Vietnam time</b>"></span><br>
        Method: Chrome fetch tuần tự · AbortController 12–15s
      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <!-- date picker v2 (collapsible) -->
  <button class="pk-toggle" id="pkToggle" type="button" aria-expanded="false" aria-controls="pkWrap" onclick="pkFold()">
    <span class="lft"><span class="bar"></span>
      <span class="cap t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span>
      <span class="sel" id="pkToggleSel"></span></span>
    <span class="chev">&#9660;</span>
  </button>
  <div class="pk-wrap" id="pkWrap" hidden>
  <div class="pk-card">
    <div class="pk-title"><span class="bar"></span><span class="t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span></div>
    <p class="pk-sub t" data-vi="Chọn <b>một ngày</b> rồi bấm <b>Cập nhật</b> để mở đúng bản báo cáo đã lưu của ngày đó. Chọn <b>một khoảng ngày</b> để xem xu hướng trong khoảng. Ngày <b>có dấu chấm</b> là ngày đã quét và có báo cáo lưu; ngày làm mờ vẫn chọn được làm đầu/cuối khoảng, nhưng không có báo cáo riêng để mở." data-en="Pick <b>a single day</b> and press <b>Update</b> to open that day's saved report. Pick <b>a date range</b> to see the trend across it. Days <b>with a dot</b> were crawled and have a stored report; faded days can still anchor a range but have no report of their own."></p>
    <div class="pk-bar">
      <div class="dpwrap">
        <button class="dpbtn" id="dpBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>&#128197;</span><span id="dpLabel">Ngày 09/09/2026</span><span class="car">&#9660;</span>
        </button>
        <div class="dppane" id="dpPane" role="dialog">
          <div class="dp-presets" id="dpPresets"></div>
          <div class="dp-right">
            <div class="dp-nav">
              <button type="button" id="dpPrev" aria-label="prev">&#8249;</button>
              <div class="mtitle"><span id="dpM1"></span><span id="dpM2"></span></div>
              <button type="button" id="dpNext" aria-label="next">&#8250;</button>
            </div>
            <div class="dp-months"><div class="dp-m" id="dpG1"></div><div class="dp-m" id="dpG2"></div></div>
            <div class="dp-foot">
              <div class="dp-selinfo"><div class="d1" id="dpSelD"></div><div class="d2" id="dpSelInfo"></div></div>
              <div class="dp-actions">
                <button type="button" id="dpCancel" class="t" data-vi="Hủy" data-en="Cancel"></button>
                <button type="button" id="dpApply" class="go t" data-vi="Cập nhật" data-en="Update"></button>

ntent 90 hold. <b>New deductions:</b> a deeper pass found <b>10 legacy long-slug article URLs that still return 200 with a self-referencing canonical</b> — duplicate content — plus <b>1 broken internal link (404)</b>; these two hold Crawlability at 93 rather than 97."></div>

  <div class="foot t" data-vi="<b>Cách đọc:</b> mỗi điểm là một lần quét đầy đủ; những ngày không quét <b>không</b> được nội suy. Điểm 09/09 là lần quét lúc 06:00 giờ Việt Nam. <b>Ba điều đáng chú ý:</b> (1) <b>đường Crawlability bật từ 77 lên 93</b> — bước nhảy lớn nhất của bất kỳ hạng mục nào kể từ cú rơi 97 &#8594; 72 hôm 03/09, và lần này là hướng ngược lại: trang hub <code>/articles</code> đã được sửa, kéo đường Health lên <b>91</b>, mức cao thứ hai trong chuỗi. Khoảng cách tới 97 là hai lỗi mới tìm thấy (10 URL trùng lặp, 1 link gãy), đều sửa được trong một lần. (2) <b>đường TTFB trang gốc tách khỏi hai đường kia</b>: bài viết và dự án đều đi xuống (891 &#8594; 823, 701 &#8594; 635 ms) trong khi trang gốc đi lên 877 &#8594; 952 — và toàn bộ phần đi lên nằm ở trang chủ ~2 giây. Nếu điểm tiếp theo của đường trang gốc vẫn cao, đó là hồi quy thật của trang chủ. (3) <b>đường số trang lên 103 và số từ mỗi bài giữ ~2.550</b> — nhịp một bài mỗi ngày đang được duy trì mà không pha loãng; nhưng đường Structured Data trượt 96 &#8594; 95 &#8594; 94 đúng theo nhịp đó, vì mỗi bài mới đều thiếu FAQPage. Hai đường này sẽ tiếp tục đi ngược chiều cho tới khi chốt chặn FAQPage được dựng." data-en="<b>How to read this:</b> each point is one full crawl; days without a crawl are <b>not</b> interpolated. The 9 Sep point is the 06:00 Vietnam-time crawl. <b>Three things worth noting:</b> (1) <b>the Crawlability line jumps from 77 to 93</b> — the largest move by any sub-score since the 97 &#8594; 72 fall of 3 Sep, this time in the other direction: the <code>/articles</code> hub has been fixed, lifting the Health line to <b>91</b>, the second-highest reading in the series. The gap to 97 is two newly found defects (10 duplicate URLs, 1 broken link), both fixable in one pass. (2) <b>the core-page TTFB line separates from the other two</b>: articles and projects both fall (891 &#8594; 823, 701 &#8594; 635 ms) while core pages rise 877 &#8594; 952 — and the entire rise sits on the ~2-second   <!-- Insights -->
  <h2 class="sec t" data-vi="Hướng đi &amp; Insight ưu tiên" data-en="Direction &amp; Priority insights"></h2>

<div class="ins win">
    <div class="prio t" data-vi="&#10003; ĐÃ SỬA · P1 lớn nhất đóng lại: trang hub /articles lộ đủ 80/80 bài trong HTML gốc, bài mồ côi 17 &#8594; 0" data-en="&#10003; FIXED · the largest P1 is closed: the /articles hub exposes all 80 of 80 articles in source HTML, orphans 17 &#8594; 0"></div>
    <p class="t" data-vi="<b>Hạng mục đã đứng đầu danh sách việc cần làm suốt từ 03/09 hôm nay không còn nữa.</b> HTML gốc của <code>/articles</code> chứa <b>đủ 80/80 link bài</b> (hôm qua 7/79, tức 8,9%), dung lượng tăng lên <b>236 KB</b>, số từ 328 &#8594; <b>1.043</b>, internal link lên <b>97</b>. Kiểm tra DOM sau render xác nhận <b>80 thẻ bài đều hiển thị</b> (94 thẻ <code>&lt;a&gt;</code> trỏ tới bài, 80 URL duy nhất). Phân trang và bộ lọc chủ đề <b>vẫn là nút JavaScript</b> (7 nút phân trang, 5 nút lọc, 0 thẻ <code>&lt;a&gt;</code> tới URL phân trang) — nhưng điều đó không còn quan trọng: bot không cần bấm nút khi mọi link đã có sẵn trong nguồn. <b>Hệ quả đo được:</b> bản đồ link ngược dựng từ cả 103 trang cho <b>0 bài không có link nội bộ trỏ tới</b> (hôm qua 17); mọi bài nay có ít nhất 1 link vào, bài nhiều nhất có 81. <b>Crawlability 77 &#8594; 93.</b> <b>Một lưu ý để không chủ quan:</b> <b>21 bài chỉ có duy nhất trang hub trỏ tới</b> — không còn mồ côi, nhưng toàn bộ link equity của chúng phụ thuộc vào một trang. Đây là hạng mục P3 mới: bổ sung dần link ngữ cảnh từ các bài liên quan, ưu tiên các bài dịch vụ như <code>3d-rendering-services-melbourne</code>, <code>3d-renders-for-property-developers-sydney</code>, <code>3d-rendering-company-adelaide</code>. Mô hình &quot;danh sách xoay vòng sinh bài mồ côi&quot; của các bản 04–08/09 nay <b>không còn áp dụng</b>." data-en="<b>The item that has topped the to-do list since 3 Sep is gone today.</b> The source HTML of <code>/articles</code> contains <b>all 80 of 80 article links</b> (yesterday 7 of 79, or 8.9%), the page grew to <b>236 KB</b>, its word count went 328 &#8594; <b>1,043</b> and its internal links up to <b>97</b>. The rendered-DOM check confirms <b>all 80 article cards are visible</b> (94 <code>&lt;a&gt;</code> tags pointing at articles, 80 unique URLs). Pagination and topic filters <b>are still JavaScript buttons</b> (7 pagination buttons, 5 filter buttons, 0 <code>&lt;a&gt;</code> tags to paginated URLs) — but that no longer matters: a crawler does not need to press buttons when every link is already in the source. <b>The measured consequence:</b> the inbound-link map built across all 103 pages shows <b>0 articles with no inbound internal link</b> (17 yesterday); every article now has at least 1 inbound link, the best-linked has 81. <b>Crawlability 77 &#8594; 93.</b> <b>One caution:</b> <b>21 articles are linked from the hub and nowhere else</b> — no longer orphans, but all of their link equity depends on a single page. This becomes a new P3: add contextual links from related articles over time, starting with service pieces such as <code>3d-rendering-services-melbourne</code>, <code>3d-renders-for-property-developers-sydney</code> and <code>3d-rendering-company-adelaide</code>. The &quot;rotating listing creates orphans&quot; model of the 4&#8211;8 Sep reports <b>no longer applies</b>."></p>
  </div>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 · Không đổi · bài mới thứ ba liên tiếp thiếu FAQPage — 65/80 (81,3%), danh sách thiếu 15 bài" data-en="P1 · Unchanged · a third consecutive new article without FAQPage — 65 of 80 (81.3%), 15 articles missing"></div>
    <p class="t" data-vi="<b>Ba bài trong ba ngày, cùng một lỗi:</b> <code>4d-construction-sequencing-australia</code> (07/09), <code>development-application-3d-render</code> (08/09) và hôm nay <code>vr-walkthrough-services-australia</code> (09/09). Bài hôm nay về mặt biên tập hoàn toàn ổn — <b>2.300 từ, 23 internal link, đúng một <code>h1</code>, TTFB 625 ms</b> — nhưng chỉ có <b>3 khối JSON-LD</b> (<code>Article + BreadcrumbList + BlogPosting</code>) và <b>không có <code>FAQPage</code></b>. Tỷ lệ phủ vì thế giảm ngày thứ ba liên tiếp: <b>84,2% &#8594; 83,3% &#8594; 82,3% &#8594; 81,3%</b>; danh sách thiếu 12 &#8594; 13 &#8594; 14 &#8594; <b>15 bài</b>. <b>Đây là chuỗi dài nhất của lỗi này kể từ khi theo dõi</b>, và nó khẳng định kết luận hôm qua: mẫu bài mới đang được xuất bản <b>không có khối FAQ</b>, nên mỗi bài đăng thêm là thêm một khoản nợ. <b>Thứ tự xử lý không đổi:</b> (1) đưa <code>FAQPage</code> thành trường bắt buộc trong mẫu xuất bản hoặc thêm bước kiểm tra tự động chặn publish khi thiếu; (2) sau đó mới dọn lô 15 bài. Nếu dọn trước, với nhịp một bài mỗi ngày, danh sách sẽ đầy lại trong hai tuần." data-en="<b>Three articles in three days, the same defect:</b> <code>4d-construction-sequencing-australia</code> (7 Sep), <code>development-application-3d-render</code> (8 Sep) and today <code>vr-walkthrough-services-australia</code> (9 Sep). Today's article is editorially sound — <b>2,300 words, 23 internal links, exactly one <code>h1</code>, TTFB 625 ms</b> — but carries only <b>3 JSON-LD blocks</b> (<code>Article + BreadcrumbList + BlogPosting</code>) and <b>no <code>FAQPage</code></b>. Coverage has therefore fallen for a third consecutive day: <b>84.2% &#8594; 83.3% &#8594; 82.3% &#8594; 81.3%</b>; the missing list has grown 12 &#8594; 13 &#8594; 14 &#8594; <b>15 articles</b>. <b>This is the longest run of this defect since tracking began</b>, and it confirms yesterday's conclusion: the template new articles are being published from <b>has no FAQ block</b>, so every publication adds to the debt. <b>The order of work is unchanged:</b> (1) make <code>FAQPage</code> a required field in the publishing template, or add an automated check that blocks publication when it is absent; (2) only then clear the 15-article batch. Clear the batch first and, at one article a day, the list refills within two weeks."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · MỚI · 10 URL slug dài của bài cũ vẫn trả 200, tự canonical, index-follow — trùng lặp nội dung — cùng 1 link nội bộ gãy" data-en="P2 · NEW · 10 legacy long-slug article URLs still return 200, self-canonical, index-follow — duplicate content — plus 1 broken internal link"></div>
    <p class="t" data-vi="<b>Lần đầu tiên bản quét đối chiếu mọi đích link nội bộ với tập trang đã crawl</b>, và tìm thấy <b>11 URL được link tới nhưng không nằm trong sitemap</b>. <b>10 URL</b> là phiên bản slug dài của các bài hiện có — ví dụ <code>/articles/project-management-and-cost-control-from-plan-to-profit</code> bên cạnh <code>/articles/project-management-and-cost-control</code>, hay <code>/articles/6-benefits-of-using-vr-to-see-projects-in-your-mind</code> bên cạnh <code>/articles/6-benefits-of-using-vr-technology</code> (hai cặp này đã đối chiếu: <b>cùng một <code>h1</code></b>). Cả 10 URL đều <b>trả 200 chứ không 301</b>, <b>canonical trỏ về chính nó</b>, <code>robots: index, follow</code>, và phát khối <code>Article</code> riêng — nghĩa là Google đang thấy <b>hai trang có thể index cho cùng một bài</b>, tự cạnh tranh nhau và chia đôi tín hiệu. Chúng được <b>32 link nội bộ</b> từ các bài khác trỏ tới (mỗi URL 1–7 link), nên đây không phải URL đã chết mà là URL đang được nuôi. Danh sách đầy đủ 10 slug dài: <code>project-management-and-cost-control-from-plan-to-profit</code>, <code>bim-for-architects-australia-key-strategies-for-seamless-custom-home-design</code>, <code>step-inside-the-future-6-home-design-trends-shaping-australia-in-2026</code>, <code>custom-home-visualisation-timeline-from-concept-to-completion</code>, <code>how-to-use-3d-configurators-to-increase-buyer-commitment</code>, <code>3d-house-design-guide-from-sketch-to-walkthrough</code>, <code>contemporary-houses-a-practical-guide-to-design-costs-and-planning</code>, <code>duplex-house-design-in-australia-visual-clarity-acoustic-calm-4d-delivery</code>, <code>how-virtual-reality-is-shaping-the-future-of-home-design-in-australian</code>, <code>6-benefits-of-using-vr-to-see-projects-in-your-mind</code>. <b>URL thứ 11 là một link gãy thật sự:</b> trong bài <code>6-benefits-of-using-vr-technology</code> có một <code>href</code> dán liền ba URL cách nhau bằng dấu cách, trả <b>404</b> — lỗi soạn thảo, sửa trong một phút. <b>Cách sửa cho 10 URL kia:</b> 301 từng slug dài về slug ngắn tương ứng (hoặc tối thiểu đặt canonical về slug ngắn), rồi cập nhật 32 link nội bộ để trỏ thẳng vào URL đúng." data-en="<b>For the first time the crawl cross-checked every internal link target against the set of crawled pages</b>, and found <b>11 linked URLs that are not in the sitemap</b>. <b>10 of them</b> are long-slug versions of existing articles — for example <code>/articles/project-management-and-cost-control-from-plan-to-profit</code> alongside <code>/articles/project-management-and-cost-control</code>, or <code>/articles/6-benefits-of-using-vr-to-see-projects-in-your-mind</code> alongside <code>/articles/6-benefits-of-using-vr-technology</code> (both pairs verified: <b>identical <code>h1</code></b>). All 10 <b>return 200, not 301</b>, carry a <b>self-referencing canonical</b>, <code>robots: index, follow</code>, and emit their own <code>Article</code> block — so Google sees <b>two indexable pages for the same article</b>, competing with each other and splitting signals. They receive <b>32 internal links</b> from other articles (1&#8211;7 each), so these are not dead URLs but URLs being actively fed. The full list of 10 long slugs: <code>project-management-and-cost-control-from-plan-to-profit</code>, <code>bim-for-architects-australia-key-strategies-for-seamless-custom-home-design</code>, <code>step-inside-the-future-6-home-design-trends-shaping-australia-in-2026</code>, <code>custom-home-visualisation-timeline-from-concept-to-completion</code>, <code>how-to-use-3d-configurators-to-increase-buyer-commitment</code>, <code>3d-house-design-guide-from-sketch-to-walkthrough</code>, <code>contemporary-houses-a-practical-guide-to-design-costs-and-planning</code>, <code>duplex-house-design-in-australia-visual-clarity-acoustic-calm-4d-delivery</code>, <code>how-virtual-reality-is-shaping-the-future-of-home-design-in-australian</code>, <code>6-benefits-of-using-vr-to-see-projects-in-your-mind</code>. <b>The 11th URL is a genuinely broken link:</b> <code>6-benefits-of-using-vr-technology</code> contains an <code>href</code> that concatenates three URLs separated by spaces and returns <b>404</b> — an editing slip, a one-minute fix. <b>The fix for the other 10:</b> 301 each long slug to its short-slug counterpart (or at minimum point the canonical at the short slug), then update the 32 internal links to target the correct URL directly."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · MỚI · trang chủ chậm ~2 giây qua bốn lần đo — không phải nhiễu, cần theo dõi ngay lần quét sau" data-en="P2 · NEW · the homepage is ~2 seconds across four readings — not noise, watch it closely on the next crawl"></div>
    <p class="t" data-vi="<b>Trang chủ là trang duy nhất đi ngược chiều hôm nay.</b> Sau ba lần quét giảm liên tiếp (1.601 &#8594; 1.325 &#8594; 1.259 ms) — chuỗi cải thiện thật duy nhất được ghi nhận hôm qua — hôm nay lần đo đầu cho <b>1.988 ms</b>. Áp dụng đúng quy tắc mới: đo lại ba lần nữa trong cùng phiên, kết quả <b>2.103 / 2.537 / 1.534 ms</b>. <b>Bốn lần đo, bốn lần trên 1,5 giây</b>, trung bình <b>2.040 ms</b> — gấp rưỡi hôm qua và vượt xa biên độ nhiễu ±100 ms. Đây là <b>trang chậm nhất toàn site</b>, trong khi phần còn lại của site nhanh hơn hôm qua (bài viết 891 &#8594; 823 ms). <b>Hai manh mối:</b> (1) khi tải trang bằng điều hướng thật của trình duyệt, TTFB chỉ <b>1.136 ms</b> và dung lượng truyền 26 KB nén — bản cache CDN vẫn nhanh; phép đo <code>cache: no-store</code> đang phải chờ origin. (2) <code>/studio</code> (1.595 ms) và <code>/modules</code> (1.251, đo lại 1.428) cũng chậm hơn hôm qua, còn các trang gốc khác không đổi. Cả ba đều là trang <b>có nhiều thành phần động</b>. <b>Chưa nên kết luận nguyên nhân sau một ngày</b>, nhưng theo quy tắc &quot;ba lần cùng chiều&quot;: nếu lần quét tiếp theo trang chủ vẫn trên 1,5 giây thì đây là hồi quy thật và cần xem origin/cache của trang chủ. <b>Tác động điểm số hôm nay được giữ ở mức nhỏ</b> (Performance chỉ +1 thay vì +3) để phản ánh rủi ro này." data-en="<b>The homepage is the only page moving the wrong way today.</b> After three consecutive crawls of improvement (1,601 &#8594; 1,325 &#8594; 1,259 ms) — the one genuine improvement trend recorded yesterday — today's first measurement came in at <b>1,988 ms</b>. Applying the new rule, it was re-measured three more times within the same session: <b>2,103 / 2,537 / 1,534 ms</b>. <b>Four readings, all above 1.5 seconds</b>, averaging <b>2,040 ms</b> — half as slow again as yesterday and far outside the &#177;100 ms noise band. It is now <b>the slowest page on the site</b>, while the rest of the site is faster than yesterday (articles 891 &#8594; 823 ms). <b>Two clues:</b> (1) loading the page through a real browser navigation gave a TTFB of only <b>1,136 ms</b> with 26 KB transferred compressed — the CDN-cached copy is still quick; the <code>cache: no-store</code> measurement is waiting on the origin. (2) <code>/studio</code> (1,595 ms) and <code>/modules</code> (1,251, re-measured 1,428) are also slower than yesterday while the other core pages are unchanged. All three are pages <b>with many dynamic components</b>. <b>No root-cause conclusion should be drawn after one day</b>, but under the &quot;three readings in one direction&quot; rule: if the homepage is still above 1.5 seconds on the next crawl, this is a real regression and the homepage origin/cache path needs looking at. <b>Today's scoring impact is deliberately kept small</b> (Performance +1 rather than +3) to reflect this risk."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · Điều chỉnh · template dự án: nội dung vẫn ~248 từ, nhưng lỗi heading H1 &#8594; H3 không tái hiện được — con số 15 trang nhảy bậc được rút lại" data-en="P2 · Revised · project template: content still ~248 words, but the H1 &#8594; H3 skip cannot be reproduced — the 15-page heading-skip figure is withdrawn"></div>
    <p class="t" data-vi="<b>Hôm nay heading được đo lại từ đầu thay vì chép số cũ.</b> Quy tắc chuẩn: một &quot;nhảy bậc&quot; là khi heading đi sâu hơn một bậc (H1 &#8594; H3, H2 &#8594; H4). Trên HTML gốc, cả 6 trang dự án đều có cấu trúc <b>H1 &#8594; H2 (Location, Timeframe, Technologies, Related projects) &#8594; H3 &#8594; H4</b> — không nhảy bậc; DOM sau render của <code>/projects/251-station-st</code> cho đúng chuỗi đó. 8 trang gốc từng bị liệt kê (<code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code>, <code>/modules</code>, <code>/projects</code>, <code>/faq</code>, <code>/start-interactive</code>) cũng <b>không có bước nhảy sâu hơn một bậc nào</b>; <code>/start-interactive</code> chỉ có ba heading H1-H2-H2. <b>Trang duy nhất nhảy bậc thật là bài <code>bim-3d-4d-5d-explained</code> với 4 điểm H2 &#8594; H4</b> — khớp với số &quot;4 điểm&quot; của bản 28/08. Con số 15 trang được chép từ 28/08 đến 08/09 <b>không tái hiện được</b>; hoặc template đã được sửa mà chưa ai đo lại, hoặc số cũ dựa trên quy tắc khác. Từ nay bảng theo dõi dùng số đo hôm nay: <b>1 trang / 4 điểm</b>. <b>Việc còn lại của template dự án là nội dung:</b> 6 trang vẫn <b>241–257 từ, trung bình 248</b> (DOM render đếm được 232 từ), không nhúc nhích hơn sáu tuần dù đã có schema, tốc độ tốt nhất site (<b>635 ms</b>) và 22 internal link mỗi trang. Bổ sung phạm vi công việc, vật liệu, mốc thời gian để đạt 600–800 từ — <b>một template, sáu trang</b>." data-en="<b>Headings were re-measured from scratch today instead of carrying the old number forward.</b> The standard rule: a &quot;skip&quot; is a heading that goes more than one level deeper (H1 &#8594; H3, H2 &#8594; H4). In source HTML all 6 project pages follow <b>H1 &#8594; H2 (Location, Timeframe, Technologies, Related projects) &#8594; H3 &#8594; H4</b> — no skip; the rendered DOM of <code>/projects/251-station-st</code> shows exactly that sequence. The 8 core pages previously listed (<code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code>, <code>/modules</code>, <code>/projects</code>, <code>/faq</code>, <code>/start-interactive</code>) likewise <b>contain no jump deeper than one level</b>; <code>/start-interactive</code> has only three headings, H1-H2-H2. <b>The one page with genuine skips is the article <code>bim-3d-4d-5d-explained</code>, with 4 H2 &#8594; H4 points</b> — matching the &quot;4 points&quot; of the 28 Aug report. The 15-page figure carried from 28 Aug to 8 Sep <b>cannot be reproduced</b>; either the template was fixed without anyone re-measuring, or the old count used a different rule. From today the tracker uses today's measurement: <b>1 page / 4 points</b>. <b>What remains on the project template is content:</b> the 6 pages still sit at <b>241&#8211;257 words, averaging 248</b> (232 counted in the rendered DOM), unmoved for over six weeks despite having schema, the fastest group on the site (<b>635 ms</b>) and 22 internal links each. Add scope, materials and timeline sections to reach 600&#8211;800 words — <b>one template, six pages</b>."></p>
  </div>

  <div class="ins p3">
    <div class="prio t" data-vi="P3 · 1 ảnh template thiếu alt trên cả 103 trang · heading đứng trước H1 trên mọi bài · lazy-load ổn định 53%" data-en="P3 · 1 template image lacks alt on all 103 pages · a heading precedes the H1 on every article · lazy-loading steady at 53%"></div>
    <p class="t" data-vi="<b>Đúng 1 ảnh thiếu <code>alt</code> trên mỗi trang, trên cả 103/103 trang</b> — <b>103 trong 1.182 ảnh (8,7%)</b>, tỷ lệ y hệt ba lần quét trước. DOM sau render của trang chủ (22 ảnh), <code>/articles</code> (11 ảnh) và <code>/projects/251-station-st</code> (21 ảnh) đều cho <b>0 ảnh thiếu alt</b> — <code>alt</code> được gắn khi hydrate, nên vẫn là việc một dòng chủ yếu vì bot AI đọc HTML gốc. <b>Phát hiện mới, cũng từ việc đo lại heading:</b> <b>mọi bài viết đều có một <code>&lt;h2&gt;ARTICLES&lt;/h2&gt;</code> đứng trước <code>h1</code></b> (nhãn chuyên mục trong template), và trang <code>/articles</code> có <b>4 thẻ <code>h3</code> đứng trước <code>h1</code></b>. Không phải nhảy bậc, nhưng heading đứng trước H1 làm dàn ý trang bắt đầu sai chỗ với trình đọc màn hình và một số công cụ phân tích; đổi nhãn đó sang <code>&lt;p&gt;</code> hoặc <code>&lt;span&gt;</code> là xong cho cả 80 bài. Lazy-load giữ ổn định: <b>627/1.182 ảnh (53,0%)</b> có <code>loading=&quot;lazy&quot;</code>; trang chủ 17/22, trang dự án 16/21 sau render." data-en="<b>Exactly one image lacks <code>alt</code> on every page, across all 103</b> — <b>103 of 1,182 images (8.7%)</b>, the same ratio as the previous three crawls. The rendered DOM of the homepage (22 images), <code>/articles</code> (11) and <code>/projects/251-station-st</code> (21) all show <b>zero missing alt</b> — the attribute is added on hydration, so this stays a one-line fix that matters mainly because AI crawlers read source HTML. <b>A new observation, also from the heading re-measurement:</b> <b>every article carries an <code>&lt;h2&gt;ARTICLES&lt;/h2&gt;</code> before its <code>h1</code></b> (a section label in the template), and <code>/articles</code> has <b>4 <code>h3</code> tags before its <code>h1</code></b>. Not a skip, but a heading before the H1 starts the page outline in the wrong place for screen readers and some analysis tools; switching that label to a <code>&lt;p&gt;</code> or <code>&lt;span&gt;</code> fixes all 80 articles at once. Lazy-loading holds steady: <b>627 of 1,182 images (53.0%)</b> carry <code>loading=&quot;lazy&quot;</code>; homepage 17 of 22, project page 16 of 21 after render."></p>
  </div>

  <div class="ins win">
    <div class="prio t" data-vi="&#10003; THẮNG · 215.000 từ, 103/103 trang trả 200, cache lạnh hôm qua đã xác nhận, schema không nhân bản" data-en="&#10003; WIN · 215,000 words, 103 of 103 pages return 200, yesterday's cold cache confirmed, no schema duplication"></div>
    <p class="t" data-vi="<b>Tổng số từ toàn site 213.007 &#8594; 215.236 (+2.229)</b>, trung bình mỗi bài <b>2.548 từ</b>, bài mới 2.300 từ nằm trên ngưỡng chuẩn. <b>Dự đoán hôm qua đúng:</b> <code>development-application-3d-render</code> đo lại <b>1.848 &#8594; 877 ms</b> — con số 1.848 chỉ là cache lạnh của trang vừa đăng, và bài mới hôm nay đo <b>625 ms</b> ngay lần đầu. <b>Nhóm bài viết nhanh hơn rõ:</b> 891 &#8594; 823 ms, bài dưới 1 giây 58 &#8594; 65/80, bài chậm nhất 1.848 &#8594; 1.413 ms. Nền tảng kỹ thuật tiếp tục sạch: <b>103/103 trang trả 200</b>, <b>0 timeout</b>, <b>103/103 trang đúng một <code>h1</code></b> kèm đủ title, meta description và canonical, <b>103/103 trang có link về trang chủ</b>. <b>Hệ số nhân bản schema vẫn đúng 1,0&#215;</b> — các khối JSON-LD được so sánh theo nội dung, không khối nào trùng — lỗi 14 khối giống hệt nhau từng là P1 lớn nhất nay đã im lặng hơn ba tuần. <b>Số trang mỏng giữ nguyên 11</b> (5 trang gốc chức năng + 6 trang dự án). Và quan trọng nhất: <b>lần đầu tiên kể từ 03/09, hạng mục thấp nhất không còn là Crawlability</b> — 5 điểm thành phần nay đều từ 88 trở lên." data-en="<b>Site-wide words 213,007 &#8594; 215,236 (+2,229)</b>, article average <b>2,548 words</b>, with the new article at 2,300 above the working threshold. <b>Yesterday's prediction held:</b> <code>development-application-3d-render</code> re-measured at <b>1,848 &#8594; 877 ms</b> — the 1,848 was just the cold cache of a freshly published page, and today's new article measured <b>625 ms</b> on its first request. <b>Articles are clearly faster:</b> 891 &#8594; 823 ms, articles under one second 58 &#8594; 65 of 80, slowest article 1,848 &#8594; 1,413 ms. The technical foundation stays clean: <b>103 of 103 pages return 200</b>, <b>zero timeouts</b>, <b>all 103 pages carry exactly one <code>h1</code></b> plus title, meta description and canonical, <b>all 103 link home</b>. <b>Schema duplication holds at exactly 1.0&#215;</b> — JSON-LD blocks compared by content, none identical — the 14-identical-blocks defect that was once the site's largest P1 has been silent for over three weeks. <b>Thin pages hold at 11</b> (5 functional core pages + 6 project pages). And most importantly: <b>for the first time since 3 Sep, the lowest sub-score is no longer Crawlability</b> — all five sub-scores now sit at 88 or above."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="Roadmap · Next steps ưu tiên" data-en="Roadmap · Prioritised next steps"></div>
    <p class="t" data-vi="<b>Health 87 &#8594; 91/100.</b> Bốn điểm tăng đến từ một việc đã làm xong: <b>trang hub <code>/articles</code> đã được sửa</b>, 80/80 bài lộ trong HTML gốc, 0 bài mồ côi. Danh sách việc vì thế được sắp lại. <b>Việc số 1 — dựng chốt chặn <code>FAQPage</code> (P1):</b> ba bài mới liên tiếp cùng thiếu, 65/80; đưa FAQ thành trường bắt buộc hoặc kiểm tra tự động trước khi publish, rồi dọn 15 bài. <b>Việc số 2 — 301 mười URL slug dài về slug ngắn (P2 mới)</b> và sửa <code>href</code> lỗi trong <code>6-benefits-of-using-vr-technology</code>; sau đó cập nhật 32 link nội bộ đang trỏ vào slug dài. Đây là việc kỹ thuật một lần, gỡ trùng lặp cho 10 bài và đưa Crawlability lên mức 97. <b>Việc số 3 — theo dõi trang chủ (P2 mới):</b> nếu lần quét sau vẫn trên 1,5 giây (hôm nay 4 lần đo đều 1,5–2,5 giây), kiểm tra origin/cache của trang chủ; chưa cần hành động trước khi có lần đo thứ hai. <b>Việc số 4 — template 6 trang dự án:</b> chỉ còn nội dung (248 &#8594; 600–800 từ); lỗi heading đã được xác nhận là không tồn tại. <b>Việc số 5 (P3) — thêm <code>alt</code> cho ảnh template, đổi nhãn <code>&lt;h2&gt;ARTICLES&lt;/h2&gt;</code> trước H1 thành thẻ không phải heading, và bổ sung dần link ngữ cảnh cho 21 bài hiện chỉ được hub trỏ tới.</b>" data-en="<b>Health 87 &#8594; 91/100.</b> The four points gained come from one job done: <b>the <code>/articles</code> hub is fixed</b>, 80 of 80 articles exposed in source HTML, zero orphans. The list is therefore re-ordered. <b>Job one — build the <code>FAQPage</code> gate (P1):</b> three consecutive new articles missing it, 65 of 80; make FAQ a required field or an automated pre-publish check, then clear the 15 articles. <b>Job two — 301 the ten long-slug URLs to their short slugs (new P2)</b> and fix the malformed <code>href</code> in <code>6-benefits-of-using-vr-technology</code>; then update the 32 internal links that still point at long slugs. One-off technical work that removes the duplication for 10 articles and lifts Crawlability to the 97 level. <b>Job three — watch the homepage (new P2):</b> if the next crawl is still above 1.5 seconds (today's four readings were all 1.5&#8211;2.5 s), inspect the homepage origin/cache path; no action is needed before a second reading. <b>Job four — the six-page project template:</b> only content remains (248 &#8594; 600&#8211;800 words); the heading defect has been confirmed not to exist. <b>Job five (P3) — add <code>alt</code> to the template image, change the <code>&lt;h2&gt;ARTICLES&lt;/h2&gt;</code> label before the H1 to a non-heading tag, and gradually add contextual links to the 21 articles currently linked only from the hub.</b>"></p>
  </div>

function trFmt(d){const p=d.split('-');return LANG==='vi'?p[2]+'/'+p[1]:p[2]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1];}

/* generic multi-series line chart -> inline SVG string */
function trChart(rows, series, opts){
  opts = opts || {};
  const W=520, H=opts.h||210, L=42, R=12, TP=14, BT=30;
  const iw=W-L-R, ih=H-TP-BT;
  let vals=[]; series.forEach(s=>rows.forEach(r=>{const v=r[s.i]; if(v!==null&&v!==0||s.zero)vals.push(v);}));
  let lo = opts.min!==undefined?opts.min:Math.min.apply(null,vals);
  let hi = opts.max!==undefined?opts.max:Math.max.apply(null,vals);
  if(hi===lo){hi=lo+1;}
  const pad=(hi-lo)*0.12; lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=>L+(rows.length<2?iw/2:i*iw/(rows.length-1));
  const Y=v=>TP+ih-(v-lo)/(hi-lo)*ih;
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let g='';
  /* gridlines + y labels */
  const TICKS=4;
  for(let t=0;t<=TICKS;t++){
    const v=lo+(hi-lo)*t/TICKS, y=Y(v);
    g+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" ${t?'stroke-dasharray="3 4"':''}/>`;
    g+=`<text x="${L-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">${Math.round(v).toLocaleString(loc)}</text>`;
  }
  /* x labels: first, last and every other */
  rows.forEach((r,i)=>{
    if(i!==0 && i!==rows.length-1 && i%2) return;
    g+=`<text x="${X(i).toFixed(1)}" y="${H-11}" text-anchor="middle" font-size="9" fill="var(--muted)">${trFmt(r[0])}</text>`;
  });
  /* series */
  series.forEach(s=>{
    const pts=[];
    rows.forEach((r,i)=>{const v=r[s.i]; if(v===null||(v===0&&!s.zero))return; pts.push([X(i),Y(v),v,r[0]]);});
    if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area){
      g+=`<path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${TP+ih} L ${pts[0][0].toFixed(1)} ${TP+ih} Z" fill="${s.c}" opacity=".10"/>`;
    }
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{
      g+=`<circle class="tr-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.w>2?3:2.4}" fill="var(--card)" stroke="${s.c}" stroke-width="1.8"><title>${s.n} · ${trFmt(p[3])}: ${p[2].toLocaleString(loc)}${opts.unit||''}</title></circle>`;
    });
    /* value label on the last point */
    if(s.last!==false){
      const lp=pts[pts.length-1];
      g+=`<text x="${(lp[0]+6).toFixed(1)}" y="${(lp[1]-6).toFixed(1)}" font-size="10.5" font-weight="700" fill="${s.c}">${lp[2].toLocaleString(loc)}</text>`;
    }
  });
  const lg=series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('');
  return `<svg class="tr-svg" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tr-lg">${lg}</div>`;
}

function foldSec(btnId, wrapId){
  const b=document.getElementById(btnId), w=document.getElementById(wrapId);
  const open = b.getAttribute("aria-expanded")!=="true";
  b.setAttribute("aria-expanded", open?"true":"false");
  w.hidden = !open;
}
function pkToggleLabel(){
  const el=document.getElementById('pkToggleSel'); if(!el) return;
  const one = PK_SEL.s===PK_SEL.e;
  const cur = PK_SEL.s===PK_TODAY;
  el.textContent = LANG==='vi'
    ? (one ? (cur?'· đang xem bản hôm nay ('+pkFmt(PK_SEL.s)+')':'· đang xem '+pkFmt(PK_SEL.s)) : '· khoảng '+pkFmt(PK_SEL.s)+' – '+pkFmt(PK_SEL.e))
    : (one ? (cur?'· viewing today ('+pkFmt(PK_SEL.s)+')':'· viewing '+pkFmt(PK_SEL.s)) : '· range '+pkFmt(PK_SEL.s)+' – '+pkFmt(PK_SEL.e));
}

let LANG = 'en';

function applyLang(){
  document.querySelectorAll('.t').forEach(e=>{
    const v = e.dataset[LANG];
    if(v!==undefined) e.innerHTML = v;
  });
  document.querySelectorAll('.tsvg').forEach(e=>{
    const v = e.dataset[LANG];
    if(v!==undefined) e.textContent = v;
  });
}

function setLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('btnVI').classList.toggle('active', l==='vi');
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.querySelectorAll('.langfix button[data-l]').forEach(b=>
    b.classList.toggle('active', b.dataset.l===l));
  applyLang();
  render();
  if(typeof pkRender==='function' && PK_SNAPS.length) pkRender();
}

function renderRt(){
  const loaded = [...PAGES].sort((a,b)=>b.rt-a.rt);
  const max = 2100;
  const col = ms => ms<1000?'var(--green)':ms<3000?'var(--accent)':ms<6000?'var(--amber)':'var(--red)';
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let h='';
  loaded.forEach(p=>{
    const w=Math.max(2,(p.rt/max*100)).toFixed(1);
    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

const tbody=document.querySelector('#pt tbody');
let sortK='rt', sortDir=1, filt='all';
function render(){
  renderRt();
  renderTrend();
  pkToggleLabel();
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let rows=[...PAGES];
  if(filt!=='all')rows=rows.filter(p=>p.grp===filt);
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}
    return sortDir*(x-y);
  });
  tbody.innerHTML=rows.map(p=>{
    const st='<span class="badge b200">200</span>';
    const sc=p.schema>0?`<span class="yes">${p.schema}</span>`:'<span class="no">0</span>';
    const sm=p.sm?'<span class="yes">✓</span>':'<span class="no">✗</span>';
    const rtc=p.rt<1000?'var(--green)':p.rt<3000?'var(--accent-dk)':p.rt<6000?'var(--amber)':'var(--red)';
    return `<tr>
      <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.url}">${p.url}</td>
      <td class="num">${st}</td>
      <td class="num" style="color:${rtc};font-weight:700">${p.rt.toLocaleString(loc)}</td>
      <td class="num">${p.words}</td>
      <td class="num">${sc}</td>
      <td class="num">${p.links}</td>
      <td>${sm}</td></tr>`;
  }).join('');
}
document.querySelectorAll('#pt th').forEach(th=>{
  th.addEventListener('click',()=>{
    const k=th.dataset.k;
    if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1;}
    render();
  });
});
document.querySelectorAll('.filter-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');filt=b.dataset.f;render();
  });
});

/* ================= date picker v2 (sample-matched) ================= */
const PK_BASE  = '';
const PK_TODAY = '2026-09-09';
let PK_SNAPS = [], PK_MAP = {}, PK_VIEW = null;
let PK_SEL = {s:PK_TODAY, e:PK_TODAY}, PK_DRAFT = {s:PK_TODAY, e:PK_TODAY}, PK_PENDING = false, PK_PRESET = null;

const PK_T = {
  vi:{day:'Ngày',range:'Khoảng',now:d=>`Đang xem báo cáo ngày ${d} (mới nhất)`,
      viewing:d=>`Đang xem báo cáo ngày ${d}`,
      trend:(a,b)=>`Đang xem xu hướng ${a} → ${b}`,
      quick:'Mở nhanh', today:'mới nhất',
      months:['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'],
      dow:['CN','T2','T3','T4','T5','T6','T7'],
      saved:n=>`${n} ngày đã lưu trong khoảng này · ngày theo giờ Việt Nam (Asia/Ho_Chi_Minh), là giờ lúc quét`,
      noRep:'Ngày này chưa quét — không có báo cáo riêng để mở.',
      trendTitle:(a,b)=>`Xu hướng Health Score · ${a} → ${b}`,
      open:'mở'},
  en:{day:'Day',range:'Range',now:d=>`Viewing the report for ${d} (latest)`,
      viewing:d=>`Viewing the report for ${d}`,
      trend:(a,b)=>`Viewing the trend ${a} → ${b}`,
      quick:'Quick open', today:'latest',
      months:['January','February','March','April','May','June','July','August','September','October','November','December'],
      dow:['Su','Mo','Tu','We','Th','Fr','Sa'],
      saved:n=>`${n} stored day(s) in this range · dates in Vietnam time (Asia/Ho_Chi_Minh), the time of the crawl`,
      noRep:'This day was not crawled — there is no separate report to open.',
      trendTitle:(a,b)=>`Health Score trend · ${a} → ${b}`,
      open:'open'}
};
const pkL = () => PK_T[LANG];

function pkISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pkD(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function pkFmt(iso){ const [y,m,d]=iso.split('-'); return LANG==='vi'?`${d}/${m}/${y}`:`${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`; }
function pkAdd(iso,n){ const d=pkD(iso); d.setDate(d.getDate()+n); return pkISO(d); }
function pkIn(iso,a,b){ return iso>=a && iso<=b; }
function pkCount(a,b){ return PK_SNAPS.filter(s=>pkIn(s.date,a,b)).length; }

function pkPresets(){
  const T=PK_TODAY, d=pkD(T);
  const monStart=(()=>{const x=pkD(T); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return pkISO(x);})();
  const lastMonStart=pkAdd(monStart,-7), lastMonEnd=pkAdd(monStart,-1);
  const mStart=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
  const pmStart=pkISO(pm), pmEnd=pkISO(new Date(d.getFullYear(),d.getMonth(),0));
  const first=PK_SNAPS.length?PK_SNAPS[0].date:T;
  return [
    {k:'y',   vi:'Hôm qua',   en:'Yesterday',   s:pkAdd(T,-1), e:pkAdd(T,-1)},
    {k:'7',   vi:'7 ngày qua', en:'Last 7 days',  s:pkAdd(T,-6), e:T},
    {k:'28',  vi:'28 ngày qua',en:'Last 28 days', s:pkAdd(T,-27),e:T},
    {k:'90',  vi:'90 ngày qua',en:'Last 90 days', s:pkAdd(T,-89),e:T},
    {k:'tw',  vi:'Tuần này',  en:'This week',   s:monStart, e:T},
    {k:'tm',  vi:'Tháng này', en:'This month',  s:mStart, e:T},
    {k:'ty',  vi:'Năm nay',   en:'This year',   s:`${d.getFullYear()}-01-01`, e:T},
    {k:'lw',  vi:'Tuần trước',en:'Last week',   s:lastMonStart, e:lastMonEnd},
    {k:'lm',  vi:'Tháng trước',en:'Last month', s:pmStart, e:pmEnd},
    {k:'all', vi:'Toàn bộ dữ liệu đã lưu', en:'All stored data', s:first, e:T}
  ];
}

function pkRenderPresets(){
  const box=document.getElementById('dpPresets'); if(!box) return;
  box.innerHTML = pkPresets().map(p=>{
    const n=pkCount(p.s,p.e), off=n===0;
    const on=PK_PRESET===p.k;
    return `<button type="button" class="dp-preset${on?' on':''}" data-k="${p.k}" ${off?'disabled':''}>
      <span class="rd"></span><span class="nm">${LANG==='vi'?p.vi:p.en}</span><span class="ct">${n}</span></button>`;
  }).join('');
  box.querySelectorAll('.dp-preset').forEach(b=>b.addEventListener('click',()=>{
    const p=pkPresets().find(x=>x.k===b.dataset.k);
    PK_PRESET=p.k; PK_DRAFT={s:p.s,e:p.e}; PK_PENDING=false;
    PK_VIEW=pkD(p.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1);
    pkRenderCal(); pkRenderPresets();
  }));
}

function pkMonth(base,off){
  const d=new Date(base.getFullYear(), base.getMonth()+off, 1);
  const y=d.getFullYear(), m=d.getMonth();
  const start=new Date(y,m,1).getDay(); // 0=Sun
  const days=new Date(y,m+1,0).getDate();
  let cells=pkL().dow.map(x=>`<div class="dp-dow">${x}</div>`).join('');
  for(let i=0;i<start;i++) cells+='<button class="dp-d blank" disabled></button>';
  for(let dd=1;dd<=days;dd++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const has=!!PK_MAP[iso];
    const sel=iso===PK_DRAFT.s||iso===PK_DRAFT.e;
    const inr=pkIn(iso,PK_DRAFT.s,PK_DRAFT.e)&&!sel;
    const edge=iso===PK_DRAFT.s&&PK_DRAFT.s!==PK_DRAFT.e?' edge-l':(iso===PK_DRAFT.e&&PK_DRAFT.s!==PK_DRAFT.e?' edge-r':'');
    cells+=`<button type="button" class="dp-d${has?' has':''}${inr?' inrange':''}${sel?' sel'+edge:''}" data-iso="${iso}">${dd}${has?'<span class="dot"></span>':''}</button>`;
  }
  return {title:`${pkL().months[m]} ${y}`, html:`<div class="dp-grid">${cells}</div>`};
}

function pkRenderCal(){
  if(!PK_VIEW){ PK_VIEW=pkD(PK_SEL.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1); }
  const a=pkMonth(PK_VIEW,0), b=pkMonth(PK_VIEW,1);
  document.getElementById('dpM1').textContent=a.title;
  document.getElementById('dpM2').textContent=b.title;
  document.getElementById('dpG1').innerHTML=a.html;
  document.getElementById('dpG2').innerHTML=b.html;
  document.querySelectorAll('#dpG1 .dp-d,#dpG2 .dp-d').forEach(el=>{
    if(el.classList.contains('blank')) return;
    el.addEventListener('click',()=>{
      const iso=el.dataset.iso;
      if(!PK_PENDING){ PK_DRAFT={s:iso,e:iso}; PK_PENDING=true; }
      else { PK_DRAFT = iso<PK_DRAFT.s ? {s:iso,e:PK_DRAFT.s} : {s:PK_DRAFT.s,e:iso}; PK_PENDING=false; }
      PK_PRESET=null; pkRenderCal(); pkRenderPresets();
    });
  });
  const single=PK_DRAFT.s===PK_DRAFT.e;
  document.getElementById('dpSelD').textContent = single?pkFmt(PK_DRAFT.s):`${pkFmt(PK_DRAFT.s)} → ${pkFmt(PK_DRAFT.e)}`;
  const n=pkCount(PK_DRAFT.s,PK_DRAFT.e);
  document.getElementById('dpSelInfo').textContent = n===0 ? pkL().noRep : pkL().saved(n);
}

function pkRenderQuick(){
  const box=document.getElementById('dpQuick'); if(!box) return;
  const chips=PK_SNAPS.slice().reverse().map(s=>{
    const cur=s.date===PK_SEL.s&&PK_SEL.s===PK_SEL.e;
    const lb=LANG==='vi'?(s.label_vi||''):(s.label_en||'');
    return `<button type="button" class="qchip${cur?' cur':''}" data-iso="${s.date}">
      <span class="qd">${pkFmt(s.date)}</span><span class="ql">${lb}</span></button>`;
  }).join('');
  box.innerHTML=`<span class="pk-quick-lbl">${pkL().quick}</span>`+chips;
  box.querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('cur')) return;
    pkGo(b.dataset.iso,b.dataset.iso);
  }));
}

function pkRenderNow(){
  const el=document.getElementById('dpNow'); if(!el) return;
  const single=PK_SEL.s===PK_SEL.e;
  el.textContent = !single ? pkL().trend(pkFmt(PK_SEL.s),pkFmt(PK_SEL.e))
    : (PK_SEL.s===PK_TODAY ? pkL().now(pkFmt(PK_SEL.s)) : pkL().viewing(pkFmt(PK_SEL.s)));
  document.getElementById('dpLabel').textContent = single
    ? `${pkL().day} ${pkFmt(PK_SEL.s)}` : `${pkL().range} ${pkFmt(PK_SEL.s)} → ${pkFmt(PK_SEL.e)}`;
}

function pkGo(s,e){
  if(s===e){
    const snap=PK_MAP[s];
    if(snap && s!==PK_TODAY){ location.href=PK_BASE+snap.report; return; }
    PK_SEL={s,e}; PK_DRAFT={s,e}; PK_PRESET=null;
    document.getElementById('dpTrend').classList.remove('on');
    pkRenderNow(); pkRenderQuick(); pkRenderCal();
    return;
  }
  PK_SEL={s,e}; pkRenderNow(); pkRenderQuick(); pkTrend(s,e);
}

function pkTrend(s,e){
  const box=document.getElementById('dpTrend');
  const days=PK_SNAPS.filter(x=>pkIn(x.date,s,e));
  if(!days.length){ box.classList.remove('on'); box.innerHTML=''; return; }
  Promise.all(days.map(d=>fetch(PK_BASE+d.data,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)))
   .then(js=>{
     const rows=js.map((j,i)=>({date:days[i].date, rep:days[i].report, hs:j&&j.health_score, pg:j&&j.pages_measured}))
                  .filter(r=>r.hs!=null);
     box.innerHTML=`<h4>${pkL().trendTitle(pkFmt(s),pkFmt(e))}</h4>`+rows.map(r=>`
       <div class="trd"><span class="tdate">${pkFmt(r.date)}</span>
         <span class="ttrack"><span class="tfill" style="width:${r.hs}%"></span></span>
         <span class="tval">${r.hs}</span>
         <span class="tlink" data-h="${r.rep}">${pkL().open} &#8594;</span></div>`).join('');
     box.classList.add('on');
     box.querySelectorAll('.tlink').forEach(a=>a.addEventListener('click',()=>{
       const h=a.dataset.h; if(h && h!=='index.html') location.href=PK_BASE+h;
     }));
   });
}

function pkRender(){ pkRenderPresets(); pkRenderCal(); pkRenderQuick(); pkRenderNow(); pkToggleLabel(); }

(function pkInit(){
  const btn=document.getElementById('dpBtn'), pane=document.getElementById('dpPane');
  if(!btn) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=pane.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
    if(open){ PK_DRAFT={...PK_SEL}; PK_PENDING=false; pkRenderCal(); pkRenderPresets(); }
  });
  document.addEventListener('click',e=>{
    if(!pane.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') pane.classList.remove('open'); });
  document.getElementById('dpPrev').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()-1); pkRenderCal(); });
  document.getElementById('dpNext').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()+1); pkRenderCal(); });
  document.getElementById('dpCancel').addEventListener('click',()=>{
    PK_DRAFT={...PK_SEL}; PK_PENDING=false; PK_PRESET=null;
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false'); pkRenderCal();
  });
  document.getElementById('dpApply').addEventListener('click',()=>{
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    pkGo(PK_DRAFT.s,PK_DRAFT.e);
  });
  fetch(PK_BASE+'data/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    PK_SNAPS=(j.snapshots||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s);
    pkRender();
  }).catch(()=>{
    PK_SNAPS=[{date:PK_TODAY,report:'index.html',data:'data/'+PK_TODAY+'.json',label_vi:'Bản hiện tại',label_en:'Current report'}];
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s); pkRender();
  });
})();

setLang('en');
</script>
