<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 16 trang gốc + toàn bộ 45 bài /articles + sitemap" data-en="Source: Chrome live crawl · 16 core pages + all 45 /articles + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>30/07/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>30 Jul 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>61 trang</b> · Sitemap: <b>67 URL</b>" data-en="Directly measured: <b>61 pages</b> · Sitemap: <b>67 URLs</b>"></span><br>
        Method: Chrome fetch · AbortController 9–12s
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi">
      <div class="lbl t" data-vi="Health Score" data-en="Health Score"></div>
      <div class="score-ring">
        <div class="val" style="color:var(--green)">87<span style="font-size:15px;color:var(--muted)">/100</span></div>
      </div>
      <div class="note"><span class="tag green t" data-vi="Tốt — đang tăng" data-en="Good — improving"></span></div>
      <div class="delta up t" data-vi="▲ +3 so hôm qua (29/07: 84) · schema deploy 12 trang gốc" data-en="▲ +3 vs yesterday (29 Jul: 84) · schema deployed to 12 core pages"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Sitemap URL" data-en="Sitemap URLs"></div>
      <div class="val" style="color:var(--green)">67</div>
      <div class="note t" data-vi="16 gốc + 45 bài + 6 dự án" data-en="16 core + 45 articles + 6 projects"></div>
      <div class="delta flat t" data-vi="= không đổi · cả 45 bài /articles đều có trong sitemap" data-en="= unchanged · all 45 /articles present in sitemap"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="TTFB TB — trang gốc" data-en="Avg TTFB — core"></div>
      <div class="val" style="color:var(--green)">0,8<span style="font-size:15px">s</span></div>
      <div class="note t" data-vi="11/16 trang gốc &lt;1s · /articles 1,55s · trang chủ 1,26s" data-en="11/16 core pages &lt;1s · /articles 1.55s · homepage 1.26s"></div>
      <div class="delta flat t" data-vi="= ổn định · 54/61 trang &lt;1s (cache ấm)" data-en="= stable · 54/61 pages &lt;1s (warm cache)"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="TTFB TB — bài viết" data-en="Avg TTFB — articles"></div>
      <div class="val" style="color:var(--green)">0,8<span style="font-size:15px">s</span></div>
      <div class="note t" data-vi="Toàn bộ 45 bài · 0,56–1,18s · SSG/cache ổn định" data-en="All 45 articles · 0.56–1.18s · SSG/cache stable"></div>
      <div class="delta up t" data-vi="▲ nhanh hơn · chậm nhất /architectural-rendering 1,18s · 31–32 schema + 1 H1 mỗi bài" data-en="▲ faster · slowest /architectural-rendering 1.18s · 31–32 schema + 1 H1 each"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Schema (JSON-LD)" data-en="Schema (JSON-LD)"></div>
      <div class="val" style="color:var(--green)">13/16 ✓</div>
      <div class="note t" data-vi="Trang chủ 24 · 12 trang gốc mới 14–15 · Bài 31–32" data-en="Home 24 · 12 new core pages 14–15 · Articles 31–32"></div>
      <div class="delta up t" data-vi="▲ ĐÃ SỬA · 12 trang gốc từ 0 → có Service+Breadcrumb · còn 3 trang 0" data-en="▲ FIXED · 12 core pages 0 → Service+Breadcrumb · 3 pages still 0"></div>
    </div>
  </div>

  <!-- Charts -->
  <h2 class="sec t" data-vi="Điểm sức khỏe theo hạng mục &amp; phân bố tốc độ" data-en="Health sub-scores &amp; speed distribution"></h2>
  <div class="grid2">
    <div class="card">
      <h3 class="t" data-vi="5 điểm thành phần (/100)" data-en="5 sub-scores (/100)"></h3>
      <div class="bar-row"><span class="name t" data-vi="Crawlability" data-en="Crawlability"></span><div class="bar-track"><div class="bar-fill" style="width:90%;background:var(--green)">90</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Performance / TTFB" data-en="Performance / TTFB"></span><div class="bar-track"><div class="bar-fill" style="width:93%;background:var(--green)">93</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Structured Data / AEO" data-en="Structured Data / AEO"></span><div class="bar-track"><div class="bar-fill" style="width:88%;background:var(--green)">88</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="On-page / Meta" data-en="On-page / Meta"></span><div class="bar-track"><div class="bar-fill" style="width:79%;background:var(--blue)">79</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Content" data-en="Content"></span><div class="bar-track"><div class="bar-fill" style="width:80%;background:var(--blue)">80</div></div></div>
      <div class="foot t" data-vi="Health tổng <b>87/100</b> (▲ +3 so hôm qua 29/07: 84). Bước nhảy đến từ <b>Structured Data 74 → 88</b>: 12 trang gốc trước đây 0 JSON-LD nay đã có <code>Service</code> + <code>BreadcrumbList</code> (14–15 schema/trang). Chi tiết hôm nay: Crawlability 90 (61/61 trả 200, mọi bài trong sitemap, chỉ /login ngoài sitemap), Performance 93 (54/61 trang &lt;1s; chậm nhất chỉ 1,55s), Structured Data 88 (trang chủ 24 + 12 trang gốc 14–15 + 45 bài 31–32; chỉ còn /articles, /start-interactive, /login = 0), On-page 79 (trang chủ 7/11 ảnh thiếu alt, heading nhảy bậc 2→4), Content 80 (bài 1.136–3.043 từ). Trọng số: Crawl 25% · Perf 25% · Schema 20% · On-page 15% · Content 15%." data-en="Overall health <b>87/100</b> (▲ +3 vs yesterday 29 Jul: 84). The jump comes from <b>Structured Data 74 → 88</b>: 12 core pages that carried 0 JSON-LD now ship <code>Service</code> + <code>BreadcrumbList</code> (14–15 schema each). Today's detail: Crawlability 90 (61/61 return 200, every article in sitemap, only /login outside it), Performance 93 (54/61 pages &lt;1s; slowest just 1.55s), Structured Data 88 (homepage 24 + 12 core pages 14–15 + all 45 articles 31–32; only /articles, /start-interactive, /login left at 0), On-page 79 (homepage 7/11 images missing alt, heading skip 2→4), Content 80 (articles 1,136–3,043 words). Weights: Crawl 25% · Perf 25% · Schema 20% · On-page 15% · Content 15%."></div>
    </div>
    <div class="card">
      <h3 class="t" data-vi="Phân bố tốc độ (61 trang đo trực tiếp)" data-en="Speed distribution (61 pages measured)"></h3>
      <div class="donut-wrap">
        <svg width="150" height="150" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--cream2)" stroke-width="6"></circle>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--green)" stroke-width="6"
            stroke-dasharray="88.5 11.5" stroke-dashoffset="25"></circle>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--amber)" stroke-width="6"
            stroke-dasharray="11.5 88.5" stroke-dashoffset="-63.5"></circle>
          <text x="21" y="20" text-anchor="middle" font-size="7" font-weight="700" fill="#2c2620">61</text>
          <text x="21" y="26.5" text-anchor="middle" font-size="3.2" fill="#6f665a" class="tsvg" data-vi="trang" data-en="pages">trang</text>
        </svg>
        <div class="legend">
          <div><span class="dot" style="background:var(--green)"></span> <span class="t" data-vi="Nhanh &lt;1s: <b>54</b> · 88,5%" data-en="Fast &lt;1s: <b>54</b> · 88.5%"></span></div>
          <div><span class="dot" style="background:var(--amber)"></span> <span class="t" data-vi="1–3s: <b>7</b> · 11,5%" data-en="1–3s: <b>7</b> · 11.5%"></span></div>
          <div><span class="dot" style="background:var(--red)"></span> <span class="t" data-vi="Chậm &gt;3s: <b>0</b> · 0%" data-en="Slow &gt;3s: <b>0</b> · 0%"></span></div>
          <div class="foot t" style="margin-top:10px" data-vi="<b>Không trang nào &gt;3s.</b> Crawl toàn bộ 61 trang (16 gốc + 45 bài): <b>54/61 trang &lt;1s</b> (88,5%, tăng từ 50 hôm qua). Cả 45 bài /articles ở 0,56–1,18s — sự cố chậm 6,5–10,8s trước đây vẫn đã hết hẳn. Chậm nhất lần này: trang listing <code>/articles</code> 1,55s và trang chủ 1,26s — nằm trong biến động mạng bình thường, không phải regression. 7 trang nhóm 1–3s gồm trang chủ, /articles, /studio, /interiors, /contact và 2 bài dài." data-en="<b>No page exceeds 3s.</b> Crawl of all 61 pages (16 core + 45 articles): <b>54/61 pages &lt;1s</b> (88.5%, up from 50 yesterday). All 45 /articles sit at 0.56–1.18s — the old 6.5–10.8s slowdown remains fully gone. Slowest this scan: the <code>/articles</code> listing at 1.55s and the homepage at 1.26s — within normal network jitter, not a regression. The 7 pages in the 1–3s band are the homepage, /articles, /studio, /interiors, /contact and 2 long articles."></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Insights -->
  <h2 class="sec t" data-vi="Hướng đi &amp; Insight ưu tiên" data-en="Direction &amp; Priority insights"></h2>

  <div class="ins win">
    <div class="prio t" data-vi="✓ AUDIT HÔM NAY (30/07) — cải thiện lớn, P1 đã xử lý" data-en="✓ TODAY'S AUDIT (30 Jul) — major improvement, P1 resolved"></div>
    <h4 class="t" data-vi="Health 84 → 87: 12 trang gốc vừa được deploy schema Service + BreadcrumbList" data-en="Health 84 → 87: 12 core pages just received Service + BreadcrumbList schema"></h4>
    <p class="t" data-vi="Crawl hôm nay (30/07) phát hiện <b>thay đổi tích cực rõ rệt</b>: 12 trang gốc trước đây hoàn toàn trống schema — <code>/about</code>, <code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code>, <code>/modules</code>, <code>/projects</code>, <code>/suppliers</code>, <code>/apply</code>, <code>/contact</code>, <code>/privacy-policy</code>, <code>/terms-of-service</code> — <b>nay đã có 14–15 JSON-LD</b> (rendered-DOM /studio xác nhận: 14 khối <code>Service</code> + 14 <code>BreadcrumbList</code>). Đây đúng là đề xuất P1 của báo cáo hôm qua, nay đã triển khai. Điểm sáng cũ vẫn giữ: cả 45 bài <code>/articles/*</code> trả 200 với TTFB <b>0,56–1,18s</b>, 31–32 JSON-LD/bài (32/45 có FAQPage), 1 H1 giàu từ khóa; trang chủ 24 JSON-LD; sitemap 67 URL; 61/61 trang trả 200, 0 timeout." data-en="Today's crawl (30 Jul) detected a <b>clear positive change</b>: 12 core pages that were completely schema-bare — <code>/about</code>, <code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code>, <code>/modules</code>, <code>/projects</code>, <code>/suppliers</code>, <code>/apply</code>, <code>/contact</code>, <code>/privacy-policy</code>, <code>/terms-of-service</code> — <b>now carry 14–15 JSON-LD</b> (rendered-DOM on /studio confirms: 14 <code>Service</code> + 14 <code>BreadcrumbList</code> blocks). This is exactly the P1 recommendation from yesterday's report, now shipped. Prior highlights hold: all 45 <code>/articles/*</code> return 200 with TTFB <b>0.56–1.18s</b>, 31–32 JSON-LD each (32/45 with FAQPage), a single keyword-rich H1; homepage 24 JSON-LD; sitemap 67 URLs; 61/61 pages return 200, 0 timeouts."></p>
    <p class="fix t" data-vi="<b>Việc tiếp theo:</b> điểm còn nhích tiếp khi (1) thêm alt cho 7 ảnh hero trang chủ và (2) bổ sung <code>CollectionPage</code>/<code>ItemList</code> cho trang listing <code>/articles</code> (hiện vẫn 0 schema). Vào GSC xác nhận schema mới đã được Google 'Valid' và không lỗi." data-en="<b>Next:</b> the score rises further once (1) alt is added to the 7 homepage hero images and (2) <code>CollectionPage</code>/<code>ItemList</code> schema is added to the <code>/articles</code> listing (still 0 schema). In GSC, confirm the new schema is 'Valid' with no errors."></p>
  </div>

  <div class="ins win">
    <div class="prio t" data-vi="✓ ĐÃ SỬA · P1 cũ · Schema trang gốc" data-en="✓ FIXED · former P1 · Core-page schema"></div>
