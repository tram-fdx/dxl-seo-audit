<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  .langfix{position:fixed;top:14px;right:14px;z-index:120;display:inline-flex;
    border:1px solid var(--accent);border-radius:20px;overflow:hidden;background:var(--card);
    box-shadow:0 2px 12px rgba(70,55,30,.2)}
  .langfix button{background:transparent;color:var(--muted);border:none;padding:6px 15px;
    font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px;font-family:inherit;line-height:1.5}
  .langfix button.active{background:var(--accent);color:#2c2620}
  .langfix button:not(.active):hover{color:var(--ink)}
  @media(max-width:700px){.langfix{top:8px;right:8px}
    .langfix button{padding:5px 12px;font-size:11px}}
  @media print{.langfix{display:none}}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .legend .foot{display:block;line-height:1.55}
  .legend{max-width:520px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}

  /* ---------- date picker v2 (sample-matched) ---------- */
  /* collapsible date picker */
  .pk-toggle{margin-top:24px;width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 20px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);
    text-align:left;transition:border-color .15s,box-shadow .15s}
  .pk-toggle:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(184,147,90,.13)}
  .pk-toggle .lft{display:flex;align-items:center;gap:11px;min-width:0}
  .pk-toggle .bar{display:inline-block;width:3px;height:17px;background:var(--accent);border-radius:2px;flex:none}
  .pk-toggle .cap{font-weight:600}
  .pk-toggle .sel{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
  .pk-toggle .chev{flex:none;transition:transform .2s;color:var(--muted);font-size:12px}
  .pk-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .pk-wrap[hidden]{display:none}
  .pk-wrap .pk-card{margin-top:10px}

  /* trend charts */
  .tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.tr-grid{grid-template-columns:1fr}}
  .tr-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 14px}
  .tr-card h3{margin:0 0 2px;font-size:14.5px;font-weight:700;color:var(--ink)}
  .tr-card .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
  .tr-lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .tr-lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .tr-svg{width:100%;height:auto;display:block;overflow:visible}
  .tr-dot{transition:r .12s}
  .tr-card:hover .tr-dot{r:3.2}
  .pk-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 16px;box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .pk-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;
    letter-spacing:.9px;text-transform:uppercase;color:var(--accent-dk);margin:0 0 8px}
  .pk-title .bar{width:26px;height:3px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  .pk-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;max-width:900px}
  .pk-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dpwrap{position:relative}
  .dpbtn{display:inline-flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid #cfc6b3;border-radius:10px;padding:10px 15px;font-family:inherit;
    font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink);cursor:pointer;transition:.15s}
  .dpbtn:hover{border-color:var(--accent)}
  .dpbtn .car{color:var(--muted);font-size:9px;margin-left:2px}
  .pk-now{display:inline-block;background:var(--accent-soft,#f3e7d3);color:var(--accent-dk);
    border:1px solid #e6d5b8;border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700}

  .dppane{position:absolute;top:calc(100% + 9px);left:0;z-index:80;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 40px rgba(70,55,30,.20);overflow:hidden}
  .dppane.open{display:flex}
  .dp-presets{width:196px;flex:0 0 auto;border-right:1px solid var(--line);
    padding:12px 8px;background:#fdfbf6;max-height:430px;overflow:auto}
  .dp-preset{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;
    font-size:12.5px;color:var(--ink);transition:.12s}
  .dp-preset:hover:not(:disabled){background:var(--cream2)}
  .dp-preset:disabled{color:#bdb4a6;cursor:not-allowed}
  .dp-preset .rd{width:13px;height:13px;border-radius:50%;border:1.5px solid #c3b9a6;flex:0 0 auto;position:relative}
  .dp-preset.on .rd{border-color:var(--accent)}
  .dp-preset.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
  .dp-preset .nm{flex:1}
  .dp-preset .ct{font-size:11.5px;color:var(--faint,#9a9186);font-weight:700}

  .dp-right{padding:14px 16px 12px;min-width:452px}
  .dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .dp-nav button{background:transparent;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
  .dp-nav button:hover:not(:disabled){background:var(--cream2);color:var(--ink)}
  .dp-nav button:disabled{opacity:.3;cursor:not-allowed}
  .dp-nav .mtitle{flex:1;display:flex;justify-content:space-around;font-size:13.5px;font-weight:700}
  .dp-months{display:flex;gap:26px}
  .dp-m{flex:1}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dp-dow{font-size:10.5px;color:var(--muted);text-align:center;padding:5px 0 3px;font-weight:700}
  .dp-d{position:relative;height:29px;border:none;background:transparent;border-radius:7px;
    font-family:inherit;font-size:12.5px;color:#bdb4a6;cursor:pointer;padding:0;transition:.1s}
  .dp-d.blank{cursor:default}
  .dp-d.has{color:var(--ink);font-weight:700}
  .dp-d:hover:not(.blank):not(.sel){background:var(--cream2)}
  .dp-d.inrange{background:var(--accent-soft,#f3e7d3);border-radius:0}
  .dp-d.sel{background:var(--accent);color:#2c2620;font-weight:800}
  .dp-d.sel.edge-l{border-radius:7px 0 0 7px}
  .dp-d.sel.edge-r{border-radius:0 7px 7px 0}
  .dp-d .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:3.5px;height:3.5px;border-radius:50%;background:var(--accent)}
  .dp-d.sel .dot{background:#2c2620}

  .dp-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-selinfo .d1{font-size:13.5px;font-weight:700}
  .dp-selinfo .d2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;max-width:300px}
  .dp-actions{display:flex;gap:9px;flex:0 0 auto}
  .dp-actions button{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:9px;
    padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .dp-actions .go{background:var(--accent);border-color:var(--accent);color:#2c2620}
  .dp-actions .go:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
  .dp-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
  .dp-legend .dotlg{display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-right:4px}

  .pk-quick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;
    padding-top:14px;border-top:1px solid var(--line)}
  .pk-quick-lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);
    text-transform:uppercase;flex:0 0 auto;margin-right:2px}
  .qchip{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--ink);transition:.13s;text-align:left}
  .qchip:hover{border-color:var(--accent);background:#fdfaf3}
  .qchip .qd{font-weight:700;flex:0 0 auto}
  .qchip .ql{font-size:11.5px;color:var(--muted)}
  .qchip.cur{background:var(--accent);border-color:var(--accent);color:#2c2620;cursor:default}
  .qchip.cur .ql{color:#5c4a24}

  .pk-trend{display:none;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .pk-trend.on{display:block}
  .pk-trend h4{margin:0 0 10px;font-size:13px;color:var(--accent-dk)}
  .trd{display:grid;grid-template-columns:88px 1fr 46px 62px;gap:9px;align-items:center;
    margin:6px 0;font-size:12.5px}
  .trd .tdate{font-weight:700}
  .trd .ttrack{background:var(--cream2);border-radius:6px;height:16px;overflow:hidden}
  .trd .tfill{height:100%;background:var(--accent);border-radius:6px}
  .trd .tval{font-weight:800;text-align:right}
  .trd .tlink{font-size:11px;color:var(--accent-dk);text-decoration:underline;cursor:pointer;text-align:right}
  @media(max-width:860px){.dppane.open{flex-direction:column}.dp-right{min-width:0}.dp-months{flex-direction:column;gap:14px}.dp-presets{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:none}}

</style>
</head>
<body>
<div class="langfix" role="group" aria-label="Language">
  <button type="button" data-l="vi" onclick="setLang('vi')">VI</button>
  <button type="button" data-l="en" onclick="setLang('en')">EN</button>
</div>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 17 trang gốc + 62 bài /articles + 6 trang dự án + sitemap" data-en="Source: Chrome live crawl · 17 core pages + 62 /articles + 6 project pages + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>25/08/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>25 Aug 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>85 trang</b> · Sitemap: <b>86 URL</b>" data-en="Directly measured: <b>85 pages</b> · Sitemap: <b>86 URLs</b>"></span><br>
        Method: Chrome fetch tuần tự · AbortController 12–15s
      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <!-- date picker v2 (collapsible) -->
  <button class="pk-toggle" id="pkToggle" type="button" aria-expanded="false" aria-controls="pkWrap" onclick="pkFold()">
    <span class="lft"><span class="bar"></span>
      <span class="cap t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span>
      <span class="sel" id="pkToggleSel"></span></span>
    <span class="chev">&#9660;</span>
  </button>
  <div class="pk-wrap" id="pkWrap" hidden>
  <div class="pk-card">
    <div class="pk-title"><span class="bar"></span><span class="t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span></div>
    <p class="pk-sub t" data-vi="Chọn <b>một ngày</b> rồi bấm <b>Cập nhật</b> để mở đúng bản báo cáo đã lưu của ngày đó. Chọn <b>một khoảng ngày</b> để xem xu hướng trong khoảng. Ngày <b>có dấu chấm</b> là ngày đã quét và có báo cáo lưu; ngày làm mờ vẫn chọn được làm đầu/cuối khoảng, nhưng không có báo cáo riêng để mở." data-en="Pick <b>a single day</b> and press <b>Update</b> to open that day's saved report. Pick <b>a date range</b> to see the trend across it. Days <b>with a dot</b> were crawled and have a stored report; faded days can still anchor a range but have no report of their own."></p>
    <div class="pk-bar">
      <div class="dpwrap">
        <button class="dpbtn" id="dpBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>&#128197;</span><span id="dpLabel">Ngày 24/08/2026</span><span class="car">&#9660;</span>
        </button>
        <div class="dppane" id="dpPane" role="dialog">
          <div class="dp-presets" id="dpPresets"></div>
          <div class="dp-right">
            <div class="dp-nav">
              <button type="button" id="dpPrev" aria-label="prev">&#8249;</button>
              <div class="mtitle"><span id="dpM1"></span><span id="dpM2"></span></div>
              <button type="button" id="dpNext" aria-label="next">&#8250;</button>
            </div>
            <div class="dp-months"><div class="dp-m" id="dpG1"></div><div class="dp-m" id="dpG2"></div></div>
            <div class="dp-foot">
              <div class="dp-selinfo"><div class="d1" id="dpSelD"></div><div class="d2" id="dpSelInfo"></div></div>
              <div class="dp-actions">
                <button type="button" id="dpCancel" class="t" data-vi="Hủy" data-en="Cancel"></button>
                <button type="button" id="dpApply" class="go t" data-vi="Cập nhật" data-en="Update"></button>

  <div class="foot t" data-vi="<b>Cách đọc:</b> mỗi điểm là một lần quét đầy đủ; các ngày không quét (01–02/08, 06/08, 08–09/08, 15–16/08, 22–23/08) <b>không</b> được nội suy mà chỉ nối thẳng giữa hai lần quét gần nhau, nên đoạn dốc dài không có nghĩa là thay đổi diễn ra đột ngột. <b>Ba mốc đáng chú ý:</b> (1) <b>đường Crawlability đã hoàn tất chữ V</b>: 96 &#8594; <b>67</b> ngày 20/08 khi sitemap sập còn 16 URL, rồi bật lại <b>94</b> ngày 24/08 và <b>95</b> hôm nay — hố sâu bốn ngày ấy giờ nhìn rõ là một sự cố hạ tầng đã được đóng lại, không phải xu hướng; (2) <b>On-page đã thoát khỏi đường thẳng 76</b> kéo dài từ 31/07 đến 18/08 và đứng ổn định ở <b>91</b> sang ngày thứ năm — đây là bằng chứng bản sửa alt/link-về-trang-chủ hôm 19/08 nằm trong <b>template</b> chứ không phải cấu hình tạm; (3) <b>đường Performance vừa bẻ xuống</b> 95 &#8594; <b>91</b>, mức giảm một ngày lớn nhất kể từ 20/08. Nhìn cả chuỗi, TTFB toàn site đã dao động trong dải <b>630–870 ms</b> suốt một tháng, nên <b>819 ms hôm nay vẫn nằm trong dải lịch sử</b> — nhưng nó là <b>lần đầu tiên nhóm trang gốc chậm hơn nhóm bài viết</b> kể từ 31/07, và đó mới là điểm bất thường cần theo dõi thêm 1–2 ngày. Đường Content và Structured Data phẳng tuyệt đối, đúng như kỳ vọng khi không có deploy nội dung nào ngoài một bài mới." data-en="<b>How to read this:</b> each point is one full crawl; days without a crawl (1–2, 6, 8–9, 15–16, 22–23 Aug) are <b>not</b> interpolated, the line simply joins the two nearest crawls, so a long slope does not mean the change happened abruptly. <b>Three things worth noting:</b> (1) <b>the Crawlability line has completed its V</b>: 96 &#8594; <b>67</b> on 20 Aug when the sitemap collapsed to 16 URLs, then back to <b>94</b> on 24 Aug and <b>95</b> today — that four-day trough now clearly reads as a closed infrastructure incident rather than a trend; (2) <b>On-page has escaped the flat line at 76</b> that ran from 31 Jul to 18 Aug and has sat steady at <b>91</b> for a fifth day, which is evidence the 19 Aug alt-text and link-home fix lives in the <b>template</b> rather than in temporary config; (3) <b>the Performance line has just turned down</b> 95 &#8594; <b>91</b>, the largest single-day fall since 20 Aug. Across the whole series site-wide TTFB has moved within a <b>630–870 ms</b> band for a month, so <b>819 ms today still sits inside the historical range</b> — but it is the <b>first time the core group has been slower than the article group</b> since 31 Jul, and that is the genuine anomaly worth another day or two of watching. The Content and Structured Data lines are perfectly flat, exactly as expected on a day with no content deploy beyond one new article."></div>

  <!-- Insights -->
  <h2 class="sec t" data-vi="Hướng đi &amp; Insight ưu tiên" data-en="Direction &amp; Priority insights"></h2>

  <div class="ins win">
    <div class="prio t" data-vi="✓ THẮNG · P2 mở suốt 18 ngày đã được sửa · trang dự án hết mồ côi" data-en="✓ WIN · a P2 open for 18 days has been fixed · the project pages are no longer orphaned"></div>
    <h4 class="t" data-vi="/projects nay render thẻ &lt;a&gt; tới cả 6 trang con — số trang dự án không có internal link giảm 5 → 1" data-en="/projects now renders &lt;a&gt; tags to all six children — project pages with no internal link fell from 5 to 1"></h4>
    <p class="t" data-vi="Lỗi được theo dõi liên tục từ 07/08 <b>đã được deploy</b>. Trước hôm nay, trang <code>/projects</code> hiển thị 6 thẻ dự án nhưng <b>không thẻ nào là link thật</b> — rendered DOM đếm được <b>0 thẻ <code>&lt;a href=&quot;/projects/*&quot;&gt;</code></b>, nên 5 trong 6 trang dự án hoàn toàn không có đường vào từ nội bộ. Lần quét hôm nay: rendered DOM của <code>/projects</code> có <b>12 thẻ &lt;a&gt;</b> trỏ tới trang dự án (ảnh và tiêu đề mỗi card đều là link), và HTML thô cũng khai báo đủ <b>6 slug</b>, tức link có <b>ngay trong HTML server-render</b> chứ không phải chỉ xuất hiện sau khi JavaScript chạy — điều bắt buộc để crawler đi theo được. Dựng lại toàn bộ đồ thị liên kết từ 85 trang cho thấy: <b>số trang có link tới <code>/projects/*</code> tăng 11 &#8594; 19</b>, và 4 trang dự án trước đây 0 inbound nay mỗi trang có <b>6 inbound link</b>. Số trang dự án mồ côi: <b>5 &#8594; 1</b>." data-en="A fault tracked continuously since 07 Aug <b>has been deployed</b>. Until today the <code>/projects</code> page showed six project cards but <b>none of them was a real link</b> — the rendered DOM counted <b>0 <code>&lt;a href=&quot;/projects/*&quot;&gt;</code> tags</b>, so five of the six project pages had no internal route in at all. On today&#39;s crawl the rendered DOM of <code>/projects</code> carries <b>12 &lt;a&gt; tags</b> pointing at project pages (both the image and the heading of each card are links), and the raw HTML declares all <b>six slugs</b> as well, meaning the links are present <b>in the server-rendered HTML</b> rather than appearing only once JavaScript runs — which is what a crawler needs. Rebuilding the full link graph across all 85 pages shows <b>pages linking to <code>/projects/*</code> rose 11 &#8594; 19</b>, and four project pages that previously had zero inbound links now have <b>six each</b>. Orphaned project pages: <b>5 &#8594; 1</b>."></p>
    <p class="fix t" data-vi="<b>Việc cần làm tiếp:</b> chỉ còn một trang chưa được nhận link — xem mục P1 ngay bên dưới, vì nguyên nhân không phải thiếu link mà là <b>sai slug</b>. Ngoài ra nên gửi lại <code>sitemap.xml</code> trong Google Search Console một lần nữa để Google bò lại 5 trang dự án vừa có đường vào nội bộ; các trang này trước đây chỉ được khai báo trong sitemap chứ không có tín hiệu liên kết, nên thường bị xếp hạng ưu tiên crawl rất thấp." data-en="<b>What to do next:</b> only one page is still missing its link — see the P1 note directly below, because the cause there is not a missing link but a <b>slug mismatch</b>. Beyond that, resubmit <code>sitemap.xml</code> in Google Search Console once more so Google recrawls the five project pages that have just gained an internal route; until now they were declared in the sitemap with no link signal at all, which typically leaves them very low in the crawl queue."></p>
  </div>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 · MỚI PHÁT HIỆN HÔM NAY · một dự án đang tồn tại ở hai URL khác nhau" data-en="P1 · NEW TODAY · one project exists at two different URLs"></div>
    <h4 class="t" data-vi="/projects/85-commodore-drive và /projects/85-commodore-drive-surfers-paradise đều trả 200 và tự canonical về chính mình" data-en="/projects/85-commodore-drive and /projects/85-commodore-drive-surfers-paradise both return 200 and each canonicals to itself"></h4>
    <p class="t" data-vi="Bản sửa link ở trên đã lộ ra một lỗi vốn bị che khuất. Toàn bộ 19 trang có link tới dự án đều trỏ tới <code>/projects/<b>85-commodore-drive</b></code>, nhưng URL nằm trong sitemap lại là <code>/projects/<b>85-commodore-drive-surfers-paradise</b></code>. Kiểm trực tiếp cả hai: <b>cả hai đều trả HTTP 200</b>, cùng hiển thị <code>&lt;h1&gt;85 Commodore Drive&lt;/h1&gt;</code>, nhưng <b>title khác nhau</b> (&quot;85 Commodore Drive | DX Living Project&quot; so với &quot;85 Commodore Drive Surfers Paradise | DX LIVING Project&quot;), <b>dung lượng khác nhau</b> (52,6 KB so với 59,4 KB) và — nghiêm trọng nhất — <b>mỗi trang tự đặt canonical về chính nó</b>. Hệ quả kép: bản trong sitemap là trang <b>duy nhất còn mồ côi</b> (0 inbound link), còn bản được link khắp site thì <b>không hề có trong sitemap</b>. Với Google đây là hai trang trùng nội dung cạnh tranh nhau, và tín hiệu liên kết đang bị chia đôi thay vì dồn về một URL." data-en="The link fix above has exposed a fault that was previously hidden. All 19 pages that link to a project point at <code>/projects/<b>85-commodore-drive</b></code>, but the URL declared in the sitemap is <code>/projects/<b>85-commodore-drive-surfers-paradise</b></code>. Fetching both directly: <b>both return HTTP 200</b> and both render <code>&lt;h1&gt;85 Commodore Drive&lt;/h1&gt;</code>, but they carry <b>different titles</b> (&quot;85 Commodore Drive | DX Living Project&quot; versus &quot;85 Commodore Drive Surfers Paradise | DX LIVING Project&quot;), <b>different payload sizes</b> (52.6 KB versus 59.4 KB) and — most seriously — <b>each one canonicals to itself</b>. The effect cuts both ways: the sitemap version is now the <b>only remaining orphan</b> (0 inbound links), while the version linked across the site <b>does not appear in the sitemap at all</b>. To Google these are two competing duplicates, and the link signal is being split across them instead of consolidated on one URL."></p>
    <p class="fix t" data-vi="<b>Cách sửa (chọn một URL rồi làm dứt điểm):</b> (1) chọn <code>/projects/85-commodore-drive-surfers-paradise</code> làm URL chính vì nó dài hơn, có từ khoá địa danh và đang nằm trong sitemap; (2) đặt <b>301</b> từ <code>/projects/85-commodore-drive</code> sang URL chính — <b>không</b> dùng canonical thay cho 301, vì canonical không hợp nhất tín hiệu liên kết mạnh bằng; (3) sửa component card trong <code>/projects</code> để sinh href từ <b>đúng trường slug dùng cho sitemap</b>, tránh lặp lại lỗi này với dự án mới; (4) sau khi deploy, chạy lại đồ thị liên kết và xác nhận trang <code>-surfers-paradise</code> đã có 6 inbound link và số trang mồ côi về <b>0</b>. Ưu tiên P1 vì nó vừa gây trùng lặp nội dung vừa vô hiệu hoá phần lớn giá trị của bản sửa link vừa deploy." data-en="<b>How to fix it (pick one URL and finish the job):</b> (1) choose <code>/projects/85-commodore-drive-surfers-paradise</code> as the canonical URL — it is longer, carries the location keyword and is already in the sitemap; (2) put a <b>301</b> from <code>/projects/85-commodore-drive</code> onto it — do <b>not</b> substitute a canonical tag for the 301, as a canonical consolidates link signal far less reliably; (3) fix the card component on <code>/projects</code> so the href is built from <b>the same slug field the sitemap uses</b>, which prevents this recurring on the next project; (4) after deploying, rerun the link graph and confirm the <code>-surfers-paradise</code> page has six inbound links and that orphan pages read <b>0</b>. Rated P1 because it creates duplicate content and simultaneously cancels most of the value of the link fix that has just shipped."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · Mới · TTFB nhóm trang gốc trượt đồng loạt theo template" data-en="P2 · New · core-page TTFB slipped as a template group"></div>
    <h4 class="t" data-vi="Bốn trang cùng layout cùng lúc vượt 1 giây, trang chủ lên 1,38s — dấu hiệu cache chứ không phải trang nặng lên" data-en="Four pages on one layout crossed 1 second together and the homepage rose to 1.38s — a cache signature, not heavier pages"></h4>
    <p class="t" data-vi="TTFB toàn site tăng <b>700 &#8594; 819 ms</b>, và gần như toàn bộ mức tăng nằm ở <b>nhóm trang gốc: 660 &#8594; 832 ms</b>. Cụ thể: <code>/</code> <b>1,04 &#8594; 1,38s</b>, <code>/articles</code> <b>1,00 &#8594; 1,10s</b>, và bốn trang dùng chung một layout cùng lúc vượt vạch — <code>/studio</code> <b>1,05s</b>, <code>/model</code> <b>1,04s</b>, <code>/interiors</code> <b>1,01s</b>, <code>/prestige</code> <b>1,00s</b>. Hai điểm khiến chẩn đoán nghiêng về hạ tầng chứ không phải nội dung: (a) <b>dung lượng HTML của cả bốn trang gần như không đổi</b> so hôm qua (chênh dưới 1 KB), nên chúng không hề nặng thêm; (b) <b>nhóm bài viết và nhóm dự án không hề có trang nào vượt 1 giây</b> — 62/62 và 6/6 đều dưới ngưỡng — nên đây không phải là toàn bộ server chậm đi đồng đều. Mỗi trang vượt 1s đã được đo lại <b>ba lần</b> ngoài hai lần chuẩn, nên loại được khả năng nhiễu mạng." data-en="Site-wide TTFB rose <b>700 &#8594; 819 ms</b>, and almost all of the increase sits in the <b>core group: 660 &#8594; 832 ms</b>. Specifically <code>/</code> went <b>1.04 &#8594; 1.38s</b>, <code>/articles</code> <b>1.00 &#8594; 1.10s</b>, and four pages sharing one layout crossed the line together — <code>/studio</code> <b>1.05s</b>, <code>/model</code> <b>1.04s</b>, <code>/interiors</code> <b>1.01s</b> and <code>/prestige</code> <b>1.00s</b>. Two observations point the diagnosis at infrastructure rather than content: (a) <b>the HTML size of all four is essentially unchanged</b> from yesterday (under 1 KB difference), so they have not grown heavier; (b) <b>neither the article group nor the project group has a single page over a second</b> — 62 of 62 and 6 of 6 are under it — so this is not the whole server slowing uniformly. Every page over 1s was re-measured <b>three further times</b> on top of the standard two passes, which rules out network jitter."></p>
    <p class="fix t" data-vi="<b>Cách xử lý:</b> (1) <b>chưa mở ticket hạ tầng ngay hôm nay</b> — 819 ms vẫn nằm trong dải dao động lịch sử 630–870 ms của cả tháng, và một ngày chưa đủ để kết luận; (2) <b>quét lại vào ngày mai và quyết định theo quy tắc rõ ràng</b>: nếu nhóm trang gốc về dưới 750 ms thì đóng lại, coi là dao động; nếu vẫn ở 800+ ms hai ngày liên tiếp thì đây là nền mới và cần điều tra; (3) khi điều tra, bắt đầu từ <b>lớp cache/ISR của bốn trang cùng layout</b> (<code>/studio</code>, <code>/model</code>, <code>/interiors</code>, <code>/prestige</code>) — trượt cùng lúc và cùng biên độ gần như luôn là <b>revalidate window hết hạn đồng thời</b> hoặc cold start sau deploy, không phải truy vấn dữ liệu; (4) riêng trang chủ ở 1,38s đáng theo dõi sát nhất vì nó vừa là trang chậm nhất site vừa là trang nhận nhiều traffic nhất." data-en="<b>How to handle it:</b> (1) <b>do not raise an infrastructure ticket today</b> — 819 ms still sits inside the 630–870 ms band the site has occupied all month, and one day is not enough to call it; (2) <b>recrawl tomorrow and decide against a stated rule</b>: if the core group returns below 750 ms, close it as noise; if it stays above 800 ms for two consecutive days, treat it as a new baseline and investigate; (3) when investigating, start at the <b>cache/ISR layer for the four pages sharing a layout</b> (<code>/studio</code>, <code>/model</code>, <code>/interiors</code>, <code>/prestige</code>) — slipping together by a similar margin almost always means <b>revalidation windows expiring in step</b> or a cold start after a deploy, not a data query; (4) the homepage at 1.38s deserves the closest watch, being both the slowest page on the site and the one taking the most traffic."></p>
  </div>

  <div class="ins win">
    <div class="prio t" data-vi="✓ GIỮ VỮNG · sang ngày thứ tám · ba bản sửa lớn của 19/08 vẫn nguyên vẹn" data-en="✓ HOLDING · into an eighth day · the three major 19 Aug fixes remain intact"></div>
    <h4 class="t" data-vi="JSON-LD vẫn 1,0×, vẫn 0/866 ảnh thiếu alt, vẫn 85/85 trang link về trang chủ, vẫn 0 lỗi H1" data-en="JSON-LD still at 1.0×, still 0 of 866 images missing alt, still 85 of 85 pages link home, still 0 H1 faults"></h4>
    <p class="t" data-vi="<b>(1) Nhân bản JSON-LD:</b> toàn site phát <b>257 khối cho đúng 257 payload (hệ số 1,0&#215;)</b> — kiểm bằng cách so <i>nội dung</i> khối chứ không chỉ đếm, qua <code>new Set(blocks).size</code> trên HTML thô của cả 85 trang. Nhắc lại để thấy khoảng cách: hôm 03/08 mỗi trang phát <b>14 khối y hệt nhau</b>. <b>(2) Ảnh thiếu alt:</b> <b>0/866</b> ảnh trong HTML thô thiếu thuộc tính <code>alt</code>, và <b>524 ảnh</b> có <code>loading=&quot;lazy&quot;</code>; rendered DOM trang chủ xác nhận 22 ảnh, 0 thiếu alt, 17 lazy. <b>(3) Link về trang chủ:</b> <b>85/85 trang</b> có thẻ <code>&lt;a&gt;</code> thật trỏ về <code>/</code> — logo trong header vẫn là anchor chứ không phải div bắt sự kiện click. <b>(4) H1:</b> <b>0 trang</b> có số H1 khác 1, và <b>85/85 trang</b> có đủ title, meta description và canonical. Tất cả đều là số đo hôm nay, không phải chép lại từ báo cáo cũ." data-en="<b>(1) JSON-LD duplication:</b> the site emits <b>257 blocks for exactly 257 distinct payloads (1.0&#215;)</b> — verified by comparing block <i>content</i> rather than merely counting, using <code>new Set(blocks).size</code> across the raw HTML of all 85 pages. For scale, on 03 Aug every page emitted <b>14 identical blocks</b>. <b>(2) Missing alt text:</b> <b>0 of 866</b> raw-HTML images lack an <code>alt</code> attribute and <b>524</b> carry <code>loading=&quot;lazy&quot;</code>; the rendered homepage DOM confirms 22 images, 0 missing alt, 17 lazy. <b>(3) Link home:</b> <b>85 of 85 pages</b> carry a real <code>&lt;a&gt;</code> to <code>/</code> — the header logo is still an anchor rather than a click-handling div. <b>(4) H1:</b> <b>0 pages</b> have an H1 count other than 1, and <b>85 of 85</b> carry title, meta description and canonical. All of these are measured today, not carried over from an earlier report."></p>
    <p class="fix t" data-vi="<b>Giữ nguyên:</b> không cần can thiệp. Bài học của tuần này vẫn đúng: sửa trong <b>template</b> thì bền qua nhiều tuần, còn sửa ở <b>cấu hình build</b> — như sự cố sitemap 20/08 — thì có thể âm thầm hỏng lại bất cứ lúc nào. Đó là lý do nên ưu tiên bản sửa 301 ở mục P1 làm trong <b>route/config có test</b> thay vì sửa tay từng link." data-en="<b>Leave as is:</b> no action required. This week&#39;s lesson still holds: fixes made in a <b>template</b> survive for weeks, while fixes made in <b>build configuration</b> — as with the 20 Aug sitemap incident — can quietly break again at any point. That is the argument for implementing the P1 301 in a <b>tested route or config</b> rather than hand-editing individual links."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · Nội dung · một bài mới đúng chuẩn, nhưng toàn site hụt 1.521 từ" data-en="P2 · Content · one new article done properly, but the site lost 1,521 words elsewhere"></div>
    <h4 class="t" data-vi="78 trang cùng mất 20–57 từ mỗi trang trong khi 7 trang dự án lại tăng ~15 từ" data-en="78 pages each lost 20–57 words while 7 project-related pages each gained about 15"></h4>
    <p class="t" data-vi="Bài mới <code>/articles/sustainable-home-energy-comfort</code> là <b>một trong những bài ra mắt sạch nhất của cả chuỗi</b>: <b>2.526 từ</b>, có <code>FAQPage</code> ngay từ đầu, 4 khối JSON-LD, 29 internal link, TTFB 0,88s, rendered DOM 2.443 từ và 0 ảnh thiếu alt. Không có việc gì phải làm với bài này. Nhưng khi so từng trang với 24/08 thì thấy một chuyển động khác: <b>78 trang cùng giảm 20–57 từ</b> (giảm mạnh nhất là <code>/articles/3d-rendering-perth</code> −57 và <code>/studio</code> −42), trong khi <b>7 trang liên quan tới dự án lại tăng 11–23 từ</b>. Tổng lại: toàn site <b>151.846 &#8594; 152.851 từ (+1.005)</b>, nhưng nếu trừ bài mới ra thì các trang cũ <b>hụt 1.521 từ</b>. Hai chiều ngược nhau này khớp với chính bản deploy hôm nay: <b>phần tăng ở trang dự án chính là text của link/card vừa được thêm</b>, còn phần giảm đều tay ở mọi trang là <b>một khối chung nhỏ trong layout bị cắt bớt</b>. Cần nói rõ: đây <b>không phải lỗi đo</b> — phương pháp đếm từ hôm nay giống hệt 24/08, và đã kiểm chứng rằng site không có nội dung <code>&lt;noscript&gt;</code> nên hai cách đếm cho kết quả trùng khít." data-en="The new article <code>/articles/sustainable-home-energy-comfort</code> is <b>one of the cleanest launches of the series</b>: <b>2,526 words</b>, <code>FAQPage</code> present from the start, 4 JSON-LD blocks, 29 internal links, 0.88s TTFB, 2,443 rendered words and 0 images missing alt. Nothing to do on that one. But comparing page by page against 24 Aug shows a second movement: <b>78 pages each lost 20–57 words</b> (the largest being <code>/articles/3d-rendering-perth</code> at −57 and <code>/studio</code> at −42), while <b>7 project-related pages each gained 11–23</b>. In total the site went <b>151,846 &#8594; 152,851 words (+1,005)</b>, but setting the new article aside the existing pages are <b>down 1,521 words</b>. Those two opposing movements line up with today&#39;s deploy: <b>the gain on project pages is the anchor and card text just added</b>, while the even loss across every page is <b>a small shared block trimmed out of the layout</b>. To be clear, this is <b>not a measurement artefact</b> — the word-count method is identical to 24 Aug, and it was verified that the site carries no <code>&lt;noscript&gt;</code> content, so the strict and loose counts agree exactly."></p>
    <p class="fix t" data-vi="<b>Việc cần làm:</b> (1) hỏi đội dev xem <b>khối chung nào trong layout vừa bị gọn lại</b> ở lần deploy hôm nay và xác nhận đó là chủ ý — mức 20–57 từ/trang là quá nhỏ để ảnh hưởng SEO, nên nếu là chủ ý thì <b>không cần khôi phục</b>; (2) chỉ cần cảnh giác nếu con số này lặp lại nhiều ngày, vì chuỗi báo cáo đã ghi nhận khối footer bị thêm/gỡ <b>bốn lần</b> trong tháng 8 (12, 13, 14 và 17/08) và mỗi lần đều làm nhiễu đường Content; (3) chốt luôn một quyết định thành văn về khối footer đó để chấm dứt dao động — <b>đây vẫn là việc còn nợ từ 17/08</b>." data-en="<b>What to do:</b> (1) ask the dev team <b>which shared layout block was trimmed</b> in today&#39;s deploy and confirm it was deliberate — 20–57 words per page is far too small to affect SEO, so if it was intentional there is <b>nothing to restore</b>; (2) only treat it as a concern if the same movement repeats over several days, since this series has already recorded the footer block being added and removed <b>four times</b> in August (12, 13, 14 and 17 Aug), each time adding noise to the Content line; (3) settle a written decision on that footer block to end the oscillation — <b>this remains outstanding from 17 Aug</b>."></p>

    <p class="t" data-vi="Ba mục này <b>đứng yên tuyệt đối</b> — cùng con số, cùng danh sách trang như hôm qua. Heading nhảy bậc ở <b>15 trang</b>: <b>1&#8594;3 ở 9 trang</b> (6 trang dự án cộng <code>/projects</code>, <code>/faq</code>, <code>/start-interactive</code>), <b>2&#8594;4 ở 5 trang</b> (<code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code> và bài <code>bim-3d-4d-5d-explained</code>) và <b>1&#8594;4 ở 1 trang</b> (<code>/modules</code>). <code>FAQPage</code>: <b>13 bài</b> vẫn thiếu, và <b>vẫn đúng 13 bài đó</b> — chúng là các bài hiển thị <b>3</b> thay vì 4 ở cột JSON-LD trong bảng chi tiết. Trang mỏng: <b>11 trang dưới 300 từ</b>, gồm <b>6 trang dự án</b> (238–260 từ), <code>/projects</code> (270), <code>/modules</code> (244), <code>/contact</code> (248), <code>/start-interactive</code> (58) và <code>/login</code> (27)." data-en="These three are <b>completely static</b> — same counts, same page lists as yesterday. Heading skips affect <b>15 pages</b>: <b>1&#8594;3 on 9</b> (the six project pages plus <code>/projects</code>, <code>/faq</code> and <code>/start-interactive</code>), <b>2&#8594;4 on 5</b> (<code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code> and the article <code>bim-3d-4d-5d-explained</code>) and <b>1&#8594;4 on 1</b> (<code>/modules</code>). <code>FAQPage</code>: <b>13 articles</b> still lack one, and it is <b>the same 13</b> — they are precisely the rows showing <b>3</b> rather than 4 in the JSON-LD column of the detail table. Thin pages: <b>11 under 300 words</b>, being the <b>6 project pages</b> (238–260 words), <code>/projects</code> (270), <code>/modules</code> (244), <code>/contact</code> (248), <code>/start-interactive</code> (58) and <code>/login</code> (27)."></p>
    <p class="fix t" data-vi="<b>Cách sửa (không đổi):</b> (1) <b>Heading</b> — phần lớn nằm ở <b>một template trang dự án dùng chung</b> (1&#8594;3) và <b>bốn trang gốc cùng layout</b> (2&#8594;4), nên sửa hai template là dọn được 13/15 trang; đây là việc CSS-only, hạ H3 xuống H2 chứ không đổi giao diện; (2) <b>FAQPage</b> — 13 bài, mỗi bài cần 3–5 cặp hỏi đáp lấy từ chính nội dung bài rồi bọc trong schema; đây là <b>hạng mục có đòn bẩy AEO cao nhất còn lại</b> vì FAQPage là thứ trợ lý AI trích dẫn trực tiếp; (3) <b>Trang mỏng</b> — 6 trang dự án ở 238–260 từ là điểm yếu rõ nhất: mỗi trang nên có 250–400 từ mô tả phạm vi công việc, vật liệu và vai trò của DX Living, vừa giải quyết trang mỏng vừa tạo chỗ đặt internal link tự nhiên. <code>/login</code> và <code>/start-interactive</code> <b>không cần sửa</b> — chúng không nên index." data-en="<b>How to fix (unchanged):</b> (1) <b>Headings</b> — most sit in <b>one shared project template</b> (1&#8594;3) and <b>four core pages on one layout</b> (2&#8594;4), so fixing two templates clears 13 of the 15; this is CSS-only work, demoting an H3 to an H2 without changing the visual design; (2) <b>FAQPage</b> — 13 articles, each needing 3–5 question-and-answer pairs drawn from the article&#39;s own content and wrapped in schema; this is <b>the highest-leverage AEO item remaining</b>, because FAQPage is exactly what AI assistants quote directly; (3) <b>Thin pages</b> — the six project pages at 238–260 words are the clearest weakness: each should carry 250–400 words on scope, materials and DX Living&#39;s role, which fixes the thinness and creates natural places to put internal links. <code>/login</code> and <code>/start-interactive</code> need <b>no work</b> — they should not be indexed."></p>

    <p class="t" data-vi="<b>Health 93 &#8594; 92.</b> Đọc đúng ngày hôm nay là: <b>site tốt lên về cấu trúc, chậm đi về tốc độ</b>, và phần chậm đi chưa đủ bằng chứng để gọi là xu hướng. Một lỗi P2 mở suốt 18 ngày <b>đã được sửa</b> (trang <code>/projects</code> nay link tới cả 6 trang con, trang mồ côi 5 &#8594; 1), sitemap sau sự cố 20/08 <b>vẫn chạy đúng sang ngày thứ hai</b> (85 &#8594; 86 URL, <code>lastmod</code> thật), và một bài mới ra <b>đúng chuẩn ngay từ đầu</b>. Đổi lại, TTFB nhóm trang gốc trượt <b>660 &#8594; 832 ms</b> và bản sửa link vừa deploy làm lộ ra một lỗi trùng URL. <b>Thứ tự việc cần làm:</b> <b>(1) P1 — 301 cho <code>/projects/85-commodore-drive</code></b> về bản <code>-surfers-paradise</code> và sửa component card để sinh href từ đúng trường slug của sitemap; đây là việc dưới một giờ nhưng đang chia đôi tín hiệu liên kết của một dự án và tạo nội dung trùng. <b>(2) P2 — quét lại TTFB ngày mai và quyết định theo quy tắc đã đặt:</b> nhóm trang gốc dưới 750 ms thì đóng lại; từ 800 ms trở lên hai ngày liên tiếp thì mở ticket và bắt đầu từ lớp cache của bốn trang cùng layout. <b>(3) P2 — gửi lại sitemap trong Search Console</b> để Google bò lại 5 trang dự án vừa có internal link lần đầu. <b>(4) P2 — xác nhận với dev</b> khối layout nhỏ bị cắt hôm nay là chủ ý, và chốt thành văn quyết định về khối footer đang dao động từ 12/08. <b>(5) P3 — FAQPage cho 13 bài</b>, việc có đòn bẩy AEO cao nhất còn lại, và <b>250–400 từ cho mỗi trang dự án</b>, vốn vừa mới có đường vào từ nội bộ nên giờ mới thật sự đáng đầu tư nội dung." data-en="<b>Health 93 &#8594; 92.</b> The honest reading of today is that the <b>site got structurally better and slower</b>, and the slower half does not yet have enough evidence behind it to be called a trend. A P2 open for 18 days <b>has been fixed</b> (<code>/projects</code> now links to all six children, orphans 5 &#8594; 1), the sitemap repaired after the 20 Aug incident <b>is still generating correctly on its second day</b> (85 &#8594; 86 URLs with real <code>lastmod</code> values), and a new article <b>shipped correct on day one</b>. Against that, core-page TTFB slid <b>660 &#8594; 832 ms</b> and the newly deployed link fix exposed a duplicate-URL fault. <b>In order:</b> <b>(1) P1 — 301 <code>/projects/85-commodore-drive</code></b> onto the <code>-surfers-paradise</code> version and fix the card component so hrefs are built from the same slug field the sitemap uses; under an hour of work, but it is currently splitting one project&#39;s link signal and creating duplicate content. <b>(2) P2 — recrawl TTFB tomorrow and decide against the stated rule:</b> core group below 750 ms, close it; 800 ms or above for two consecutive days, raise a ticket and start at the cache layer for the four pages sharing a layout. <b>(3) P2 — resubmit the sitemap in Search Console</b> so Google recrawls the five project pages that have just gained an internal link for the first time. <b>(4) P2 — confirm with the dev team</b> that the small layout block trimmed today was deliberate, and put the wavering footer decision from 12 Aug in writing. <b>(5) P3 — FAQPage on 13 articles</b>, the highest-leverage AEO item left, and <b>250–400 words on each project page</b>, which have only just gained an internal route and are therefore only now genuinely worth the content investment."></p>

/* generic multi-series line chart -> inline SVG string */
function trChart(rows, series, opts){
  opts = opts || {};
  const W=520, H=opts.h||210, L=42, R=12, TP=14, BT=30;
  const iw=W-L-R, ih=H-TP-BT;
  let vals=[]; series.forEach(s=>rows.forEach(r=>{const v=r[s.i]; if(v!==null&&v!==0||s.zero)vals.push(v);}));
  let lo = opts.min!==undefined?opts.min:Math.min.apply(null,vals);
  let hi = opts.max!==undefined?opts.max:Math.max.apply(null,vals);
  if(hi===lo){hi=lo+1;}
  const pad=(hi-lo)*0.12; lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=>L+(rows.length<2?iw/2:i*iw/(rows.length-1));
  const Y=v=>TP+ih-(v-lo)/(hi-lo)*ih;
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let g='';
  /* gridlines + y labels */
  const TICKS=4;
  for(let t=0;t<=TICKS;t++){
    const v=lo+(hi-lo)*t/TICKS, y=Y(v);
    g+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" ${t?'stroke-dasharray="3 4"':''}/>`;
    g+=`<text x="${L-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">${Math.round(v).toLocaleString(loc)}</text>`;
  }
  /* x labels: first, last and every other */
  rows.forEach((r,i)=>{
    if(i!==0 && i!==rows.length-1 && i%2) return;
    g+=`<text x="${X(i).toFixed(1)}" y="${H-11}" text-anchor="middle" font-size="9" fill="var(--muted)">${trFmt(r[0])}</text>`;
  });
  /* series */
  series.forEach(s=>{
    const pts=[];
    rows.forEach((r,i)=>{const v=r[s.i]; if(v===null||(v===0&&!s.zero))return; pts.push([X(i),Y(v),v,r[0]]);});
    if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area){
      g+=`<path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${TP+ih} L ${pts[0][0].toFixed(1)} ${TP+ih} Z" fill="${s.c}" opacity=".10"/>`;
    }
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{
      g+=`<circle class="tr-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.w>2?3:2.4}" fill="var(--card)" stroke="${s.c}" stroke-width="1.8"><title>${s.n} · ${trFmt(p[3])}: ${p[2].toLocaleString(loc)}${opts.unit||''}</title></circle>`;
    });
    /* value label on the last point */
    if(s.last!==false){
      const lp=pts[pts.length-1];
      g+=`<text x="${(lp[0]+6).toFixed(1)}" y="${(lp[1]-6).toFixed(1)}" font-size="10.5" font-weight="700" fill="${s.c}">${lp[2].toLocaleString(loc)}</text>`;
    }
  });
  const lg=series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('');
  return `<svg class="tr-svg" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tr-lg">${lg}</div>`;
}

function renderRt(){
  const loaded = [...PAGES].sort((a,b)=>b.rt-a.rt);
  const max = 1450;
  const col = ms => ms<1000?'var(--green)':ms<3000?'var(--accent)':ms<6000?'var(--amber)':'var(--red)';
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let h='';
  loaded.forEach(p=>{
    const w=Math.max(2,(p.rt/max*100)).toFixed(1);
    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

const tbody=document.querySelector('#pt tbody');
let sortK='rt', sortDir=1, filt='all';
function render(){
  renderRt();
  renderTrend();
  pkToggleLabel();
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let rows=[...PAGES];
  if(filt!=='all')rows=rows.filter(p=>p.grp===filt);
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}
    return sortDir*(x-y);
  });
  tbody.innerHTML=rows.map(p=>{
    const st='<span class="badge b200">200</span>';
    const sc=p.schema>0?`<span class="yes">${p.schema}</span>`:'<span class="no">0</span>';
    const sm=p.sm?'<span class="yes">✓</span>':'<span class="no">✗</span>';
    const rtc=p.rt<1000?'var(--green)':p.rt<3000?'var(--accent-dk)':p.rt<6000?'var(--amber)':'var(--red)';
    return `<tr>
      <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.url}">${p.url}</td>
      <td class="num">${st}</td>
      <td class="num" style="color:${rtc};font-weight:700">${p.rt.toLocaleString(loc)}</td>

  }).join('');
}

function pkISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pkD(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function pkFmt(iso){ const [y,m,d]=iso.split('-'); return LANG==='vi'?`${d}/${m}/${y}`:`${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`; }
function pkAdd(iso,n){ const d=pkD(iso); d.setDate(d.getDate()+n); return pkISO(d); }
function pkIn(iso,a,b){ return iso>=a && iso<=b; }
function pkCount(a,b){ return PK_SNAPS.filter(s=>pkIn(s.date,a,b)).length; }

  box.querySelectorAll('.dp-preset').forEach(b=>b.addEventListener('click',()=>{
    const p=pkPresets().find(x=>x.k===b.dataset.k);
    PK_PRESET=p.k; PK_DRAFT={s:p.s,e:p.e}; PK_PENDING=false;
    PK_VIEW=pkD(p.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1);
    pkRenderCal(); pkRenderPresets();
  }));
}

function pkMonth(base,off){
  const d=new Date(base.getFullYear(), base.getMonth()+off, 1);
  const y=d.getFullYear(), m=d.getMonth();
  const start=new Date(y,m,1).getDay(); // 0=Sun
  const days=new Date(y,m+1,0).getDate();
  let cells=pkL().dow.map(x=>`<div class="dp-dow">${x}</div>`).join('');
  for(let i=0;i<start;i++) cells+='<button class="dp-d blank" disabled></button>';
  for(let dd=1;dd<=days;dd++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const has=!!PK_MAP[iso];
    const sel=iso===PK_DRAFT.s||iso===PK_DRAFT.e;
    const inr=pkIn(iso,PK_DRAFT.s,PK_DRAFT.e)&&!sel;
    const edge=iso===PK_DRAFT.s&&PK_DRAFT.s!==PK_DRAFT.e?' edge-l':(iso===PK_DRAFT.e&&PK_DRAFT.s!==PK_DRAFT.e?' edge-r':'');
    cells+=`<button type="button" class="dp-d${has?' has':''}${inr?' inrange':''}${sel?' sel'+edge:''}" data-iso="${iso}">${dd}${has?'<span class="dot"></span>':''}</button>`;
  }
  return {title:`${pkL().months[m]} ${y}`, html:`<div class="dp-grid">${cells}</div>`};
}

function pkRenderCal(){
  if(!PK_VIEW){ PK_VIEW=pkD(PK_SEL.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1); }
  const a=pkMonth(PK_VIEW,0), b=pkMonth(PK_VIEW,1);
  document.getElementById('dpM1').textContent=a.title;
  document.getElementById('dpM2').textContent=b.title;
  document.getElementById('dpG1').innerHTML=a.html;
  document.getElementById('dpG2').innerHTML=b.html;
  document.querySelectorAll('#dpG1 .dp-d,#dpG2 .dp-d').forEach(el=>{
    if(el.classList.contains('blank')) return;
    el.addEventListener('click',()=>{
      const iso=el.dataset.iso;
      if(!PK_PENDING){ PK_DRAFT={s:iso,e:iso}; PK_PENDING=true; }
      else { PK_DRAFT = iso<PK_DRAFT.s ? {s:iso,e:PK_DRAFT.s} : {s:PK_DRAFT.s,e:iso}; PK_PENDING=false; }
      PK_PRESET=null; pkRenderCal(); pkRenderPresets();
    });
  });
  const single=PK_DRAFT.s===PK_DRAFT.e;
  document.getElementById('dpSelD').textContent = single?pkFmt(PK_DRAFT.s):`${pkFmt(PK_DRAFT.s)} → ${pkFmt(PK_DRAFT.e)}`;
  const n=pkCount(PK_DRAFT.s,PK_DRAFT.e);
  document.getElementById('dpSelInfo').textContent = n===0 ? pkL().noRep : pkL().saved(n);
}

function pkRenderQuick(){
  const box=document.getElementById('dpQuick'); if(!box) return;
  const chips=PK_SNAPS.slice().reverse().map(s=>{
    const cur=s.date===PK_SEL.s&&PK_SEL.s===PK_SEL.e;
    const lb=LANG==='vi'?(s.label_vi||''):(s.label_en||'');
    return `<button type="button" class="qchip${cur?' cur':''}" data-iso="${s.date}">
      <span class="qd">${pkFmt(s.date)}</span><span class="ql">${lb}</span></button>`;
  }).join('');
  box.innerHTML=`<span class="pk-quick-lbl">${pkL().quick}</span>`+chips;
  box.querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('cur')) return;
    pkGo(b.dataset.iso,b.dataset.iso);
  }));
}

function pkRenderNow(){
  const el=document.getElementById('dpNow'); if(!el) return;
  const single=PK_SEL.s===PK_SEL.e;
  el.textContent = !single ? pkL().trend(pkFmt(PK_SEL.s),pkFmt(PK_SEL.e))
    : (PK_SEL.s===PK_TODAY ? pkL().now(pkFmt(PK_SEL.s)) : pkL().viewing(pkFmt(PK_SEL.s)));
  document.getElementById('dpLabel').textContent = single
    ? `${pkL().day} ${pkFmt(PK_SEL.s)}` : `${pkL().range} ${pkFmt(PK_SEL.s)} → ${pkFmt(PK_SEL.e)}`;
}

function pkGo(s,e){
  if(s===e){
    const snap=PK_MAP[s];
    if(snap && s!==PK_TODAY){ location.href=PK_BASE+snap.report; return; }
    PK_SEL={s,e}; PK_DRAFT={s,e}; PK_PRESET=null;
    document.getElementById('dpTrend').classList.remove('on');
    pkRenderNow(); pkRenderQuick(); pkRenderCal();
    return;
  }
  PK_SEL={s,e}; pkRenderNow(); pkRenderQuick(); pkTrend(s,e);
}

function pkTrend(s,e){
  const box=document.getElementById('dpTrend');
  const days=PK_SNAPS.filter(x=>pkIn(x.date,s,e));
  if(!days.length){ box.classList.remove('on'); box.innerHTML=''; return; }
  Promise.all(days.map(d=>fetch(PK_BASE+d.data,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)))
   .then(js=>{
     const rows=js.map((j,i)=>({date:days[i].date, rep:days[i].report, hs:j&&j.health_score, pg:j&&j.pages_measured}))
                  .filter(r=>r.hs!=null);
     box.innerHTML=`<h4>${pkL().trendTitle(pkFmt(s),pkFmt(e))}</h4>`+rows.map(r=>`
       <div class="trd"><span class="tdate">${pkFmt(r.date)}</span>
         <span class="ttrack"><span class="tfill" style="width:${r.hs}%"></span></span>
         <span class="tval">${r.hs}</span>
         <span class="tlink" data-h="${r.rep}">${pkL().open} &#8594;</span></div>`).join('');
     box.classList.add('on');
     box.querySelectorAll('.tlink').forEach(a=>a.addEventListener('click',()=>{
       const h=a.dataset.h; if(h && h!=='index.html') location.href=PK_BASE+h;
     }));
   });
}

function pkRender(){ pkRenderPresets(); pkRenderCal(); pkRenderQuick(); pkRenderNow(); pkToggleLabel(); }

(function pkInit(){
  const btn=document.getElementById('dpBtn'), pane=document.getElementById('dpPane');
  if(!btn) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=pane.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
    if(open){ PK_DRAFT={...PK_SEL}; PK_PENDING=false; pkRenderCal(); pkRenderPresets(); }
  });
  document.addEventListener('click',e=>{
    if(!pane.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') pane.classList.remove('open'); });
  document.getElementById('dpPrev').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()-1); pkRenderCal(); });
  document.getElementById('dpNext').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()+1); pkRenderCal(); });
  document.getElementById('dpCancel').addEventListener('click',()=>{
    PK_DRAFT={...PK_SEL}; PK_PENDING=false; PK_PRESET=null;
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false'); pkRenderCal();
  });
  document.getElementById('dpApply').addEventListener('click',()=>{
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    pkGo(PK_DRAFT.s,PK_DRAFT.e);
  });
  fetch(PK_BASE+'data/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    PK_SNAPS=(j.snapshots||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s);
    pkRender();
  }).catch(()=>{
    PK_SNAPS=[{date:PK_TODAY,report:'index.html',data:'data/'+PK_TODAY+'.json',label_vi:'Bản hiện tại',label_en:'Current report'}];
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s); pkRender();
  });
})();

setLang('en');
</script>
