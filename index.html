<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  .langfix{position:fixed;top:14px;right:14px;z-index:120;display:inline-flex;
    border:1px solid var(--accent);border-radius:20px;overflow:hidden;background:var(--card);
    box-shadow:0 2px 12px rgba(70,55,30,.2)}
  .langfix button{background:transparent;color:var(--muted);border:none;padding:6px 15px;
    font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px;font-family:inherit;line-height:1.5}
  .langfix button.active{background:var(--accent);color:#2c2620}
  .langfix button:not(.active):hover{color:var(--ink)}
  @media(max-width:700px){.langfix{top:8px;right:8px}
    .langfix button{padding:5px 12px;font-size:11px}}
  @media print{.langfix{display:none}}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .legend .foot{display:block;line-height:1.55}
  .legend{max-width:520px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}

  /* ---------- date picker v2 (sample-matched) ---------- */
  /* collapsible date picker */
  .pk-toggle{margin-top:24px;width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 20px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);
    text-align:left;transition:border-color .15s,box-shadow .15s}
  .pk-toggle:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(184,147,90,.13)}
  .pk-toggle .lft{display:flex;align-items:center;gap:11px;min-width:0}
  .pk-toggle .bar{display:inline-block;width:3px;height:17px;background:var(--accent);border-radius:2px;flex:none}
  .pk-toggle .cap{font-weight:600}
  .pk-toggle .sel{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
  .pk-toggle .chev{flex:none;transition:transform .2s;color:var(--muted);font-size:12px}
  .pk-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .pk-wrap[hidden]{display:none}
  .pk-wrap .pk-card{margin-top:10px}

  /* trend charts */
  .tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.tr-grid{grid-template-columns:1fr}}
  .tr-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 14px}
  .tr-card h3{margin:0 0 2px;font-size:14.5px;font-weight:700;color:var(--ink)}
  .tr-card .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
  .tr-lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .tr-lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .tr-svg{width:100%;height:auto;display:block;overflow:visible}
  .tr-dot{transition:r .12s}
  .tr-card:hover .tr-dot{r:3.2}
  .pk-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 16px;box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .pk-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;
    letter-spacing:.9px;text-transform:uppercase;color:var(--accent-dk);margin:0 0 8px}
  .pk-title .bar{width:26px;height:3px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  .pk-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;max-width:900px}
  .pk-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dpwrap{position:relative}
  .dpbtn{display:inline-flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid #cfc6b3;border-radius:10px;padding:10px 15px;font-family:inherit;
    font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink);cursor:pointer;transition:.15s}
  .dpbtn:hover{border-color:var(--accent)}
  .dpbtn .car{color:var(--muted);font-size:9px;margin-left:2px}
  .pk-now{display:inline-block;background:var(--accent-soft,#f3e7d3);color:var(--accent-dk);
    border:1px solid #e6d5b8;border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700}

  .dppane{position:absolute;top:calc(100% + 9px);left:0;z-index:80;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 40px rgba(70,55,30,.20);overflow:hidden}
  .dppane.open{display:flex}
  .dp-presets{width:196px;flex:0 0 auto;border-right:1px solid var(--line);
    padding:12px 8px;background:#fdfbf6;max-height:430px;overflow:auto}
  .dp-preset{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;
    font-size:12.5px;color:var(--ink);transition:.12s}
  .dp-preset:hover:not(:disabled){background:var(--cream2)}
  .dp-preset:disabled{color:#bdb4a6;cursor:not-allowed}
  .dp-preset .rd{width:13px;height:13px;border-radius:50%;border:1.5px solid #c3b9a6;flex:0 0 auto;position:relative}
  .dp-preset.on .rd{border-color:var(--accent)}
  .dp-preset.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
  .dp-preset .nm{flex:1}
  .dp-preset .ct{font-size:11.5px;color:var(--faint,#9a9186);font-weight:700}

  .dp-right{padding:14px 16px 12px;min-width:452px}
  .dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .dp-nav button{background:transparent;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
  .dp-nav button:hover:not(:disabled){background:var(--cream2);color:var(--ink)}
  .dp-nav button:disabled{opacity:.3;cursor:not-allowed}
  .dp-nav .mtitle{flex:1;display:flex;justify-content:space-around;font-size:13.5px;font-weight:700}
  .dp-months{display:flex;gap:26px}
  .dp-m{flex:1}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dp-dow{font-size:10.5px;color:var(--muted);text-align:center;padding:5px 0 3px;font-weight:700}
  .dp-d{position:relative;height:29px;border:none;background:transparent;border-radius:7px;
    font-family:inherit;font-size:12.5px;color:#bdb4a6;cursor:pointer;padding:0;transition:.1s}
  .dp-d.blank{cursor:default}
  .dp-d.has{color:var(--ink);font-weight:700}
  .dp-d:hover:not(.blank):not(.sel){background:var(--cream2)}
  .dp-d.inrange{background:var(--accent-soft,#f3e7d3);border-radius:0}
  .dp-d.sel{background:var(--accent);color:#2c2620;font-weight:800}
  .dp-d.sel.edge-l{border-radius:7px 0 0 7px}
  .dp-d.sel.edge-r{border-radius:0 7px 7px 0}
  .dp-d .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:3.5px;height:3.5px;border-radius:50%;background:var(--accent)}
  .dp-d.sel .dot{background:#2c2620}

  .dp-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-selinfo .d1{font-size:13.5px;font-weight:700}
  .dp-selinfo .d2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;max-width:300px}
  .dp-actions{display:flex;gap:9px;flex:0 0 auto}
  .dp-actions button{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:9px;
    padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .dp-actions .go{background:var(--accent);border-color:var(--accent);color:#2c2620}
  .dp-actions .go:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
  .dp-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
  .dp-legend .dotlg{display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-right:4px}

  .pk-quick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;
    padding-top:14px;border-top:1px solid var(--line)}
  .pk-quick-lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);
    text-transform:uppercase;flex:0 0 auto;margin-right:2px}
  .qchip{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--ink);transition:.13s;text-align:left}
  .qchip:hover{border-color:var(--accent);background:#fdfaf3}
  .qchip .qd{font-weight:700;flex:0 0 auto}
  .qchip .ql{font-size:11.5px;color:var(--muted)}
  .qchip.cur{background:var(--accent);border-color:var(--accent);color:#2c2620;cursor:default}
  .qchip.cur .ql{color:#5c4a24}

  .pk-trend{display:none;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .pk-trend.on{display:block}
  .pk-trend h4{margin:0 0 10px;font-size:13px;color:var(--accent-dk)}
  .trd{display:grid;grid-template-columns:88px 1fr 46px 62px;gap:9px;align-items:center;
    margin:6px 0;font-size:12.5px}
  .trd .tdate{font-weight:700}
  .trd .ttrack{background:var(--cream2);border-radius:6px;height:16px;overflow:hidden}
  .trd .tfill{height:100%;background:var(--accent);border-radius:6px}
  .trd .tval{font-weight:800;text-align:right}
  .trd .tlink{font-size:11px;color:var(--accent-dk);text-decoration:underline;cursor:pointer;text-align:right}
  @media(max-width:860px){.dppane.open{flex-direction:column}.dp-right{min-width:0}.dp-months{flex-direction:column;gap:14px}.dp-presets{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:none}}

</style>
</head>
<body>
<div class="langfix" role="group" aria-label="Language">
  <button type="button" data-l="vi" onclick="setLang('vi')">VI</button>
  <button type="button" data-l="en" onclick="setLang('en')">EN</button>
</div>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 17 trang gốc + 64 bài /articles + 6 trang dự án + sitemap" data-en="Source: Chrome live crawl · 17 core pages + 64 /articles + 6 project pages + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>26/08/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>26 Aug 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>87 trang</b> · Sitemap: <b>88 URL</b>" data-en="Directly measured: <b>87 pages</b> · Sitemap: <b>88 URLs</b>"></span><br>
        Method: Chrome fetch tuần tự · AbortController 12–15s
      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <!-- date picker v2 (collapsible) -->
  <button class="pk-toggle" id="pkToggle" type="button" aria-expanded="false" aria-controls="pkWrap" onclick="pkFold()">
    <span class="lft"><span class="bar"></span>
      <span class="cap t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span>
      <span class="sel" id="pkToggleSel"></span></span>
    <span class="chev">&#9660;</span>
  </button>
  <div class="pk-wrap" id="pkWrap" hidden>
  <div class="pk-card">
    <div class="pk-title"><span class="bar"></span><span class="t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span></div>
    <p class="pk-sub t" data-vi="Chọn <b>một ngày</b> rồi bấm <b>Cập nhật</b> để mở đúng bản báo cáo đã lưu của ngày đó. Chọn <b>một khoảng ngày</b> để xem xu hướng trong khoảng. Ngày <b>có dấu chấm</b> là ngày đã quét và có báo cáo lưu; ngày làm mờ vẫn chọn được làm đầu/cuối khoảng, nhưng không có báo cáo riêng để mở." data-en="Pick <b>a single day</b> and press <b>Update</b> to open that day's saved report. Pick <b>a date range</b> to see the trend across it. Days <b>with a dot</b> were crawled and have a stored report; faded days can still anchor a range but have no report of their own."></p>
    <div class="pk-bar">
      <div class="dpwrap">
        <button class="dpbtn" id="dpBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>&#128197;</span><span id="dpLabel">Ngày 25/08/2026</span><span class="car">&#9660;</span>
        </button>
        <div class="dppane" id="dpPane" role="dialog">
          <div class="dp-presets" id="dpPresets"></div>
          <div class="dp-right">
            <div class="dp-nav">
              <button type="button" id="dpPrev" aria-label="prev">&#8249;</button>
              <div class="mtitle"><span id="dpM1"></span><span id="dpM2"></span></div>
              <button type="button" id="dpNext" aria-label="next">&#8250;</button>
            </div>
            <div class="dp-months"><div class="dp-m" id="dpG1"></div><div class="dp-m" id="dpG2"></div></div>
            <div class="dp-foot">
              <div class="dp-selinfo"><div class="d1" id="dpSelD"></div><div class="d2" id="dpSelInfo"></div></div>
              <div class="dp-actions">
                <button type="button" id="dpCancel" class="t" data-vi="Hủy" data-en="Cancel"></button>
                <button type="button" id="dpApply" class="go t" data-vi="Cập nhật" data-en="Update"></button>

  <div class="foot t" data-vi="<b>Cách đọc:</b> mỗi điểm là một lần quét đầy đủ; các ngày không quét (01–02/08, 06/08, 08–09/08, 15–16/08, 22–23/08) <b>không</b> được nội suy mà chỉ nối thẳng giữa hai lần quét gần nhau, nên đoạn dốc dài không có nghĩa là thay đổi diễn ra đột ngột. <b>Ba điều đáng chú ý hôm nay:</b> (1) <b>đường Health lần đầu vượt 93</b>, kết thúc thế giằng co từ 24/08 — và nó vượt lên <b>không phải nhờ tốc độ</b> mà nhờ Crawlability, hạng mục vừa nhảy <b>95 &#8594; 97</b> khi hai P2 cùng đóng; (2) <b>đường Performance đảo chiều xuống 96 &#8594; 94</b> sau ba ngày đi lên — nhìn trên trục TTFB thì cả ba nhóm trang cùng nhích lên trong một ngày, dấu hiệu điển hình của <b>nhiễu tầng hạ tầng</b> chứ không phải một trang cụ thể xấu đi; (3) <b>đường On-page vẫn đứng yên ở 91</b> sang ngày thứ tám liên tiếp — đây giờ là <b>đường phẳng dài nhất trên biểu đồ</b>, và nó tương ứng đúng với ba việc P3 chưa ai đụng tới: heading nhảy bậc, tiêu đề quá dài/quá ngắn, và nội dung mỏng ở trang dự án. Muốn Health lên 95+ thì phải phá đường phẳng này." data-en="<b>How to read this:</b> each point is one full crawl; days without a crawl (1–2, 6, 8–9, 15–16, 22–23 Aug) are <b>not</b> interpolated, the line simply joins the two nearest crawls, so a long slope does not mean the change happened abruptly. <b>Three things worth noting today:</b> (1) <b>the Health line clears 93 for the first time</b>, breaking the deadlock that had held since 24 Aug — and it did so <b>not on speed</b> but on Crawlability, which jumped <b>95 &#8594; 97</b> as two P2s closed together; (2) <b>the Performance line turns down 96 &#8594; 94</b> after three days of climbing — on the TTFB axis all three page groups rose on the same day, the signature of <b>infrastructure-level noise</b> rather than any one page degrading; (3) <b>the On-page line is still flat at 91</b> for an eighth consecutive day — it is now the <b>longest flat stretch on the chart</b>, and it maps exactly onto the three P3 jobs nobody has touched: heading skips, titles outside the length band, and thin project-page content. Breaking that flat line is what takes Health past 95."></div>

    <h4 class="t" data-vi="Hai URL của 85 Commodore Drive nay cùng canonical về một địa chỉ, và sitemap đã khai đúng địa chỉ đó" data-en="Both 85 Commodore Drive URLs now canonicalise to one address, and the sitemap declares that address"></h4>
    <p class="t" data-vi="Đề xuất hôm qua <b>đã được thực hiện, và làm gọn hơn cả đề xuất</b>. Kiểm lại hôm nay: cả <code>/projects/85-commodore-drive</code> lẫn <code>/projects/85-commodore-drive-surfers-paradise</code> đều trả 200, nhưng <b>cả hai giờ cùng đặt <code>rel=&quot;canonical&quot;</code> về <code>/projects/85-commodore-drive</code></b>, cùng title &quot;85 Commodore Drive | DX Living Project&quot; và cùng kích thước 58 KB. Quan trọng hơn: <b>sitemap.xml đã đổi sang khai URL ngắn</b> (hôm qua khai URL dài), nên sitemap và internal link <b>lần đầu trỏ cùng một hướng</b> — chính là chỗ tín hiệu bị chẻ đôi hôm qua. Trang này vẫn nhận <b>6 internal link</b> và vẫn nằm trong cụm 6 trang dự án liên kết chéo nhau." data-en="Yesterday's recommendation <b>was implemented, and implemented more cleanly than proposed</b>. Re-checked today: both <code>/projects/85-commodore-drive</code> and <code>/projects/85-commodore-drive-surfers-paradise</code> return 200, but <b>both now set <code>rel=&quot;canonical&quot;</code> to <code>/projects/85-commodore-drive</code></b>, carry the same title &quot;85 Commodore Drive | DX Living Project&quot; and the same 58 KB payload. More importantly: <b>sitemap.xml has switched to declaring the short URL</b> (it declared the long one yesterday), so the sitemap and the internal links <b>point the same way for the first time</b> — which is exactly where the signal was split. The page still receives <b>6 internal links</b> and remains part of the cross-linked cluster of 6 project pages."></p>
    <p class="fix t" data-vi="<b>Việc cần làm:</b> không có gì bắt buộc. Nếu muốn dọn triệt để, thêm <b>301</b> từ URL dài về URL ngắn thay vì để nó trả 200 kèm canonical — canonical là gợi ý, 301 là mệnh lệnh. Nhưng đây là mức <b>tuỳ chọn</b>, không phải lỗi cần theo dõi nữa." data-en="<b>Action:</b> nothing required. To close it out completely, add a <b>301</b> from the long URL to the short one rather than leaving it at 200 with a canonical — a canonical is a hint, a 301 is an instruction. But this is now <b>optional polish</b>, not a defect to track."></p>

    <div class="prio t" data-vi="✓ THẮNG · P2 tồn 7 ngày đã đóng — theo cách tốt hơn đề xuất" data-en="✓ WIN · a P2 that had run seven days is closed — and better than proposed"></div>
    <h4 class="t" data-vi="timber-flooring-composite-decking không còn 404: bài đã trả 200 với 3.305 từ và 4 khối schema" data-en="timber-flooring-composite-decking no longer 404s: it returns 200 with 3,305 words and 4 schema blocks"></h4>
    <p class="t" data-vi="Báo cáo hôm qua đề xuất trỏ <b>301</b> URL này về <code>/articles/interior-finishes</code>. Đội ngũ đã chọn phương án tốt hơn: <b>khôi phục chính bài đó</b>. Hôm nay <code>/articles/timber-flooring-composite-decking</code> trả <b>HTTP 200</b>, <b>3.305 từ</b>, <b>4 khối JSON-LD</b> gồm <code>FAQPage</code>, 16 ảnh (11 lazy-load, 0 ảnh thiếu alt), 28 internal link, đã nằm trong sitemap và đo <b>0,63s</b>. Đây là kết quả tốt hơn 301 vì <b>giữ lại toàn bộ nội dung</b> thay vì gộp link equity vào bài khác. Cùng với bài mới <code>3d-renders-for-property-developers-melbourne</code>, site tăng <b>62 &#8594; 64 bài</b> và <b>+5.255 từ</b> trong một ngày." data-en="Yesterday's report proposed a <b>301</b> from this URL to <code>/articles/interior-finishes</code>. The team chose the better option: <b>restoring the article itself</b>. Today <code>/articles/timber-flooring-composite-decking</code> returns <b>HTTP 200</b> with <b>3,305 words</b>, <b>4 JSON-LD blocks</b> including <code>FAQPage</code>, 16 images (11 lazy-loaded, 0 missing alt), 28 internal links, a sitemap entry, and it measured <b>0.63s</b>. That beats a 301 because it <b>keeps the content</b> instead of folding its link equity into another page. Together with the new <code>3d-renders-for-property-developers-melbourne</code>, the site went <b>62 &#8594; 64 articles</b> and gained <b>5,255 words</b> in a day."></p>
    <p class="fix t" data-vi="<b>Việc cần làm:</b> không có. Chỉ cần <b>ping Search Console</b> để Google crawl lại URL này sớm — nó đã bị đánh dấu 404 suốt bảy ngày nên có thể mất vài ngày để quay lại index." data-en="<b>Action:</b> none. Just <b>ping Search Console</b> so Google recrawls this URL promptly — it has been flagged 404 for seven days, so it may take a few days to return to the index."></p>

  <div class="ins win">
    <div class="prio t" data-vi="✓ GIỮ VỮNG · sang ngày thứ chín · ba bản sửa nền tảng vẫn nguyên" data-en="✓ HOLDING · into a ninth day · the three structural fixes are intact"></div>
    <h4 class="t" data-vi="JSON-LD vẫn 1,0×; 0/984 ảnh thiếu alt; 0 trang mồ côi; 20 ngày liên tiếp không lỗi 4xx/5xx" data-en="JSON-LD still 1.0×; 0 of 984 images missing alt; 0 orphan pages; 20 consecutive days without a 4xx/5xx"></h4>
    <p class="t" data-vi="Ba bản sửa nền của chuỗi <b>đều giữ nguyên dù site vừa thêm 2 bài và đổi cấu trúc URL trang dự án</b> — đó mới là phép thử thật. (1) <b>Nhân bản JSON-LD vẫn 1,0&#215;</b> sang ngày thứ chín: <b>267 khối cho đúng 267 payload</b> trên 87 trang. (2) <b>0/984 ảnh thiếu alt</b> (hôm qua 0/951), <b>547 ảnh lazy-load</b>; hai bài mới thêm vào đều đúng chuẩn ngay từ đầu, nghĩa là <b>quy tắc đã nằm trong template</b> chứ không phải sửa tay. (3) <b>0 trang mồ côi</b>: cả 6 trang dự án vẫn nhận link (251 Station St 18 link, năm trang còn lại 6 link mỗi trang), và <b>87/87 trang</b> vẫn link về trang chủ. Sitemap lên <b>88 URL</b> với đủ 64 bài và 6 trang dự án." data-en="The three structural fixes <b>all held through a day in which the site gained 2 articles and changed a project URL</b> — which is the real test. (1) <b>JSON-LD duplication is still 1.0&#215;</b> into a ninth day: <b>267 blocks for exactly 267 payloads</b> across 87 pages. (2) <b>0 of 984 images missing alt</b> (0 of 951 yesterday), with <b>547 lazy-loaded</b>; both new articles were compliant from the start, meaning the rule <b>lives in the template</b> rather than in manual fixes. (3) <b>0 orphan pages</b>: all 6 project pages still receive links (251 Station St 18, the other five 6 each), and <b>87 of 87 pages</b> still link home. The sitemap is up to <b>88 URLs</b>, carrying all 64 articles and all 6 project pages."></p>
    <p class="fix t" data-vi="<b>Giữ nguyên:</b> không cần can thiệp. Vẫn nên đặt <b>cảnh báo tự động</b> đếm số <code>&lt;loc&gt;</code> trong sitemap và số khối JSON-LD mỗi ngày, báo động nếu lệch quá 10% — hai chỉ số này từng hỏng âm thầm trước đây." data-en="<b>Keep as is:</b> no intervention needed. It is still worth setting an <b>automated alert</b> that counts <code>&lt;loc&gt;</code> entries in the sitemap and JSON-LD blocks daily and fires if either moves more than 10% — both have failed silently before."></p>

    <div class="prio t" data-vi="P3 · Cần theo dõi · phát sinh hôm nay, chưa phải lỗi" data-en="P3 · Watch item · new today, not yet a defect"></div>
    <h4 class="t" data-vi="TTFB toàn site chậm lại 656 → 720 ms, nhóm trang dự án chậm nhất (+31%)" data-en="Site-wide TTFB slowed 656 → 720 ms, with project pages moving most (+31%)"></h4>
    <p class="t" data-vi="Đây là điểm trừ duy nhất hôm nay và là lý do Performance rơi <b>96 &#8594; 94</b>. Toàn site <b>656 &#8594; 720 ms</b>; nhóm gốc gần như đứng yên (684 &#8594; 692 ms), nhóm bài <b>653 &#8594; 720 ms</b>, nhóm dự án <b>610 &#8594; 798 ms (+31%)</b>. Số trang trên 1 giây tăng từ 1 lên 2: <code>house-renovation-3d-design-melbourne</code> ở 1,07s và trang chủ ở 1,05s. <b>Vì sao chưa xếp là P2:</b> không có trang nào hỏng, <b>85/87 vẫn dưới 1 giây (97,7%)</b>, không trang nào chạm 1,1s, và biên độ toàn site <b>0,34–1,07s</b> là dải hẹp nhất từng đo. Cả ba nhóm cùng nhích lên trong một ngày — dấu hiệu của <b>nhiễu tầng hạ tầng</b>, không phải một trang cụ thể xấu đi. Năm trong sáu trang dự án rơi vào dải 0,82–0,85s, sát nhau đến mức bất thường, càng giống hiệu ứng cache tầng edge hơn là nội dung." data-en="This is today's single negative and the reason Performance fell <b>96 &#8594; 94</b>. Site-wide <b>656 &#8594; 720 ms</b>; core is essentially flat (684 &#8594; 692 ms), articles <b>653 &#8594; 720 ms</b>, projects <b>610 &#8594; 798 ms (+31%)</b>. Pages over 1 second went from 1 to 2: <code>house-renovation-3d-design-melbourne</code> at 1.07s and the homepage at 1.05s. <b>Why this is not a P2:</b> nothing is broken, <b>85 of 87 pages are still under a second (97.7%)</b>, nothing reaches 1.1s, and the site-wide range of <b>0.34–1.07s</b> is the tightest ever recorded. All three groups rose on the same day — the signature of <b>infrastructure-level noise</b> rather than any one page degrading. Five of the six project pages landed in a 0.82–0.85s band, clustered unusually tightly, which looks more like an edge-cache effect than a content change."></p>
    <p class="fix t" data-vi="<b>Việc cần làm:</b> <b>chưa làm gì cả</b> — chờ thêm một lần quét. Nếu ngày mai toàn site vẫn ≥700 ms thì mới xem lại: (1) tỉ lệ cache hit ở tầng edge/CDN cho nhóm <code>/projects/*</code>, (2) thời gian phản hồi gốc từ server, (3) liệu 2 bài mới có làm listing <code>/articles</code> (220 KB) nặng thêm và đẩy tải chung lên hay không." data-en="<b>Action:</b> <b>nothing yet</b> — wait one more crawl. If site-wide is still ≥700 ms tomorrow, then look at: (1) edge/CDN cache hit rate for <code>/projects/*</code>, (2) origin server response time, and (3) whether the 2 new articles have made the <code>/articles</code> listing (220 KB) heavier and lifted overall load."></p>
  </div>
  <div class="ins p3">
    <div class="prio t" data-vi="P3 · Còn tồn · không đổi so 25/08 · giờ là việc duy nhất còn lại" data-en="P3 · Persisting · unchanged from 25 Aug · now the only work left"></div>
    <h4 class="t" data-vi="Heading còn nhảy bậc ở 15/87 trang; 12 bài chưa có FAQPage; 11 trang dưới 300 từ" data-en="Heading skips remain on 15 of 87 pages; 12 articles lack FAQPage; 11 pages are under 300 words"></h4>
    <p class="t" data-vi="Ba mục này <b>đứng yên hoàn toàn</b> sang ngày thứ tám, và giờ chúng là <b>toàn bộ danh sách việc tồn đọng</b> — không còn P1 hay P2 nào khác. Heading nhảy bậc ở <b>15 trang</b>, phần lớn là <b>1&#8594;3</b> trên template trang dự án (kiểm rendered DOM ở <code>/projects/251-station-st</code>: chuỗi heading <code>1-3-4-3-4-3-4-2-3-4...</code>) và <b>2&#8594;4</b> ở vài trang gốc; riêng <code>bim-3d-4d-5d-explained</code> có 4 chỗ nhảy bậc, nhiều nhất site. <code>FAQPage</code> còn thiếu ở <b>12 bài</b> (81,3% đã có, lên từ 79,0% — nhưng chỉ vì mẫu số tăng, <b>không bài cũ nào được bổ sung</b>). Nội dung mỏng ở <b>11 trang</b>: 6 trang dự án (238–255 từ), <code>/modules</code> 244, <code>/contact</code> 248, <code>/projects</code> 270, và hai trang chức năng <code>/start-interactive</code> (58 từ) với <code>/login</code> (27 từ) — hai trang cuối không cần sửa." data-en="These three <b>have not moved at all</b> into an eighth day, and they now constitute <b>the entire outstanding list</b> — there is no remaining P1 or P2. Heading skips affect <b>15 pages</b>, mostly <b>1&#8594;3</b> from the project-page template (rendered-DOM check on <code>/projects/251-station-st</code> shows a heading sequence of <code>1-3-4-3-4-3-4-2-3-4...</code>) plus <b>2&#8594;4</b> on a few core pages; <code>bim-3d-4d-5d-explained</code> alone has 4 skips, the most on the site. <code>FAQPage</code> is missing on <b>12 articles</b> (81.3% now carry one, up from 79.0% — but only because the denominator grew; <b>no existing article gained one</b>). Thin content affects <b>11 pages</b>: the 6 project pages (238–255 words), <code>/modules</code> at 244, <code>/contact</code> at 248, <code>/projects</code> at 270, plus the two utility pages <code>/start-interactive</code> (58 words) and <code>/login</code> (27) — neither of which needs fixing."></p>
    <p class="fix t" data-vi="<b>Cách sửa (không đổi):</b> (1) <b>Heading</b> — sửa <b>một template trang dự án</b> là dọn xong 7 trong 15 trang: đổi <code>&lt;h3&gt;</code> đầu tiên sau H1 thành <code>&lt;h2&gt;</code>. (2) <b>FAQPage</b> — 12 bài, mỗi bài 3–5 câu hỏi, khoảng 20 phút/bài; ưu tiên <code>bim-3d-from-design-to-site-in-2026</code> và <code>project-management-and-cost-control</code> vì đã có 9 và 1 internal link trỏ vào. (3) <b>Trang dự án</b> — nâng từ ~245 lên 600+ từ: bối cảnh dự án, phạm vi công việc DX Living đảm nhận, và kết quả đo được. Đây là việc <b>có tác động lớn nhất</b> còn lại vì nó nâng cả Content lẫn On-page." data-en="<b>How to fix (unchanged):</b> (1) <b>Headings</b> — fixing <b>one project-page template</b> clears 7 of the 15 pages: change the first <code>&lt;h3&gt;</code> after the H1 to an <code>&lt;h2&gt;</code>. (2) <b>FAQPage</b> — 12 articles, 3–5 questions each, roughly 20 minutes apiece; start with <code>bim-3d-from-design-to-site-in-2026</code> and <code>project-management-and-cost-control</code>, which already receive 9 and 1 internal links. (3) <b>Project pages</b> — lift them from ~245 to 600+ words: project context, the scope DX Living handled, and measured outcomes. This is the <b>highest-impact</b> job left, because it moves Content and On-page together."></p>
  </div>

    <div class="prio t" data-vi="P3 · Quan sát mới · chưa từng nêu trong chuỗi" data-en="P3 · New observation · not previously raised in the series"></div>
    <h4 class="t" data-vi="28/87 tiêu đề nằm ngoài dải 30–65 ký tự, biên độ 26–80 — nguy cơ bị Google viết lại" data-en="28 of 87 titles fall outside the 30–65 character band, ranging 26–80 — a rewrite risk in Google"></h4>
    <p class="t" data-vi="Chỉ số này vẫn ổn định suốt chuỗi (26–80 ký tự) nên chưa từng được tách ra nói riêng, nhưng giờ nó là <b>một trong số ít việc còn lại</b> nên đáng nêu. <b>28/87 trang</b> có tiêu đề ngoài dải khuyến nghị 30–65 ký tự. Phía dài: <code>contemporary-houses-a-practical-guide</code> 80 ký tự, <code>pre-construction-visualisation-construction-readiness</code> 78, <code>6-benefits-of-using-vr-technology</code> 78 — nhóm này dễ bị Google cắt bớt hoặc tự viết lại trên SERP. Phía ngắn: <code>/faq</code> 27 ký tự, <code>/login</code> 26, <code>/privacy-policy</code> 26, <code>/terms-of-service</code> 28 — nhóm này bỏ phí chỗ đặt từ khoá. Cả 87 trang <b>đều có</b> title, meta description và canonical, nên đây thuần tuý là chuyện <b>độ dài</b>, không phải thiếu thẻ." data-en="This metric has been stable across the series (26–80 characters) so it was never broken out separately, but with so little else outstanding it now deserves a mention. <b>28 of 87 pages</b> carry a title outside the recommended 30–65 character band. On the long side: <code>contemporary-houses-a-practical-guide</code> at 80 characters, <code>pre-construction-visualisation-construction-readiness</code> at 78, and <code>6-benefits-of-using-vr-technology</code> at 78 — these are the ones Google is most likely to truncate or rewrite in the SERP. On the short side: <code>/faq</code> at 27, <code>/login</code> at 26, <code>/privacy-policy</code> at 26 and <code>/terms-of-service</code> at 28 — these waste available keyword space. All 87 pages <b>do have</b> a title, meta description and canonical, so this is purely about <b>length</b>, not missing tags."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> ưu tiên <b>khoảng 8 tiêu đề dài nhất</b> (trên 72 ký tự) vì đó là nhóm gần như chắc chắn bị cắt — rút về 55–60 ký tự, giữ từ khoá chính ở đầu. Nhóm ngắn ở trang pháp lý và <code>/login</code> <b>không cần đụng tới</b>: chúng không nhắm từ khoá nào. Việc này ảnh hưởng CTR chứ không ảnh hưởng thứ hạng, nên xếp sau ba mục P3 ở trên." data-en="<b>How to fix:</b> prioritise the <b>eight or so longest titles</b> (over 72 characters), since those are near-certain to be truncated — trim to 55–60 characters keeping the primary keyword first. The short titles on the legal pages and <code>/login</code> <b>need no attention</b>: they target no keyword. This affects CTR rather than ranking, so it sits behind the three P3 items above."></p>
  </div>

function trFmt(d){const p=d.split('-');return LANG==='vi'?p[2]+'/'+p[1]:p[2]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1];}

/* generic multi-series line chart -> inline SVG string */
function trChart(rows, series, opts){
  opts = opts || {};
  const W=520, H=opts.h||210, L=42, R=12, TP=14, BT=30;
  const iw=W-L-R, ih=H-TP-BT;
  let vals=[]; series.forEach(s=>rows.forEach(r=>{const v=r[s.i]; if(v!==null&&v!==0||s.zero)vals.push(v);}));
  let lo = opts.min!==undefined?opts.min:Math.min.apply(null,vals);
  let hi = opts.max!==undefined?opts.max:Math.max.apply(null,vals);
  if(hi===lo){hi=lo+1;}
  const pad=(hi-lo)*0.12; lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=>L+(rows.length<2?iw/2:i*iw/(rows.length-1));
  const Y=v=>TP+ih-(v-lo)/(hi-lo)*ih;
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let g='';
  /* gridlines + y labels */
  const TICKS=4;
  for(let t=0;t<=TICKS;t++){
    const v=lo+(hi-lo)*t/TICKS, y=Y(v);
    g+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" ${t?'stroke-dasharray="3 4"':''}/>`;
    g+=`<text x="${L-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">${Math.round(v).toLocaleString(loc)}</text>`;
  }
  /* x labels: first, last and every other */
  rows.forEach((r,i)=>{
    if(i!==0 && i!==rows.length-1 && i%2) return;
    g+=`<text x="${X(i).toFixed(1)}" y="${H-11}" text-anchor="middle" font-size="9" fill="var(--muted)">${trFmt(r[0])}</text>`;
  });
  /* series */
  series.forEach(s=>{
    const pts=[];
    rows.forEach((r,i)=>{const v=r[s.i]; if(v===null||(v===0&&!s.zero))return; pts.push([X(i),Y(v),v,r[0]]);});
    if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area){
      g+=`<path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${TP+ih} L ${pts[0][0].toFixed(1)} ${TP+ih} Z" fill="${s.c}" opacity=".10"/>`;
    }
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{
      g+=`<circle class="tr-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.w>2?3:2.4}" fill="var(--card)" stroke="${s.c}" stroke-width="1.8"><title>${s.n} · ${trFmt(p[3])}: ${p[2].toLocaleString(loc)}${opts.unit||''}</title></circle>`;
    });
    /* value label on the last point */
    if(s.last!==false){
      const lp=pts[pts.length-1];
      g+=`<text x="${(lp[0]+6).toFixed(1)}" y="${(lp[1]-6).toFixed(1)}" font-size="10.5" font-weight="700" fill="${s.c}">${lp[2].toLocaleString(loc)}</text>`;
    }
  });
  const lg=series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('');
  return `<svg class="tr-svg" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tr-lg">${lg}</div>`;
}

  el.textContent = LANG==='vi'
    ? (one ? (cur?'· đang xem bản hôm nay ('+pkFmt(PK_SEL.s)+')':'· đang xem '+pkFmt(PK_SEL.s)) : '· khoảng '+pkFmt(PK_SEL.s)+' – '+pkFmt(PK_SEL.e))
    : (one ? (cur?'· viewing today ('+pkFmt(PK_SEL.s)+')':'· viewing '+pkFmt(PK_SEL.s)) : '· range '+pkFmt(PK_SEL.s)+' – '+pkFmt(PK_SEL.e));
}

let LANG = 'en';

function applyLang(){
  document.querySelectorAll('.t').forEach(e=>{
    const v = e.dataset[LANG];
    if(v!==undefined) e.innerHTML = v;
  });
  document.querySelectorAll('.tsvg').forEach(e=>{
    const v = e.dataset[LANG];
    if(v!==undefined) e.textContent = v;
  });
}

function setLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('btnVI').classList.toggle('active', l==='vi');
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.querySelectorAll('.langfix button[data-l]').forEach(b=>
    b.classList.toggle('active', b.dataset.l===l));
  applyLang();
  render();
  if(typeof pkRender==='function' && PK_SNAPS.length) pkRender();
}

function renderRt(){
  const loaded = [...PAGES].sort((a,b)=>b.rt-a.rt);
  const max = 1100;
  const col = ms => ms<1000?'var(--green)':ms<3000?'var(--accent)':ms<6000?'var(--amber)':'var(--red)';
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let h='';
  loaded.forEach(p=>{
    const w=Math.max(2,(p.rt/max*100)).toFixed(1);
    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

const tbody=document.querySelector('#pt tbody');
let sortK='rt', sortDir=1, filt='all';
function render(){
  renderRt();
  renderTrend();
  pkToggleLabel();
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let rows=[...PAGES];
  if(filt!=='all')rows=rows.filter(p=>p.grp===filt);
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}
    return sortDir*(x-y);
  });
  tbody.innerHTML=rows.map(p=>{
    const st='<span class="badge b200">200</span>';
    const sc=p.schema>0?`<span class="yes">${p.schema}</span>`:'<span class="no">0</span>';
    const sm=p.sm?'<span class="yes">✓</span>':'<span class="no">✗</span>';
    const rtc=p.rt<1000?'var(--green)':p.rt<3000?'var(--accent-dk)':p.rt<6000?'var(--amber)':'var(--red)';
    return `<tr>
      <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.url}">${p.url}</td>
      <td class="num">${st}</td>
      <td class="num" style="color:${rtc};font-weight:700">${p.rt.toLocaleString(loc)}</td>
      <td class="num">${p.words}</td>
      <td class="num">${sc}</td>
      <td class="num">${p.links}</td>
      <td>${sm}</td></tr>`;
  }).join('');
}
document.querySelectorAll('#pt th').forEach(th=>{
  th.addEventListener('click',()=>{
    const k=th.dataset.k;
    if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1;}
    render();
  });
});
document.querySelectorAll('.filter-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');filt=b.dataset.f;render();
  });
});

/* ================= date picker v2 (sample-matched) ================= */
const PK_BASE  = '';
const PK_TODAY = '2026-08-26';
let PK_SNAPS = [], PK_MAP = {}, PK_VIEW = null;
let PK_SEL = {s:PK_TODAY, e:PK_TODAY}, PK_DRAFT = {s:PK_TODAY, e:PK_TODAY}, PK_PENDING = false, PK_PRESET = null;

const PK_T = {
  vi:{day:'Ngày',range:'Khoảng',now:d=>`Đang xem báo cáo ngày ${d} (mới nhất)`,
      viewing:d=>`Đang xem báo cáo ngày ${d}`,
      trend:(a,b)=>`Đang xem xu hướng ${a} → ${b}`,
      quick:'Mở nhanh', today:'mới nhất',
      months:['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'],
      dow:['CN','T2','T3','T4','T5','T6','T7'],
      saved:n=>`${n} ngày đã lưu trong khoảng này · ngày theo giờ Việt Nam (Asia/Ho_Chi_Minh), là giờ lúc quét`,
      noRep:'Ngày này chưa quét — không có báo cáo riêng để mở.',
      trendTitle:(a,b)=>`Xu hướng Health Score · ${a} → ${b}`,
      open:'mở'},
  en:{day:'Day',range:'Range',now:d=>`Viewing the report for ${d} (latest)`,
      viewing:d=>`Viewing the report for ${d}`,
      trend:(a,b)=>`Viewing the trend ${a} → ${b}`,
      quick:'Quick open', today:'latest',
      months:['January','February','March','April','May','June','July','August','September','October','November','December'],
      dow:['Su','Mo','Tu','We','Th','Fr','Sa'],
      saved:n=>`${n} stored day(s) in this range · dates in Vietnam time (Asia/Ho_Chi_Minh), the time of the crawl`,
      noRep:'This day was not crawled — there is no separate report to open.',
      trendTitle:(a,b)=>`Health Score trend · ${a} → ${b}`,
      open:'open'}
};
const pkL = () => PK_T[LANG];

function pkISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pkD(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function pkFmt(iso){ const [y,m,d]=iso.split('-'); return LANG==='vi'?`${d}/${m}/${y}`:`${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`; }
function pkAdd(iso,n){ const d=pkD(iso); d.setDate(d.getDate()+n); return pkISO(d); }
function pkIn(iso,a,b){ return iso>=a && iso<=b; }
function pkCount(a,b){ return PK_SNAPS.filter(s=>pkIn(s.date,a,b)).length; }

function pkPresets(){
  const T=PK_TODAY, d=pkD(T);
  const monStart=(()=>{const x=pkD(T); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return pkISO(x);})();
  const lastMonStart=pkAdd(monStart,-7), lastMonEnd=pkAdd(monStart,-1);
  const mStart=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
  const pmStart=pkISO(pm), pmEnd=pkISO(new Date(d.getFullYear(),d.getMonth(),0));
  const first=PK_SNAPS.length?PK_SNAPS[0].date:T;
  return [
    {k:'y',   vi:'Hôm qua',   en:'Yesterday',   s:pkAdd(T,-1), e:pkAdd(T,-1)},
    {k:'7',   vi:'7 ngày qua', en:'Last 7 days',  s:pkAdd(T,-6), e:T},
    {k:'28',  vi:'28 ngày qua',en:'Last 28 days', s:pkAdd(T,-27),e:T},
    {k:'90',  vi:'90 ngày qua',en:'Last 90 days', s:pkAdd(T,-89),e:T},
    {k:'tw',  vi:'Tuần này',  en:'This week',   s:monStart, e:T},
    {k:'tm',  vi:'Tháng này', en:'This month',  s:mStart, e:T},
    {k:'ty',  vi:'Năm nay',   en:'This year',   s:`${d.getFullYear()}-01-01`, e:T},
    {k:'lw',  vi:'Tuần trước',en:'Last week',   s:lastMonStart, e:lastMonEnd},
    {k:'lm',  vi:'Tháng trước',en:'Last month', s:pmStart, e:pmEnd},
    {k:'all', vi:'Toàn bộ dữ liệu đã lưu', en:'All stored data', s:first, e:T}
  ];
}

function pkRenderPresets(){
  const box=document.getElementById('dpPresets'); if(!box) return;
  box.innerHTML = pkPresets().map(p=>{
    const n=pkCount(p.s,p.e), off=n===0;
    const on=PK_PRESET===p.k;
    return `<button type="button" class="dp-preset${on?' on':''}" data-k="${p.k}" ${off?'disabled':''}>
      <span class="rd"></span><span class="nm">${LANG==='vi'?p.vi:p.en}</span><span class="ct">${n}</span></button>`;
  }).join('');
  box.querySelectorAll('.dp-preset').forEach(b=>b.addEventListener('click',()=>{
    const p=pkPresets().find(x=>x.k===b.dataset.k);
    PK_PRESET=p.k; PK_DRAFT={s:p.s,e:p.e}; PK_PENDING=false;
    PK_VIEW=pkD(p.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1);
    pkRenderCal(); pkRenderPresets();
  }));
}

function pkMonth(base,off){
  const d=new Date(base.getFullYear(), base.getMonth()+off, 1);
  const y=d.getFullYear(), m=d.getMonth();
  const start=new Date(y,m,1).getDay(); // 0=Sun
  const days=new Date(y,m+1,0).getDate();
  let cells=pkL().dow.map(x=>`<div class="dp-dow">${x}</div>`).join('');
  for(let i=0;i<start;i++) cells+='<button class="dp-d blank" disabled></button>';
  for(let dd=1;dd<=days;dd++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const has=!!PK_MAP[iso];
    const sel=iso===PK_DRAFT.s||iso===PK_DRAFT.e;
    const inr=pkIn(iso,PK_DRAFT.s,PK_DRAFT.e)&&!sel;
    const edge=iso===PK_DRAFT.s&&PK_DRAFT.s!==PK_DRAFT.e?' edge-l':(iso===PK_DRAFT.e&&PK_DRAFT.s!==PK_DRAFT.e?' edge-r':'');
    cells+=`<button type="button" class="dp-d${has?' has':''}${inr?' inrange':''}${sel?' sel'+edge:''}" data-iso="${iso}">${dd}${has?'<span class="dot"></span>':''}</button>`;
  }
  return {title:`${pkL().months[m]} ${y}`, html:`<div class="dp-grid">${cells}</div>`};
}

function pkRenderCal(){
  if(!PK_VIEW){ PK_VIEW=pkD(PK_SEL.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1); }
  const a=pkMonth(PK_VIEW,0), b=pkMonth(PK_VIEW,1);
  document.getElementById('dpM1').textContent=a.title;
  document.getElementById('dpM2').textContent=b.title;
  document.getElementById('dpG1').innerHTML=a.html;
  document.getElementById('dpG2').innerHTML=b.html;
  document.querySelectorAll('#dpG1 .dp-d,#dpG2 .dp-d').forEach(el=>{
    if(el.classList.contains('blank')) return;
    el.addEventListener('click',()=>{
      const iso=el.dataset.iso;
      if(!PK_PENDING){ PK_DRAFT={s:iso,e:iso}; PK_PENDING=true; }
      else { PK_DRAFT = iso<PK_DRAFT.s ? {s:iso,e:PK_DRAFT.s} : {s:PK_DRAFT.s,e:iso}; PK_PENDING=false; }
      PK_PRESET=null; pkRenderCal(); pkRenderPresets();
    });
  });
  const single=PK_DRAFT.s===PK_DRAFT.e;
  document.getElementById('dpSelD').textContent = single?pkFmt(PK_DRAFT.s):`${pkFmt(PK_DRAFT.s)} → ${pkFmt(PK_DRAFT.e)}`;
  const n=pkCount(PK_DRAFT.s,PK_DRAFT.e);
  document.getElementById('dpSelInfo').textContent = n===0 ? pkL().noRep : pkL().saved(n);
}

function pkRenderQuick(){
  const box=document.getElementById('dpQuick'); if(!box) return;
  const chips=PK_SNAPS.slice().reverse().map(s=>{
    const cur=s.date===PK_SEL.s&&PK_SEL.s===PK_SEL.e;
    const lb=LANG==='vi'?(s.label_vi||''):(s.label_en||'');
    return `<button type="button" class="qchip${cur?' cur':''}" data-iso="${s.date}">
      <span class="qd">${pkFmt(s.date)}</span><span class="ql">${lb}</span></button>`;
  }).join('');
  box.innerHTML=`<span class="pk-quick-lbl">${pkL().quick}</span>`+chips;
  box.querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('cur')) return;
    pkGo(b.dataset.iso,b.dataset.iso);
  }));
}

function pkRenderNow(){
  const el=document.getElementById('dpNow'); if(!el) return;
  const single=PK_SEL.s===PK_SEL.e;
  el.textContent = !single ? pkL().trend(pkFmt(PK_SEL.s),pkFmt(PK_SEL.e))
    : (PK_SEL.s===PK_TODAY ? pkL().now(pkFmt(PK_SEL.s)) : pkL().viewing(pkFmt(PK_SEL.s)));
  document.getElementById('dpLabel').textContent = single
    ? `${pkL().day} ${pkFmt(PK_SEL.s)}` : `${pkL().range} ${pkFmt(PK_SEL.s)} → ${pkFmt(PK_SEL.e)}`;
}

function pkGo(s,e){
  if(s===e){
    const snap=PK_MAP[s];
    if(snap && s!==PK_TODAY){ location.href=PK_BASE+snap.report; return; }
    PK_SEL={s,e}; PK_DRAFT={s,e}; PK_PRESET=null;
    document.getElementById('dpTrend').classList.remove('on');
    pkRenderNow(); pkRenderQuick(); pkRenderCal();
    return;
  }
  PK_SEL={s,e}; pkRenderNow(); pkRenderQuick(); pkTrend(s,e);
}

function pkTrend(s,e){
  const box=document.getElementById('dpTrend');
  const days=PK_SNAPS.filter(x=>pkIn(x.date,s,e));
  if(!days.length){ box.classList.remove('on'); box.innerHTML=''; return; }
  Promise.all(days.map(d=>fetch(PK_BASE+d.data,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)))
   .then(js=>{
     const rows=js.map((j,i)=>({date:days[i].date, rep:days[i].report, hs:j&&j.health_score, pg:j&&j.pages_measured}))
                  .filter(r=>r.hs!=null);
     box.innerHTML=`<h4>${pkL().trendTitle(pkFmt(s),pkFmt(e))}</h4>`+rows.map(r=>`
       <div class="trd"><span class="tdate">${pkFmt(r.date)}</span>
         <span class="ttrack"><span class="tfill" style="width:${r.hs}%"></span></span>
         <span class="tval">${r.hs}</span>
         <span class="tlink" data-h="${r.rep}">${pkL().open} &#8594;</span></div>`).join('');
     box.classList.add('on');
     box.querySelectorAll('.tlink').forEach(a=>a.addEventListener('click',()=>{
       const h=a.dataset.h; if(h && h!=='index.html') location.href=PK_BASE+h;
     }));
   });
}

function pkRender(){ pkRenderPresets(); pkRenderCal(); pkRenderQuick(); pkRenderNow(); pkToggleLabel(); }

(function pkInit(){
  const btn=document.getElementById('dpBtn'), pane=document.getElementById('dpPane');
  if(!btn) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=pane.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
    if(open){ PK_DRAFT={...PK_SEL}; PK_PENDING=false; pkRenderCal(); pkRenderPresets(); }
  });
  document.addEventListener('click',e=>{
    if(!pane.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') pane.classList.remove('open'); });
  document.getElementById('dpPrev').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()-1); pkRenderCal(); });
  document.getElementById('dpNext').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()+1); pkRenderCal(); });
  document.getElementById('dpCancel').addEventListener('click',()=>{
    PK_DRAFT={...PK_SEL}; PK_PENDING=false; PK_PRESET=null;
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false'); pkRenderCal();
  });
  document.getElementById('dpApply').addEventListener('click',()=>{
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    pkGo(PK_DRAFT.s,PK_DRAFT.e);
  });
  fetch(PK_BASE+'data/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    PK_SNAPS=(j.snapshots||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s);
    pkRender();
  }).catch(()=>{
    PK_SNAPS=[{date:PK_TODAY,report:'index.html',data:'data/'+PK_TODAY+'.json',label_vi:'Bản hiện tại',label_en:'Current report'}];
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s); pkRender();
  });
})();

setLang('en');
</script>
