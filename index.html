<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .legend .foot{display:block;line-height:1.55}
  .legend{max-width:520px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}

  /* ---------- date picker v2 (sample-matched) ---------- */
  .pk-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 16px;box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .pk-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;
    letter-spacing:.9px;text-transform:uppercase;color:var(--accent-dk);margin:0 0 8px}
  .pk-title .bar{width:26px;height:3px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  .pk-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;max-width:900px}
  .pk-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dpwrap{position:relative}
  .dpbtn{display:inline-flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid #cfc6b3;border-radius:10px;padding:10px 15px;font-family:inherit;
    font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink);cursor:pointer;transition:.15s}
  .dpbtn:hover{border-color:var(--accent)}
  .dpbtn .car{color:var(--muted);font-size:9px;margin-left:2px}
  .pk-now{display:inline-block;background:var(--accent-soft,#f3e7d3);color:var(--accent-dk);
    border:1px solid #e6d5b8;border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700}

  .dppane{position:absolute;top:calc(100% + 9px);left:0;z-index:80;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 40px rgba(70,55,30,.20);overflow:hidden}
  .dppane.open{display:flex}
  .dp-presets{width:196px;flex:0 0 auto;border-right:1px solid var(--line);
    padding:12px 8px;background:#fdfbf6;max-height:430px;overflow:auto}
  .dp-preset{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;
    font-size:12.5px;color:var(--ink);transition:.12s}
  .dp-preset:hover:not(:disabled){background:var(--cream2)}
  .dp-preset:disabled{color:#bdb4a6;cursor:not-allowed}
  .dp-preset .rd{width:13px;height:13px;border-radius:50%;border:1.5px solid #c3b9a6;flex:0 0 auto;position:relative}
  .dp-preset.on .rd{border-color:var(--accent)}
  .dp-preset.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
  .dp-preset .nm{flex:1}
  .dp-preset .ct{font-size:11.5px;color:var(--faint,#9a9186);font-weight:700}

  .dp-right{padding:14px 16px 12px;min-width:452px}
  .dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .dp-nav button{background:transparent;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
  .dp-nav button:hover:not(:disabled){background:var(--cream2);color:var(--ink)}
  .dp-nav button:disabled{opacity:.3;cursor:not-allowed}
  .dp-nav .mtitle{flex:1;display:flex;justify-content:space-around;font-size:13.5px;font-weight:700}
  .dp-months{display:flex;gap:26px}
  .dp-m{flex:1}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dp-dow{font-size:10.5px;color:var(--muted);text-align:center;padding:5px 0 3px;font-weight:700}
  .dp-d{position:relative;height:29px;border:none;background:transparent;border-radius:7px;
    font-family:inherit;font-size:12.5px;color:#bdb4a6;cursor:pointer;padding:0;transition:.1s}
  .dp-d.blank{cursor:default}
  .dp-d.has{color:var(--ink);font-weight:700}
  .dp-d:hover:not(.blank):not(.sel){background:var(--cream2)}
  .dp-d.inrange{background:var(--accent-soft,#f3e7d3);border-radius:0}
  .dp-d.sel{background:var(--accent);color:#2c2620;font-weight:800}
  .dp-d.sel.edge-l{border-radius:7px 0 0 7px}
  .dp-d.sel.edge-r{border-radius:0 7px 7px 0}
  .dp-d .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:3.5px;height:3.5px;border-radius:50%;background:var(--accent)}
  .dp-d.sel .dot{background:#2c2620}

  .dp-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-selinfo .d1{font-size:13.5px;font-weight:700}
  .dp-selinfo .d2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;max-width:300px}
  .dp-actions{display:flex;gap:9px;flex:0 0 auto}
  .dp-actions button{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:9px;
    padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .dp-actions .go{background:var(--accent);border-color:var(--accent);color:#2c2620}
  .dp-actions .go:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
  .dp-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
  .dp-legend .dotlg{display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-right:4px}

  .pk-quick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;
    padding-top:14px;border-top:1px solid var(--line)}
  .pk-quick-lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);
    text-transform:uppercase;flex:0 0 auto;margin-right:2px}
  .qchip{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--ink);transition:.13s;text-align:left}
  .qchip:hover{border-color:var(--accent);background:#fdfaf3}
  .qchip .qd{font-weight:700;flex:0 0 auto}
  .qchip .ql{font-size:11.5px;color:var(--muted)}
  .qchip.cur{background:var(--accent);border-color:var(--accent);color:#2c2620;cursor:default}
  .qchip.cur .ql{color:#5c4a24}

  .pk-trend{display:none;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .pk-trend.on{display:block}
  .pk-trend h4{margin:0 0 10px;font-size:13px;color:var(--accent-dk)}
  .trd{display:grid;grid-template-columns:88px 1fr 46px 62px;gap:9px;align-items:center;
    margin:6px 0;font-size:12.5px}
  .trd .tdate{font-weight:700}
  .trd .ttrack{background:var(--cream2);border-radius:6px;height:16px;overflow:hidden}
  .trd .tfill{height:100%;background:var(--accent);border-radius:6px}
  .trd .tval{font-weight:800;text-align:right}
  .trd .tlink{font-size:11px;color:var(--accent-dk);text-decoration:underline;cursor:pointer;text-align:right}
  @media(max-width:860px){.dppane.open{flex-direction:column}.dp-right{min-width:0}.dp-months{flex-direction:column;gap:14px}.dp-presets{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:none}}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 17 trang gốc + 54 bài /articles + 6 trang dự án + sitemap" data-en="Source: Chrome live crawl · 17 core pages + 54 /articles + 6 project pages + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>11/08/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>11 Aug 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>78 trang</b> · Sitemap: <b>77 URL</b>" data-en="Directly measured: <b>78 pages</b> · Sitemap: <b>77 URLs</b>"></span><br>
        Method: Chrome fetch tuần tự · AbortController 12–15s
      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <!-- date picker v2 -->
  <div class="pk-card">
    <div class="pk-title"><span class="bar"></span><span class="t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span></div>
    <p class="pk-sub t" data-vi="Chọn <b>một ngày</b> rồi bấm <b>Cập nhật</b> để mở đúng bản báo cáo đã lưu của ngày đó. Chọn <b>một khoảng ngày</b> để xem xu hướng trong khoảng. Ngày <b>có dấu chấm</b> là ngày đã quét và có báo cáo lưu; ngày làm mờ vẫn chọn được làm đầu/cuối khoảng, nhưng không có báo cáo riêng để mở." data-en="Pick <b>a single day</b> and press <b>Update</b> to open that day's saved report. Pick <b>a date range</b> to see the trend across it. Days <b>with a dot</b> were crawled and have a stored report; faded days can still anchor a range but have no report of their own."></p>
    <div class="pk-bar">
      <div class="dpwrap">
        <button class="dpbtn" id="dpBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>&#128197;</span><span id="dpLabel">Ngày 11/08/2026</span><span class="car">&#9660;</span>
        </button>
        <div class="dppane" id="dpPane" role="dialog">
          <div class="dp-presets" id="dpPresets"></div>
          <div class="dp-right">
            <div class="dp-nav">
              <button type="button" id="dpPrev" aria-label="prev">&#8249;</button>
              <div class="mtitle"><span id="dpM1"></span><span id="dpM2"></span></div>
              <button type="button" id="dpNext" aria-label="next">&#8250;</button>
            </div>
            <div class="dp-months"><div class="dp-m" id="dpG1"></div><div class="dp-m" id="dpG2"></div></div>
            <div class="dp-foot">
              <div class="dp-selinfo"><div class="d1" id="dpSelD"></div><div class="d2" id="dpSelInfo"></div></div>
              <div class="dp-actions">
                <button type="button" id="dpCancel" class="t" data-vi="Hủy" data-en="Cancel"></button>
                <button type="button" id="dpApply" class="go t" data-vi="Cập nhật" data-en="Update"></button>
              </div>
            </div>
            <div class="dp-legend"><span class="dotlg"></span><span class="t" data-vi="Dấu chấm = ngày đã có dữ liệu lưu. Ngày làm mờ = chưa quét: dùng được làm đầu/cuối khoảng, nhưng không mở được báo cáo riêng." data-en="Dot = a day with stored data. Faded day = not crawled: usable as a range endpoint, but it has no report of its own to open."></span></div>
          </div>
        </div>
      </div>
      <span class="pk-now" id="dpNow"></span>
    </div>
    <div class="pk-quick" id="dpQuick"></div>
    <div class="pk-trend" id="dpTrend"></div>
  </div>

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi">
      <div class="lbl t" data-vi="Health Score" data-en="Health Score"></div>
      <div class="score-ring">
        <div class="val" style="color:var(--accent-dk)">89<span style="font-size:15px;color:var(--muted)">/100</span></div>
      </div>
      <div class="note"><span class="tag green t" data-vi="Cao nhất của chuỗi audit — nhưng toàn bộ mức tăng đến từ tốc độ, không từ bản sửa nào" data-en="Highest of the audit series — but the entire gain comes from speed, not from any fix"></span></div>
      <div class="delta up t" data-vi="&#9650; 88 &#8594; <b>89</b> so 10/08 · điểm thô 88,3 &#8594; <b>88,8</b>. Chỉ <b>một</b> điểm thành phần thay đổi: Performance 94 &#8594; <b>96</b>. Crawlability (<b>96</b>), Structured Data (<b>87</b>), On-page (<b>76</b>) và Content (<b>80</b>) <b>đứng yên tuyệt đối sang ngày thứ tư</b> — hai lỗi tồn đọng lớn nhất vẫn chưa được chạm tới" data-en="&#9650; 88 &#8594; <b>89</b> vs 10 Aug · raw score 88.3 &#8594; <b>88.8</b>. Exactly <b>one</b> sub-score moved: Performance 94 &#8594; <b>96</b>. Crawlability (<b>96</b>), Structured Data (<b>87</b>), On-page (<b>76</b>) and Content (<b>80</b>) are <b>completely static for a fourth day</b> — the two largest outstanding defects remain untouched"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Trang crawl được" data-en="Pages crawled"></div>
      <div class="val" style="color:var(--green)">78</div>
      <div class="note t" data-vi="17 gốc + 55 bài + 6 dự án · 78/78 trả 200" data-en="17 core + 55 articles + 6 projects · 78/78 return 200"></div>
      <div class="delta up t" data-vi="&#9650; +1 so 10/08 (77) · bài mới <code>/articles/bathroom-remodel-cost-australia</code> · sitemap 76 &#8594; <b>77 URL</b> · 0 timeout và 0 lỗi 4xx/5xx sang <b>ngày thứ bảy liên tiếp</b> · hai ngày liền có bài mới, nhịp xuất bản đã chạy trở lại" data-en="&#9650; +1 vs 10 Aug (77) · the new <code>/articles/bathroom-remodel-cost-australia</code> · sitemap 76 &#8594; <b>77 URLs</b> · 0 timeouts and 0 4xx/5xx errors for a <b>seventh consecutive day</b> · two new articles on two consecutive days, so the publishing cadence has restarted"></div>
    </div>
    <div class="kpi">

etter of two sequential passes</b> for every URL; read the band trend (under-1s share, slowest page) rather than a few tens of milliseconds on any single page. Also worth noting: today&#39;s first parallel pass reported TTFB 6–8&#215; higher (averaging about 4.5s) purely because 8 concurrent requests contend for bandwidth — <b>every figure in this report comes from sequential passes</b>, which is precisely why sequential measurement is required."></div>

  <h2 class="sec t" data-vi="Hướng đi &amp; Insight ưu tiên" data-en="Direction &amp; Priority insights"></h2>

  <div class="ins win">
    <div class="prio t" data-vi="✓ ĐIỂM SÁNG HÔM NAY · tốc độ đạt mốc mới + bài mới thứ hai" data-en="✓ TODAY&#39;S BRIGHT SPOT · a new speed milestone and a second new article"></div>
    <h4 class="t" data-vi="Lần đầu tiên toàn bộ 55 bài viết đều dưới 1s, và nhịp xuất bản đã chạy lại hai ngày liền" data-en="For the first time all 55 articles come in under 1s, and publishing has run two days straight"></h4>
    <p class="t" data-vi="<b>Thứ nhất — tốc độ đạt mốc mới.</b> Đây là lần đầu tiên trong chuỗi audit <b>không còn bài viết nào trên 1s</b>: cả 55 bài nằm trong dải <b>0,50–0,79s</b>, bài chậm nhất là <code>interior-finishes</code> ở 0,79s so với 1,16s hôm 10/08. Nhóm dưới 1s toàn site nới rộng <b>72/77 &#8594; 76/78</b> (97,4%) và chỉ còn <b>hai</b> trang trên 1s, cả hai đều là trang gốc: <code>/prestige</code> 1,13s và <code>/</code> 1,03s. Đáng chú ý, hai trang từng chậm nhất đều đảo chiều mạnh: <code>/articles</code> <b>1,43s &#8594; 0,89s</b> và <code>/studio</code> <b>1,35s &#8594; 0,97s</b> — <code>/studio</code> chính là trang duy nhất xấu đi hôm 10/08, nay đã hồi lại. Ba ngày liên tiếp cải thiện đồng bộ trên nhiều nhóm trang khác nhau là dấu hiệu của một thay đổi thật ở tầng phục vụ hoặc cache, không phải nhiễu mạng. <b>Thứ hai — bài mới thứ hai trong hai ngày.</b> <code>/articles/bathroom-remodel-cost-australia</code> ra đời <b>đúng chuẩn ngay từ đầu</b>: <b>3.353 từ</b> (bài dài nhất site), đủ <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> + <code>FAQPage</code>, 22 internal link, TTFB <b>0,58s</b>, có trong sitemap và <b>đã tự động xuất hiện trong HTML thô của listing <code>/articles</code></b> (55/55 link) mà không cần thao tác tay. Hai bài liên tiếp cùng đạt chuẩn xác nhận template và bản sửa listing hôm 07/08 <b>đã ổn định</b>." data-en="<b>First, a new speed milestone.</b> This is the first time in the audit series that <b>no article sits above 1s</b>: all 55 fall within <b>0.50–0.79s</b>, the slowest being <code>interior-finishes</code> at 0.79s against 1.16s on 10 Aug. The site-wide under-1s band widened <b>72 of 77 &#8594; 76 of 78</b> (97.4%) and only <b>two</b> pages remain above 1s, both core: <code>/prestige</code> at 1.13s and <code>/</code> at 1.03s. Notably the two formerly slowest pages both reversed sharply: <code>/articles</code> <b>1.43s &#8594; 0.89s</b> and <code>/studio</code> <b>1.35s &#8594; 0.97s</b> — <code>/studio</code> was the one page that regressed on 10 Aug and has now recovered. Three consecutive days of synchronised improvement across different page groups points to a genuine serving-layer or cache change rather than network noise. <b>Second, a second new article in two days.</b> <code>/articles/bathroom-remodel-cost-australia</code> shipped <b>correct from the outset</b>: <b>3,353 words</b> (the longest on the site), a full <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> + <code>FAQPage</code> set, 22 internal links, <b>0.58s</b> TTFB, present in the sitemap and <b>already visible in the raw HTML of the <code>/articles</code> listing</b> (55 of 55 links) with no manual step. Two consecutive on-standard articles confirm the template and the 07 Aug listing fix are <b>settled</b>."></p>
    <p class="fix t" data-vi="<b>Việc cần làm tiếp:</b> nếu tốc độ tốt lên là do một thay đổi cache/CDN có chủ đích trong ba ngày qua, hãy <b>ghi lại cấu hình đó ngay</b> — hiện Performance là điểm thành phần duy nhất còn tăng, và mất cấu hình này sẽ kéo Health xuống lại. Đồng thời, hai bài mới đã chứng minh template FAQ hoạt động: hãy áp ngược quy trình đó cho <b>13 bài cũ còn thiếu <code>FAQPage</code></b>." data-en="<b>Do next:</b> if the speed gain came from a deliberate cache or CDN change over the past three days, <b>record that configuration now</b> — Performance is currently the only sub-score still moving, and losing the configuration would pull Health back down. Meanwhile the two new articles prove the FAQ template works: run that process backwards over the <b>13 older articles still missing <code>FAQPage</code></b>."></p>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 · Còn tồn · sang ngày thứ 9 chưa sửa" data-en="P1 · Persisting · ninth day unfixed"></div>
    <h4 class="t" data-vi="Mỗi trang vẫn phát ra 14–32 khối JSON-LD y hệt nhau — 2.062 khối cho chỉ 229 payload thật" data-en="Every page still emits 14–32 byte-identical JSON-LD blocks — 2,062 blocks for only 229 real payloads"></h4>
    <p class="t" data-vi="Kiểm chứng lại bằng cách so <i>nội dung</i> khối chứ không chỉ đếm (<code>new Set(blocks).size</code>): <b>y nguyên sang ngày thứ 9</b>. Trang gốc <b>14 khối / 1 payload</b>; trang chủ <b>24 / 2</b>; <code>/articles</code> <b>22 / 1</b>; 6 trang dự án <b>14 / 1</b>; bài viết <b>32 / 4</b> (hoặc <b>31 / 3</b> ở 13 bài chưa có <code>FAQPage</code>). Cộng toàn site: <b>2.062 khối script</b> để biểu đạt <b>229 payload thật</b> — hệ số nhân bản <b>9,0&#215;</b>, không đổi một chữ số thập phân nào so 10/08. Chi tiết đáng nói hôm nay: <b>bài mới thứ hai liên tiếp cũng ra đời với 32 khối cho 4 payload</b>. Hai bài, hai ngày, cùng một lỗi kế thừa — không còn chỗ cho giả thuyết &quot;lỗi ở một trang cụ thể&quot;. Lỗi nằm ở <b>component/layout dùng chung</b>, và mỗi bài xuất bản thêm tự động mang theo khoảng 15–25 KB HTML thừa; với nhịp một bài/ngày như hai ngày qua, chi phí này cộng dồn nhanh hơn trước. Schema thật vẫn đúng chuẩn — <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> (+ <code>FAQPage</code> ở 42 bài), trang dự án là một khối <code>@graph</code> gồm <code>Organization</code> + <code>WebSite</code> + <code>WebPage</code> + <code>CreativeWork</code> + <code>BreadcrumbList</code> — chỉ đơn giản bị in ra nhiều lần." data-en="Re-verified by comparing block <i>content</i> rather than counting (<code>new Set(blocks).size</code>): <b>unchanged into a ninth day</b>. Core pages <b>14 blocks / 1 payload</b>; the homepage <b>24 / 2</b>; <code>/articles</code> <b>22 / 1</b>; the 6 project pages <b>14 / 1</b>; articles <b>32 / 4</b> (or <b>31 / 3</b> on the 13 without <code>FAQPage</code>). Site-wide that totals <b>2,062 script blocks</b> expressing <b>229 real payloads</b> — a duplication factor of <b>9.0&#215;</b>, unchanged to the decimal from 10 Aug. The detail worth stating today: <b>a second consecutive new article also arrived with 32 blocks for 4 payloads</b>. Two articles, two days, the same inherited defect — there is no room left for a &quot;one bad page&quot; hypothesis. The fault sits in a <b>shared component or layout</b>, and every further article automatically carries roughly 15–25 KB of surplus HTML; at the one-per-day cadence of the last two days that cost now accrues faster than before. The genuine schema remains correct — <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> (+ <code>FAQPage</code> on 42), and one <code>@graph</code> per project page holding <code>Organization</code> + <code>WebSite</code> + <code>WebPage</code> + <code>CreativeWork</code> + <code>BreadcrumbList</code> — merely printed repeatedly."></p>
    <p class="fix t" data-vi="<b>Cách sửa (không đổi qua 9 ngày):</b> tìm component render <code>&lt;script type=&quot;application/ld+json&quot;&gt;</code> và đảm bảo nó chỉ chạy <b>một lần ở cấp document/head</b> (dedupe theo key, hoặc hoist lên root layout rồi bỏ khỏi các layout con). Sau khi sửa, mong đợi: trang gốc còn 1–2 khối, bài viết còn 4, trang dự án còn 1, HTML giảm 15–25 KB/trang. <b>Đây vẫn là việc P1 duy nhất</b> và là thứ duy nhất đang giữ Structured Data ở 87 thay vì 95+." data-en="<b>Fix (unchanged across nine days):</b> locate the component rendering <code>&lt;script type=&quot;application/ld+json&quot;&gt;</code> and make it execute <b>once at document/head level</b> (dedupe by key, or hoist to the root layout and remove it from nested layouts). After the fix expect 1–2 blocks on core pages, 4 on articles, 1 on project pages, and 15–25 KB less HTML per page. <b>This remains the only P1</b> and the only thing holding Structured Data at 87 rather than 95+."></p>

    <h4 class="t" data-vi="Trang chủ vẫn 7/11 ảnh thiếu alt, trang dự án 15/19, và cả hai vẫn 0 ảnh lazy-load" data-en="Homepage still 7 of 11 images without alt, project pages 15 of 19, and neither uses lazy-loading"></h4>
    <p class="t" data-vi="Rendered-DOM hôm nay lại cho kết quả <b>giống hệt từng con số</b> so 10/08 và 07/08: trang chủ <b>11 ảnh, 7 thiếu <code>alt</code>, 0 ảnh <code>loading=&quot;lazy&quot;</code></b>; <code>/projects/251-station-st</code> <b>19 ảnh, 15 thiếu <code>alt</code>, 0 lazy-load</b>. Đây là khuyến nghị từ báo cáo 30/07 và nay <b>đã 12 ngày chưa deploy</b>. Toàn site (HTML thô): <b>79/607 ảnh thiếu alt</b> và chỉ <b>215/607 ảnh</b> dùng lazy-load — gần như toàn bộ phần lazy-load nằm ở template bài viết (bài mới hôm nay có 2/8 ảnh lazy-load), còn trang chủ và 6 trang dự án vẫn ở mức <b>0 tuyệt đối</b>. Trang chủ đồng thời vẫn nhảy heading <b>2&#8594;4</b>. Điểm cần nói thẳng, và nay đã là ngày thứ hai liên tiếp phải nói: đội ngũ <b>đã deploy hai ngày liền</b> (hai bài mới + thay đổi tốc độ), nên việc này bị bỏ lại <b>không phải vì thiếu cửa deploy</b> mà vì chưa được đưa vào hàng đợi. Với On-page đứng yên ở 76 suốt bốn ngày, đây là điểm thành phần duy nhất chưa từng nhúc nhích trong cả tuần." data-en="Today&#39;s rendered DOM again returns <b>identical figures</b> to 10 Aug and 07 Aug: the homepage carries <b>11 images, 7 without <code>alt</code>, 0 using <code>loading=&quot;lazy&quot;</code></b>; <code>/projects/251-station-st</code> carries <b>19 images, 15 without <code>alt</code>, 0 lazy-loaded</b>. This was recommended in the 30 Jul report and has now gone <b>twelve days without a deploy</b>. Site-wide (raw HTML): <b>79 of 607 images lack alt</b> and only <b>215 of 607</b> use lazy-loading — almost all of that from the article template (today&#39;s new article has 2 of 8 lazy-loaded), while the homepage and the 6 project pages remain at <b>absolute zero</b>. The homepage also still skips <b>2&#8594;4</b> in heading order. Worth stating plainly, for the second day running: the team <b>deployed on two consecutive days</b> (two new articles plus the speed change), so this work is outstanding <b>not for lack of a deploy window</b> but because it has not been queued. With On-page frozen at 76 for four days, it is the only sub-score that has not moved at all this week."></p>

    <h4 class="t" data-vi="Không một trang nào trên site trỏ internal link về trang chủ" data-en="No page on the site carries an internal link back to the homepage"></h4>
    <p class="t" data-vi="Kiểm tra rendered-DOM của <code>/about</code>: <b>16 internal link duy nhất, và 0 link trỏ về <code>/</code></b> — logo ở header không phải một thẻ <code>&lt;a href=&quot;/&quot;&gt;</code>. Kiểm chứng lại trong HTML thô: <code>/about</code>, <code>/faq</code> và <code>/projects/251-station-st</code> đều có <b>0</b> lần xuất hiện <code>href=&quot;/&quot;</code>. Các trang bài viết có <b>đúng một</b> link tuyệt đối <code>https://dxliving.com/</code> (nằm trong breadcrumb), nên bài viết vẫn trỏ về trang chủ; nhưng <b>17 trang gốc và 6 trang dự án thì không</b>. Hệ quả: trang chủ — trang đáng lẽ nhận nhiều internal link nhất — hầu như không nhận link equity nội bộ từ nhóm trang gốc, và người dùng ở trang dự án không có đường bấm về trang chủ. <b>Cảnh báo về cách đọc:</b> hôm nay tôi siết lại quy tắc đếm internal link để <b>loại các href tài sản</b> (4 icon <code>.svg</code> + 2 file <code>/_next/*</code>), nên cột &quot;Internal links&quot; trong bảng dưới <b>thấp hơn khoảng 6 so báo cáo 10/08 và không so sánh trực tiếp được</b> — mức giảm đó là do phương pháp, không phải site. Riêng phát hiện &quot;không có link về trang chủ&quot; thì <b>không phụ thuộc cách đếm</b>: nó được xác nhận trực tiếp trên DOM đã render. Vì chưa có số liệu ngày trước theo cùng cách đếm, <b>chưa thể kết luận đây là lỗi mới hay đã tồn tại từ lâu</b>, nên mục này chưa bị trừ điểm On-page." data-en="Checking the rendered DOM of <code>/about</code>: <b>16 unique internal links, and 0 pointing at <code>/</code></b> — the header logo is not an <code>&lt;a href=&quot;/&quot;&gt;</code>. Re-verified in raw HTML: <code>/about</code>, <code>/faq</code> and <code>/projects/251-station-st</code> each contain <b>zero</b> occurrences of <code>href=&quot;/&quot;</code>. Article pages carry <b>exactly one</b> absolute <code>https://dxliving.com/</code> link (inside the breadcrumb), so articles do point home; but <b>the 17 core pages and 6 project pages do not</b>. The consequence: the homepage — the page that should receive the most internal links — receives almost no internal link equity from the core group, and a visitor on a project page has no way to click back to the homepage. <b>A caution on reading the numbers:</b> today I tightened the internal-link counting rule to <b>exclude asset hrefs</b> (4 <code>.svg</code> icons + 2 <code>/_next/*</code> files), so the &quot;Internal links&quot; column below runs about 6 lower than the 10 Aug report and <b>is not directly comparable</b> — that drop is methodology, not the site. The &quot;no link home&quot; finding itself is <b>independent of the counting rule</b>: it was confirmed directly against the rendered DOM. Because there is no prior-day figure on the same basis, <b>it cannot yet be established whether this is new or long-standing</b>, so no On-page deduction has been taken for it."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> bọc logo header trong <code>&lt;a href=&quot;/&quot; aria-label=&quot;DX Living — trang chủ&quot;&gt;</code> và thêm <code>/</code> vào footer nav. Đây là thay đổi một dòng trong component dùng chung, và nên gộp cùng deploy alt/lazy-load ở mục trên. <b>Cần xác nhận trước:</b> hỏi đội phát triển liệu logo cố tình không trỏ link hay đây là hồi quy — nếu là hồi quy, kiểm tra xem lần rút gọn footer/nav hôm 07/08 có gỡ luôn link này không." data-en="<b>Fix:</b> wrap the header logo in <code>&lt;a href=&quot;/&quot; aria-label=&quot;DX Living — home&quot;&gt;</code> and add <code>/</code> to the footer nav. It is a one-line change in a shared component and should ride along with the alt/lazy-load deploy above. <b>Confirm first:</b> ask the development team whether the logo is deliberately unlinked or this is a regression — and if a regression, check whether the 07 Aug footer/nav trim removed this link too."></p>

ches the 78 crawled pages minus <code>/login</code> exactly. <code>/faq</code>: 1,315 words + <code>FAQPage</code> at 0.42s TTFB — faster again and still the site&#39;s strongest AEO asset. Average words per article rises to <b>2,096</b> on the back of the 3,353-word new piece."></p>

>: <b>2&#8594;4</b> on 66 pages (the homepage, the articles and most core pages); the other 10 skip <b>1&#8594;3</b> or <b>1&#8594;4</b> — including all 6 project pages, <code>/projects</code>, <code>/modules</code>, <code>/faq</code> and <code>/start-interactive</code>. Only <code>/login</code> and <code>/privacy-policy</code> are clean. <b>13 of 55 articles still lack <code>FAQPage</code></b> — <b>exactly the thirteen from 10 Aug and 07 Aug, none retrofitted</b>: <code>how-3d-coordination-reduces-design-conflicts…</code>, <code>the-best-home-builders-adelaide</code>, <code>brisbane-custom-home-builders-checklist…</code>, <code>bim-3d-4d-5d-explained</code>, <code>custom-built-homes-melbourne-checklist</code>, <code>how-to-choose-custom-home-builders-in-south-australia</code>, <code>best-practices-for-project-and-quality-management-in-2026</code>, <code>construction-program-management-software</code>, <code>program-for-construction-estimates-explained</code>, <code>what-is-bim-3d-modeling</code>, <code>project-management-and-cost-control</code>, <code>bim-3d-from-design-to-site-in-2026</code>, <code>duplex-house-design-in-australia</code> — identifiable at a glance because they emit 31 JSON-LD blocks rather than 32. Coverage nudged from 75.9% to 76.4%, but only because of the new article, not because any older one was fixed. <b>11 pages sit under 300 words</b>: <code>/login</code> (17), <code>/start-interactive</code> (45), the 6 project pages (161–178), <code>/projects</code> (173), <code>/contact</code> (187) and <code>/modules</code> (192) — <b>not a single word changed</b> from 10 Aug. <code>/login</code> is correctly outside the sitemap but <code>/start-interactive</code> is still in it, and those two remain the only pages without schema. No <code>hreflang</code> in use — reasonable for an AU-only market."></p>

    <p class="t" data-vi="<b>Thay đổi so 10/08:</b> thứ tự #1 và #2 giữ nguyên, nhưng thêm một hạng mục mới ở #3 (link về trang chủ) và nó <b>nên được gộp vào cùng deploy với #1</b> vì cả hai đều sửa trong component dùng chung. <b>1.</b> Deploy 7 <code>alt</code> trang chủ + 15 <code>alt</code> trang dự án + bật <code>loading=&quot;lazy&quot;</code> — <b>đã trễ 12 ngày</b>, ~30 phút, đưa On-page 76 &#8594; ~85 và Health lên ~90,2. <b>Đây là con đường duy nhất còn lại để vượt mốc 90.</b> <b>2.</b> Sửa lỗi nhân bản JSON-LD — <b>việc P1 duy nhất</b>, sang ngày thứ 9, ảnh hưởng cả 76 trang có schema, và hai bài mới hai ngày liền đều kế thừa lỗi ngay khi ra đời. Sửa xong dự kiến đưa Structured Data 87 &#8594; 95+ và giảm 15–25 KB HTML mỗi trang. <b>3.</b> Bọc logo header thành <code>&lt;a href=&quot;/&quot;&gt;</code> và thêm <code>/</code> vào footer nav — hiện <b>không trang gốc hay trang dự án nào trỏ link về trang chủ</b>; xác nhận với đội phát triển đây là chủ đích hay hồi quy. <b>4.</b> Thêm <code>FAQPage</code> cho 13 bài còn thiếu — nhận diện nhanh bằng cột JSON-LD = 31 trong bảng dưới. <b>5.</b> Đẩy 6 trang dự án lên 250–400 từ và thêm <code>ImageObject</code> cho ảnh gallery. <b>6.</b> Chuẩn hóa heading tuần tự (bỏ nhảy 2&#8594;4 và 1&#8594;3). <b>7.</b> Phân trang <code>/articles</code> 12–16 bài/trang — hiện đã <b>55 bài</b> và tăng một bài mỗi ngày trong hai ngày qua, nên mốc 70–80 sẽ đến nhanh hơn dự kiến. <b>8.</b> noindex <code>/login</code> &amp; <code>/start-interactive</code>, gỡ <code>/start-interactive</code> khỏi sitemap. <b>9. Theo dõi:</b> ghi lại cấu hình cache/CDN đã tạo ra ba ngày cải thiện tốc độ liên tiếp, và kiểm tra trong GSC xem hai bài mới (<code>kitchen-renovation-cost-melbourne</code>, <code>bathroom-remodel-cost-australia</code>) đã được index chưa." data-en="<b>Change vs 10 Aug:</b> the #1 and #2 order stands, but a new item enters at #3 (the link home) and it <b>should ride the same deploy as #1</b> since both are edits to a shared component. <b>1.</b> Ship 7 homepage <code>alt</code>s + 15 project-page <code>alt</code>s + <code>loading=&quot;lazy&quot;</code> — <b>twelve days late</b>, ~30 minutes, taking On-page 76 &#8594; ~85 and Health to ~90.2. <b>This is the only remaining route past 90.</b> <b>2.</b> Fix the JSON-LD duplication — <b>the only P1</b>, now on day nine, affecting all 76 schema-bearing pages, with two new articles on two consecutive days each inheriting the defect on arrival. Fixing it should take Structured Data 87 &#8594; 95+ and cut 15–25 KB of HTML per page. <b>3.</b> Wrap the header logo in <code>&lt;a href=&quot;/&quot;&gt;</code> and add <code>/</code> to the footer nav — <b>no core or project page currently links back to the homepage</b>; confirm with the development team whether that is deliberate or a regression. <b>4.</b> Add <code>FAQPage</code> to the 13 articles missing it — spot them instantly via the JSON-LD = 31 column in the table below. <b>5.</b> Bring the 6 project pages to 250–400 words and add <code>ImageObject</code> for gallery images. <b>6.</b> Normalise heading order (remove the 2&#8594;4 and 1&#8594;3 skips). <b>7.</b> Paginate <code>/articles</code> at 12–16 per page — it is at <b>55</b> and has grown by one on each of the last two days, so the 70–80 threshold will arrive sooner than planned. <b>8.</b> noindex <code>/login</code> &amp; <code>/start-interactive</code>, drop <code>/start-interactive</code> from the sitemap. <b>9. Watch:</b> record the cache/CDN configuration behind three consecutive days of speed gains, and check in GSC whether the two new articles (<code>kitchen-renovation-cost-melbourne</code>, <code>bathroom-remodel-cost-australia</code>) have been indexed."></p>

let LANG = 'vi';

function applyLang(){
  document.querySelectorAll('.t').forEach(e=>{

function setLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('btnVI').classList.toggle('active', l==='vi');
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  applyLang();
  render();

}

function renderRt(){
  const loaded = [...PAGES].sort((a,b)=>b.rt-a.rt);
  const max = 1130;
  const col = ms => ms<1000?'var(--green)':ms<3000?'var(--accent)':ms<6000?'var(--amber)':'var(--red)';
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let h='';
  loaded.forEach(p=>{
    const w=Math.max(2,(p.rt/max*100)).toFixed(1);
    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

const tbody=document.querySelector('#pt tbody');
let sortK='rt', sortDir=1, filt='all';
function render(){
  renderRt();
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let rows=[...PAGES];
  if(filt!=='all')rows=rows.filter(p=>p.grp===filt);
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}
    return sortDir*(x-y);
  });
  tbody.innerHTML=rows.map(p=>{
    const st='<span class="badge b200">200</span>';
    const sc=p.schema>0?`<span class="yes">${p.schema}</span>`:'<span class="no">0</span>';
    const sm=p.sm?'<span class="yes">✓</span>':'<span class="no">✗</span>';

      <td class="num">${st}</td>

      <td class="num">${sc}</td>
      <td class="num">${p.links}</td>
      <td>${sm}</td></tr>`;
  }).join('');
}

function pkISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pkD(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }

function pkIn(iso,a,b){ return iso>=a && iso<=b; }

    {k:'28',  vi:'28 ngày qua',en:'Last 28 days', s:pkAdd(T,-27),e:T},
    {k:'90',  vi:'90 ngày qua',en:'Last 90 days', s:pkAdd(T,-89),e:T},
    {k:'tw',  vi:'Tuần này',  en:'This week',   s:monStart, e:T},
    {k:'tm',  vi:'Tháng này', en:'This month',  s:mStart, e:T},
    {k:'ty',  vi:'Năm nay',   en:'This year',   s:`${d.getFullYear()}-01-01`, e:T},
    {k:'lw',  vi:'Tuần trước',en:'Last week',   s:lastMonStart, e:lastMonEnd},
    {k:'lm',  vi:'Tháng trước',en:'Last month', s:pmStart, e:pmEnd},
    {k:'all', vi:'Toàn bộ dữ liệu đã lưu', en:'All stored data', s:first, e:T}
  ];
}

function pkRenderPresets(){
  const box=document.getElementById('dpPresets'); if(!box) return;
  box.innerHTML = pkPresets().map(p=>{
    const n=pkCount(p.s,p.e), off=n===0;
    const on=PK_PRESET===p.k;
    return `<button type="button" class="dp-preset${on?' on':''}" data-k="${p.k}" ${off?'disabled':''}>
      <span class="rd"></span><span class="nm">${LANG==='vi'?p.vi:p.en}</span><span class="ct">${n}</span></button>`;
  }).join('');
  box.querySelectorAll('.dp-preset').forEach(b=>b.addEventListener('click',()=>{
    const p=pkPresets().find(x=>x.k===b.dataset.k);
    PK_PRESET=p.k; PK_DRAFT={s:p.s,e:p.e}; PK_PENDING=false;
    PK_VIEW=pkD(p.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1);
    pkRenderCal(); pkRenderPresets();
  }));
}

function pkMonth(base,off){
  const d=new Date(base.getFullYear(), base.getMonth()+off, 1);
  const y=d.getFullYear(), m=d.getMonth();
  const start=new Date(y,m,1).getDay(); // 0=Sun
  const days=new Date(y,m+1,0).getDate();
  let cells=pkL().dow.map(x=>`<div class="dp-dow">${x}</div>`).join('');
  for(let i=0;i<start;i++) cells+='<button class="dp-d blank" disabled></button>';
  for(let dd=1;dd<=days;dd++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const has=!!PK_MAP[iso];
    const sel=iso===PK_DRAFT.s||iso===PK_DRAFT.e;
    const inr=pkIn(iso,PK_DRAFT.s,PK_DRAFT.e)&&!sel;
    const edge=iso===PK_DRAFT.s&&PK_DRAFT.s!==PK_DRAFT.e?' edge-l':(iso===PK_DRAFT.e&&PK_DRAFT.s!==PK_DRAFT.e?' edge-r':'');
    cells+=`<button type="button" class="dp-d${has?' has':''}${inr?' inrange':''}${sel?' sel'+edge:''}" data-iso="${iso}">${dd}${has?'<span class="dot"></span>':''}</button>`;
  }
  return {title:`${pkL().months[m]} ${y}`, html:`<div class="dp-grid">${cells}</div>`};
}

function pkRenderCal(){
  if(!PK_VIEW){ PK_VIEW=pkD(PK_SEL.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1); }
  const a=pkMonth(PK_VIEW,0), b=pkMonth(PK_VIEW,1);
  document.getElementById('dpM1').textContent=a.title;
  document.getElementById('dpM2').textContent=b.title;
  document.getElementById('dpG1').innerHTML=a.html;
  document.getElementById('dpG2').innerHTML=b.html;
  document.querySelectorAll('#dpG1 .dp-d,#dpG2 .dp-d').forEach(el=>{
    if(el.classList.contains('blank')) return;
    el.addEventListener('click',()=>{
      const iso=el.dataset.iso;
      if(!PK_PENDING){ PK_DRAFT={s:iso,e:iso}; PK_PENDING=true; }
      else { PK_DRAFT = iso<PK_DRAFT.s ? {s:iso,e:PK_DRAFT.s} : {s:PK_DRAFT.s,e:iso}; PK_PENDING=false; }
      PK_PRESET=null; pkRenderCal(); pkRenderPresets();
    });
  });
  const single=PK_DRAFT.s===PK_DRAFT.e;
  document.getElementById('dpSelD').textContent = single?pkFmt(PK_DRAFT.s):`${pkFmt(PK_DRAFT.s)} → ${pkFmt(PK_DRAFT.e)}`;
  const n=pkCount(PK_DRAFT.s,PK_DRAFT.e);
  document.getElementById('dpSelInfo').textContent = n===0 ? pkL().noRep : pkL().saved(n);
}

function pkRenderQuick(){
  const box=document.getElementById('dpQuick'); if(!box) return;
  const chips=PK_SNAPS.slice().reverse().map(s=>{
    const cur=s.date===PK_SEL.s&&PK_SEL.s===PK_SEL.e;
    const lb=LANG==='vi'?(s.label_vi||''):(s.label_en||'');
    return `<button type="button" class="qchip${cur?' cur':''}" data-iso="${s.date}">
      <span class="qd">${pkFmt(s.date)}</span><span class="ql">${lb}</span></button>`;
  }).join('');
  box.innerHTML=`<span class="pk-quick-lbl">${pkL().quick}</span>`+chips;
  box.querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('cur')) return;
    pkGo(b.dataset.iso,b.dataset.iso);
  }));
}

function pkRenderNow(){
  const el=document.getElementById('dpNow'); if(!el) return;
  const single=PK_SEL.s===PK_SEL.e;
  el.textContent = !single ? pkL().trend(pkFmt(PK_SEL.s),pkFmt(PK_SEL.e))
    : (PK_SEL.s===PK_TODAY ? pkL().now(pkFmt(PK_SEL.s)) : pkL().viewing(pkFmt(PK_SEL.s)));
  document.getElementById('dpLabel').textContent = single
    ? `${pkL().day} ${pkFmt(PK_SEL.s)}` : `${pkL().range} ${pkFmt(PK_SEL.s)} → ${pkFmt(PK_SEL.e)}`;
}

function pkGo(s,e){
  if(s===e){
    const snap=PK_MAP[s];
    if(snap && s!==PK_TODAY){ location.href=PK_BASE+snap.report; return; }
    PK_SEL={s,e}; PK_DRAFT={s,e}; PK_PRESET=null;
    document.getElementById('dpTrend').classList.remove('on');
    pkRenderNow(); pkRenderQuick(); pkRenderCal();
    return;
  }
  PK_SEL={s,e}; pkRenderNow(); pkRenderQuick(); pkTrend(s,e);
}

function pkTrend(s,e){
  const box=document.getElementById('dpTrend');
  const days=PK_SNAPS.filter(x=>pkIn(x.date,s,e));
  if(!days.length){ box.classList.remove('on'); box.innerHTML=''; return; }
  Promise.all(days.map(d=>fetch(PK_BASE+d.data,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)))
   .then(js=>{
     const rows=js.map((j,i)=>({date:days[i].date, rep:days[i].report, hs:j&&j.health_score, pg:j&&j.pages_measured}))
                  .filter(r=>r.hs!=null);
     box.innerHTML=`<h4>${pkL().trendTitle(pkFmt(s),pkFmt(e))}</h4>`+rows.map(r=>`
       <div class="trd"><span class="tdate">${pkFmt(r.date)}</span>
         <span class="ttrack"><span class="tfill" style="width:${r.hs}%"></span></span>
         <span class="tval">${r.hs}</span>
         <span class="tlink" data-h="${r.rep}">${pkL().open} &#8594;</span></div>`).join('');
     box.classList.add('on');
     box.querySelectorAll('.tlink').forEach(a=>a.addEventListener('click',()=>{
       const h=a.dataset.h; if(h && h!=='index.html') location.href=PK_BASE+h;
     }));
   });
}

function pkRender(){ pkRenderPresets(); pkRenderCal(); pkRenderQuick(); pkRenderNow(); }

(function pkInit(){
  const btn=document.getElementById('dpBtn'), pane=document.getElementById('dpPane');
  if(!btn) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=pane.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
    if(open){ PK_DRAFT={...PK_SEL}; PK_PENDING=false; pkRenderCal(); pkRenderPresets(); }
  });
  document.addEventListener('click',e=>{
    if(!pane.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') pane.classList.remove('open'); });
  document.getElementById('dpPrev').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()-1); pkRenderCal(); });
  document.getElementById('dpNext').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()+1); pkRenderCal(); });
  document.getElementById('dpCancel').addEventListener('click',()=>{
    PK_DRAFT={...PK_SEL}; PK_PENDING=false; PK_PRESET=null;
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false'); pkRenderCal();
  });
  document.getElementById('dpApply').addEventListener('click',()=>{
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    pkGo(PK_DRAFT.s,PK_DRAFT.e);
  });
  fetch(PK_BASE+'data/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    PK_SNAPS=(j.snapshots||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s);
    pkRender();
  }).catch(()=>{
    PK_SNAPS=[{date:PK_TODAY,report:'index.html',data:'data/'+PK_TODAY+'.json',label_vi:'Bản hiện tại',label_en:'Current report'}];
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s); pkRender();
  });
})();

setLang('vi');
</script>
