<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 16 trang gốc + 20 bài /articles mẫu + sitemap" data-en="Source: Chrome live crawl · 16 core pages + 20 sampled /articles + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>28/07/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>28 Jul 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>36 trang</b> · Sitemap: <b>67 URL</b>" data-en="Directly measured: <b>36 pages</b> · Sitemap: <b>67 URLs</b>"></span><br>
        Method: Chrome fetch · AbortController 9–12s
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi">
      <div class="lbl t" data-vi="Health Score" data-en="Health Score"></div>
      <div class="score-ring">
        <div class="val" style="color:var(--green)">82<span style="font-size:15px;color:var(--muted)">/100</span></div>
      </div>
      <div class="note"><span class="tag green t" data-vi="Tốt — ổn định" data-en="Good — stable"></span></div>
      <div class="delta flat t" data-vi="= giữ nguyên 82 so hôm qua (27/07) · chưa có deploy mới" data-en="= flat at 82 vs yesterday (27 Jul) · no new deploy"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Sitemap URL" data-en="Sitemap URLs"></div>
      <div class="val" style="color:var(--green)">67</div>
      <div class="note t" data-vi="16 gốc + 45 bài + 6 dự án" data-en="16 core + 45 articles + 6 projects"></div>
      <div class="delta flat t" data-vi="= không đổi · 45 bài /articles vẫn đủ trong sitemap" data-en="= unchanged · all 45 /articles still in sitemap"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="TTFB TB — trang gốc" data-en="Avg TTFB — core"></div>
      <div class="val" style="color:var(--green)">0,9<span style="font-size:15px">s</span></div>
      <div class="note t" data-vi="15/16 trang gốc &lt;1,3s · trang chủ 2,2s (biến động mạng)" data-en="15/16 core pages &lt;1.3s · homepage 2.2s (network jitter)"></div>
      <div class="delta up t" data-vi="▲ nhanh hơn nhẹ · 25/36 trang &lt;1s (cache ấm)" data-en="▲ marginally faster · 25/36 pages &lt;1s (warm cache)"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="TTFB TB — bài viết" data-en="Avg TTFB — articles"></div>
      <div class="val" style="color:var(--green)">1,0<span style="font-size:15px">s</span></div>
      <div class="note t" data-vi="20 bài mẫu · 0,71–1,31s · SSG/cache ổn định" data-en="20 samples · 0.71–1.31s · SSG/cache stable"></div>
      <div class="delta up t" data-vi="▲ ~0,9s · 34 schema + 1 H1 mỗi bài, không timeout" data-en="▲ ~0.9s · 34 schema + 1 H1 each, no timeouts"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Schema (JSON-LD)" data-en="Schema (JSON-LD)"></div>
      <div class="val" style="color:var(--amber)">Home ✓</div>
      <div class="note t" data-vi="Trang chủ 24 · Bài 32–34 · Trang dịch vụ vẫn 0" data-en="Home 24 · Articles 32–34 · Service pages still 0"></div>
      <div class="delta flat t" data-vi="= không đổi · trang chủ 24, còn 12 trang gốc trống" data-en="= unchanged · homepage 24, 12 core pages still bare"></div>
    </div>
  </div>

  <!-- Charts -->
  <h2 class="sec t" data-vi="Điểm sức khỏe theo hạng mục &amp; phân bố tốc độ" data-en="Health sub-scores &amp; speed distribution"></h2>
  <div class="grid2">
    <div class="card">
      <h3 class="t" data-vi="5 điểm thành phần (/100)" data-en="5 sub-scores (/100)"></h3>
      <div class="bar-row"><span class="name t" data-vi="Crawlability" data-en="Crawlability"></span><div class="bar-track"><div class="bar-fill" style="width:88%;background:var(--green)">88</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Performance / TTFB" data-en="Performance / TTFB"></span><div class="bar-track"><div class="bar-fill" style="width:88%;background:var(--green)">88</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Structured Data / AEO" data-en="Structured Data / AEO"></span><div class="bar-track"><div class="bar-fill" style="width:72%;background:var(--blue)">72</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="On-page / Meta" data-en="On-page / Meta"></span><div class="bar-track"><div class="bar-fill" style="width:78%;background:var(--blue)">78</div></div></div>
      <div class="bar-row"><span class="name t" data-vi="Content" data-en="Content"></span><div class="bar-track"><div class="bar-fill" style="width:78%;background:var(--blue)">78</div></div></div>
      <div class="foot t" data-vi="Health tổng <b>82/100</b> (= giữ nguyên so hôm qua 27/07). 5 điểm thành phần đứng yên: Crawlability 88, Performance 88 (bài viết ~0,9s, hôm nay còn nhanh hơn nhẹ), Structured Data 72 (trang chủ 24 JSON-LD nhưng 12 trang dịch vụ vẫn 0), On-page 78, Content 78. Điểm sẽ chỉ nhích khi có deploy mới cho schema trang dịch vụ / alt ảnh. Trọng số: Crawl 25% · Perf 25% · Schema 20% · On-page 15% · Content 15%." data-en="Overall health <b>82/100</b> (= flat vs yesterday 27 Jul). All five sub-scores hold: Crawlability 88, Performance 88 (articles ~0.9s, marginally faster today), Structured Data 72 (homepage 24 JSON-LD but 12 service pages still 0), On-page 78, Content 78. The score will only move once a new deploy lands for service-page schema / image alt. Weights: Crawl 25% · Perf 25% · Schema 20% · On-page 15% · Content 15%."></div>
    </div>
    <div class="card">
      <h3 class="t" data-vi="Phân bố tốc độ (36 trang đo trực tiếp)" data-en="Speed distribution (36 pages measured)"></h3>
      <div class="donut-wrap">
        <svg width="150" height="150" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--cream2)" stroke-width="6"></circle>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--green)" stroke-width="6"
            stroke-dasharray="69.4 30.6" stroke-dashoffset="25"></circle>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--amber)" stroke-width="6"
            stroke-dasharray="30.6 69.4" stroke-dashoffset="-44.4"></circle>
          <text x="21" y="20" text-anchor="middle" font-size="7" font-weight="700" fill="#2c2620">36</text>
          <text x="21" y="26.5" text-anchor="middle" font-size="3.2" fill="#6f665a" class="tsvg" data-vi="trang" data-en="pages">trang</text>
        </svg>
        <div class="legend">
          <div><span class="dot" style="background:var(--green)"></span> <span class="t" data-vi="Nhanh &lt;1s: <b>25</b> · 69,4%" data-en="Fast &lt;1s: <b>25</b> · 69.4%"></span></div>
          <div><span class="dot" style="background:var(--amber)"></span> <span class="t" data-vi="1–3s: <b>11</b> · 30,6%" data-en="1–3s: <b>11</b> · 30.6%"></span></div>
          <div><span class="dot" style="background:var(--red)"></span> <span class="t" data-vi="Chậm &gt;3s: <b>0</b> · 0%" data-en="Slow &gt;3s: <b>0</b> · 0%"></span></div>
          <div class="foot t" style="margin-top:10px" data-vi="<b>Không trang nào &gt;3s.</b> Hôm nay tốc độ khá hơn: <b>25/36 trang &lt;1s</b> (hôm qua 19) khi cache CDN đã ấm. Cả 20 bài /articles ở 0,71–1,31s. Chậm nhất lần này: trang chủ 2,2s — biến động mạng, không phải regression. Nhóm &lt;1s gồm trang dịch vụ, pháp lý, tiện ích và phần lớn bài viết." data-en="<b>No page exceeds 3s.</b> Speeds are better today: <b>25/36 pages &lt;1s</b> (19 yesterday) as the CDN cache warms. All 20 /articles sit at 0.71–1.31s. Slowest this scan: homepage 2.2s — network jitter, not a regression. The &lt;1s group covers service, legal, utility pages and most articles."></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Insights -->
  <h2 class="sec t" data-vi="Hướng đi &amp; Insight ưu tiên" data-en="Direction &amp; Priority insights"></h2>

  <div class="ins win">
    <div class="prio t" data-vi="✓ AUDIT HÔM NAY (28/07) — ổn định" data-en="✓ TODAY'S AUDIT (28 Jul) — stable"></div>
    <h4 class="t" data-vi="Giữ vững thành quả: Health 82, bài viết ~0,9s, hôm nay còn nhanh hơn nhẹ" data-en="Holding the gains: Health 82, articles ~0.9s, marginally faster today"></h4>
    <p class="t" data-vi="Crawl hôm nay (28/07) <b>khớp với hôm qua</b> ở mọi tín hiệu cấu trúc và <b>nhanh hơn một chút</b>: 20 bài <code>/articles/*</code> có TTFB <b>0,71–1,31s</b> (TB 0,9s), <b>34 JSON-LD</b>/bài, đúng <b>1 H1</b>; <b>25/36 trang giờ &lt;1s</b> (hôm qua 19/36) — cache đang ấm. Trang chủ vẫn <b>24 JSON-LD</b> và H1 giàu từ khóa; sitemap 67 URL; 36/36 trang trả 200. Không phát hiện regression." data-en="Today's crawl (28 Jul) <b>matches yesterday</b> on every structural signal and is <b>a touch faster</b>: the 20 <code>/articles/*</code> posts show TTFB <b>0.71–1.31s</b> (avg 0.9s), <b>34 JSON-LD</b> each, a clean <b>single H1</b>; <b>25/36 pages are now &lt;1s</b> (19/36 yesterday) — the cache is warm. The homepage still carries <b>24 JSON-LD</b> and a keyword-rich H1; sitemap 67 URLs; 36/36 pages return 200. No regressions."></p>
    <p class="fix t" data-vi="<b>Việc tiếp theo (không đổi):</b> điểm sẽ chỉ nhích tiếp khi deploy schema (Service/LocalBusiness/Breadcrumb) cho 12 trang dịch vụ và thêm alt cho 7 ảnh hero trang chủ. Sau khi deploy + purge cache, báo mình quét lại để xác nhận điểm tăng." data-en="<b>Next (unchanged):</b> the score will only rise further once schema (Service/LocalBusiness/Breadcrumb) is deployed to the 12 service pages and alt is added to the 7 homepage hero images. After deploy + cache purge, tell me and I'll re-scan to confirm the lift."></p>
  </div>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 · Ưu tiên cao · CÒN LẠI" data-en="P1 · High priority · REMAINING"></div>
    <h4 class="t" data-vi="12 trang dịch vụ/pháp lý vẫn 0 JSON-LD — thiếu Service / LocalBusiness / Breadcrumb" data-en="12 service/legal pages still 0 JSON-LD — missing Service / LocalBusiness / Breadcrumb"></h4>
    <p class="t" data-vi="Trang chủ và bài viết giờ giàu schema, nhưng <b>12 trang gốc còn lại vẫn trống hoàn toàn</b>: <code>/about</code>, <code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code>, <code>/modules</code>, <code>/projects</code>, <code>/suppliers</code>, <code>/apply</code>, <code>/contact</code> và 2 trang pháp lý — tất cả 0 script JSON-LD. Đây là các trang thương mại ý định cao, bỏ lỡ rich result và cơ hội được AI/AEO trích dẫn." data-en="The homepage and articles are now schema-rich, but the <b>remaining 12 core pages are still completely bare</b>: <code>/about</code>, <code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code>, <code>/modules</code>, <code>/projects</code>, <code>/suppliers</code>, <code>/apply</code>, <code>/contact</code> plus the 2 legal pages — all 0 JSON-LD scripts. These are high-intent commercial pages, forfeiting rich results and AI/AEO citation odds."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> Nhân rộng schema đã dùng cho trang chủ: thêm <code>Service</code> cho từng trang dịch vụ (<code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code>, <code>/modules</code>), <code>BreadcrumbList</code> toàn site và <code>ContactPage</code>/<code>AboutPage</code> tương ứng. File <code>dxliving-jsonld-schema.md</code> đã có sẵn." data-en="<b>Fix:</b> Replicate the homepage schema pattern: add <code>Service</code> to each service page (<code>/studio</code>, <code>/prestige</code>, <code>/model</code>, <code>/interiors</code>, <code>/modules</code>), <code>BreadcrumbList</code> site-wide and matching <code>ContactPage</code>/<code>AboutPage</code>. The <code>dxliving-jsonld-schema.md</code> file is ready."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · Cảnh báo · MỚI" data-en="P2 · Warning · NEW"></div>
    <h4 class="t" data-vi="Regression nhẹ: trang chủ có 7/11 ảnh thiếu alt; hydration nặng (load 7,9s)" data-en="Minor regression: homepage 7/11 images missing alt; heavy hydration (load 7.9s)"></h4>
    <p class="t" data-vi="Rendered-DOM hôm nay: trang chủ có <b>7/11 ảnh thiếu thuộc tính alt</b> (lần trước 0) — có thể do bố cục hero/gallery mới trong đợt deploy. <code>/studio</code> thiếu 2/6, bài viết thiếu 2/11. Ngoài ra dù TTFB rất nhanh, trang chủ <b>domInteractive 2,8s và loadEvent 7,9s</b> — bundle JS/hydration còn nặng, ảnh hưởng LCP/INP thực địa." data-en="Today's rendered-DOM: the homepage has <b>7/11 images missing alt</b> (was 0 last run) — likely from a new hero/gallery layout in the deploy. <code>/studio</code> misses 2/6, articles miss 2/11. Also, despite the fast TTFB, the homepage shows <b>domInteractive 2.8s and loadEvent 7.9s</b> — the JS bundle/hydration is still heavy, which affects field LCP/INP."></p>

let LANG = 'vi';

function applyLang(){
  document.querySelectorAll('.t').forEach(e=>{
    const v = e.dataset[LANG];
    if(v!==undefined) e.innerHTML = v;
  });
  document.querySelectorAll('.tsvg').forEach(e=>{
    const v = e.dataset[LANG];
    if(v!==undefined) e.textContent = v;
  });
}

function setLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('btnVI').classList.toggle('active', l==='vi');
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  applyLang();
  render();
}

function renderRt(){
  const loaded = [...PAGES].sort((a,b)=>b.rt-a.rt);
  const max = 2172;
  const col = ms => ms<1000?'var(--green)':ms<3000?'var(--accent)':ms<6000?'var(--amber)':'var(--red)';
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let h='';
  loaded.forEach(p=>{
    const w=Math.max(2,(p.rt/max*100)).toFixed(1);
    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

const tbody=document.querySelector('#pt tbody');
let sortK='rt', sortDir=1, filt='all';
function render(){
  renderRt();
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let rows=[...PAGES];
  if(filt==='core')rows=rows.filter(p=>p.grp==='core');
  if(filt==='art')rows=rows.filter(p=>p.grp==='art');
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}
    return sortDir*(x-y);
  });
  tbody.innerHTML=rows.map(p=>{
    const st='<span class="badge b200">200</span>';
    const sc=p.schema>0?`<span class="yes">${p.schema}</span>`:'<span class="no">0</span>';
    const sm=p.sm?'<span class="yes">✓</span>':'<span class="no">✗</span>';
    const rtc=p.rt<1000?'var(--green)':p.rt<3000?'var(--accent-dk)':p.rt<6000?'var(--amber)':'var(--red)';
    return `<tr>
      <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.url}">${p.url}</td>
      <td class="num">${st}</td>
      <td class="num" style="color:${rtc};font-weight:700">${p.rt.toLocaleString(loc)}</td>
      <td class="num">${p.words}</td>
      <td class="num">${sc}</td>
      <td class="num">${p.links}</td>
      <td>${sm}</td></tr>`;
  }).join('');
}
document.querySelectorAll('#pt th').forEach(th=>{
  th.addEventListener('click',()=>{
    const k=th.dataset.k;
    if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1;}
    render();
  });
});
document.querySelectorAll('.filter-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');filt=b.dataset.f;render();
  });
});
