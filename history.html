<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="https://tram-fdx.github.io/dxl-social-dashboard-site/fdx-favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DX Living — Website Audit · Lịch sử</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--line:#e6e1d6;--ink:#22262c;--muted:#7b828c}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#2c2a26;color:#e5dcc7;padding:18px 16px}
  header a{color:#e5dcc7}
  main{max-width:960px;margin:0 auto;padding:16px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  td.muted{color:var(--muted)}
</style>
</head>
<body>
<header><b>DX Living — Website Audit</b> · Lịch sử theo ngày / Daily history · <a href="index.html">Bản mới nhất / Latest</a></header>
<main>
  <p class="muted">Mỗi dòng là một lần quét đã đóng băng. Bấm vào ngày để mở báo cáo của ngày đó. Biểu đồ xu hướng và “Tất cả thời gian” nằm ở cuối trang mới nhất.</p>
  <table><thead><tr><th>Ngày / Date</th><th>Tóm tắt / Summary</th></tr></thead><tbody id="rows"><tr><td colspan="2">…</td></tr></tbody></table>
</main>
<script>
  fetch('data/index.json', {cache: 'no-store'}).then(r => r.json()).then(j => {
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    document.getElementById('rows').innerHTML = (j.snapshots || []).slice().reverse().map(s =>
      `<tr><td><a href="${esc(s.report || ('archive/' + s.date + '.html'))}">${esc(s.date)}</a></td><td class="muted">${esc(s.label_vi || s.label_en || '')}</td></tr>`).join('');
  }).catch(() => { document.getElementById('rows').innerHTML = '<tr><td colspan="2">Không đọc được data/index.json</td></tr>'; });
</script>
</body>
</html>
