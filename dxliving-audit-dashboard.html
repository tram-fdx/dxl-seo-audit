<style>
:root{

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:22px}
.wrap{max-width:1280px;margin:0 auto}
.head{border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:20px;position:relative}
.head .ey{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:700}
.head h1{font-size:27px;font-weight:800;margin-top:4px}
.head .sub{color:var(--muted);font-size:13px;margin-top:6px}
.method{display:inline-block;background:#eef4ee;color:var(--good);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-top:8px}
.langtog{position:absolute;top:0;right:0;display:flex;border:1px solid var(--accent);border-radius:20px;overflow:hidden;font-size:12px;font-weight:700}
.langtog button{border:0;background:#fff;color:var(--accent);padding:5px 14px;cursor:pointer}
.langtog button.on{background:var(--accent);color:#fff}
.grid{display:grid;gap:15px}
.kpis{grid-template-columns:repeat(6,1fr);margin-bottom:18px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.kpi .lab{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-size:26px;font-weight:800;margin-top:3px;line-height:1.1}
.kpi .note{font-size:11.5px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff}
.b-warn{background:var(--warn)}
.diag{background:linear-gradient(180deg,#fff,#faf6ef);border:1px solid var(--line);border-left:5px solid var(--crit);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.diag h2{font-size:16px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.diag p{font-size:13.5px;margin-bottom:8px}
.diag .kv{font-size:12.5px;color:var(--muted)}
h3.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
h3.sec::before{content:"";width:4px;height:15px;background:var(--accent);border-radius:2px}
.row2{grid-template-columns:1fr 1fr;margin-bottom:18px}
@media(max-width:900px){.row2{grid-template-columns:1fr}}
.subscores{grid-template-columns:repeat(5,1fr);margin-bottom:20px}
@media(max-width:900px){.subscores{grid-template-columns:repeat(2,1fr)}}
.ss{text-align:center;padding:14px 10px}
.ss .ring{margin:0 auto 8px}
.ss .nm{font-size:12px;font-weight:600}
.ss .dt{font-size:11px;color:var(--muted);margin-top:2px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.bar-row .nm{width:160px;flex:0 0 160px}
.bar-track{flex:1;background:#f0ece3;border-radius:6px;height:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:10.5px;font-weight:700;min-width:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.insight{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:13px 15px;margin-bottom:11px;background:#fff}

.insight .d{font-size:12.5px}

.chip{font-size:10.5px;padding:2px 8px;border-radius:5px;font-weight:600}
.chip.imp{background:#fbe6e3;color:var(--crit)}.chip.eff{background:#eef4ee;color:var(--good)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;padding:8px 7px;border-bottom:2px solid var(--line);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;white-space:nowrap}
tbody td{padding:7px;border-bottom:1px solid #f2ede3}
tbody tr:hover{background:#faf7f0}
.pill{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;white-space:nowrap}
.ok{background:#e5f2ea;color:var(--good)}.slow{background:#fdf1e0;color:var(--warn)}.bad{background:#fbe6e3;color:var(--crit)}
.mono{font-variant-numeric:tabular-nums}
.x{color:var(--crit);font-weight:700}.c{color:var(--good);font-weight:700}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.roadmap-t{width:100%;border-collapse:collapse;font-size:12.5px}
.roadmap-t th{background:#f6f1e8;text-align:left;padding:9px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.roadmap-t td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:11px;align-items:center;justify-content:center}
</style>
</head>

  fix:{vi:"Chỉ giữ 1 H1 (tiêu đề bài); hạ phần còn lại xuống H2.",en:"Keep a single H1 (the article title); demote the rest to H2."}},

 {p:"OK",cls:"pg",bg:"var(--good)",
  t:{vi:"Điểm mạnh: nền tảng nội dung & on-page tốt",en:"Strength: solid content & on-page foundation"},

const RM=[

 {n:2,imp:{vi:"Cao",en:"High"},eff:{vi:"Thấp",en:"Low"},own:"Dev/SEO",act:{vi:"Thêm 16 bài viết vào sitemap.xml + submit GSC",en:"Add 16 articles to sitemap.xml + submit in GSC"},why:{vi:"Giúp Google phát hiện & index nhanh; làm ngay được",en:"Helps Google discover & index fast; can ship immediately"}},
 {n:3,imp:{vi:"Cao",en:"High"},eff:{vi:"Trung bình",en:"Medium"},own:"Dev",act:{vi:"Giảm payload /articles listing từ 1.8MB xuống &lt;100KB",en:"Cut /articles listing payload from 1.8MB to &lt;100KB"},why:{vi:"Trang hub quan trọng đang chặn crawl & phân phối link",en:"Key hub page is blocking crawl & link distribution"}},
 {n:4,imp:{vi:"Cao",en:"High"},eff:{vi:"Thấp",en:"Low"},own:"SEO/Dev",act:{vi:"Thêm schema Organization + LocalBusiness + Service + Breadcrumb cho trang chính",en:"Add Organization + LocalBusiness + Service + Breadcrumb schema to main pages"},why:{vi:"Bật rich result + tăng khả năng được AI trích dẫn (AEO)",en:"Enables rich results + boosts AI citation (AEO)"}},
 {n:5,imp:{vi:"Trung bình",en:"Medium"},eff:{vi:"Thấp",en:"Low"},own:"Dev",act:{vi:"Sửa 2×H1 trên bài viết → 1 H1",en:"Fix 2×H1 on articles → single H1"},why:{vi:"Làm rõ chủ đề trang cho Google",en:"Clarifies the page's topic for Google"}},
 {n:6,imp:{vi:"Trung bình",en:"Medium"},eff:{vi:"Thấp",en:"Low"},own:"SEO",act:{vi:"Viết lại H1 trang chính có từ khóa (giữ brand ở subtitle)",en:"Rewrite main-page H1s with keywords (keep brand in subtitle)"},why:{vi:"Tận dụng tín hiệu on-page mạnh nhất còn bỏ trống",en:"Taps the strongest unused on-page signal"}},
 {n:7,imp:{vi:"Thấp",en:"Low"},eff:{vi:"Thấp",en:"Low"},own:"SEO",act:{vi:"noindex /login; dày nội dung + internal link cho /start-interactive",en:"noindex /login; enrich /start-interactive with content + internal links"},why:{vi:"Dọn thin/orphan, gom crawl budget về trang giá trị",en:"Cleans up thin/orphan pages, refocuses crawl budget"}},
 {n:8,imp:{vi:"Thấp",en:"Low"},eff:{vi:"Thấp",en:"Low"},own:"Dev",act:{vi:"Sửa heading nhảy cấp (H2→H4) toàn site",en:"Fix heading jumps (H2→H4) site-wide"},why:{vi:"Cải thiện accessibility & hiểu cấu trúc nội dung",en:"Improves accessibility & content-structure understanding"}}
];
const TH=[{f:'u',vi:'URL',en:'URL'},{f:'t',vi:'Loại',en:'Type'},{f:'ttfb',vi:'TTFB',en:'TTFB'},{f:'kb',vi:'HTML',en:'HTML'},{f:'sc',vi:'Schema',en:'Schema'},{f:'h1',vi:'H1',en:'H1'},{f:'sm',vi:'Sitemap',en:'Sitemap'},{f:'skip',vi:'H-skip',en:'H-skip'}];

let sf='ttfb',sd='desc';
function ring(v){const c=v>=80?'var(--good)':v>=60?'var(--warn)':'var(--crit)';return `<svg class="ring" width="66" height="66" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#f0ece3" stroke-width="4"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="${c}" stroke-width="4" stroke-dasharray="${v} ${100-v}" stroke-dashoffset="25" stroke-linecap="round"/><text x="21" y="24" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)">${v}</text></svg>`;}
const tc=ms=>ms<1000?'var(--good)':ms<3000?'var(--warn)':'var(--crit)';

function render(){
 document.documentElement.lang=LANG;
 document.getElementById('bvi').className=LANG==='vi'?'on':'';
 document.getElementById('ben').className=LANG==='en'?'on':'';
 ['ey','h1','sub','method','diagh','diagp1','diagp2'].forEach(id=>{document.getElementById(id).innerHTML=T[id][LANG];});
 document.getElementById('sec-ttfb').textContent=T.secTtfb[LANG];
 document.getElementById('sec-schema').textContent=T.secSchema[LANG];
 document.getElementById('sec-insight').textContent=T.secInsight[LANG];
 document.getElementById('sec-road').textContent=T.secRoad[LANG];
 document.getElementById('sec-tbl').textContent=T.secTbl[LANG];
 document.getElementById('ttfbleg').innerHTML=T.ttfbleg[LANG];
 document.getElementById('schemaleg').innerHTML=T.schemaleg[LANG];
 // KPIs
 document.getElementById('kpis').innerHTML=KPI.map(k=>`<div class="card kpi"><div class="lab">${k.l[LANG]}</div><div class="val">${k.v}</div><div class="note">${k.n()}</div></div>`).join('');
 // subscores
 document.getElementById('subscores').innerHTML=SS.map(s=>`<div class="card ss">${ring(s.v)}<div class="nm">${s.nm[LANG]}</div><div class="dt">${s.dt[LANG]}</div></div>`).join('');
 // ttfb bars
 const tset=[{n:{vi:"Trang chính (TB)",en:"Main pages (avg)"},ms:avgMain},{n:{vi:"/articles (listing)",en:"/articles (listing)"},ms:7013},{n:{vi:"Bài viết (TB)",en:"Articles (avg)"},ms:avgArt},{n:{vi:"Bài chậm nhất",en:"Slowest article"},ms:10803},{n:{vi:"/login (nhanh nhất)",en:"/login (fastest)"},ms:289}];
 const maxT=Math.max(...tset.map(x=>x.ms));
 document.getElementById('ttfbbars').innerHTML=tset.map(x=>`<div class="bar-row"><div class="nm">${x.n[LANG]}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(6,x.ms/maxT*100)}%;background:${tc(x.ms)}">${(x.ms/1000).toFixed(1)}s</div></div></div>`).join('');
 // schema bars
 document.getElementById('schemabars').innerHTML=SCH.map(x=>`<div class="bar-row"><div class="nm">${x.n[LANG]}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(8,x.pct||8)}%;background:${x.col}">${x.pct}%</div></div><div style="font-size:11px;color:var(--muted);flex:0 0 165px">${x.lbl[LANG]}</div></div>`).join('');
 // insights
 document.getElementById('insights').innerHTML=INS.map(i=>`<div class="insight ${i.cls}"><div class="t"><span class="pri" style="background:${i.bg}">${i.p}</span><span>${i.t[LANG]}</span></div><div class="d">${i.d[LANG]}</div>${i.fix?`<div class="fix"><b>${LANG==='vi'?'Cách sửa':'Fix'}:</b> ${i.fix[LANG]}</div>`:''}</div>`).join('');
 // roadmap
 const rh=LANG==='vi'?['#','Hành động','Impact','Effort','Owner','Vì sao']:['#','Action','Impact','Effort','Owner','Why'];
 document.getElementById('roadmap').innerHTML='<thead><tr>'+rh.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+RM.map(r=>`<tr><td><span class="num">${r.n}</span></td><td><b>${r.act[LANG]}</b></td><td><span class="chip imp">${r.imp[LANG]}</span></td><td><span class="chip eff">${r.eff[LANG]}</span></td><td>${r.own}</td><td style="color:var(--muted)">${r.why[LANG]}</td></tr>`).join('')+'</tbody>';
 drawTable();
 document.getElementById('foot').innerHTML=(LANG==='vi'?"DXL Technical Audit · crawl trực tiếp qua Chrome · ":"DXL Technical Audit · crawled live via Chrome · ")+"Health "+HEALTH+"/100 · "+(LANG==='vi'?"TTFB chính ":"main TTFB ")+(avgMain/1000).toFixed(1)+"s · "+(LANG==='vi'?"bài viết ":"articles ")+(avgArt/1000).toFixed(1)+"s"+(LANG==='vi'?" · tự cập nhật mỗi sáng":" · auto-updates each morning");
}
function drawTable(){
 const data=PAGES.slice().sort((a,b)=>{let x=a[sf],y=b[sf];if(sf==='sc'){x=a.sc.length;y=b.sc.length;}if(typeof x==='string')return sd==='asc'?x.localeCompare(y):y.localeCompare(x);return sd==='asc'?x-y:y-x;});
 let h='<thead><tr>'+TH.map(c=>`<th onclick="sb('${c.f}')">${c[LANG]}${sf===c.f?(sd==='asc'?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>';
 data.forEach(p=>{
   const cls=p.ttfb<1000?'ok':p.ttfb<3000?'slow':'bad';
   h+=`<tr><td class="mono" style="max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.u}</td><td>${p.t}</td><td><span class="pill ${cls}">${(p.ttfb/1000).toFixed(1)}s</span></td><td class="mono">${p.kb>500?'<span class="x">'+p.kb+'</span>':p.kb} KB</td><td>${p.sc.length?'<span class="c">'+p.sc.join(', ')+'</span>':'<span class="x">—</span>'}</td><td class="${p.h1>1?'x':''}">${p.h1}</td><td>${p.sm?'<span class="c">✓</span>':'<span class="x">✕</span>'}</td><td>${p.skip?'<span class="x">'+p.skip+'</span>':'<span class="c">✓</span>'}</td></tr>`;
 });
 document.getElementById('tbl').innerHTML=h+'</tbody>';
}
function sb(f){if(sf===f)sd=sd==='asc'?'desc':'asc';else{sf=f;sd='desc';}drawTable();}
function setLang(l){LANG=l;render();}
render();
</script>
