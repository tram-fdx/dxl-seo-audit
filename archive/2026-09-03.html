<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  .langfix{position:fixed;top:14px;right:14px;z-index:120;display:inline-flex;
    border:1px solid var(--accent);border-radius:20px;overflow:hidden;background:var(--card);
    box-shadow:0 2px 12px rgba(70,55,30,.2)}
  .langfix button{background:transparent;color:var(--muted);border:none;padding:6px 15px;
    font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px;font-family:inherit;line-height:1.5}
  .langfix button.active{background:var(--accent);color:#2c2620}
  .langfix button:not(.active):hover{color:var(--ink)}
  @media(max-width:700px){.langfix{top:8px;right:8px}
    .langfix button{padding:5px 12px;font-size:11px}}
  @media print{.langfix{display:none}}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .legend .foot{display:block;line-height:1.55}
  .legend{max-width:520px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}

  /* ---------- date picker v2 (sample-matched) ---------- */
  /* collapsible date picker */
  .pk-toggle{margin-top:24px;width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 20px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);
    text-align:left;transition:border-color .15s,box-shadow .15s}
  .pk-toggle:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(184,147,90,.13)}
  .pk-toggle .lft{display:flex;align-items:center;gap:11px;min-width:0}
  .pk-toggle .bar{display:inline-block;width:3px;height:17px;background:var(--accent);border-radius:2px;flex:none}
  .pk-toggle .cap{font-weight:600}
  .pk-toggle .sel{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
  .pk-toggle .chev{flex:none;transition:transform .2s;color:var(--muted);font-size:12px}
  .pk-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .pk-wrap[hidden]{display:none}
  .pk-wrap .pk-card{margin-top:10px}

  /* trend charts */
  .tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.tr-grid{grid-template-columns:1fr}}
  .tr-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 14px}
  .tr-card h3{margin:0 0 2px;font-size:14.5px;font-weight:700;color:var(--ink)}
  .tr-card .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
  .tr-lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .tr-lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .tr-svg{width:100%;height:auto;display:block;overflow:visible}
  .tr-dot{transition:r .12s}
  .tr-card:hover .tr-dot{r:3.2}
  .pk-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 16px;box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .pk-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;
    letter-spacing:.9px;text-transform:uppercase;color:var(--accent-dk);margin:0 0 8px}
  .pk-title .bar{width:26px;height:3px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  .pk-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;max-width:900px}
  .pk-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dpwrap{position:relative}
  .dpbtn{display:inline-flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid #cfc6b3;border-radius:10px;padding:10px 15px;font-family:inherit;
    font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink);cursor:pointer;transition:.15s}
  .dpbtn:hover{border-color:var(--accent)}
  .dpbtn .car{color:var(--muted);font-size:9px;margin-left:2px}
  .pk-now{display:inline-block;background:var(--accent-soft,#f3e7d3);color:var(--accent-dk);
    border:1px solid #e6d5b8;border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700}

  .dppane{position:absolute;top:calc(100% + 9px);left:0;z-index:80;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 40px rgba(70,55,30,.20);overflow:hidden}
  .dppane.open{display:flex}
  .dp-presets{width:196px;flex:0 0 auto;border-right:1px solid var(--line);
    padding:12px 8px;background:#fdfbf6;max-height:430px;overflow:auto}
  .dp-preset{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;
    font-size:12.5px;color:var(--ink);transition:.12s}
  .dp-preset:hover:not(:disabled){background:var(--cream2)}
  .dp-preset:disabled{color:#bdb4a6;cursor:not-allowed}
  .dp-preset .rd{width:13px;height:13px;border-radius:50%;border:1.5px solid #c3b9a6;flex:0 0 auto;position:relative}
  .dp-preset.on .rd{border-color:var(--accent)}
  .dp-preset.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
  .dp-preset .nm{flex:1}
  .dp-preset .ct{font-size:11.5px;color:var(--faint,#9a9186);font-weight:700}

  .dp-right{padding:14px 16px 12px;min-width:452px}
  .dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .dp-nav button{background:transparent;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
  .dp-nav button:hover:not(:disabled){background:var(--cream2);color:var(--ink)}
  .dp-nav button:disabled{opacity:.3;cursor:not-allowed}
  .dp-nav .mtitle{flex:1;display:flex;justify-content:space-around;font-size:13.5px;font-weight:700}
  .dp-months{display:flex;gap:26px}
  .dp-m{flex:1}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dp-dow{font-size:10.5px;color:var(--muted);text-align:center;padding:5px 0 3px;font-weight:700}
  .dp-d{position:relative;height:29px;border:none;background:transparent;border-radius:7px;
    font-family:inherit;font-size:12.5px;color:#bdb4a6;cursor:pointer;padding:0;transition:.1s}
  .dp-d.blank{cursor:default}
  .dp-d.has{color:var(--ink);font-weight:700}
  .dp-d:hover:not(.blank):not(.sel){background:var(--cream2)}
  .dp-d.inrange{background:var(--accent-soft,#f3e7d3);border-radius:0}
  .dp-d.sel{background:var(--accent);color:#2c2620;font-weight:800}
  .dp-d.sel.edge-l{border-radius:7px 0 0 7px}
  .dp-d.sel.edge-r{border-radius:0 7px 7px 0}
  .dp-d .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:3.5px;height:3.5px;border-radius:50%;background:var(--accent)}
  .dp-d.sel .dot{background:#2c2620}

  .dp-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-selinfo .d1{font-size:13.5px;font-weight:700}
  .dp-selinfo .d2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;max-width:300px}
  .dp-actions{display:flex;gap:9px;flex:0 0 auto}
  .dp-actions button{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:9px;
    padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .dp-actions .go{background:var(--accent);border-color:var(--accent);color:#2c2620}
  .dp-actions .go:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
  .dp-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
  .dp-legend .dotlg{display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-right:4px}

  .pk-quick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;
    padding-top:14px;border-top:1px solid var(--line)}
  .pk-quick-lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);
    text-transform:uppercase;flex:0 0 auto;margin-right:2px}
  .qchip{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--ink);transition:.13s;text-align:left}
  .qchip:hover{border-color:var(--accent);background:#fdfaf3}
  .qchip .qd{font-weight:700;flex:0 0 auto}
  .qchip .ql{font-size:11.5px;color:var(--muted)}
  .qchip.cur{background:var(--accent);border-color:var(--accent);color:#2c2620;cursor:default}
  .qchip.cur .ql{color:#5c4a24}

  .pk-trend{display:none;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .pk-trend.on{display:block}
  .pk-trend h4{margin:0 0 10px;font-size:13px;color:var(--accent-dk)}
  .trd{display:grid;grid-template-columns:88px 1fr 46px 62px;gap:9px;align-items:center;
    margin:6px 0;font-size:12.5px}
  .trd .tdate{font-weight:700}
  .trd .ttrack{background:var(--cream2);border-radius:6px;height:16px;overflow:hidden}
  .trd .tfill{height:100%;background:var(--accent);border-radius:6px}
  .trd .tval{font-weight:800;text-align:right}
  .trd .tlink{font-size:11px;color:var(--accent-dk);text-decoration:underline;cursor:pointer;text-align:right}
  @media(max-width:860px){.dppane.open{flex-direction:column}.dp-right{min-width:0}.dp-months{flex-direction:column;gap:14px}.dp-presets{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:none}}

</style>
</head>
<body>
<div class="langfix" role="group" aria-label="Language">
  <button type="button" data-l="vi" onclick="setLang('vi')">VI</button>
  <button type="button" data-l="en" onclick="setLang('en')">EN</button>
</div>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 17 trang gốc + 24 bài /articles + 6 trang dự án + sitemap" data-en="Source: Chrome live crawl · 17 core pages + 24 /articles + 6 project pages + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>03/09/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>3 Sep 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>47 trang</b> · Sitemap: <b>48 URL</b>" data-en="Directly measured: <b>47 pages</b> · Sitemap: <b>48 URLs</b>"></span><br>
        Method: Chrome fetch tuần tự · AbortController 12–15s
      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <!-- date picker v2 (collapsible) -->
  <button class="pk-toggle" id="pkToggle" type="button" aria-expanded="false" aria-controls="pkWrap" onclick="pkFold()">
    <span class="lft"><span class="bar"></span>
      <span class="cap t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span>
      <span class="sel" id="pkToggleSel"></span></span>
    <span class="chev">&#9660;</span>
  </button>
  <div class="pk-wrap" id="pkWrap" hidden>
  <div class="pk-card">
    <div class="pk-title"><span class="bar"></span><span class="t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span></div>
    <p class="pk-sub t" data-vi="Chọn <b>một ngày</b> rồi bấm <b>Cập nhật</b> để mở đúng bản báo cáo đã lưu của ngày đó. Chọn <b>một khoảng ngày</b> để xem xu hướng trong khoảng. Ngày <b>có dấu chấm</b> là ngày đã quét và có báo cáo lưu; ngày làm mờ vẫn chọn được làm đầu/cuối khoảng, nhưng không có báo cáo riêng để mở." data-en="Pick <b>a single day</b> and press <b>Update</b> to open that day's saved report. Pick <b>a date range</b> to see the trend across it. Days <b>with a dot</b> were crawled and have a stored report; faded days can still anchor a range but have no report of their own."></p>
    <div class="pk-bar">
      <div class="dpwrap">
        <button class="dpbtn" id="dpBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>&#128197;</span><span id="dpLabel">Ngày 28/08/2026</span><span class="car">&#9660;</span>
        </button>
        <div class="dppane" id="dpPane" role="dialog">
          <div class="dp-presets" id="dpPresets"></div>
          <div class="dp-right">
            <div class="dp-nav">
              <button type="button" id="dpPrev" aria-label="prev">&#8249;</button>
              <div class="mtitle"><span id="dpM1"></span><span id="dpM2"></span></div>
              <button type="button" id="dpNext" aria-label="next">&#8250;</button>
            </div>
            <div class="dp-months"><div class="dp-m" id="dpG1"></div><div class="dp-m" id="dpG2"></div></div>
            <div class="dp-foot">
              <div class="dp-selinfo"><div class="d1" id="dpSelD"></div><div class="d2" id="dpSelInfo"></div></div>
              <div class="dp-actions">
                <button type="button" id="dpCancel" class="t" data-vi="Hủy" data-en="Cancel"></button>
                <button type="button" id="dpApply" class="go t" data-vi="Cập nhật" data-en="Update"></button>

      <div class="note"><span class="tag t" style="background:#fdeaea;color:#9b2c2c" data-vi="92 &#8594; 80 — site vừa bị thay gần toàn bộ, 53 URL bài viết cũ chết 404" data-en="92 &#8594; 80 — the site was replaced; 53 old article URLs now 404"></span></div>
      <div class="delta t" data-vi="&#9654; 92 &#8594; <b>80</b> so lần quét 28/08 — <b>mức giảm lớn nhất từ trước tới nay</b>, và nguyên nhân <b>không phải site chậm đi</b> mà là <b>site đã bị thay gần như toàn bộ</b>. Ngày 28/08 sitemap khai <b>92 URL / 68 bài</b>; hôm nay chỉ còn <b>48 URL / 24 bài</b>. Kiểm lại từng URL cũ: <b>53/68 bài trả HTTP 404</b> và <b>không một URL nào có redirect 301</b>. Bốn hạng mục đi xuống: Crawlability <b>97 &#8594; 72</b>, Structured Data <b>96 &#8594; 82</b> (<code>FAQPage</code> từ <b>56 bài xuống 0</b>), Content <b>88 &#8594; 62</b> (tổng số từ toàn site <b>185.747 &#8594; 47.314</b>, &#8722;75%), On-page <b>91 &#8594; 84</b> (heading nhảy bậc lan từ 15 lên <b>38/47 trang</b>). Hạng mục duy nhất đi lên là Performance <b>88 &#8594; 96</b> — TTFB toàn site <b>862 &#8594; 473 ms</b>, <b>47/47 trang dưới 1 giây</b>. <b>Cách đọc đúng:</b> tốc độ nhanh lên là hệ quả số học của một site nhỏ hơn 49%, <b>không phải thành tích tối ưu</b>. Điểm 80 ghi nhận <b>một sự kiện migration</b>, không phải site xuống cấp dần." data-en="&#9654; 92 &#8594; <b>80</b> against the 28 Aug crawl &#8212; the <b>largest single-day fall recorded</b>, and the cause is <b>not a slower site</b> but a site that has been <b>almost entirely replaced</b>. On 28 Aug the sitemap declared <b>92 URLs / 68 articles</b>; today it declares <b>48 URLs / 24 articles</b>. Re-testing every old URL: <b>53 of 68 articles return HTTP 404</b> and <b>not one carries a 301 redirect</b>. Four sub-scores fell: Crawlability <b>97 &#8594; 72</b>, Structured Data <b>96 &#8594; 82</b> (<code>FAQPage</code> from <b>56 articles to 0</b>), Content <b>88 &#8594; 62</b> (site-wide words <b>185,747 &#8594; 47,314</b>, &#8722;75%), On-page <b>91 &#8594; 84</b> (heading skips spread from 15 to <b>38 of 47 pages</b>). The only sub-score up is Performance <b>88 &#8594; 96</b> &#8212; site-wide TTFB <b>862 &#8594; 473 ms</b>, <b>47 of 47 pages under a second</b>. <b>How to read it:</b> the speed gain is the arithmetic consequence of a site 49% smaller, <b>not an optimisation win</b>. The 80 records <b>a migration event</b>, not gradual decay."></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Trang crawl được" data-en="Pages crawled"></div>
      <div class="val" style="color:var(--red)">47</div>
      <div class="note t" data-vi="17 gốc + 24 bài + 6 dự án · 47/47 trả 200 · <b>46/47 nằm trong sitemap</b>" data-en="17 core + 24 articles + 6 projects · 47 of 47 return 200 · <b>46 of 47 are in the sitemap</b>"></div>
      <div class="delta t" data-vi="&#9660; 91 &#8594; <b>47 trang</b> · sitemap 92 &#8594; <b>48 URL</b>. Đây là <b>cảnh báo P1 nghiêm trọng nhất trong toàn bộ chuỗi báo cáo</b>. Trong 68 bài có mặt ngày 28/08, <b>chỉ 15 bài còn trả 200</b>; <b>53 bài trả 404</b> và <b>không một URL nào có redirect</b> — đã kiểm bằng <code>fetch(redirect:'follow')</code>, cờ <code>redirected</code> trả <code>false</code> trên cả 68 URL. Trong 15 bài còn sống, <b>11 bài không nằm trong sitemap</b>, tức là trang mồ côi: ví dụ <code>/articles/the-best-home-builders-adelaide</code> vẫn trả 200 trong khi sitemap chỉ khai bản slug mới <code>/articles/how-to-compare-the-best-home-builders-adelaide-before-you-sign</code>. Hai URL này <b>nội dung gần trùng nhau</b> nên đang tự cạnh tranh. <b>Hệ quả nếu không xử lý:</b> 53 URL đã được index sẽ rơi khỏi index trong khoảng 2–4 tuần, kéo theo toàn bộ backlink và thứ hạng đã tích luỹ. <b>Việc phải làm ngay:</b> map 53 URL cũ sang URL mới gần nhất và bật <b>301</b>; URL nào không có bản thay thế thì trỏ về <code>/articles</code>." data-en="&#9660; 91 &#8594; <b>47 pages</b> · sitemap 92 &#8594; <b>48 URLs</b>. This is the <b>most serious P1 in the history of this report</b>. Of the 68 articles present on 28 Aug, <b>only 15 still return 200</b>; <b>53 return 404</b> and <b>not one redirects</b> &#8212; verified with <code>fetch(redirect:'follow')</code>, where the <code>redirected</code> flag came back <code>false</code> on all 68 URLs. Of the 15 survivors, <b>11 are absent from the sitemap</b>, leaving them orphaned: <code>/articles/the-best-home-builders-adelaide</code> still returns 200 while the sitemap declares only the new slug <code>/articles/how-to-compare-the-best-home-builders-adelaide-before-you-sign</code>. The two carry <b>near-identical content</b> and now compete with each other. <b>If left alone:</b> 53 already-indexed URLs will drop out of the index over roughly 2&#8211;4 weeks, taking their accumulated links and rankings with them. <b>Immediate job:</b> map all 53 old URLs to their closest new equivalent and serve a <b>301</b>; anything without a replacement should point at <code>/articles</code>."></div>

      <div class="note t" data-vi="<b>17/17 trang gốc &lt;1s</b> · <code>/articles</code> 966 ms là trang chậm nhất site" data-en="<b>17 of 17 core pages &lt;1s</b> · <code>/articles</code> at 966 ms is the slowest page on the site"></div>
      <div class="delta t" data-vi="&#9660; 816 &#8594; <b>458 ms</b> nhóm trang gốc (&#8722;43,9%) — <b>mức nhanh nhất từng ghi nhận</b> và là lần đầu <b>17/17 trang gốc đều dưới 1 giây</b>. Trang chậm nhất site nay là <code>/articles</code> ở <b>966 ms</b>, giảm từ 1.374 ms; nhanh nhất là <code>/faq</code> ở <b>236 ms</b>. <b>Nhưng phải nói thẳng:</b> con số này <b>không phải kết quả tối ưu hạ tầng</b>. Listing <code>/articles</code> trước phải trả 68 link bài, nay chỉ còn 24 bài và <b>chỉ 7 link lộ ra trong HTML thô</b>, còn toàn site nhẹ đi 49% số trang. <b>Site nhanh lên vì nhỏ đi, không phải vì cache tốt lên.</b> Mục P2 TTFB tồn từ 27/08 <b>được đóng lại</b>, nhưng đóng theo cách này thì không tính là thắng lợi kỹ thuật." data-en="&#9660; 816 &#8594; <b>458 ms</b> for the core group (&#8722;43.9%) &#8212; the <b>fastest reading ever recorded</b> and the first time <b>all 17 core pages</b> sit under a second. The slowest page on the site is now <code>/articles</code> at <b>966 ms</b>, down from 1,374 ms; the fastest is <code>/faq</code> at <b>236 ms</b>. <b>Said plainly:</b> this is <b>not an infrastructure win</b>. The <code>/articles</code> listing used to carry 68 article links; it now carries 24 and <b>exposes only 7 of them in the raw HTML</b>, while the site as a whole holds 49% fewer pages. <b>The site got faster because it got smaller, not because caching improved.</b> The TTFB P2 open since 27 Aug <b>closes</b>, but closing it this way does not count as an engineering result."></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="TTFB TB — bài viết" data-en="Avg TTFB — articles"></div>
      <div class="val" style="color:var(--green)">0,50<span style="font-size:15px">s</span></div>
      <div class="note t" data-vi="Toàn bộ 24 bài · 0,24–0,80s · <b>24/24 bài &lt;1s</b>" data-en="All 24 articles · 0.24–0.80s · <b>24 of 24 under 1s</b>"></div>
      <div class="delta t" data-vi="&#9660; 887 &#8594; <b>496 ms</b> nhóm bài viết (&#8722;44,1%). <b>24/24 bài dưới 1 giây</b>, dải đo <b>236–800 ms</b>. Nhóm dự án <b>706 &#8594; 421 ms</b>. Cả ba nhóm cùng giảm khoảng 44% <b>trong cùng một ngày</b> — mức đồng đều này xác nhận nguyên nhân là <b>toàn bộ nền tảng được deploy lại</b>, không phải tối ưu từng trang. <b>Điều cần theo dõi:</b> 24 bài mới trung bình <b>1.578 từ</b>, so với 2.554 từ của bộ 68 bài cũ (&#8722;38%). Bài mỏng nhất là <code>how-to-use-3d-configurators-to-increase-buyer-commitment</code> ở <b>733 từ</b>. Trang nhẹ hơn thì nhanh hơn, nhưng <b>đổi độ sâu nội dung lấy tốc độ là một cuộc trao đổi lỗ</b> đối với truy vấn thông tin." data-en="&#9660; 887 &#8594; <b>496 ms</b> for articles (&#8722;44.1%). <b>All 24 articles are under a second</b>, spanning <b>236&#8211;800 ms</b>. The project group moved <b>706 &#8594; 421 ms</b>. All three groups fell roughly 44% <b>on the same day</b> &#8212; that uniformity confirms a <b>whole-platform redeploy</b> rather than per-page tuning. <b>Worth watching:</b> the 24 new articles average <b>1,578 words</b> against 2,554 for the old set of 68 (&#8722;38%). The thinnest is <code>how-to-use-3d-configurators-to-increase-buyer-commitment</code> at <b>733 words</b>. Lighter pages load faster, but <b>trading content depth for speed is a losing trade</b> on informational queries."></div>

      <div class="val" style="color:var(--green)">45/47</div>
      <div class="note t" data-vi="Trang chủ 2 · <code>/articles</code> 1 · Dự án 1 · Bài 2 · hệ số nhân bản <b>1,0&#215;</b> · <b>FAQPage 0/24 bài</b>" data-en="Home 2 · <code>/articles</code> 1 · Projects 1 · Articles 2 · duplication factor <b>1.0&#215;</b> · <b>FAQPage on 0 of 24 articles</b>"></div>
      <div class="delta t" data-vi="<b>45/47 trang có schema</b> (95,7%, hôm 28/08 là 97,8%) và <b>hệ số nhân bản vẫn 1,0&#215;</b> — lỗi 14 khối JSON-LD trùng nhau <b>không tái phát</b>. <b>Tin tốt:</b> 6 trang dự án <b>lần đầu có schema đầy đủ</b>, một khối <code>@graph</code> gồm <code>Organization + WebSite + WebPage + CreativeWork + BreadcrumbList</code>. Đây là mục P1 tồn từ 03/08 và nay <b>đã đóng</b>. <b>Tin xấu và lớn hơn:</b> <code>FAQPage</code> rơi từ <b>56/68 bài (82,4%) xuống 0/24 bài (0%)</b>. Template bài viết mới chỉ phát <code>Article + BreadcrumbList</code>, và <b>trong thân bài cũng không còn mục FAQ</b> — đã kiểm trên rendered DOM chứ không chỉ HTML thô. Mất toàn bộ <code>FAQPage</code> đồng nghĩa mất cơ hội rich result dạng câu hỏi và mất một bề mặt trích dẫn quan trọng cho AI search. Hai trang không có schema vẫn là <code>/start-interactive</code> và <code>/login</code>, đúng như thiết kế. <code>/articles</code> vẫn giữ đủ <code>CollectionPage + ItemList + BreadcrumbList</code>." data-en="<b>45 of 47 pages carry schema</b> (95.7%, against 97.8% on 28 Aug) and the <b>duplication factor holds at 1.0&#215;</b> &#8212; the 14-identical-blocks defect <b>has not returned</b>. <b>Good news:</b> the 6 project pages <b>carry full schema for the first time</b>, a single <code>@graph</code> with <code>Organization + WebSite + WebPage + CreativeWork + BreadcrumbList</code>. That P1, open since 3 Aug, is <b>now closed</b>. <b>The bigger bad news:</b> <code>FAQPage</code> fell from <b>56 of 68 articles (82.4%) to 0 of 24 (0%)</b>. The new article template emits only <code>Article + BreadcrumbList</code>, and <b>the FAQ section is gone from the body copy too</b> &#8212; confirmed in the rendered DOM, not just raw HTML. Losing every <code>FAQPage</code> means losing question-style rich results and a significant citation surface for AI search. The two pages without schema are still <code>/start-interactive</code> and <code>/login</code>, by design. <code>/articles</code> retains a full <code>CollectionPage + ItemList + BreadcrumbList</code>."></div>

      <div class="foot t" data-vi="Health tổng <b>80/100</b> (điểm thô 92,30 &#8594; <b>80,30</b>). <b>Bốn trên năm hạng mục đi xuống</b> và tất cả đều bắt nguồn từ <b>cùng một nguyên nhân duy nhất</b>: bộ bài viết của site đã bị thay từ 68 bài sang 24 bài mới, không kèm redirect. <b>Crawlability 97 &#8594; 72</b> — 53 URL cũ trả 404 không redirect, cộng 11 trang mồ côi còn sống ngoài sitemap. <b>Content 88 &#8594; 62</b> — tổng số từ toàn site 185.747 &#8594; 47.314 (&#8722;74,5%), trung bình mỗi bài 2.554 &#8594; 1.578 từ. <b>Structured Data 96 &#8594; 82</b> — <code>FAQPage</code> từ 56 bài xuống 0, bù lại 6 trang dự án lần đầu có <code>@graph</code> đầy đủ. <b>On-page 91 &#8594; 84</b> — heading nhảy bậc lan từ 15 lên 38/47 trang vì template mới nhảy thẳng H1 &#8594; H3. <b>Performance 88 &#8594; 96</b> là hạng mục duy nhất tăng, và tăng vì site nhỏ đi chứ không phải vì hạ tầng tốt lên. <b>Điểm mấu chốt:</b> danh sách tồn đọng chuyển từ <b>0 P1</b> hôm 28/08 sang <b>3 P1</b> hôm nay. Điểm 80 sẽ không tự hồi; nó chỉ hồi khi 53 redirect được bật. Trọng số: Crawlability 25%, Performance 25%, Structured Data 20%, On-page 15%, Content 15%." data-en="Overall Health <b>80/100</b> (raw score 92.30 &#8594; <b>80.30</b>). <b>Four of the five sub-scores fell</b> and every one of them traces to <b>a single cause</b>: the article set was swapped from 68 pieces to 24 new ones with no redirects. <b>Crawlability 97 &#8594; 72</b> &#8212; 53 old URLs return 404 without redirecting, plus 11 orphaned survivors living outside the sitemap. <b>Content 88 &#8594; 62</b> &#8212; site-wide words 185,747 &#8594; 47,314 (&#8722;74.5%), article average 2,554 &#8594; 1,578. <b>Structured Data 96 &#8594; 82</b> &#8212; <code>FAQPage</code> from 56 articles to 0, partly offset by the 6 project pages finally carrying a full <code>@graph</code>. <b>On-page 91 &#8594; 84</b> &#8212; heading skips spread from 15 to 38 of 47 pages because the new template jumps H1 straight to H3. <b>Performance 88 &#8594; 96</b> is the only riser, and it rises because the site shrank, not because the infrastructure improved. <b>The point to take away:</b> the backlog went from <b>0 P1s</b> on 28 Aug to <b>3 P1s</b> today. The 80 will not recover on its own; it recovers when the 53 redirects go live. Weights: Crawlability 25%, Performance 25%, Structured Data 20%, On-page 15%, Content 15%."></div>

  <div class="foot t" data-vi="<b>Cách đọc:</b> mỗi điểm là một lần quét đầy đủ; những ngày không quét <b>không</b> được nội suy mà chỉ nối thẳng giữa hai lần quét gần nhau, nên đoạn dốc dài không có nghĩa là thay đổi diễn ra từ từ. <b>Ba điều đáng chú ý hôm nay:</b> (1) <b>đường Health gãy dốc 92 &#8594; 80</b>, đứt mạch 92–94 kéo dài từ 19/08; đây là điểm gãy lớn nhất trên toàn biểu đồ và nó rơi đúng vào lần quét đầu tiên sau khoảng trống 29/08–02/09, nên <b>không thể xác định chính xác ngày site bị thay</b> — chỉ biết nó xảy ra trong khoảng đó. (2) <b>đường Content và đường số từ trung bình cùng rơi thẳng đứng</b> (88 &#8594; 62 và 2.554 &#8594; 1.578) trong khi <b>đường Performance vọt lên đỉnh mới 96</b> — hai chuyển động ngược chiều này <b>không độc lập</b>: site nhanh lên chính vì nội dung ít đi. Khi đọc biểu đồ TTFB, hãy đọc kèm đường &quot;số trang crawl được&quot; ngay bên cạnh, đang rơi 91 &#8594; 47. (3) <b>đường Crawlability rơi 97 &#8594; 72</b>, mức thấp nhất kể từ 20/08 — lần trước rơi vì phát hiện lỗi cũ, lần này rơi vì <b>lỗi mới thật sự</b>: 53 URL chết không redirect." data-en="<b>How to read this:</b> each point is one full crawl; days without a crawl are <b>not</b> interpolated, the line simply joins the two nearest crawls, so a long slope does not mean the change happened gradually. <b>Three things worth noting today:</b> (1) <b>the Health line breaks 92 &#8594; 80</b>, ending the 92&#8211;94 band held since 19 Aug; it is the largest break anywhere on the chart, and it lands on the first crawl after the 29 Aug &#8211; 2 Sep gap, so <b>the exact day of the swap cannot be pinned down</b> &#8212; only that it happened inside that window. (2) <b>the Content line and the average-words line fall vertically together</b> (88 &#8594; 62 and 2,554 &#8594; 1,578) while <b>the Performance line jumps to a new high of 96</b> &#8212; those two moves are <b>not independent</b>: the site got faster precisely because it holds less content. Read the TTFB chart alongside the 'pages crawled' line next to it, which is falling 91 &#8594; 47. (3) <b>the Crawlability line drops 97 &#8594; 72</b>, its lowest since 20 Aug &#8212; last time it fell because old defects were discovered, this time it falls on a <b>genuinely new defect</b>: 53 dead URLs with no redirect."></div>

  <!-- Insights -->
  <h2 class="sec t" data-vi="Hướng đi &amp; Insight ưu tiên" data-en="Direction &amp; Priority insights"></h2>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 · MỚI · nghiêm trọng nhất từ trước tới nay · 53 URL chết không redirect" data-en="P1 · NEW · the most serious finding to date · 53 dead URLs, no redirect"></div>
    <p class="t" data-vi="<b>53 trong 68 bài viết có mặt ngày 28/08 nay trả HTTP 404, và không một URL nào có 301.</b> Đã kiểm từng URL bằng <code>fetch(redirect:'follow')</code>: cờ <code>redirected</code> trả <code>false</code> trên cả 68. Ví dụ <code>/articles/bathroom-remodel-cost-australia</code>, <code>/articles/interior-finishes</code>, <code>/articles/luxury-home-builders-sydney</code> và <code>/articles/project-251-case-study</code> đều trả trang 404 nặng 7 KB. Đây là những URL đã tích luỹ backlink và thứ hạng suốt nhiều tháng. <b>Vì sao gấp:</b> Google thường mất 2–4 tuần để loại một URL 404 khỏi index; sau mốc đó, bật redirect chỉ thu lại được một phần link equity. <b>Việc cần làm:</b> (1) xuất danh sách 53 URL từ file <code>data/2026-08-28.json</code> trong repo báo cáo này — đó là bản ghi đầy đủ cuối cùng của bộ 68 bài; (2) map từng URL sang bài mới gần nhất về chủ đề, ví dụ <code>the-best-home-builders-adelaide</code> &#8594; <code>how-to-compare-the-best-home-builders-adelaide-before-you-sign</code>; (3) URL nào không có bản thay thế thì <b>301 về <code>/articles</code></b>, không để 404; (4) sau khi bật redirect, nộp lại sitemap trong Search Console." data-en="<b>53 of the 68 articles present on 28 Aug now return HTTP 404, and not one carries a 301.</b> Every URL was re-tested with <code>fetch(redirect:'follow')</code>: the <code>redirected</code> flag came back <code>false</code> on all 68. <code>/articles/bathroom-remodel-cost-australia</code>, <code>/articles/interior-finishes</code>, <code>/articles/luxury-home-builders-sydney</code> and <code>/articles/project-251-case-study</code> all serve a 7 KB 404 page. These are URLs that accumulated links and rankings over months. <b>Why it is urgent:</b> Google typically takes 2&#8211;4 weeks to drop a 404 from the index; after that point, adding redirects recovers only part of the link equity. <b>What to do:</b> (1) pull the list of 53 URLs from <code>data/2026-08-28.json</code> in this report's repo &#8212; it is the last complete record of the 68-article set; (2) map each one to the closest new article by topic, e.g. <code>the-best-home-builders-adelaide</code> &#8594; <code>how-to-compare-the-best-home-builders-adelaide-before-you-sign</code>; (3) anything without a replacement should <b>301 to <code>/articles</code></b> rather than 404; (4) resubmit the sitemap in Search Console once the redirects are live."></p>
  </div>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 · MỚI · 11 trang mồ côi trùng nội dung với bài mới" data-en="P1 · NEW · 11 orphaned pages duplicating the new articles"></div>
    <p class="t" data-vi="<b>15 URL cũ vẫn trả 200, nhưng 11 trong số đó không nằm trong sitemap.</b> Chúng là trang mồ côi: không có link nội bộ trỏ tới, không được khai báo, nhưng Google vẫn có thể vào vì đã index từ trước. Nghiêm trọng hơn, phần lớn <b>trùng chủ đề gần như hoàn toàn</b> với bài mới. Cặp rõ nhất: <code>/articles/the-best-home-builders-adelaide</code> (cũ, còn sống, ngoài sitemap) và <code>/articles/how-to-compare-the-best-home-builders-adelaide-before-you-sign</code> (mới, trong sitemap). Tương tự với <code>bim-3d-4d-5d-explained</code>, <code>what-is-bim-3d-modeling</code>, <code>construction-program-management-software</code>, <code>duplex-house-design-in-australia</code>, <code>3d-house-design-guide</code>, <code>contemporary-houses-a-practical-guide</code>, <code>custom-home-visualisation-timeline</code>, <code>project-management-and-cost-control</code>, <code>program-for-construction-estimates-explained</code> và <code>virtual-reality-home-walkthrough</code>. <b>Hệ quả:</b> hai URL cùng nhắm một truy vấn sẽ chia nhau tín hiệu, và Google có thể chọn đúng bản cũ mồ côi để xếp hạng. <b>Việc cần làm:</b> chọn một bản chính thức cho mỗi cặp và cho bản còn lại <b>301 về bản chính</b> — không dùng canonical, vì bản cũ không nên tồn tại nữa." data-en="<b>15 old URLs still return 200, but 11 of them are absent from the sitemap.</b> They are orphans: nothing links to them internally and nothing declares them, yet Google can still reach them because they were indexed earlier. Worse, most of them <b>duplicate a new article almost exactly</b>. The clearest pair: <code>/articles/the-best-home-builders-adelaide</code> (old, alive, outside the sitemap) against <code>/articles/how-to-compare-the-best-home-builders-adelaide-before-you-sign</code> (new, in the sitemap). The same pattern applies to <code>bim-3d-4d-5d-explained</code>, <code>what-is-bim-3d-modeling</code>, <code>construction-program-management-software</code>, <code>duplex-house-design-in-australia</code>, <code>3d-house-design-guide</code>, <code>contemporary-houses-a-practical-guide</code>, <code>custom-home-visualisation-timeline</code>, <code>project-management-and-cost-control</code>, <code>program-for-construction-estimates-explained</code> and <code>virtual-reality-home-walkthrough</code>. <b>Consequence:</b> two URLs chasing one query split their signals, and Google may well rank the orphaned old version. <b>What to do:</b> pick one canonical version per pair and <b>301 the other to it</b> &#8212; not a canonical tag, because the old URL should no longer exist."></p>
  </div>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 · MỚI · FAQPage biến mất khỏi toàn bộ 24 bài" data-en="P1 · NEW · FAQPage gone from all 24 articles"></div>
    <p class="t" data-vi="<b><code>FAQPage</code> rơi từ 56/68 bài (82,4%) xuống 0/24 bài (0%).</b> Template bài viết mới chỉ phát hai khối JSON-LD: <code>Article</code> và <code>BreadcrumbList</code>. Đã kiểm lại trên rendered DOM của <code>/articles/how-to-compare-the-best-home-builders-adelaide-before-you-sign</code> — <b>không chỉ schema mất, mà mục FAQ trong thân bài cũng không còn</b>, chuỗi &quot;frequently asked&quot; không xuất hiện ở bất kỳ đâu trong nội dung render. Vậy đây không phải lỗi đọc HTML thô mà là <b>quyết định nội dung</b> khi làm lại template. <b>Vì sao đáng tiếc:</b> nhóm bài trước đây là nguồn duy nhất tạo rich result dạng câu hỏi cho site, và khối FAQ là dạng nội dung được các công cụ AI search trích dẫn nhiều nhất vì đã ở sẵn định dạng hỏi–đáp. <b>Việc cần làm:</b> đưa lại khối FAQ 4–6 câu vào cuối mỗi bài kèm <code>FAQPage</code> trong template, để mọi bài viết sau này có sẵn thay vì phải bổ sung thủ công." data-en="<b><code>FAQPage</code> fell from 56 of 68 articles (82.4%) to 0 of 24 (0%).</b> The new article template emits only two JSON-LD blocks: <code>Article</code> and <code>BreadcrumbList</code>. Re-checked in the rendered DOM of <code>/articles/how-to-compare-the-best-home-builders-adelaide-before-you-sign</code> &#8212; <b>the schema is gone and so is the FAQ section in the body</b>: the string &quot;frequently asked&quot; appears nowhere in the rendered content. So this is not a raw-HTML parsing artefact but <b>a content decision</b> taken during the rebuild. <b>Why it matters:</b> articles were the site's only source of question-style rich results, and FAQ blocks are among the most frequently cited content formats in AI search because they already sit in question-and-answer form. <b>What to do:</b> put a 4&#8211;6 question FAQ block back at the foot of the article template with <code>FAQPage</code> attached, so every future article ships with one rather than needing a manual retrofit."></p>
  </div>

  <div class="ins win">
    <div class="prio t" data-vi="&#10003; THẮNG · P1 tồn từ 03/08 đã đóng · 6 trang dự án lần đầu có schema" data-en="&#10003; WIN · a P1 open since 3 Aug now closed · project pages carry schema for the first time"></div>
    <p class="t" data-vi="<b>Sáu trang <code>/projects/*</code> lần đầu tiên có structured data đầy đủ.</b> Mỗi trang nay phát một khối <code>@graph</code> gồm <code>Organization + WebSite + WebPage + CreativeWork + BreadcrumbList</code>. Đây là mục P1 mở từ 03/08 và đã nằm trong danh sách tồn đọng suốt một tháng. Cùng với đó, <b>ảnh thiếu alt trên trang dự án đã được xử lý dứt điểm</b>: <code>/projects/251-station-st</code> đo trên rendered DOM cho <b>0/21 ảnh thiếu alt</b> (trước đây 15/19 thiếu), và <b>16/21 ảnh đã bật lazy-load</b>. Trang chủ cũng sạch: <b>0/22 ảnh thiếu alt</b> (trước 7/11 thiếu), <b>17/22 ảnh lazy-load</b> (trước 0), và <b>không còn heading nhảy bậc</b> (trước 2&#8594;4). <b>Ba mục P2 cũ đã đóng cùng lúc.</b> Lỗi 14 khối JSON-LD trùng nhau cũng không tái phát — hệ số nhân bản giữ <b>1,0&#215;</b> sang ngày thứ mười sáu." data-en="<b>The six <code>/projects/*</code> pages carry full structured data for the first time.</b> Each now emits one <code>@graph</code> containing <code>Organization + WebSite + WebPage + CreativeWork + BreadcrumbList</code>. That P1 had been open since 3 Aug and had sat in the backlog for a month. Alongside it, <b>missing image alt text on project pages is fully resolved</b>: <code>/projects/251-station-st</code> measures <b>0 of 21 images missing alt</b> in the rendered DOM (previously 15 of 19 missing), with <b>16 of 21 lazy-loaded</b>. The homepage is clean too: <b>0 of 22 images missing alt</b> (previously 7 of 11), <b>17 of 22 lazy-loaded</b> (previously 0), and <b>no heading skips at all</b> (previously 2&#8594;4). <b>Three older P2 items closed at once.</b> The 14-duplicate-JSON-LD defect has also not returned &#8212; the duplication factor holds at <b>1.0&#215;</b> into a sixteenth day."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · MỚI · template bài viết và trang dự án nhảy H1 &#8594; H3" data-en="P2 · NEW · article and project templates jump H1 straight to H3"></div>
    <p class="t" data-vi="<b>38/47 trang có ít nhất một điểm nhảy bậc heading</b>, tăng mạnh từ 15 trang hôm 28/08. Nguyên nhân không phải nhiều lỗi mới rải rác mà là <b>một lỗi template lặp lại</b>: cả template bài viết lẫn template trang dự án đều đi thẳng từ <code>h1</code> sang <code>h3</code>, bỏ qua <code>h2</code>. Đã xác nhận trên rendered DOM của cả <code>/articles/how-to-compare-the-best-home-builders-adelaide-before-you-sign</code> và <code>/projects/251-station-st</code>. <b>Tin tốt là chi phí sửa rất thấp:</b> chỉ cần đổi cấp heading trong hai template thì <b>30 trang được dọn cùng lúc</b>. Trang chủ đã đúng chuẩn (H1 &#8594; H2 &#8594; H3), nên bản sửa có sẵn ngay trong codebase. Đây là việc rẻ nhất trong toàn bộ danh sách hôm nay và nên làm chung với lần deploy redirect." data-en="<b>38 of 47 pages carry at least one heading skip</b>, up sharply from 15 pages on 28 Aug. The cause is not scattered new mistakes but <b>one repeated template defect</b>: both the article template and the project template jump from <code>h1</code> straight to <code>h3</code>, skipping <code>h2</code>. Confirmed in the rendered DOM of both <code>/articles/how-to-compare-the-best-home-builders-adelaide-before-you-sign</code> and <code>/projects/251-station-st</code>. <b>The good news is the fix is cheap:</b> correcting the heading levels in two templates <b>clears 30 pages at once</b>. The homepage already follows the correct order (H1 &#8594; H2 &#8594; H3), so a working reference exists in the codebase. This is the lowest-cost item on today's list and should ship alongside the redirect deploy."></p>
  </div>

  <div class="ins p3">
    <div class="prio t" data-vi="P3 · Còn tồn · nội dung mỏng ở 13 trang · 6 trang dự án vẫn ~180 từ" data-en="P3 · Persisting · 13 thin pages · the 6 project pages still sit at ~180 words"></div>
    <p class="t" data-vi="<b>13/47 trang dưới 300 từ.</b> Sáu trang dự án đứng ở <b>170–188 từ</b>, gần như không đổi so với ~250 từ đo hôm 28/08 và vẫn là mục tồn lâu nhất trong báo cáo. Bảy trang còn lại là <code>/modules</code> (190), <code>/projects</code> (182), <code>/contact</code> (186), <code>/articles</code> (257), <code>/interiors</code> (298), <code>/start-interactive</code> (43) và <code>/login</code> (15) — hai trang cuối là trang tiện ích nên không tính là lỗi. <b>Vì sao vẫn để ở P3 dù Content rơi xuống 62:</b> đợt rơi điểm Content hôm nay đến từ việc mất 44 bài viết, không phải từ mấy trang mỏng này; sửa 6 trang dự án <b>không kéo lại được điểm đã mất</b>. Tuy vậy đây vẫn là việc duy nhất nâng được đồng thời hai hạng mục Content và On-page, và nên xếp sau khi ba mục P1 đã xong." data-en="<b>13 of 47 pages fall under 300 words.</b> The six project pages sit at <b>170&#8211;188 words</b>, effectively unchanged from the ~250 measured on 28 Aug, and remain the longest-standing item in this report. The others are <code>/modules</code> (190), <code>/projects</code> (182), <code>/contact</code> (186), <code>/articles</code> (257), <code>/interiors</code> (298), <code>/start-interactive</code> (43) and <code>/login</code> (15) &#8212; the last two are utility pages and not defects. <b>Why it stays at P3 even though Content dropped to 62:</b> today's Content fall comes from losing 44 articles, not from these thin pages; fixing the six project pages <b>will not recover the lost points</b>. It remains the only job that lifts Content and On-page together, and it should queue behind the three P1s."></p>
  </div>

  <div class="ins p3">
    <div class="prio t" data-vi="P3 · Đứng yên · 13/47 tiêu đề ngoài dải 30–65 ký tự" data-en="P3 · Flat · 13 of 47 titles fall outside the 30&#8211;65 character band"></div>
    <p class="t" data-vi="<b>13/47 tiêu đề nằm ngoài dải 30–65 ký tự</b> (27,7%, so với 38,5% hôm 28/08 — tỉ lệ tốt lên chủ yếu vì mẫu nhỏ đi). Dải đo hiện tại là <b>26–80 ký tự</b>. Phần dài vượt ngưỡng đến từ chính các slug mới, vốn được đặt dài hơn hẳn bộ cũ; ví dụ <code>bim-for-architects-australia-key-strategies-for-seamless-custom-home-design</code>. <b>Mặt tích cực:</b> <b>47/47 trang đều có đủ title, meta description và canonical</b>, và <b>47/47 trang có đúng một thẻ H1</b> — cả hai chỉ số này giữ sạch qua đợt thay site, cho thấy phần meta của template mới được làm cẩn thận. <b>Việc cần làm:</b> đưa trần độ dài title vào quy trình xuất bản trước, rồi mới rút gọn 13 tiêu đề hiện tại — làm ngược lại thì vài tuần nữa sẽ lặp lại đúng vấn đề." data-en="<b>13 of 47 titles fall outside the 30&#8211;65 character band</b> (27.7%, against 38.5% on 28 Aug &#8212; the ratio improves mostly because the sample shrank). The current range is <b>26&#8211;80 characters</b>. The overlong end comes from the new slugs themselves, which are noticeably longer than the old set; for example <code>bim-for-architects-australia-key-strategies-for-seamless-custom-home-design</code>. <b>On the positive side:</b> <b>all 47 pages carry a title, meta description and canonical</b>, and <b>all 47 carry exactly one H1</b> &#8212; both held clean through the migration, which suggests the meta layer of the new template was built carefully. <b>What to do:</b> put a title-length cap into the publishing workflow first, then trim the 13 current titles &#8212; doing it the other way round reproduces the same problem in a few weeks."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="Roadmap · Next steps ưu tiên" data-en="Roadmap · Prioritised next steps"></div>

ing window</b>: once Google drops the URLs from the index after 2&#8211;4 weeks, the recoverable link equity falls sharply. The full list sits in <code>data/2026-08-28.json</code> in this repo. <b>(2) Clean up the 11 duplicate orphans</b> &#8212; 301 the old version to the new one; left alone, the old pages compete with the very articles meant to replace them. <b>(3) Restore the FAQ block and <code>FAQPage</code> in the article template</b> &#8212; fixing the template covers the 24 current articles and everything published afterwards, rather than retrofitting one by one. <b>(4) Correct the heading levels in the two templates</b> &#8212; <code>h3</code> to <code>h2</code>, clearing 30 of the 38 skip pages, under 15 minutes. <b>(5) Write real content for the 6 project pages</b> &#8212; from ~180 to 600+ words. <b>(6) Put a title-length cap into the publishing workflow.</b> <b>Today's job:</b> resubmit the new sitemap in Search Console and open the Coverage report to watch how many URLs land in &quot;Not found (404)&quot; &#8212; that number shows how far Google has got."></p>

function trFmt(d){const p=d.split('-');return LANG==='vi'?p[2]+'/'+p[1]:p[2]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1];}

/* generic multi-series line chart -> inline SVG string */
function trChart(rows, series, opts){
  opts = opts || {};
  const W=520, H=opts.h||210, L=42, R=12, TP=14, BT=30;
  const iw=W-L-R, ih=H-TP-BT;
  let vals=[]; series.forEach(s=>rows.forEach(r=>{const v=r[s.i]; if(v!==null&&v!==0||s.zero)vals.push(v);}));
  let lo = opts.min!==undefined?opts.min:Math.min.apply(null,vals);
  let hi = opts.max!==undefined?opts.max:Math.max.apply(null,vals);
  if(hi===lo){hi=lo+1;}
  const pad=(hi-lo)*0.12; lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=>L+(rows.length<2?iw/2:i*iw/(rows.length-1));
  const Y=v=>TP+ih-(v-lo)/(hi-lo)*ih;
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let g='';
  /* gridlines + y labels */
  const TICKS=4;
  for(let t=0;t<=TICKS;t++){
    const v=lo+(hi-lo)*t/TICKS, y=Y(v);
    g+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" ${t?'stroke-dasharray="3 4"':''}/>`;
    g+=`<text x="${L-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">${Math.round(v).toLocaleString(loc)}</text>`;
  }
  /* x labels: first, last and every other */
  rows.forEach((r,i)=>{
    if(i!==0 && i!==rows.length-1 && i%2) return;
    g+=`<text x="${X(i).toFixed(1)}" y="${H-11}" text-anchor="middle" font-size="9" fill="var(--muted)">${trFmt(r[0])}</text>`;
  });
  /* series */
  series.forEach(s=>{
    const pts=[];
    rows.forEach((r,i)=>{const v=r[s.i]; if(v===null||(v===0&&!s.zero))return; pts.push([X(i),Y(v),v,r[0]]);});
    if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area){
      g+=`<path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${TP+ih} L ${pts[0][0].toFixed(1)} ${TP+ih} Z" fill="${s.c}" opacity=".10"/>`;
    }
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{
      g+=`<circle class="tr-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.w>2?3:2.4}" fill="var(--card)" stroke="${s.c}" stroke-width="1.8"><title>${s.n} · ${trFmt(p[3])}: ${p[2].toLocaleString(loc)}${opts.unit||''}</title></circle>`;
    });
    /* value label on the last point */
    if(s.last!==false){
      const lp=pts[pts.length-1];
      g+=`<text x="${(lp[0]+6).toFixed(1)}" y="${(lp[1]-6).toFixed(1)}" font-size="10.5" font-weight="700" fill="${s.c}">${lp[2].toLocaleString(loc)}</text>`;
    }
  });
  const lg=series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('');
  return `<svg class="tr-svg" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tr-lg">${lg}</div>`;
}

  document.getElementById('trSize').innerHTML = trChart(TREND,[
    {i:7,n:vi?'Trang crawl được':'Pages crawled',c:'#b8935a',w:2.6,area:true}],{h:200});
  const T3=TREND.filter(r=>r[11]>0);
  document.getElementById('trSize').innerHTML += trChart(T3,[
    {i:11,n:vi?'Số từ TB mỗi bài':'Avg words per article',c:'#8a6fa8',w:2.6,area:true}],{h:170});
}

/* ---------- collapsible date picker ---------- */
function pkFold(force){
  const b=document.getElementById('pkToggle'), w=document.getElementById('pkWrap');
  const open = force!==undefined ? force : b.getAttribute('aria-expanded')!=='true';
  b.setAttribute('aria-expanded', open?'true':'false');
  w.hidden = !open;
  if(!open){ const p=document.getElementById('dpPane'); if(p) p.classList.remove('open'); }
}
function foldSec(btnId, wrapId){
  const b=document.getElementById(btnId), w=document.getElementById(wrapId);
  const open = b.getAttribute("aria-expanded")!=="true";
  b.setAttribute("aria-expanded", open?"true":"false");
  w.hidden = !open;
}
function pkToggleLabel(){
  const el=document.getElementById('pkToggleSel'); if(!el) return;
  const one = PK_SEL.s===PK_SEL.e;
  const cur = PK_SEL.s===PK_TODAY;
  el.textContent = LANG==='vi'
    ? (one ? (cur?'· đang xem bản hôm nay ('+pkFmt(PK_SEL.s)+')':'· đang xem '+pkFmt(PK_SEL.s)) : '· khoảng '+pkFmt(PK_SEL.s)+' – '+pkFmt(PK_SEL.e))
    : (one ? (cur?'· viewing today ('+pkFmt(PK_SEL.s)+')':'· viewing '+pkFmt(PK_SEL.s)) : '· range '+pkFmt(PK_SEL.s)+' – '+pkFmt(PK_SEL.e));
}

let LANG = 'en';

function applyLang(){
  document.querySelectorAll('.t').forEach(e=>{
    const v = e.dataset[LANG];
    if(v!==undefined) e.innerHTML = v;
  });
  document.querySelectorAll('.tsvg').forEach(e=>{
    const v = e.dataset[LANG];
    if(v!==undefined) e.textContent = v;
  });
}

function setLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('btnVI').classList.toggle('active', l==='vi');
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.querySelectorAll('.langfix button[data-l]').forEach(b=>
    b.classList.toggle('active', b.dataset.l===l));
  applyLang();
  render();
  if(typeof pkRender==='function' && PK_SNAPS.length) pkRender();
}

function renderRt(){
  const loaded = [...PAGES].sort((a,b)=>b.rt-a.rt);
  const max = 1000;
  const col = ms => ms<1000?'var(--green)':ms<3000?'var(--accent)':ms<6000?'var(--amber)':'var(--red)';
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let h='';
  loaded.forEach(p=>{
    const w=Math.max(2,(p.rt/max*100)).toFixed(1);
    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

const tbody=document.querySelector('#pt tbody');
let sortK='rt', sortDir=1, filt='all';
function render(){
  renderRt();
  renderTrend();
  pkToggleLabel();
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let rows=[...PAGES];
  if(filt!=='all')rows=rows.filter(p=>p.grp===filt);
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}
    return sortDir*(x-y);
  });
  tbody.innerHTML=rows.map(p=>{
    const st='<span class="badge b200">200</span>';
    const sc=p.schema>0?`<span class="yes">${p.schema}</span>`:'<span class="no">0</span>';
    const sm=p.sm?'<span class="yes">✓</span>':'<span class="no">✗</span>';
    const rtc=p.rt<1000?'var(--green)':p.rt<3000?'var(--accent-dk)':p.rt<6000?'var(--amber)':'var(--red)';
    return `<tr>
      <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.url}">${p.url}</td>
      <td class="num">${st}</td>
      <td class="num" style="color:${rtc};font-weight:700">${p.rt.toLocaleString(loc)}</td>
      <td class="num">${p.words}</td>
      <td class="num">${sc}</td>
      <td class="num">${p.links}</td>
      <td>${sm}</td></tr>`;
  }).join('');
}
document.querySelectorAll('#pt th').forEach(th=>{
  th.addEventListener('click',()=>{
    const k=th.dataset.k;
    if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1;}
    render();
  });
});
document.querySelectorAll('.filter-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');filt=b.dataset.f;render();
  });
});

/* ================= date picker v2 (sample-matched) ================= */
const PK_BASE  = '../';
const PK_TODAY = '2026-09-03';
let PK_SNAPS = [], PK_MAP = {}, PK_VIEW = null;
let PK_SEL = {s:PK_TODAY, e:PK_TODAY}, PK_DRAFT = {s:PK_TODAY, e:PK_TODAY}, PK_PENDING = false, PK_PRESET = null;

const PK_T = {
  vi:{day:'Ngày',range:'Khoảng',now:d=>`Đang xem báo cáo ngày ${d} (mới nhất)`,
      viewing:d=>`Đang xem báo cáo ngày ${d}`,
      trend:(a,b)=>`Đang xem xu hướng ${a} → ${b}`,
      quick:'Mở nhanh', today:'mới nhất',
      months:['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'],
      dow:['CN','T2','T3','T4','T5','T6','T7'],
      saved:n=>`${n} ngày đã lưu trong khoảng này · ngày theo giờ Việt Nam (Asia/Ho_Chi_Minh), là giờ lúc quét`,
      noRep:'Ngày này chưa quét — không có báo cáo riêng để mở.',
      trendTitle:(a,b)=>`Xu hướng Health Score · ${a} → ${b}`,
      open:'mở'},
  en:{day:'Day',range:'Range',now:d=>`Viewing the report for ${d} (latest)`,
      viewing:d=>`Viewing the report for ${d}`,
      trend:(a,b)=>`Viewing the trend ${a} → ${b}`,
      quick:'Quick open', today:'latest',
      months:['January','February','March','April','May','June','July','August','September','October','November','December'],
      dow:['Su','Mo','Tu','We','Th','Fr','Sa'],
      saved:n=>`${n} stored day(s) in this range · dates in Vietnam time (Asia/Ho_Chi_Minh), the time of the crawl`,
      noRep:'This day was not crawled — there is no separate report to open.',
      trendTitle:(a,b)=>`Health Score trend · ${a} → ${b}`,
      open:'open'}
};
const pkL = () => PK_T[LANG];

function pkISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pkD(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function pkFmt(iso){ const [y,m,d]=iso.split('-'); return LANG==='vi'?`${d}/${m}/${y}`:`${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`; }
function pkAdd(iso,n){ const d=pkD(iso); d.setDate(d.getDate()+n); return pkISO(d); }
function pkIn(iso,a,b){ return iso>=a && iso<=b; }
function pkCount(a,b){ return PK_SNAPS.filter(s=>pkIn(s.date,a,b)).length; }

function pkPresets(){
  const T=PK_TODAY, d=pkD(T);
  const monStart=(()=>{const x=pkD(T); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return pkISO(x);})();
  const lastMonStart=pkAdd(monStart,-7), lastMonEnd=pkAdd(monStart,-1);
  const mStart=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
  const pmStart=pkISO(pm), pmEnd=pkISO(new Date(d.getFullYear(),d.getMonth(),0));
  const first=PK_SNAPS.length?PK_SNAPS[0].date:T;
  return [
    {k:'y',   vi:'Hôm qua',   en:'Yesterday',   s:pkAdd(T,-1), e:pkAdd(T,-1)},
    {k:'7',   vi:'7 ngày qua', en:'Last 7 days',  s:pkAdd(T,-6), e:T},
    {k:'28',  vi:'28 ngày qua',en:'Last 28 days', s:pkAdd(T,-27),e:T},
    {k:'90',  vi:'90 ngày qua',en:'Last 90 days', s:pkAdd(T,-89),e:T},
    {k:'tw',  vi:'Tuần này',  en:'This week',   s:monStart, e:T},
    {k:'tm',  vi:'Tháng này', en:'This month',  s:mStart, e:T},
    {k:'ty',  vi:'Năm nay',   en:'This year',   s:`${d.getFullYear()}-01-01`, e:T},
    {k:'lw',  vi:'Tuần trước',en:'Last week',   s:lastMonStart, e:lastMonEnd},
    {k:'lm',  vi:'Tháng trước',en:'Last month', s:pmStart, e:pmEnd},
    {k:'all', vi:'Toàn bộ dữ liệu đã lưu', en:'All stored data', s:first, e:T}
  ];
}

function pkRenderPresets(){
  const box=document.getElementById('dpPresets'); if(!box) return;
  box.innerHTML = pkPresets().map(p=>{
    const n=pkCount(p.s,p.e), off=n===0;
    const on=PK_PRESET===p.k;
    return `<button type="button" class="dp-preset${on?' on':''}" data-k="${p.k}" ${off?'disabled':''}>
      <span class="rd"></span><span class="nm">${LANG==='vi'?p.vi:p.en}</span><span class="ct">${n}</span></button>`;
  }).join('');
  box.querySelectorAll('.dp-preset').forEach(b=>b.addEventListener('click',()=>{
    const p=pkPresets().find(x=>x.k===b.dataset.k);
    PK_PRESET=p.k; PK_DRAFT={s:p.s,e:p.e}; PK_PENDING=false;
    PK_VIEW=pkD(p.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1);
    pkRenderCal(); pkRenderPresets();
  }));
}

function pkMonth(base,off){
  const d=new Date(base.getFullYear(), base.getMonth()+off, 1);
  const y=d.getFullYear(), m=d.getMonth();
  const start=new Date(y,m,1).getDay(); // 0=Sun
  const days=new Date(y,m+1,0).getDate();
  let cells=pkL().dow.map(x=>`<div class="dp-dow">${x}</div>`).join('');
  for(let i=0;i<start;i++) cells+='<button class="dp-d blank" disabled></button>';
  for(let dd=1;dd<=days;dd++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const has=!!PK_MAP[iso];
    const sel=iso===PK_DRAFT.s||iso===PK_DRAFT.e;
    const inr=pkIn(iso,PK_DRAFT.s,PK_DRAFT.e)&&!sel;
    const edge=iso===PK_DRAFT.s&&PK_DRAFT.s!==PK_DRAFT.e?' edge-l':(iso===PK_DRAFT.e&&PK_DRAFT.s!==PK_DRAFT.e?' edge-r':'');
    cells+=`<button type="button" class="dp-d${has?' has':''}${inr?' inrange':''}${sel?' sel'+edge:''}" data-iso="${iso}">${dd}${has?'<span class="dot"></span>':''}</button>`;
  }
  return {title:`${pkL().months[m]} ${y}`, html:`<div class="dp-grid">${cells}</div>`};
}

function pkRenderCal(){
  if(!PK_VIEW){ PK_VIEW=pkD(PK_SEL.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1); }
  const a=pkMonth(PK_VIEW,0), b=pkMonth(PK_VIEW,1);
  document.getElementById('dpM1').textContent=a.title;
  document.getElementById('dpM2').textContent=b.title;
  document.getElementById('dpG1').innerHTML=a.html;
  document.getElementById('dpG2').innerHTML=b.html;
  document.querySelectorAll('#dpG1 .dp-d,#dpG2 .dp-d').forEach(el=>{
    if(el.classList.contains('blank')) return;
    el.addEventListener('click',()=>{
      const iso=el.dataset.iso;
      if(!PK_PENDING){ PK_DRAFT={s:iso,e:iso}; PK_PENDING=true; }
      else { PK_DRAFT = iso<PK_DRAFT.s ? {s:iso,e:PK_DRAFT.s} : {s:PK_DRAFT.s,e:iso}; PK_PENDING=false; }
      PK_PRESET=null; pkRenderCal(); pkRenderPresets();
    });
  });
  const single=PK_DRAFT.s===PK_DRAFT.e;
  document.getElementById('dpSelD').textContent = single?pkFmt(PK_DRAFT.s):`${pkFmt(PK_DRAFT.s)} → ${pkFmt(PK_DRAFT.e)}`;
  const n=pkCount(PK_DRAFT.s,PK_DRAFT.e);
  document.getElementById('dpSelInfo').textContent = n===0 ? pkL().noRep : pkL().saved(n);
}

function pkRenderQuick(){
  const box=document.getElementById('dpQuick'); if(!box) return;
  const chips=PK_SNAPS.slice().reverse().map(s=>{
    const cur=s.date===PK_SEL.s&&PK_SEL.s===PK_SEL.e;
    const lb=LANG==='vi'?(s.label_vi||''):(s.label_en||'');
    return `<button type="button" class="qchip${cur?' cur':''}" data-iso="${s.date}">
      <span class="qd">${pkFmt(s.date)}</span><span class="ql">${lb}</span></button>`;
  }).join('');
  box.innerHTML=`<span class="pk-quick-lbl">${pkL().quick}</span>`+chips;
  box.querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('cur')) return;
    pkGo(b.dataset.iso,b.dataset.iso);
  }));
}

function pkRenderNow(){
  const el=document.getElementById('dpNow'); if(!el) return;
  const single=PK_SEL.s===PK_SEL.e;
  el.textContent = !single ? pkL().trend(pkFmt(PK_SEL.s),pkFmt(PK_SEL.e))
    : (PK_SEL.s===PK_TODAY ? pkL().now(pkFmt(PK_SEL.s)) : pkL().viewing(pkFmt(PK_SEL.s)));
  document.getElementById('dpLabel').textContent = single
    ? `${pkL().day} ${pkFmt(PK_SEL.s)}` : `${pkL().range} ${pkFmt(PK_SEL.s)} → ${pkFmt(PK_SEL.e)}`;
}

function pkGo(s,e){
  if(s===e){
    const snap=PK_MAP[s];
    if(snap && s!==PK_TODAY){ location.href=PK_BASE+snap.report; return; }
    PK_SEL={s,e}; PK_DRAFT={s,e}; PK_PRESET=null;
    document.getElementById('dpTrend').classList.remove('on');
    pkRenderNow(); pkRenderQuick(); pkRenderCal();
    return;
  }
  PK_SEL={s,e}; pkRenderNow(); pkRenderQuick(); pkTrend(s,e);
}

function pkTrend(s,e){
  const box=document.getElementById('dpTrend');
  const days=PK_SNAPS.filter(x=>pkIn(x.date,s,e));
  if(!days.length){ box.classList.remove('on'); box.innerHTML=''; return; }
  Promise.all(days.map(d=>fetch(PK_BASE+d.data,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)))
   .then(js=>{
     const rows=js.map((j,i)=>({date:days[i].date, rep:days[i].report, hs:j&&j.health_score, pg:j&&j.pages_measured}))
                  .filter(r=>r.hs!=null);
     box.innerHTML=`<h4>${pkL().trendTitle(pkFmt(s),pkFmt(e))}</h4>`+rows.map(r=>`
       <div class="trd"><span class="tdate">${pkFmt(r.date)}</span>
         <span class="ttrack"><span class="tfill" style="width:${r.hs}%"></span></span>
         <span class="tval">${r.hs}</span>
         <span class="tlink" data-h="${r.rep}">${pkL().open} &#8594;</span></div>`).join('');
     box.classList.add('on');
     box.querySelectorAll('.tlink').forEach(a=>a.addEventListener('click',()=>{
       const h=a.dataset.h; if(h && h!=='index.html') location.href=PK_BASE+h;
     }));
   });
}

function pkRender(){ pkRenderPresets(); pkRenderCal(); pkRenderQuick(); pkRenderNow(); pkToggleLabel(); }

(function pkInit(){
  const btn=document.getElementById('dpBtn'), pane=document.getElementById('dpPane');
  if(!btn) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=pane.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
    if(open){ PK_DRAFT={...PK_SEL}; PK_PENDING=false; pkRenderCal(); pkRenderPresets(); }
  });
  document.addEventListener('click',e=>{
    if(!pane.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') pane.classList.remove('open'); });
  document.getElementById('dpPrev').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()-1); pkRenderCal(); });
  document.getElementById('dpNext').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()+1); pkRenderCal(); });
  document.getElementById('dpCancel').addEventListener('click',()=>{
    PK_DRAFT={...PK_SEL}; PK_PENDING=false; PK_PRESET=null;
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false'); pkRenderCal();
  });
  document.getElementById('dpApply').addEventListener('click',()=>{
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    pkGo(PK_DRAFT.s,PK_DRAFT.e);
  });
  fetch(PK_BASE+'data/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    PK_SNAPS=(j.snapshots||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s);
    pkRender();
  }).catch(()=>{
    PK_SNAPS=[{date:PK_TODAY,report:'index.html',data:'data/'+PK_TODAY+'.json',label_vi:'Bản hiện tại',label_en:'Current report'}];
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s); pkRender();
  });
})();

setLang('en');
</script>
