<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .legend .foot{display:block;line-height:1.55}
  .legend{max-width:520px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}

  /* ---------- date picker v2 (sample-matched) ---------- */
  .pk-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 16px;box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .pk-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;
    letter-spacing:.9px;text-transform:uppercase;color:var(--accent-dk);margin:0 0 8px}
  .pk-title .bar{width:26px;height:3px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  .pk-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;max-width:900px}
  .pk-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dpwrap{position:relative}
  .dpbtn{display:inline-flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid #cfc6b3;border-radius:10px;padding:10px 15px;font-family:inherit;
    font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink);cursor:pointer;transition:.15s}
  .dpbtn:hover{border-color:var(--accent)}
  .dpbtn .car{color:var(--muted);font-size:9px;margin-left:2px}
  .pk-now{display:inline-block;background:var(--accent-soft,#f3e7d3);color:var(--accent-dk);
    border:1px solid #e6d5b8;border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700}

  .dppane{position:absolute;top:calc(100% + 9px);left:0;z-index:80;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 40px rgba(70,55,30,.20);overflow:hidden}
  .dppane.open{display:flex}
  .dp-presets{width:196px;flex:0 0 auto;border-right:1px solid var(--line);
    padding:12px 8px;background:#fdfbf6;max-height:430px;overflow:auto}
  .dp-preset{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;
    font-size:12.5px;color:var(--ink);transition:.12s}
  .dp-preset:hover:not(:disabled){background:var(--cream2)}
  .dp-preset:disabled{color:#bdb4a6;cursor:not-allowed}
  .dp-preset .rd{width:13px;height:13px;border-radius:50%;border:1.5px solid #c3b9a6;flex:0 0 auto;position:relative}
  .dp-preset.on .rd{border-color:var(--accent)}
  .dp-preset.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
  .dp-preset .nm{flex:1}
  .dp-preset .ct{font-size:11.5px;color:var(--faint,#9a9186);font-weight:700}

  .dp-right{padding:14px 16px 12px;min-width:452px}
  .dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .dp-nav button{background:transparent;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
  .dp-nav button:hover:not(:disabled){background:var(--cream2);color:var(--ink)}
  .dp-nav button:disabled{opacity:.3;cursor:not-allowed}
  .dp-nav .mtitle{flex:1;display:flex;justify-content:space-around;font-size:13.5px;font-weight:700}
  .dp-months{display:flex;gap:26px}
  .dp-m{flex:1}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dp-dow{font-size:10.5px;color:var(--muted);text-align:center;padding:5px 0 3px;font-weight:700}
  .dp-d{position:relative;height:29px;border:none;background:transparent;border-radius:7px;
    font-family:inherit;font-size:12.5px;color:#bdb4a6;cursor:pointer;padding:0;transition:.1s}
  .dp-d.blank{cursor:default}
  .dp-d.has{color:var(--ink);font-weight:700}
  .dp-d:hover:not(.blank):not(.sel){background:var(--cream2)}
  .dp-d.inrange{background:var(--accent-soft,#f3e7d3);border-radius:0}
  .dp-d.sel{background:var(--accent);color:#2c2620;font-weight:800}
  .dp-d.sel.edge-l{border-radius:7px 0 0 7px}
  .dp-d.sel.edge-r{border-radius:0 7px 7px 0}
  .dp-d .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:3.5px;height:3.5px;border-radius:50%;background:var(--accent)}
  .dp-d.sel .dot{background:#2c2620}

  .dp-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-selinfo .d1{font-size:13.5px;font-weight:700}
  .dp-selinfo .d2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;max-width:300px}
  .dp-actions{display:flex;gap:9px;flex:0 0 auto}
  .dp-actions button{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:9px;
    padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .dp-actions .go{background:var(--accent);border-color:var(--accent);color:#2c2620}
  .dp-actions .go:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
  .dp-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
  .dp-legend .dotlg{display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-right:4px}

  .pk-quick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;
    padding-top:14px;border-top:1px solid var(--line)}
  .pk-quick-lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);
    text-transform:uppercase;flex:0 0 auto;margin-right:2px}
  .qchip{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--ink);transition:.13s;text-align:left}
  .qchip:hover{border-color:var(--accent);background:#fdfaf3}
  .qchip .qd{font-weight:700;flex:0 0 auto}
  .qchip .ql{font-size:11.5px;color:var(--muted)}
  .qchip.cur{background:var(--accent);border-color:var(--accent);color:#2c2620;cursor:default}
  .qchip.cur .ql{color:#5c4a24}

  .pk-trend{display:none;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .pk-trend.on{display:block}
  .pk-trend h4{margin:0 0 10px;font-size:13px;color:var(--accent-dk)}
  .trd{display:grid;grid-template-columns:88px 1fr 46px 62px;gap:9px;align-items:center;
    margin:6px 0;font-size:12.5px}
  .trd .tdate{font-weight:700}
  .trd .ttrack{background:var(--cream2);border-radius:6px;height:16px;overflow:hidden}
  .trd .tfill{height:100%;background:var(--accent);border-radius:6px}
  .trd .tval{font-weight:800;text-align:right}
  .trd .tlink{font-size:11px;color:var(--accent-dk);text-decoration:underline;cursor:pointer;text-align:right}
  @media(max-width:860px){.dppane.open{flex-direction:column}.dp-right{min-width:0}.dp-months{flex-direction:column;gap:14px}.dp-presets{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:none}}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 17 trang gốc + 54 bài /articles + 6 trang dự án + sitemap" data-en="Source: Chrome live crawl · 17 core pages + 54 /articles + 6 project pages + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>10/08/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>10 Aug 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>77 trang</b> · Sitemap: <b>76 URL</b>" data-en="Directly measured: <b>77 pages</b> · Sitemap: <b>76 URLs</b>"></span><br>
        Method: Chrome fetch tuần tự · AbortController 12–15s
      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <!-- date picker v2 -->
  <div class="pk-card">
    <div class="pk-title"><span class="bar"></span><span class="t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span></div>
    <p class="pk-sub t" data-vi="Chọn <b>một ngày</b> rồi bấm <b>Cập nhật</b> để mở đúng bản báo cáo đã lưu của ngày đó. Chọn <b>một khoảng ngày</b> để xem xu hướng trong khoảng. Ngày <b>có dấu chấm</b> là ngày đã quét và có báo cáo lưu; ngày làm mờ vẫn chọn được làm đầu/cuối khoảng, nhưng không có báo cáo riêng để mở." data-en="Pick <b>a single day</b> and press <b>Update</b> to open that day's saved report. Pick <b>a date range</b> to see the trend across it. Days <b>with a dot</b> were crawled and have a stored report; faded days can still anchor a range but have no report of their own."></p>
    <div class="pk-bar">
      <div class="dpwrap">
        <button class="dpbtn" id="dpBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>&#128197;</span><span id="dpLabel">Ngày 10/08/2026</span><span class="car">&#9660;</span>
        </button>
        <div class="dppane" id="dpPane" role="dialog">
          <div class="dp-presets" id="dpPresets"></div>
          <div class="dp-right">
            <div class="dp-nav">
              <button type="button" id="dpPrev" aria-label="prev">&#8249;</button>
              <div class="mtitle"><span id="dpM1"></span><span id="dpM2"></span></div>
              <button type="button" id="dpNext" aria-label="next">&#8250;</button>
            </div>
            <div class="dp-months"><div class="dp-m" id="dpG1"></div><div class="dp-m" id="dpG2"></div></div>
            <div class="dp-foot">
              <div class="dp-selinfo"><div class="d1" id="dpSelD"></div><div class="d2" id="dpSelInfo"></div></div>
              <div class="dp-actions">
                <button type="button" id="dpCancel" class="t" data-vi="Hủy" data-en="Cancel"></button>
                <button type="button" id="dpApply" class="go t" data-vi="Cập nhật" data-en="Update"></button>
              </div>
            </div>
            <div class="dp-legend"><span class="dotlg"></span><span class="t" data-vi="Dấu chấm = ngày đã có dữ liệu lưu. Ngày làm mờ = chưa quét: dùng được làm đầu/cuối khoảng, nhưng không mở được báo cáo riêng." data-en="Dot = a day with stored data. Faded day = not crawled: usable as a range endpoint, but it has no report of its own to open."></span></div>
          </div>
        </div>
      </div>
      <span class="pk-now" id="dpNow"></span>
    </div>
    <div class="pk-quick" id="dpQuick"></div>
    <div class="pk-trend" id="dpTrend"></div>
  </div>

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi">
      <div class="lbl t" data-vi="Health Score" data-en="Health Score"></div>
      <div class="score-ring">
        <div class="val" style="color:var(--accent-dk)">88<span style="font-size:15px;color:var(--muted)">/100</span></div>
      </div>
      <div class="note"><span class="tag green t" data-vi="Tốt — tốc độ tiếp tục cải thiện, nhưng ba ngày liền không có bản sửa nào" data-en="Good — speed keeps improving, but three days have passed with no fix deployed"></span></div>
      <div class="delta t" data-vi="&#61; giữ nguyên <b>88</b> so 07/08 · điểm thô 87,7 &#8594; <b>88,3</b>: Performance 92 &#8594; <b>94</b> và Content 79 &#8594; <b>80</b> nhờ tốc độ tốt lên và một bài mới; nhưng Crawlability (<b>96</b>), Structured Data (<b>87</b>) và On-page (<b>76</b>) <b>đứng yên tuyệt đối</b> vì không có bản sửa nào được deploy kể từ 07/08" data-en="&#61; holds at <b>88</b> vs 07 Aug · raw score 87.7 &#8594; <b>88.3</b>: Performance 92 &#8594; <b>94</b> and Content 79 &#8594; <b>80</b> on better speed and one new article; but Crawlability (<b>96</b>), Structured Data (<b>87</b>) and On-page (<b>76</b>) are <b>completely static</b> because nothing has been deployed since 07 Aug"></div>
    </div>
    <div class="kpi">
      <div class="lbl t" data-vi="Trang crawl được" data-en="Pages crawled"></div>
      <div class="val" style="color:var(--green)">77</div>
      <div class="note t" data-vi="17 gốc + 54 bài + 6 dự án · 77/77 trả 200" data-en="17 core + 54 articles + 6 projects · 77/77 return 200"></div>
      <div class="delta up t" data-vi="&#9650; +1 so 07/08 (76) · <b>bài mới đầu tiên kể từ khi bắt đầu chuỗi audit</b>: <code>/articles/kitchen-renovation-cost-melbourne</code> · sitemap 75 &#8594; <b>76 URL</b> · 0 timeout và 0 lỗi 4xx/5xx sang <b>ngày thứ sáu liên tiếp</b>" data-en="&#9650; +1 vs 07 Aug (76) · <b>the first new article since the audit series began</b>: <code>/articles/kitchen-renovation-cost-melbourne</code> · sitemap 75 &#8594; <b>76 URLs</b> · 0 timeouts and 0 4xx/5xx errors for a <b>sixth consecutive day</b>"></div>
    </div>
    <div class="kpi">

    <h4 class="t" data-vi="Bài mới đầu tiên của chuỗi audit ra đời đúng chuẩn, và nhóm trang gốc nhanh lên rõ rệt" data-en="The first new article of the audit series shipped correctly, and the core pages got measurably faster"></h4>
    <p class="t" data-vi="Hai tin tốt độc lập trong cùng một ngày. <b>Thứ nhất — bài mới.</b> <code>/articles/kitchen-renovation-cost-melbourne</code> là bài đầu tiên được xuất bản kể từ khi chuỗi audit bắt đầu, và nó ra đời <b>đúng chuẩn ngay từ đầu</b>: 2.427 từ, đủ <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> + <code>FAQPage</code>, 23 internal link, TTFB <b>0,56s</b>, có mặt trong sitemap và <b>đã tự động xuất hiện trong HTML thô của listing <code>/articles</code></b> mà không cần thao tác thủ công. Đây là bằng chứng bản sửa listing hôm 07/08 <b>hoạt động bền vững</b> chứ không phải một lần chạy tay. <b>Thứ hai — tốc độ.</b> TTFB trung bình giảm ở cả ba nhóm: trang gốc 0,86s &#8594; <b>0,71s</b>, bài viết 0,78s &#8594; <b>0,68s</b>, trang dự án 0,67s &#8594; <b>0,57s</b>. Nhóm dưới 1s nới rộng <b>69/76 &#8594; 72/77</b>. Ba trang gốc nhiều ảnh vốn nặng nhất đều cải thiện cùng chiều: <code>/interiors</code> 1,53s &#8594; 0,86s, <code>/modules</code> 1,16s &#8594; 0,88s, <code>/model</code> 1,00s &#8594; 0,86s — chuyển động đồng bộ như vậy thường phản ánh thay đổi ở tầng phục vụ hoặc cache, không phải nhiễu mạng." data-en="Two independent pieces of good news on the same day. <b>First, the new article.</b> <code>/articles/kitchen-renovation-cost-melbourne</code> is the first piece published since the audit series began, and it shipped <b>correct from the outset</b>: 2,427 words, a full <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> + <code>FAQPage</code> set, 23 internal links, 0.56s TTFB, present in the sitemap and <b>already visible in the raw HTML of the <code>/articles</code> listing</b> with no manual step. That is evidence the 07 Aug listing fix is <b>durable</b> rather than a one-off hand edit. <b>Second, speed.</b> Average TTFB fell across all three groups: core 0.86s &#8594; <b>0.71s</b>, articles 0.78s &#8594; <b>0.68s</b>, project pages 0.67s &#8594; <b>0.57s</b>. The under-1s band widened from <b>69 of 76 to 72 of 77</b>. The three heaviest image-led core pages all moved the same way: <code>/interiors</code> 1.53s &#8594; 0.86s, <code>/modules</code> 1.16s &#8594; 0.88s, <code>/model</code> 1.00s &#8594; 0.86s — a synchronised shift like that usually reflects a serving-layer or cache change rather than network noise."></p>
    <p class="fix t" data-vi="<b>Việc cần làm tiếp:</b> áp đúng quy trình của bài mới này cho <b>13 bài cũ còn thiếu <code>FAQPage</code></b> — bài mới chứng minh template đã sẵn sàng, chỉ là chưa ai chạy ngược lại. Và nếu tốc độ tốt lên là do một thay đổi cache/CDN có chủ đích, hãy ghi lại cấu hình đó để không bị vô tình hoàn tác." data-en="<b>Do next:</b> apply this new article&#39;s process to the <b>13 older articles still missing <code>FAQPage</code></b> — the new piece proves the template is ready, nobody has simply run it backwards yet. And if the speed gain came from a deliberate cache or CDN change, record that configuration so it is not undone by accident."></p>
  </div>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 · Còn tồn · sang ngày thứ 8 chưa sửa" data-en="P1 · Persisting · eighth day unfixed"></div>
    <h4 class="t" data-vi="Mỗi trang vẫn phát ra 14–32 khối JSON-LD y hệt nhau — 2.030 khối cho chỉ 225 payload thật" data-en="Every page still emits 14–32 byte-identical JSON-LD blocks — 2,030 blocks for only 225 real payloads"></h4>
    <p class="t" data-vi="Kiểm chứng lại bằng cách so <i>nội dung</i> khối chứ không chỉ đếm (<code>new Set(blocks).size</code>): <b>y nguyên sang ngày thứ 8</b>. Trang gốc <b>14 khối / 1 payload</b>; trang chủ <b>24 / 2</b>; <code>/articles</code> <b>22 / 1</b>; 6 trang dự án <b>14 / 1</b>; bài viết <b>32 / 4</b> (hoặc <b>31 / 3</b> ở 13 bài chưa có <code>FAQPage</code>). Cộng toàn site: <b>2.030 khối script</b> được phát ra để biểu đạt <b>225 payload thật</b> — hệ số nhân bản <b>9,0&#215;</b>. Chi tiết đáng chú ý hôm nay: <b>bài mới xuất bản hôm nay cũng ra đời với 32 khối cho 4 payload</b>, tức nội dung mới <b>vẫn tiếp tục kế thừa lỗi</b>. Điều đó xác nhận lần cuối rằng lỗi nằm ở <b>component/layout dùng chung</b> chứ không ở từng trang, và mỗi bài viết xuất bản thêm sẽ tự động mang theo khoảng 15–25 KB HTML thừa. Schema thật vẫn đúng chuẩn — <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> (+ <code>FAQPage</code> ở 41 bài), trang dự án là một khối <code>@graph</code> gồm <code>Organization</code> + <code>WebSite</code> + <code>WebPage</code> + <code>CreativeWork</code> + <code>BreadcrumbList</code> — chỉ đơn giản bị in ra nhiều lần." data-en="Re-verified by comparing block <i>content</i> rather than counting (<code>new Set(blocks).size</code>): <b>unchanged into an eighth day</b>. Core pages <b>14 blocks / 1 payload</b>; the homepage <b>24 / 2</b>; <code>/articles</code> <b>22 / 1</b>; the 6 project pages <b>14 / 1</b>; articles <b>32 / 4</b> (or <b>31 / 3</b> on the 13 without <code>FAQPage</code>). Site-wide that totals <b>2,030 script blocks</b> expressing <b>225 real payloads</b> — a duplication factor of <b>9.0&#215;</b>. The telling detail today: <b>the article published today also arrived with 32 blocks for 4 payloads</b>, so new content <b>keeps inheriting the defect</b>. That confirms once and for all that the fault sits in a <b>shared component or layout</b> rather than in individual pages, and that every further article automatically carries roughly 15–25 KB of surplus HTML. The genuine schema remains correct — <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> (+ <code>FAQPage</code> on 41), and one <code>@graph</code> per project page holding <code>Organization</code> + <code>WebSite</code> + <code>WebPage</code> + <code>CreativeWork</code> + <code>BreadcrumbList</code> — merely printed repeatedly."></p>
    <p class="fix t" data-vi="<b>Cách sửa (không đổi qua 8 ngày):</b> tìm component render <code>&lt;script type=&quot;application/ld+json&quot;&gt;</code> và đảm bảo nó chỉ chạy <b>một lần ở cấp document/head</b> (dedupe theo key, hoặc hoist lên root layout rồi bỏ khỏi các layout con). Sau khi sửa, mong đợi: trang gốc còn 1–2 khối, bài viết còn 4, trang dự án còn 1, HTML giảm 15–25 KB/trang. <b>Đây vẫn là việc P1 duy nhất</b> và là thứ duy nhất đang giữ Structured Data ở 87 thay vì 95+." data-en="<b>Fix (unchanged across eight days):</b> locate the component rendering <code>&lt;script type=&quot;application/ld+json&quot;&gt;</code> and make it execute <b>once at document/head level</b> (dedupe by key, or hoist to the root layout and remove it from nested layouts). After the fix expect 1–2 blocks on core pages, 4 on articles, 1 on project pages, and 15–25 KB less HTML per page. <b>This remains the only P1</b> and the only thing holding Structured Data at 87 rather than 95+."></p>

    <div class="prio t" data-vi="P2 · Còn tồn · sang ngày thứ 11 chưa sửa" data-en="P2 · Persisting · eleventh day unfixed"></div>
    <h4 class="t" data-vi="Trang chủ vẫn 7/11 ảnh thiếu alt, trang dự án 15/19, và cả hai vẫn 0 ảnh lazy-load" data-en="Homepage still 7 of 11 images without alt, project pages 15 of 19, and neither uses lazy-loading"></h4>
    <p class="t" data-vi="Rendered-DOM hôm nay cho kết quả <b>giống hệt từng con số</b> so 07/08: trang chủ <b>11 ảnh, 7 thiếu <code>alt</code>, 0 ảnh <code>loading=&quot;lazy&quot;</code></b>; <code>/projects/251-station-st</code> <b>19 ảnh, 15 thiếu <code>alt</code>, 0 lazy-load</b>. Đây là khuyến nghị P1 từ báo cáo 30/07 và nay <b>đã 11 ngày chưa deploy</b> — dài hơn cả tuổi thọ của lỗi P1 schema. Toàn site: <b>78/600 ảnh thiếu alt</b> và chỉ <b>213/600 ảnh</b> dùng lazy-load, gần như toàn bộ phần lazy-load nằm ở template bài viết; trang chủ và 6 trang dự án vẫn ở mức 0 tuyệt đối. Trang chủ đồng thời vẫn nhảy heading <b>2&#8594;4</b>. Điểm cần nói thẳng: hôm nay đội ngũ <b>đã có một lần deploy</b> (bài mới + thay đổi tốc độ), nghĩa là quy trình phát hành đang chạy — việc này bị bỏ lại <b>không phải vì thiếu cửa deploy</b>, mà vì chưa được đưa vào hàng đợi." data-en="Today&#39;s rendered DOM returns <b>identical figures</b> to 07 Aug: the homepage carries <b>11 images, 7 without <code>alt</code>, 0 using <code>loading=&quot;lazy&quot;</code></b>; <code>/projects/251-station-st</code> carries <b>19 images, 15 without <code>alt</code>, 0 lazy-loaded</b>. This was the 30 Jul report&#39;s P1 and has now gone <b>eleven days without a deploy</b> — longer than the schema P1 has existed. Site-wide: <b>78 of 600 images lack alt</b> and only <b>213 of 600</b> use lazy-loading, almost all of that from the article template; the homepage and the 6 project pages remain at absolute zero. The homepage also still skips <b>2&#8594;4</b> in heading order. Worth stating plainly: the team <b>did deploy today</b> (the new article plus the speed change), so the release process is running — this work is outstanding <b>not for lack of a deploy window</b> but because it has not been queued."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> một deploy nhỏ gộp cả ba việc: 7 <code>alt</code> trang chủ + 15 <code>alt</code> trang dự án + <code>loading=&quot;lazy&quot;</code> cho ảnh dưới màn hình đầu — copy đúng cách template bài viết đang làm. Ước tính ~30 phút, đưa On-page từ 76 lên khoảng <b>85</b> và Health lên khoảng <b>89,7</b>. <b>Đây vẫn là cách rẻ nhất còn lại để tăng điểm</b>, và giờ nó rẻ hơn cả việc sửa P1." data-en="<b>Fix:</b> one small deploy covering all three: 7 homepage <code>alt</code>s + 15 project-page <code>alt</code>s + <code>loading=&quot;lazy&quot;</code> below the fold — copy exactly what the article template already does. Roughly 30 minutes of work, lifting On-page from 76 to about <b>85</b> and Health to roughly <b>89.7</b>. <b>This is still the cheapest remaining point gain</b>, and it is now cheaper than fixing the P1."></p>
  </div>

  <div class="ins p3">
    <div class="prio t" data-vi="P3 · Đã khép lại · cảnh báo 07/08 nay xác nhận là trạng thái ổn định" data-en="P3 · Closed · the 07 Aug warning is now confirmed as a settled state"></div>
    <h4 class="t" data-vi="Việc footer/nav mất 5 internal link mỗi trang đã đứng yên ba ngày — coi như thay đổi có chủ đích" data-en="The footer/nav losing 5 internal links per page has held steady for three days — treat it as intentional"></h4>
    <p class="t" data-vi="Báo cáo 07/08 ghi nhận một thay đổi đồng loạt: internal link duy nhất giảm <b>22 &#8594; 17</b> ở trang gốc và trang dự án, <b>25–29 &#8594; 20–24</b> ở bài viết, kèm khoảng 60–120 từ chữ dùng chung biến mất, và đã đánh dấu là <i>cần xác nhận có chủ đích hay không</i>. Sau ba ngày, số đo hôm nay <b>trùng khớp gần như tuyệt đối</b>: trang gốc <b>17</b>, trang dự án <b>17</b>, bài viết <b>20–24</b>, và số từ mỗi trang chỉ dao động trong khoảng &#177;10 từ so 07/08 (ví dụ <code>/faq</code> giữ nguyên 1.315, <code>/contact</code> 187, <code>/interior-finishes</code> 2.808 &#8594; 2.813). <b>Không có đợt giảm thứ hai</b>, cũng không có dấu hiệu hồi phục. Diễn giải: đây là một lần rút gọn footer/nav <b>một lần rồi dừng</b> — đúng dấu hiệu của một thay đổi thiết kế có chủ đích, chứ không phải rò rỉ dần do lỗi. Ngoại lệ duy nhất vẫn là <code>/articles</code> với <b>71 link</b> (70 hôm 07/08, tăng 1 đúng bằng bài mới)." data-en="The 07 Aug report recorded a uniform change: unique internal links fell <b>22 &#8594; 17</b> on core and project pages and <b>25–29 &#8594; 20–24</b> on articles, alongside roughly 60–120 words of shared text disappearing, and flagged it as <i>needing confirmation of intent</i>. Three days on, today&#39;s measurements <b>match almost exactly</b>: core <b>17</b>, projects <b>17</b>, articles <b>20–24</b>, with per-page word counts varying by no more than about &#177;10 against 07 Aug (for example <code>/faq</code> unchanged at 1,315, <code>/contact</code> at 187, <code>/interior-finishes</code> 2,808 &#8594; 2,813). <b>There was no second drop</b>, and no recovery either. The reading: this was a <b>one-off</b> footer/nav trim — the signature of a deliberate design change rather than a gradual leak from a bug. The one exception remains <code>/articles</code> at <b>71 links</b> (70 on 07 Aug, up by exactly the new article)."></p>
    <p class="fix t" data-vi="<b>Việc cần làm:</b> không cần khôi phục. Chỉ nên xác nhận nhanh với nhóm phát triển rằng 5 link bị gỡ khỏi footer không phải là các trang đích quan trọng (ví dụ trang dịch vụ hoặc trang địa phương) — nếu có, hãy đưa chúng trở lại qua internal link trong nội dung thay vì footer. Mục này sẽ được gỡ khỏi báo cáo ngày mai." data-en="<b>Action:</b> no restoration needed. Just confirm quickly with the development team that the 5 links removed from the footer were not important destinations (a service page or a location page, for instance) — if any were, bring them back as in-content internal links rather than footer links. This item will drop out of tomorrow&#39;s report."></p>
  </div>

  <div class="ins win">

    <h4 class="t" data-vi="77/77 trang đủ title/meta/canonical và đúng 1 H1, 0 trang &gt;3s, 75/77 trang có schema" data-en="77 of 77 pages have title/meta/canonical and exactly one H1, nothing exceeds 3s, 75 of 77 carry schema"></h4>
    <p class="t" data-vi="<b>Không một trang nào</b> trong 77 trang thiếu title, meta description hay canonical, và <b>không một trang nào</b> sai số H1 — cả hai chỉ số sạch tuyệt đối sang <b>ngày thứ sáu liên tiếp</b>, và bài mới xuất bản hôm nay cũng đạt chuẩn ngay. <b>0 trang &gt;3s</b> sang ngày thứ mười; sự cố <code>/articles/*</code> chậm 6,5–10,8s hồi tháng 7 vẫn hết hẳn, và hôm nay <b>52/54 bài dưới 1s</b>. Độ phủ schema giữ <b>97,4%</b>, chỉ <code>/login</code> và <code>/start-interactive</code> còn trống. <code>FAQPage</code> lên <b>41/54 bài (75,9%)</b> nhờ bài mới. Listing <code>/articles</code> giữ <b>đủ 54 link bài trong HTML thô</b> — khớp chính xác con số rendered-DOM và sitemap, tức bản sửa 07/08 vẫn đứng vững. <code>robots.txt</code> sạch (<code>Disallow:</code> rỗng) và trỏ đúng sitemap; sitemap 76 URL khớp 77 trang crawl trừ đúng <code>/login</code>. <code>/faq</code>: 1.315 từ + <code>FAQPage</code>, TTFB 0,47s — nhanh hơn hẳn và vẫn là tài sản AEO mạnh nhất site." data-en="<b>Not one</b> of the 77 pages is missing a title, meta description or canonical, and <b>not one</b> has a wrong H1 count — both perfectly clean for a <b>sixth consecutive day</b>, and today&#39;s new article met the standard immediately. <b>Zero pages above 3s</b> for a tenth day; July&#39;s 6.5–10.8s <code>/articles/*</code> slowdown remains fully resolved, and today <b>52 of 54 articles come in under 1s</b>. Schema coverage holds at <b>97.4%</b>, leaving only <code>/login</code> and <code>/start-interactive</code> empty. <code>FAQPage</code> rises to <b>41 of 54 articles (75.9%)</b> thanks to the new piece. The <code>/articles</code> listing still carries <b>all 54 article links in raw HTML</b> — matching the rendered-DOM and sitemap counts exactly, so the 07 Aug fix is holding. <code>robots.txt</code> is clean (empty <code>Disallow:</code>) and points at the right sitemap; the 76-URL sitemap matches the 77 crawled pages minus <code>/login</code> exactly. <code>/faq</code>: 1,315 words + <code>FAQPage</code> at 0.47s TTFB — appreciably faster and still the site&#39;s strongest AEO asset."></p>
    <p class="fix t" data-vi="<b>Giữ nguyên:</b> khi sửa lỗi nhân bản schema ở P1, <b>đừng gỡ nhầm schema thật</b> — mục tiêu là còn 4 khối/bài, 1 khối <code>@graph</code>/trang dự án và 1–2 khối/trang gốc, không phải 0. Xác minh lại bằng Rich Results Test sau deploy." data-en="<b>Maintain:</b> when fixing the P1 duplication, <b>do not strip the genuine schema</b> — the target is 4 blocks per article, one <code>@graph</code> per project page and 1–2 per core page, not zero. Re-verify with the Rich Results Test after deploying."></p>
  </div>

    <h4 class="t" data-vi="Heading nhảy bậc ở 75/77 trang; 13 bài vẫn chưa có FAQPage; 11 trang vẫn dưới 300 từ" data-en="Heading skips on 75 of 77 pages; 13 articles still lack FAQPage; 11 pages remain under 300 words"></h4>
    <p class="t" data-vi="Mọi trang đều đúng <b>1 H1</b>, nhưng chuỗi heading vẫn <b>nhảy bậc ở 75/77 trang</b>: <b>2&#8594;4</b> ở trang chủ, bài viết và hầu hết trang gốc; 6 trang dự án còn thêm <b>1&#8594;3</b>. Chỉ <code>/login</code> và <code>/start-interactive</code> sạch, và chỉ vì hai trang đó gần như không có heading. <b>13/54 bài vẫn chưa có <code>FAQPage</code></b> — <b>đúng 13 bài của hôm 07/08, không bài nào được bổ sung</b>: <code>how-3d-coordination-reduces-design-conflicts…</code>, <code>the-best-home-builders-adelaide</code>, <code>brisbane-custom-home-builders-checklist…</code>, <code>bim-3d-4d-5d-explained</code>, <code>custom-built-homes-melbourne-checklist</code>, <code>how-to-choose-custom-home-builders-in-south-australia</code>, <code>best-practices-for-project-and-quality-management-in-2026</code>, <code>construction-program-management-software</code>, <code>program-for-construction-estimates-explained</code>, <code>what-is-bim-3d-modeling</code>, <code>project-management-and-cost-control</code>, <code>bim-3d-from-design-to-site-in-2026</code>, <code>duplex-house-design-in-australia</code> — nhận diện được ngay vì chúng phát 31 khối JSON-LD thay vì 32. <b>11 trang dưới 300 từ</b>: <code>/login</code> (17), <code>/start-interactive</code> (45), 6 trang dự án (161–178), <code>/projects</code> (173), <code>/contact</code> (187), <code>/modules</code> (192). <code>/login</code> đã đúng nằm ngoài sitemap nhưng <code>/start-interactive</code> vẫn còn trong, và cả hai vẫn là hai trang duy nhất không có schema. Site chưa dùng <code>hreflang</code> — hợp lý vì chỉ nhắm thị trường AU." data-en="Every page has exactly <b>1 H1</b>, but heading sequences still <b>skip levels on 75 of 77 pages</b>: <b>2&#8594;4</b> on the homepage, the articles and most core pages; the 6 project pages additionally skip <b>1&#8594;3</b>. Only <code>/login</code> and <code>/start-interactive</code> are clean, and only because they barely have headings. <b>13 of 54 articles still lack <code>FAQPage</code></b> — <b>exactly the thirteen from 07 Aug, none retrofitted</b>: <code>how-3d-coordination-reduces-design-conflicts…</code>, <code>the-best-home-builders-adelaide</code>, <code>brisbane-custom-home-builders-checklist…</code>, <code>bim-3d-4d-5d-explained</code>, <code>custom-built-homes-melbourne-checklist</code>, <code>how-to-choose-custom-home-builders-in-south-australia</code>, <code>best-practices-for-project-and-quality-management-in-2026</code>, <code>construction-program-management-software</code>, <code>program-for-construction-estimates-explained</code>, <code>what-is-bim-3d-modeling</code>, <code>project-management-and-cost-control</code>, <code>bim-3d-from-design-to-site-in-2026</code>, <code>duplex-house-design-in-australia</code> — identifiable at a glance because they emit 31 JSON-LD blocks rather than 32. <b>11 pages sit under 300 words</b>: <code>/login</code> (17), <code>/start-interactive</code> (45), the 6 project pages (161–178), <code>/projects</code> (173), <code>/contact</code> (187) and <code>/modules</code> (192). <code>/login</code> is correctly outside the sitemap but <code>/start-interactive</code> is still in it, and those two remain the only pages without schema. No <code>hreflang</code> in use — reasonable for an AU-only market."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> chuẩn hóa H1&#8594;H2&#8594;H3 tuần tự; thêm khối FAQ 3–5 câu + <code>FAQPage</code> cho 13 bài — quy trình đã có sẵn ở 41 bài còn lại và vừa được dùng lại thành công cho bài mới hôm nay, chỉ cần áp ngược lại; <b>noindex</b> <code>/login</code> và <code>/start-interactive</code>, đồng thời gỡ <code>/start-interactive</code> khỏi sitemap; đẩy 6 trang dự án lên 250–400 từ." data-en="<b>Fix:</b> normalise headings to a sequential H1&#8594;H2&#8594;H3; add a 3–5 question FAQ block + <code>FAQPage</code> to the 13 articles — the process exists on the other 41 and was just used successfully on today&#39;s new piece, it only needs applying backwards; <b>noindex</b> <code>/login</code> and <code>/start-interactive</code> and drop <code>/start-interactive</code> from the sitemap; bring the 6 project pages up to 250–400 words."></p>
  </div>

    <div class="prio t" data-vi="Roadmap · Next steps ưu tiên" data-en="Roadmap · Prioritised next steps"></div>
    <h4 class="t" data-vi="Thứ tự việc cần làm sau crawl 10/08" data-en="Action order after the 10 Aug crawl"></h4>
    <p class="t" data-vi="<b>Thay đổi thứ tự so 07/08:</b> hạng mục #3 hôm đó (xác nhận footer/nav) <b>đã khép lại</b> — số liệu ba ngày cho thấy đó là thay đổi có chủ đích, không cần khôi phục. Đổi lại, <b>#1 và #2 đảo vị trí</b>: việc alt/lazy-load giờ rẻ hơn và đem lại nhiều điểm hơn việc sửa schema, nên nên làm trước. <b>1.</b> Deploy 7 <code>alt</code> trang chủ + 15 <code>alt</code> trang dự án + bật <code>loading=&quot;lazy&quot;</code> — <b>đã trễ 11 ngày</b>, ~30 phút, đưa On-page 76 &#8594; ~85 và Health lên ~89,7. <b>Đây là việc rẻ nhất và đáng làm nhất tuần này.</b> <b>2.</b> Sửa lỗi nhân bản JSON-LD — <b>việc P1 duy nhất</b>, sang ngày thứ 8, ảnh hưởng cả 75 trang có schema, và bài mới hôm nay đã kế thừa lỗi ngay khi ra đời. Sửa xong dự kiến đưa Structured Data 87 &#8594; 95+ và giảm 15–25 KB HTML mỗi trang. <b>3.</b> Thêm <code>FAQPage</code> cho 13 bài còn thiếu — nhận diện nhanh bằng cột JSON-LD = 31 trong bảng dưới. <b>4.</b> Đẩy 6 trang dự án lên 250–400 từ và thêm <code>ImageObject</code> cho ảnh gallery. <b>5.</b> Chuẩn hóa heading tuần tự (bỏ nhảy 2&#8594;4 và 1&#8594;3). <b>6.</b> Phân trang <code>/articles</code> 12–16 bài/trang trước khi số bài lên 70–80 — hiện đã 54 và vừa tăng thêm một. <b>7.</b> noindex <code>/login</code> &amp; <code>/start-interactive</code>, gỡ <code>/start-interactive</code> khỏi sitemap. <b>8. Theo dõi:</b> kiểm tra trong GSC xem bài mới <code>kitchen-renovation-cost-melbourne</code> đã được index chưa, và 37 bài được cấp internal link hôm 07/08 đã được crawl lại chưa — đó là nơi lợi ích thật của bản sửa listing sẽ hiện ra." data-en="<b>Order changed vs 07 Aug:</b> that day&#39;s item #3 (confirm the footer/nav change) is <b>closed</b> — three days of data show it was deliberate and needs no restoration. In exchange, <b>#1 and #2 swap places</b>: the alt/lazy-load work is now cheaper and worth more points than the schema fix, so it should go first. <b>1.</b> Ship 7 homepage <code>alt</code>s + 15 project-page <code>alt</code>s + <code>loading=&quot;lazy&quot;</code> — <b>eleven days late</b>, ~30 minutes, taking On-page 76 &#8594; ~85 and Health to ~89.7. <b>This is the cheapest and highest-value job this week.</b> <b>2.</b> Fix the JSON-LD duplication — <b>the only P1</b>, now on day eight, affecting all 75 schema-bearing pages, and today&#39;s new article inherited the defect the moment it shipped. Fixing it should take Structured Data 87 &#8594; 95+ and cut 15–25 KB of HTML per page. <b>3.</b> Add <code>FAQPage</code> to the 13 articles missing it — spot them instantly via the JSON-LD = 31 column in the table below. <b>4.</b> Bring the 6 project pages to 250–400 words and add <code>ImageObject</code> for gallery images. <b>5.</b> Normalise heading order (remove the 2&#8594;4 and 1&#8594;3 skips). <b>6.</b> Paginate <code>/articles</code> at 12–16 per page before the count reaches 70–80 — it is at 54 and just grew by one. <b>7.</b> noindex <code>/login</code> &amp; <code>/start-interactive</code>, drop <code>/start-interactive</code> from the sitemap. <b>8. Watch:</b> check in GSC whether the new <code>kitchen-renovation-cost-melbourne</code> has been indexed, and whether the 37 articles given internal links on 07 Aug have been re-crawled — that is where the listing fix will show its real benefit."></p>
  </div>

let LANG = 'vi';

function applyLang(){
  document.querySelectorAll('.t').forEach(e=>{

  });

function setLang(l){
  LANG = l;
  document.documentElement.lang = l;
  document.getElementById('btnVI').classList.toggle('active', l==='vi');
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  applyLang();
  render();
  if(typeof pkRender==='function' && PK_SNAPS.length) pkRender();
}

function renderRt(){
  const loaded = [...PAGES].sort((a,b)=>b.rt-a.rt);
  const max = 1425;
  const col = ms => ms<1000?'var(--green)':ms<3000?'var(--accent)':ms<6000?'var(--amber)':'var(--red)';
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let h='';
  loaded.forEach(p=>{
    const w=Math.max(2,(p.rt/max*100)).toFixed(1);
    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

const tbody=document.querySelector('#pt tbody');
let sortK='rt', sortDir=1, filt='all';
function render(){
  renderRt();
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let rows=[...PAGES];
  if(filt!=='all')rows=rows.filter(p=>p.grp===filt);
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}
    return sortDir*(x-y);

/* ================= date picker v2 (sample-matched) ================= */
const PK_BASE  = '../';
const PK_TODAY = '2026-08-10';
let PK_SNAPS = [], PK_MAP = {}, PK_VIEW = null;
let PK_SEL = {s:PK_TODAY, e:PK_TODAY}, PK_DRAFT = {s:PK_TODAY, e:PK_TODAY}, PK_PENDING = false, PK_PRESET = null;

const PK_T = {
  vi:{day:'Ngày',range:'Khoảng',now:d=>`Đang xem báo cáo ngày ${d} (mới nhất)`,
      viewing:d=>`Đang xem báo cáo ngày ${d}`,
      trend:(a,b)=>`Đang xem xu hướng ${a} → ${b}`,
      quick:'Mở nhanh', today:'mới nhất',
      months:['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'],
      dow:['CN','T2','T3','T4','T5','T6','T7'],
      saved:n=>`${n} ngày đã lưu trong khoảng này · ngày theo giờ Việt Nam (Asia/Ho_Chi_Minh), là giờ lúc quét`,
      noRep:'Ngày này chưa quét — không có báo cáo riêng để mở.',
      trendTitle:(a,b)=>`Xu hướng Health Score · ${a} → ${b}`,
      open:'mở'},
  en:{day:'Day',range:'Range',now:d=>`Viewing the report for ${d} (latest)`,
      viewing:d=>`Viewing the report for ${d}`,
      trend:(a,b)=>`Viewing the trend ${a} → ${b}`,
      quick:'Quick open', today:'latest',
      months:['January','February','March','April','May','June','July','August','September','October','November','December'],
      dow:['Su','Mo','Tu','We','Th','Fr','Sa'],
      saved:n=>`${n} stored day(s) in this range · dates in Vietnam time (Asia/Ho_Chi_Minh), the time of the crawl`,
      noRep:'This day was not crawled — there is no separate report to open.',
      trendTitle:(a,b)=>`Health Score trend · ${a} → ${b}`,
      open:'open'}
};
const pkL = () => PK_T[LANG];

function pkISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pkD(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function pkFmt(iso){ const [y,m,d]=iso.split('-'); return LANG==='vi'?`${d}/${m}/${y}`:`${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`; }
function pkAdd(iso,n){ const d=pkD(iso); d.setDate(d.getDate()+n); return pkISO(d); }
function pkIn(iso,a,b){ return iso>=a && iso<=b; }
function pkCount(a,b){ return PK_SNAPS.filter(s=>pkIn(s.date,a,b)).length; }

function pkPresets(){
  const T=PK_TODAY, d=pkD(T);
  const monStart=(()=>{const x=pkD(T); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return pkISO(x);})();
  const lastMonStart=pkAdd(monStart,-7), lastMonEnd=pkAdd(monStart,-1);
  const mStart=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
  const pmStart=pkISO(pm), pmEnd=pkISO(new Date(d.getFullYear(),d.getMonth(),0));
  const first=PK_SNAPS.length?PK_SNAPS[0].date:T;
  return [
    {k:'y',   vi:'Hôm qua',   en:'Yesterday',   s:pkAdd(T,-1), e:pkAdd(T,-1)},
    {k:'7',   vi:'7 ngày qua', en:'Last 7 days',  s:pkAdd(T,-6), e:T},
    {k:'28',  vi:'28 ngày qua',en:'Last 28 days', s:pkAdd(T,-27),e:T},
    {k:'90',  vi:'90 ngày qua',en:'Last 90 days', s:pkAdd(T,-89),e:T},
    {k:'tw',  vi:'Tuần này',  en:'This week',   s:monStart, e:T},
    {k:'tm',  vi:'Tháng này', en:'This month',  s:mStart, e:T},
    {k:'ty',  vi:'Năm nay',   en:'This year',   s:`${d.getFullYear()}-01-01`, e:T},
    {k:'lw',  vi:'Tuần trước',en:'Last week',   s:lastMonStart, e:lastMonEnd},
    {k:'lm',  vi:'Tháng trước',en:'Last month', s:pmStart, e:pmEnd},
    {k:'all', vi:'Toàn bộ dữ liệu đã lưu', en:'All stored data', s:first, e:T}
  ];
}

function pkRenderPresets(){
  const box=document.getElementById('dpPresets'); if(!box) return;
  box.innerHTML = pkPresets().map(p=>{
    const n=pkCount(p.s,p.e), off=n===0;
    const on=PK_PRESET===p.k;
    return `<button type="button" class="dp-preset${on?' on':''}" data-k="${p.k}" ${off?'disabled':''}>
      <span class="rd"></span><span class="nm">${LANG==='vi'?p.vi:p.en}</span><span class="ct">${n}</span></button>`;
  }).join('');
  box.querySelectorAll('.dp-preset').forEach(b=>b.addEventListener('click',()=>{
    const p=pkPresets().find(x=>x.k===b.dataset.k);
    PK_PRESET=p.k; PK_DRAFT={s:p.s,e:p.e}; PK_PENDING=false;
    PK_VIEW=pkD(p.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1);
    pkRenderCal(); pkRenderPresets();
  }));
}

function pkMonth(base,off){
  const d=new Date(base.getFullYear(), base.getMonth()+off, 1);
  const y=d.getFullYear(), m=d.getMonth();
  const start=new Date(y,m,1).getDay(); // 0=Sun
  const days=new Date(y,m+1,0).getDate();
  let cells=pkL().dow.map(x=>`<div class="dp-dow">${x}</div>`).join('');
  for(let i=0;i<start;i++) cells+='<button class="dp-d blank" disabled></button>';
  for(let dd=1;dd<=days;dd++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const has=!!PK_MAP[iso];
    const sel=iso===PK_DRAFT.s||iso===PK_DRAFT.e;
    const inr=pkIn(iso,PK_DRAFT.s,PK_DRAFT.e)&&!sel;
    const edge=iso===PK_DRAFT.s&&PK_DRAFT.s!==PK_DRAFT.e?' edge-l':(iso===PK_DRAFT.e&&PK_DRAFT.s!==PK_DRAFT.e?' edge-r':'');
    cells+=`<button type="button" class="dp-d${has?' has':''}${inr?' inrange':''}${sel?' sel'+edge:''}" data-iso="${iso}">${dd}${has?'<span class="dot"></span>':''}</button>`;
  }
  return {title:`${pkL().months[m]} ${y}`, html:`<div class="dp-grid">${cells}</div>`};
}

function pkRenderCal(){
  if(!PK_VIEW){ PK_VIEW=pkD(PK_SEL.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1); }
  const a=pkMonth(PK_VIEW,0), b=pkMonth(PK_VIEW,1);
  document.getElementById('dpM1').textContent=a.title;
  document.getElementById('dpM2').textContent=b.title;
  document.getElementById('dpG1').innerHTML=a.html;
  document.getElementById('dpG2').innerHTML=b.html;
  document.querySelectorAll('#dpG1 .dp-d,#dpG2 .dp-d').forEach(el=>{
    if(el.classList.contains('blank')) return;
    el.addEventListener('click',()=>{
      const iso=el.dataset.iso;
      if(!PK_PENDING){ PK_DRAFT={s:iso,e:iso}; PK_PENDING=true; }
      else { PK_DRAFT = iso<PK_DRAFT.s ? {s:iso,e:PK_DRAFT.s} : {s:PK_DRAFT.s,e:iso}; PK_PENDING=false; }
      PK_PRESET=null; pkRenderCal(); pkRenderPresets();
    });
  });
  const single=PK_DRAFT.s===PK_DRAFT.e;
  document.getElementById('dpSelD').textContent = single?pkFmt(PK_DRAFT.s):`${pkFmt(PK_DRAFT.s)} → ${pkFmt(PK_DRAFT.e)}`;
  const n=pkCount(PK_DRAFT.s,PK_DRAFT.e);
  document.getElementById('dpSelInfo').textContent = n===0 ? pkL().noRep : pkL().saved(n);
}

function pkRenderQuick(){
  const box=document.getElementById('dpQuick'); if(!box) return;
  const chips=PK_SNAPS.slice().reverse().map(s=>{
    const cur=s.date===PK_SEL.s&&PK_SEL.s===PK_SEL.e;
    const lb=LANG==='vi'?(s.label_vi||''):(s.label_en||'');
    return `<button type="button" class="qchip${cur?' cur':''}" data-iso="${s.date}">
      <span class="qd">${pkFmt(s.date)}</span><span class="ql">${lb}</span></button>`;
  }).join('');
  box.innerHTML=`<span class="pk-quick-lbl">${pkL().quick}</span>`+chips;
  box.querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('cur')) return;
    pkGo(b.dataset.iso,b.dataset.iso);
  }));
}

function pkRenderNow(){
  const el=document.getElementById('dpNow'); if(!el) return;
  const single=PK_SEL.s===PK_SEL.e;
  el.textContent = !single ? pkL().trend(pkFmt(PK_SEL.s),pkFmt(PK_SEL.e))
    : (PK_SEL.s===PK_TODAY ? pkL().now(pkFmt(PK_SEL.s)) : pkL().viewing(pkFmt(PK_SEL.s)));
  document.getElementById('dpLabel').textContent = single
    ? `${pkL().day} ${pkFmt(PK_SEL.s)}` : `${pkL().range} ${pkFmt(PK_SEL.s)} → ${pkFmt(PK_SEL.e)}`;
}

function pkGo(s,e){
  if(s===e){
    const snap=PK_MAP[s];
    if(snap && s!==PK_TODAY){ location.href=PK_BASE+snap.report; return; }
    PK_SEL={s,e}; PK_DRAFT={s,e}; PK_PRESET=null;
    document.getElementById('dpTrend').classList.remove('on');
    pkRenderNow(); pkRenderQuick(); pkRenderCal();
    return;
  }
  PK_SEL={s,e}; pkRenderNow(); pkRenderQuick(); pkTrend(s,e);
}

function pkTrend(s,e){
  const box=document.getElementById('dpTrend');
  const days=PK_SNAPS.filter(x=>pkIn(x.date,s,e));
  if(!days.length){ box.classList.remove('on'); box.innerHTML=''; return; }
  Promise.all(days.map(d=>fetch(PK_BASE+d.data,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)))
   .then(js=>{
     const rows=js.map((j,i)=>({date:days[i].date, rep:days[i].report, hs:j&&j.health_score, pg:j&&j.pages_measured}))
                  .filter(r=>r.hs!=null);
     box.innerHTML=`<h4>${pkL().trendTitle(pkFmt(s),pkFmt(e))}</h4>`+rows.map(r=>`
       <div class="trd"><span class="tdate">${pkFmt(r.date)}</span>
         <span class="ttrack"><span class="tfill" style="width:${r.hs}%"></span></span>
         <span class="tval">${r.hs}</span>
         <span class="tlink" data-h="${r.rep}">${pkL().open} &#8594;</span></div>`).join('');
     box.classList.add('on');
     box.querySelectorAll('.tlink').forEach(a=>a.addEventListener('click',()=>{
       const h=a.dataset.h; if(h && h!=='index.html') location.href=PK_BASE+h;
     }));
   });
}

function pkRender(){ pkRenderPresets(); pkRenderCal(); pkRenderQuick(); pkRenderNow(); }

(function pkInit(){
  const btn=document.getElementById('dpBtn'), pane=document.getElementById('dpPane');
  if(!btn) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=pane.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
    if(open){ PK_DRAFT={...PK_SEL}; PK_PENDING=false; pkRenderCal(); pkRenderPresets(); }
  });
  document.addEventListener('click',e=>{
    if(!pane.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') pane.classList.remove('open'); });
  document.getElementById('dpPrev').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()-1); pkRenderCal(); });
  document.getElementById('dpNext').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()+1); pkRenderCal(); });
  document.getElementById('dpCancel').addEventListener('click',()=>{
    PK_DRAFT={...PK_SEL}; PK_PENDING=false; PK_PRESET=null;
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false'); pkRenderCal();
  });
  document.getElementById('dpApply').addEventListener('click',()=>{
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    pkGo(PK_DRAFT.s,PK_DRAFT.e);
  });
  fetch(PK_BASE+'data/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    PK_SNAPS=(j.snapshots||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s);
    pkRender();
  }).catch(()=>{
    PK_SNAPS=[{date:PK_TODAY,report:'index.html',data:'data/'+PK_TODAY+'.json',label_vi:'Bản hiện tại',label_en:'Current report'}];
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s); pkRender();
  });
})();

setLang('vi');
</script>
</body>
</html>
