<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .legend .foot{display:block;line-height:1.55}
  .legend{max-width:520px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}

  /* ---------- date picker v2 (sample-matched) ---------- */
  /* collapsible date picker */
  .pk-toggle{margin-top:24px;width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 20px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);
    text-align:left;transition:border-color .15s,box-shadow .15s}
  .pk-toggle:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(184,147,90,.13)}
  .pk-toggle .lft{display:flex;align-items:center;gap:11px;min-width:0}
  .pk-toggle .bar{display:inline-block;width:3px;height:17px;background:var(--accent);border-radius:2px;flex:none}
  .pk-toggle .cap{font-weight:600}
  .pk-toggle .sel{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
  .pk-toggle .chev{flex:none;transition:transform .2s;color:var(--muted);font-size:12px}
  .pk-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .pk-wrap[hidden]{display:none}
  .pk-wrap .pk-card{margin-top:10px}

  /* trend charts */
  .tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.tr-grid{grid-template-columns:1fr}}
  .tr-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 14px}
  .tr-card h3{margin:0 0 2px;font-size:14.5px;font-weight:700;color:var(--ink)}
  .tr-card .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
  .tr-lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .tr-lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .tr-svg{width:100%;height:auto;display:block;overflow:visible}
  .tr-dot{transition:r .12s}
  .tr-card:hover .tr-dot{r:3.2}
  .pk-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 16px;box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .pk-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;
    letter-spacing:.9px;text-transform:uppercase;color:var(--accent-dk);margin:0 0 8px}
  .pk-title .bar{width:26px;height:3px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  .pk-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;max-width:900px}
  .pk-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dpwrap{position:relative}
  .dpbtn{display:inline-flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid #cfc6b3;border-radius:10px;padding:10px 15px;font-family:inherit;
    font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink);cursor:pointer;transition:.15s}
  .dpbtn:hover{border-color:var(--accent)}
  .dpbtn .car{color:var(--muted);font-size:9px;margin-left:2px}
  .pk-now{display:inline-block;background:var(--accent-soft,#f3e7d3);color:var(--accent-dk);
    border:1px solid #e6d5b8;border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700}

  .dppane{position:absolute;top:calc(100% + 9px);left:0;z-index:80;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 40px rgba(70,55,30,.20);overflow:hidden}
  .dppane.open{display:flex}
  .dp-presets{width:196px;flex:0 0 auto;border-right:1px solid var(--line);
    padding:12px 8px;background:#fdfbf6;max-height:430px;overflow:auto}
  .dp-preset{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;
    font-size:12.5px;color:var(--ink);transition:.12s}
  .dp-preset:hover:not(:disabled){background:var(--cream2)}
  .dp-preset:disabled{color:#bdb4a6;cursor:not-allowed}
  .dp-preset .rd{width:13px;height:13px;border-radius:50%;border:1.5px solid #c3b9a6;flex:0 0 auto;position:relative}
  .dp-preset.on .rd{border-color:var(--accent)}
  .dp-preset.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
  .dp-preset .nm{flex:1}
  .dp-preset .ct{font-size:11.5px;color:var(--faint,#9a9186);font-weight:700}

  .dp-right{padding:14px 16px 12px;min-width:452px}
  .dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .dp-nav button{background:transparent;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
  .dp-nav button:hover:not(:disabled){background:var(--cream2);color:var(--ink)}
  .dp-nav button:disabled{opacity:.3;cursor:not-allowed}
  .dp-nav .mtitle{flex:1;display:flex;justify-content:space-around;font-size:13.5px;font-weight:700}
  .dp-months{display:flex;gap:26px}
  .dp-m{flex:1}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dp-dow{font-size:10.5px;color:var(--muted);text-align:center;padding:5px 0 3px;font-weight:700}
  .dp-d{position:relative;height:29px;border:none;background:transparent;border-radius:7px;
    font-family:inherit;font-size:12.5px;color:#bdb4a6;cursor:pointer;padding:0;transition:.1s}
  .dp-d.blank{cursor:default}
  .dp-d.has{color:var(--ink);font-weight:700}
  .dp-d:hover:not(.blank):not(.sel){background:var(--cream2)}
  .dp-d.inrange{background:var(--accent-soft,#f3e7d3);border-radius:0}
  .dp-d.sel{background:var(--accent);color:#2c2620;font-weight:800}
  .dp-d.sel.edge-l{border-radius:7px 0 0 7px}
  .dp-d.sel.edge-r{border-radius:0 7px 7px 0}
  .dp-d .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:3.5px;height:3.5px;border-radius:50%;background:var(--accent)}
  .dp-d.sel .dot{background:#2c2620}

  .dp-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-selinfo .d1{font-size:13.5px;font-weight:700}
  .dp-selinfo .d2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;max-width:300px}
  .dp-actions{display:flex;gap:9px;flex:0 0 auto}
  .dp-actions button{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:9px;
    padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .dp-actions .go{background:var(--accent);border-color:var(--accent);color:#2c2620}
  .dp-actions .go:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
  .dp-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
  .dp-legend .dotlg{display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-right:4px}

  .pk-quick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;
    padding-top:14px;border-top:1px solid var(--line)}
  .pk-quick-lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);
    text-transform:uppercase;flex:0 0 auto;margin-right:2px}
  .qchip{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--ink);transition:.13s;text-align:left}
  .qchip:hover{border-color:var(--accent);background:#fdfaf3}
  .qchip .qd{font-weight:700;flex:0 0 auto}
  .qchip .ql{font-size:11.5px;color:var(--muted)}
  .qchip.cur{background:var(--accent);border-color:var(--accent);color:#2c2620;cursor:default}
  .qchip.cur .ql{color:#5c4a24}

  .pk-trend{display:none;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .pk-trend.on{display:block}
  .pk-trend h4{margin:0 0 10px;font-size:13px;color:var(--accent-dk)}
  .trd{display:grid;grid-template-columns:88px 1fr 46px 62px;gap:9px;align-items:center;
    margin:6px 0;font-size:12.5px}
  .trd .tdate{font-weight:700}
  .trd .ttrack{background:var(--cream2);border-radius:6px;height:16px;overflow:hidden}
  .trd .tfill{height:100%;background:var(--accent);border-radius:6px}
  .trd .tval{font-weight:800;text-align:right}
  .trd .tlink{font-size:11px;color:var(--accent-dk);text-decoration:underline;cursor:pointer;text-align:right}
  @media(max-width:860px){.dppane.open{flex-direction:column}.dp-right{min-width:0}.dp-months{flex-direction:column;gap:14px}.dp-presets{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:none}}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 17 trang gốc + 57 bài /articles + 6 trang dự án + sitemap" data-en="Source: Chrome live crawl · 17 core pages + 57 /articles + 6 project pages + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>14/08/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>14 Aug 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>80 trang</b> · Sitemap: <b>79 URL</b>" data-en="Directly measured: <b>80 pages</b> · Sitemap: <b>79 URLs</b>"></span><br>
        Method: Chrome fetch tuần tự · AbortController 12–15s
      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <!-- date picker v2 (collapsible) -->
  <button class="pk-toggle" id="pkToggle" type="button" aria-expanded="false" aria-controls="pkWrap" onclick="pkFold()">
    <span class="lft"><span class="bar"></span>
      <span class="cap t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span>
      <span class="sel" id="pkToggleSel"></span></span>
    <span class="chev">&#9660;</span>
  </button>
  <div class="pk-wrap" id="pkWrap" hidden>
  <div class="pk-card">
    <div class="pk-title"><span class="bar"></span><span class="t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span></div>
    <p class="pk-sub t" data-vi="Chọn <b>một ngày</b> rồi bấm <b>Cập nhật</b> để mở đúng bản báo cáo đã lưu của ngày đó. Chọn <b>một khoảng ngày</b> để xem xu hướng trong khoảng. Ngày <b>có dấu chấm</b> là ngày đã quét và có báo cáo lưu; ngày làm mờ vẫn chọn được làm đầu/cuối khoảng, nhưng không có báo cáo riêng để mở." data-en="Pick <b>a single day</b> and press <b>Update</b> to open that day's saved report. Pick <b>a date range</b> to see the trend across it. Days <b>with a dot</b> were crawled and have a stored report; faded days can still anchor a range but have no report of their own."></p>
    <div class="pk-bar">
      <div class="dpwrap">
        <button class="dpbtn" id="dpBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>&#128197;</span><span id="dpLabel">Ngày 14/08/2026</span><span class="car">&#9660;</span>
        </button>
        <div class="dppane" id="dpPane" role="dialog">
          <div class="dp-presets" id="dpPresets"></div>
          <div class="dp-right">
            <div class="dp-nav">
              <button type="button" id="dpPrev" aria-label="prev">&#8249;</button>
              <div class="mtitle"><span id="dpM1"></span><span id="dpM2"></span></div>
              <button type="button" id="dpNext" aria-label="next">&#8250;</button>
            </div>
            <div class="dp-months"><div class="dp-m" id="dpG1"></div><div class="dp-m" id="dpG2"></div></div>
            <div class="dp-foot">
              <div class="dp-selinfo"><div class="d1" id="dpSelD"></div><div class="d2" id="dpSelInfo"></div></div>
              <div class="dp-actions">
                <button type="button" id="dpCancel" class="t" data-vi="Hủy" data-en="Cancel"></button>
                <button type="button" id="dpApply" class="go t" data-vi="Cập nhật" data-en="Update"></button>
              </div>
            </div>
            <div class="dp-legend"><span class="dotlg"></span><span class="t" data-vi="Dấu chấm = ngày đã có dữ liệu lưu. Ngày làm mờ = chưa quét: dùng được làm đầu/cuối khoảng, nhưng không mở được báo cáo riêng." data-en="Dot = a day with stored data. Faded day = not crawled: usable as a range endpoint, but it has no report of its own to open."></span></div>
          </div>
        </div>
      </div>
      <span class="pk-now" id="dpNow"></span>
    </div>
    <div class="pk-quick" id="dpQuick"></div>
    <div class="pk-trend" id="dpTrend"></div>
  </div>

  </div>

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi">
      <div class="lbl t" data-vi="Health Score" data-en="Health Score"></div>
      <div class="score-ring">

      <div class="foot t" data-vi="Health tổng <b>89/100</b> (&#9650; từ 88; điểm thô 88,15 &#8594; <b>88,70</b>) — <b>điểm cao nhất của cả 14 lần quét</b>, vượt mốc 89 từng đạt hôm 11/08. Chi tiết: Crawlability <b>96</b> (không đổi — 80/80 trang trả 200, sitemap 79 URL khớp hoàn toàn, listing <code>/articles</code> vẫn server-render đủ 57 link bài), Performance <b>95</b> (&#9650; từ 94 — TTFB trung bình toàn site 674 &#8594; <b>618 ms</b>, <b>nhanh nhất từ trước tới nay</b>; trang gốc 713 &#8594; <b>667</b>, bài viết 673 &#8594; <b>617</b>, trang dự án 573 &#8594; <b>492</b>; trang chậm nhất 1,40s &#8594; <b>1,09s</b>; <b>78/80 trang &lt;1s = 97,5%</b>, tỷ lệ tốt nhất từng ghi nhận, và vẫn <b>không trang nào &gt;3s</b> sang ngày thứ mười bốn), Structured Data <b>87</b> (không đổi — 78/80 trang có schema = <b>97,5%</b>; lỗi nhân bản sang <b>ngày thứ 12</b>), On-page <b>76</b> (không đổi — trang chủ vẫn 7/11 ảnh thiếu alt và 0 lazy-load, trang dự án vẫn 15/19, heading vẫn nhảy bậc ở 78/80 trang), Content <b>81</b> (&#9650; từ 79 — <b>khối footer đã quay lại</b>, tổng số từ toàn site 128.097 &#8594; <b>138.084</b>; 6 trang dự án từ 161–178 lên lại <b>222–238 từ</b>; số từ trung bình mỗi bài 2.139 &#8594; <b>2.219</b>). <b>Cách đọc thẳng thắn:</b> đây là ngày tốt nhất của chuỗi báo cáo, nhưng <b>không phải vì đội ngũ sửa được lỗi nào</b> — mà vì nội dung bị gỡ nhầm hôm qua đã quay về và tầng phục vụ chạy nhanh hơn. Ba việc P1/P2 lớn nhất (nhân bản schema, alt/lazy-load, link về trang chủ) <b>vẫn nguyên vẹn chưa động tới</b>. Điểm 89 này là <b>trần của trạng thái hiện tại</b>: nếu không deploy gì thêm, đây gần như là mức cao nhất có thể đạt. Trọng số: Crawl 25% · Perf 25% · Schema 20% · On-page 15% · Content 15%." data-en="Overall health <b>89/100</b> (&#9650; from 88; raw score 88.15 &#8594; <b>88.70</b>) — <b>the highest of all 14 crawls</b>, edging past the 89 recorded on 11 Aug. Detail: Crawlability <b>96</b> (unchanged — 80 of 80 pages return 200, the 79-URL sitemap matches exactly, and the <code>/articles</code> listing still server-renders all 57 article links), Performance <b>95</b> (&#9650; from 94 — site-wide average TTFB 674 &#8594; <b>618 ms</b>, <b>the fastest recorded</b>; core pages 713 &#8594; <b>667</b>, articles 673 &#8594; <b>617</b>, project pages 573 &#8594; <b>492</b>; the slowest page 1.40s &#8594; <b>1.09s</b>; <b>78 of 80 under 1s = 97.5%</b>, the best ratio yet, and still <b>nothing above 3s</b> for a fourteenth day), Structured Data <b>87</b> (unchanged — 78 of 80 pages carry schema = <b>97.5%</b>; the duplication defect reaches <b>day 12</b>), On-page <b>76</b> (unchanged — the homepage still shows 7 of 11 images without alt and zero lazy-loading, project pages still 15 of 19, headings still skip on 78 of 80 pages), Content <b>81</b> (&#9650; from 79 — <b>the footer block is back</b>, taking site-wide word count 128,097 &#8594; <b>138,084</b>; the 6 project pages rise from 161–178 back to <b>222–238 words</b>; average words per article 2,139 &#8594; <b>2,219</b>). <b>How to read this plainly:</b> this is the best day of the series, but <b>not because anything was fixed</b> — it is because content removed in error yesterday came back and the serving layer ran faster. The three largest P1/P2 items (schema duplication, alt text and lazy-loading, the link home) are <b>all still untouched</b>. An 89 is therefore <b>the ceiling of the current state</b>: with no further deploys this is close to the highest score achievable. Weights: Crawl 25% · Perf 25% · Schema 20% · On-page 15% · Content 15%."></div>

 than a content strategy. Every TTFB group oscillates between roughly 490 and 870 ms with <b>no long-term deterioration</b>; today is the low point on all three lines — so read the band rather than reacting to a single day."></div>

    <p class="t" data-vi="Câu hỏi đặt ra hôm qua — footer bị gỡ là chủ đích hay ngoài ý muốn — nay <b>đã có câu trả lời gián tiếp: khối đó đã quay lại</b>. So từng trang một: <b>80/80 trang đều tăng số từ, không một trang nào giảm</b>. Cụ thể <code>/about</code> 392 &#8594; <b>447</b>, <code>/studio</code> 523 &#8594; <b>612</b>, <code>/faq</code> 1.315 &#8594; <b>1.392</b>, <code>/contact</code> 187 &#8594; <b>250</b>, <code>/modules</code> 192 &#8594; <b>246</b>, <code>/projects</code> 173 &#8594; <b>255</b>, trang chủ 1.451 &#8594; <b>1.603</b>, 6 trang dự án từ 161–178 lên <b>222–238</b>. Tổng số từ toàn site: <b>128.097 &#8594; 138.084 (+9.987 từ, +7,8%)</b> — <b>cao hơn cả mức 12/08 là 135.724</b>. Kiểm tra trực tiếp phần cuối HTML xác nhận <b>khối NAP đầy đủ đã trở lại</b>: <code>1800 333 539</code> · <code>contact@dxliving.com</code> · <code>44 Lakeview Drive, Scoresby VIC 3179</code>, kèm dòng định vị và bốn cụm điều hướng. <b>Một chi tiết cần nói thẳng:</b> con số hôm nay <b>không trùng khớp chính xác với 12/08</b> — <code>/studio</code> 654 &#8594; 612, <code>/projects</code> 261 &#8594; 255, trang chủ 1.620 &#8594; 1.603 — nên đây <b>không phải một bản restore y hệt</b> mà nhiều khả năng là bản footer đã chỉnh lại đôi chút. Điều đó không làm giảm giá trị, nhưng nó xác nhận rằng khối này <b>đang được chỉnh sửa chủ động</b> chứ không phải bị deploy nhầm qua lại." data-en="Yesterday&#39;s question — whether the footer removal was intentional — now has <b>an indirect answer: the block is back</b>. Page by page: <b>80 of 80 pages gained words, with not one losing</b>. Specifically <code>/about</code> 392 &#8594; <b>447</b>, <code>/studio</code> 523 &#8594; <b>612</b>, <code>/faq</code> 1,315 &#8594; <b>1,392</b>, <code>/contact</code> 187 &#8594; <b>250</b>, <code>/modules</code> 192 &#8594; <b>246</b>, <code>/projects</code> 173 &#8594; <b>255</b>, the homepage 1,451 &#8594; <b>1,603</b>, and the 6 project pages rising from 161–178 to <b>222–238</b>. Site-wide word count: <b>128,097 &#8594; 138,084 (+9,987 words, +7.8%)</b> — <b>above even the 12 Aug figure of 135,724</b>. Reading the tail of the raw HTML directly confirms <b>the full NAP block has returned</b>: <code>1800 333 539</code> · <code>contact@dxliving.com</code> · <code>44 Lakeview Drive, Scoresby VIC 3179</code>, alongside the positioning line and four navigation clusters. <b>One detail worth stating plainly:</b> today&#39;s figures <b>do not match 12 Aug exactly</b> — <code>/studio</code> 654 &#8594; 612, <code>/projects</code> 261 &#8594; 255, the homepage 1,620 &#8594; 1,603 — so this is <b>not an identical restore</b> but most likely a slightly revised footer. That does not reduce its value, but it does confirm the block is <b>being actively edited</b> rather than accidentally deployed back and forth."></p>
    <p class="fix t" data-vi="<b>Việc cần làm:</b> khối này đã đi qua ba trạng thái trong ba ngày (thêm 12/08 &#8594; gỡ 13/08 &#8594; khôi phục 14/08). Nên <b>chốt bản cuối và khoá lại</b>: xác nhận với đội phát triển rằng bản hiện tại là bản chính thức, rồi thêm một test đơn giản trong CI kiểm tra footer có chứa số điện thoại và địa chỉ — để lần sau nếu nó biến mất thì phát hiện được ngay tại build chứ không phải chờ audit hôm sau. <b>Đồng thời tận dụng ngay:</b> footer đã có NAP nhưng <b>chưa có mục Home</b> — thêm vào lúc này là chi phí gần bằng không và nó xử lý một phần mục P2 bên dưới." data-en="<b>What to do:</b> this block has been through three states in three days (added 12 Aug &#8594; removed 13 Aug &#8594; restored 14 Aug). <b>Settle on a final version and lock it</b>: confirm with the development team that the current one is definitive, then add a simple CI check asserting the footer contains the phone number and address — so that if it disappears again it is caught at build time rather than by the next day&#39;s audit. <b>And capitalise on it now:</b> the footer carries the NAP but <b>still has no Home entry</b> — adding one costs almost nothing and resolves part of the P2 item below."></p>

    <h4 class="t" data-vi="Mỗi trang vẫn phát ra 14–32 khối JSON-LD y hệt nhau — 2.126 khối cho chỉ 237 payload thật" data-en="Every page still emits 14–32 byte-identical JSON-LD blocks — 2,126 blocks for only 237 real payloads"></h4>
    <p class="t" data-vi="Kiểm chứng lại bằng cách so <i>nội dung</i> khối chứ không chỉ đếm (<code>new Set(blocks).size</code>): <b>y nguyên sang ngày thứ 12</b>. Trang gốc <b>14 khối / 1 payload</b>; trang chủ <b>24 / 2</b>; <code>/articles</code> <b>22 / 1</b>; 6 trang dự án <b>14 / 1</b>; bài viết <b>32 / 4</b> (hoặc <b>31 / 3</b> ở 13 bài chưa có <code>FAQPage</code>). Cộng toàn site: <b>2.126 khối script</b> để biểu đạt <b>237 payload thật</b> — hệ số nhân bản <b>9,0&#215;</b>, giữ nguyên bốn ngày liền. Manh mối khoanh vùng vẫn đúng nguyên và hôm nay được kiểm chứng lại trên <code>/articles/3d-rendering-perth</code>: <b><code>Article</code> và <code>BreadcrumbList</code> in ra đúng 15 lần mỗi loại</b>, trong khi <code>BlogPosting</code> và <code>FAQPage</code> chỉ <b>1 lần</b>. Lỗi <b>không phải toàn bộ đầu ra bị lặp</b> mà là <b>đúng hai kiểu schema bị render 15 lần</b> — gần như chắc chắn chúng nằm trong một component được gọi lại theo mỗi section của trang thay vì một lần ở cấp layout. <b>Điểm mới hôm nay:</b> vì không có bài mới, tổng số khối thừa <b>không tăng thêm</b> lần đầu sau năm ngày — nhưng đó chỉ là do nhịp xuất bản dừng, không phải vì lỗi được kiềm chế. Schema thật vẫn đúng chuẩn, chỉ đơn giản bị in ra nhiều lần." data-en="Re-verified by comparing block <i>content</i> rather than counting (<code>new Set(blocks).size</code>): <b>unchanged into a twelfth day</b>. Core pages <b>14 blocks / 1 payload</b>; the homepage <b>24 / 2</b>; <code>/articles</code> <b>22 / 1</b>; the 6 project pages <b>14 / 1</b>; articles <b>32 / 4</b> (or <b>31 / 3</b> on the 13 without <code>FAQPage</code>). Site-wide that totals <b>2,126 script blocks</b> expressing <b>237 real payloads</b> — a duplication factor of <b>9.0&#215;</b>, steady for four days. The isolating lead still holds and was re-verified today on <code>/articles/3d-rendering-perth</code>: <b><code>Article</code> and <code>BreadcrumbList</code> each print exactly 15 times</b>, while <code>BlogPosting</code> and <code>FAQPage</code> appear <b>once</b>. The defect is <b>not the whole output repeating</b> but <b>precisely two schema types rendering 15 times</b> — almost certainly inside a component invoked once per page section rather than once at layout level. <b>New today:</b> with no article published, the redundant block total <b>did not grow</b> for the first time in five days — but that is only because publishing paused, not because the defect was contained. The genuine schema remains correct, merely printed repeatedly."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> tìm component render <code>&lt;script type=&quot;application/ld+json&quot;&gt;</code> cho <code>Article</code> và <code>BreadcrumbList</code> — <b>bắt đầu từ component cấp section dùng lại theo từng phần nội dung</b>, không phải root layout. Hoist chúng lên layout hoặc dedupe theo key. Sau khi sửa, mong đợi: trang gốc còn 1–2 khối, bài viết còn 4, trang dự án còn 1, HTML giảm 15–25 KB/trang. <b>Đây là việc P1 kỹ thuật lớn nhất và hôm nay nó trở lại vị trí #1</b> — câu hỏi về footer đã tự khép lại, nên không còn gì xếp trước nó. Đây cũng là thứ duy nhất giữ Structured Data ở 87 thay vì 95+." data-en="<b>Fix:</b> find the component rendering <code>&lt;script type=&quot;application/ld+json&quot;&gt;</code> for <code>Article</code> and <code>BreadcrumbList</code> — <b>start with the section-level component reused per content chunk</b>, not the root layout. Hoist them to the layout or dedupe by key. After the fix expect 1–2 blocks on core pages, 4 on articles, 1 on project pages, and 15–25 KB less HTML per page. <b>This is the largest technical P1 and today it returns to position #1</b> — the footer question closed itself, so nothing now ranks ahead of it. It is also the only thing holding Structured Data at 87 rather than 95+."></p>
  </div>

    <h4 class="t" data-vi="Trang chủ vẫn 7/11 ảnh thiếu alt, trang dự án 15/19, và cả hai vẫn 0 ảnh lazy-load" data-en="Homepage still 7 of 11 images without alt, project pages 15 of 19, and neither uses lazy-loading"></h4>
    <p class="t" data-vi="Rendered-DOM hôm nay lại cho kết quả <b>giống hệt từng con số</b> so 13/08, 12/08, 11/08, 10/08 và 07/08: trang chủ <b>11 ảnh, 7 thiếu <code>alt</code>, 0 ảnh <code>loading=&quot;lazy&quot;</code></b>; <code>/projects/251-station-st</code> <b>19 ảnh, 15 thiếu <code>alt</code>, 0 lazy-load</b>. Đây là khuyến nghị từ báo cáo 30/07 và nay <b>đã 15 ngày chưa deploy</b>. Toàn site (HTML thô): <b>81/628 ảnh thiếu alt</b> và <b>226/628 ảnh</b> dùng lazy-load — gần như toàn bộ phần lazy-load nằm ở template bài viết, còn trang chủ và 6 trang dự án vẫn ở mức <b>0 tuyệt đối</b>. <b>Bối cảnh hôm nay khiến việc này khó biện minh hơn nữa:</b> trong 72 giờ vừa qua đội ngũ đã deploy vào lớp component dùng chung <b>ba lần</b> — thêm footer, gỡ footer, rồi khôi phục footer. Cửa deploy không những tồn tại mà còn <b>đang được dùng liên tục</b> đúng vào lớp code chứa việc alt/lazy-load. Việc này bị bỏ lại <b>hoàn toàn vì chưa được đưa vào hàng đợi</b>. Với On-page đứng yên ở 76 suốt bảy ngày, đây vẫn là điểm thành phần duy nhất chưa từng nhúc nhích — và giờ nó là <b>lý do duy nhất khiến Health chưa vượt 90</b>." data-en="Today&#39;s rendered DOM again returns <b>identical figures</b> to 13, 12, 11, 10 and 07 Aug: the homepage carries <b>11 images, 7 without <code>alt</code>, 0 using <code>loading=&quot;lazy&quot;</code></b>; <code>/projects/251-station-st</code> carries <b>19 images, 15 without <code>alt</code>, 0 lazy-loaded</b>. This was recommended in the 30 Jul report and has now gone <b>fifteen days without a deploy</b>. Site-wide (raw HTML): <b>81 of 628 images lack alt</b> and <b>226 of 628</b> use lazy-loading — almost all of that from the article template, while the homepage and the 6 project pages remain at <b>absolute zero</b>. <b>Today&#39;s context makes this harder still to justify:</b> in the last 72 hours the team has deployed into the shared-component layer <b>three times</b> — adding the footer, removing it, restoring it. A deploy window does not merely exist, it <b>is in continuous use</b> on exactly the layer this work lives in. The item is outstanding <b>purely because it has not been queued</b>. With On-page frozen at 76 for seven days it remains the only sub-score that has not moved at all — and it is now <b>the single reason Health has not passed 90</b>."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> một deploy nhỏ gộp cả ba việc: 7 <code>alt</code> trang chủ + 15 <code>alt</code> trang dự án + <code>loading=&quot;lazy&quot;</code> cho ảnh dưới màn hình đầu — copy đúng cách template bài viết đang làm. Ước tính ~30 phút, đưa On-page từ 76 lên khoảng <b>85</b> và Health lên khoảng <b>90,5</b> — tức <b>đây là việc duy nhất đưa Health vượt mốc 90</b>. Đội ngũ vừa deploy ba lần trong ba ngày vào đúng lớp code này, nên không còn lý do kỹ thuật để hoãn thêm." data-en="<b>Fix:</b> one small deploy covering all three: 7 homepage <code>alt</code>s + 15 project-page <code>alt</code>s + <code>loading=&quot;lazy&quot;</code> below the fold — copy exactly what the article template already does. Roughly 30 minutes of work, lifting On-page from 76 to about <b>85</b> and Health to roughly <b>90.5</b> — making this <b>the one task that takes Health past 90</b>. The team has deployed into this exact layer three times in three days, so no technical reason to defer it remains."></p>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · Còn tồn · thêm một chi tiết mới phát hiện hôm nay" data-en="P2 · Persisting · with one new detail found today"></div>
    <h4 class="t" data-vi="58/80 trang không có internal link về trang chủ — và nút &quot;Back to Homepage&quot; ở /login hoá ra không phải link" data-en="58 of 80 pages carry no internal link home — and the /login &quot;Back to Homepage&quot; control turns out not to be a link"></h4>
    <p class="t" data-vi="Phép kiểm tra chạy lại trên toàn bộ 80 trang cho kết quả <b>giống hệt hôm qua</b>: <b>58/80 trang không có <code>href=&quot;/&quot;</code> và cũng không có link tuyệt đối về <code>https://dxliving.com/</code></b>. Chỉ <b>22 trang</b> có, gồm trang chủ và <b>21/57 bài viết</b> (link nằm trong breadcrumb). Toàn bộ 16 trang gốc còn lại và <b>cả 6 trang dự án</b> đều không có. <b>Chi tiết mới hôm nay:</b> báo cáo hôm qua ghi <code>/login</code> là ngoại lệ duy nhất có liên kết &quot;&#8592; Back to Homepage&quot; — kiểm tra kỹ HTML thô cho thấy <b>đó là một <code>&lt;button&gt;</code> chứ không phải <code>&lt;a href&gt;</code></b>, nên bot <b>không đi theo được</b>. Nghĩa là con số đúng là <b>58/80 trang không có đường về trang chủ mà crawler theo được</b>, và <code>/login</code> nằm trong nhóm 58 đó chứ không phải ngoại lệ. Việc footer quay lại hôm nay <b>không thay đổi kết luận</b>: footer mới có bốn cụm điều hướng (Modules · Projects · Suppliers · About · Articles · FAQ · Contact) nhưng <b>không có mục Home</b>, và số internal link mỗi trang vẫn đứng nguyên ở <b>16</b> đúng như hôm qua — tức các mục điều hướng trong footer cũng không phát ra <code>href</code> thật." data-en="Re-run across all 80 pages, the check returns <b>exactly yesterday&#39;s result</b>: <b>58 of 80 pages contain no <code>href=&quot;/&quot;</code> and no absolute link to <code>https://dxliving.com/</code></b>. Only <b>22 pages</b> do — the homepage plus <b>21 of 57 articles</b>, where the link sits in the breadcrumb. All 16 remaining core pages and <b>all 6 project pages</b> lack it. <b>New detail today:</b> yesterday&#39;s report recorded <code>/login</code> as the sole exception carrying a &quot;&#8592; Back to Homepage&quot; link — inspecting the raw HTML closely shows <b>it is a <code>&lt;button&gt;</code>, not an <code>&lt;a href&gt;</code></b>, so crawlers <b>cannot follow it</b>. The accurate figure is therefore <b>58 of 80 pages with no crawlable route home</b>, with <code>/login</code> inside that 58 rather than outside it. Today&#39;s footer restoration <b>does not change the conclusion</b>: the footer carries four navigation clusters (Modules · Projects · Suppliers · About · Articles · FAQ · Contact) but <b>no Home entry</b>, and the internal-link count per page stays at <b>16</b> exactly as yesterday — meaning the footer navigation items do not emit real <code>href</code>s either."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> bọc logo header trong <code>&lt;a href=&quot;/&quot; aria-label=&quot;DX Living — trang chủ&quot;&gt;</code> — một thay đổi này giải quyết cùng lúc cả <b>58 trang</b> vì logo nằm trong header dùng chung. Đổi nút ở <code>/login</code> thành thẻ <code>&lt;a href=&quot;/&quot;&gt;</code> (giữ nguyên kiểu dáng) là việc một dòng. Thêm mục <b>Home</b> vào cụm liên kết footer — <b>nên gộp luôn vào lần chỉnh footer đang diễn ra</b>. Đồng thời kiểm tra vì sao breadcrumb chỉ xuất hiện ở 21/57 bài; nhiều khả năng có hai template bài viết khác nhau và nên hợp nhất." data-en="<b>Fix:</b> wrap the header logo in <code>&lt;a href=&quot;/&quot; aria-label=&quot;DX Living — home&quot;&gt;</code> — that single change resolves all <b>58 pages</b> at once because the logo lives in the shared header. Turning the <code>/login</code> button into an <code>&lt;a href=&quot;/&quot;&gt;</code> (keeping the styling) is a one-line change. Add a <b>Home</b> entry to the footer link cluster — <b>fold this into the footer edit already in progress</b>. Also investigate why the breadcrumb appears on only 21 of 57 articles; most likely two article templates are in play and should be unified."></p>

    <div class="prio t" data-vi="✓ ĐIỂM SÁNG · tốc độ tốt nhất của cả chuỗi" data-en="✓ HOLDING STRONG · the fastest day of the series"></div>
    <h4 class="t" data-vi="57/57 bài viết dưới 1s lần đầu tiên, 78/80 trang dưới 1s, 80/80 trang đủ title/meta/canonical và đúng 1 H1" data-en="All 57 articles under 1s for the first time, 78 of 80 pages under 1s, 80 of 80 with title/meta/canonical and exactly one H1"></h4>
    <p class="t" data-vi="<b>Tốc độ là điểm sáng lớn nhất hôm nay và là mức tốt nhất từ trước tới nay:</b> TTFB trung bình toàn site 674 &#8594; <b>618 ms</b>; trang gốc 713 &#8594; <b>667 ms</b>; bài viết 673 &#8594; <b>617 ms</b>; trang dự án 573 &#8594; <b>492 ms</b>. <b>Lần đầu tiên toàn bộ 57 bài viết đều dưới 1s</b> (dải 0,54–0,87s) và <b>cả 6 trang dự án cũng vậy</b>; chỉ còn <code>/</code> (1,09s) và <code>/studio</code> (1,06s) vượt ngưỡng, mà trang chủ vừa lập mức thấp nhất của chính nó trong cả chuỗi. <b>0 trang &gt;3s</b> sang ngày thứ mười bốn; sự cố <code>/articles/*</code> chậm 6,5–10,8s hồi tháng 7 vẫn hết hẳn. Về on-page cơ bản: <b>không một trang nào</b> trong 80 trang thiếu title, meta description hay canonical, và <b>không một trang nào</b> sai số H1 — cả hai chỉ số sạch tuyệt đối sang <b>ngày thứ mười liên tiếp</b>. Độ dài title 26–80 ký tự và meta description 83–189 ký tự đều nằm trong dải hợp lý. Độ phủ schema giữ <b>97,5%</b>. Listing <code>/articles</code> giữ <b>đủ 57 link bài trong HTML thô</b>. <code>robots.txt</code> sạch và trỏ đúng sitemap; sitemap 79 URL khớp 80 trang crawl trừ đúng <code>/login</code>. <b>0 timeout, 0 lỗi 4xx/5xx sang ngày thứ mười.</b>" data-en="<b>Speed is the biggest positive today and the best recorded:</b> site-wide average TTFB 674 &#8594; <b>618 ms</b>; core pages 713 &#8594; <b>667 ms</b>; articles 673 &#8594; <b>617 ms</b>; project pages 573 &#8594; <b>492 ms</b>. <b>For the first time every one of the 57 articles is under 1s</b> (a 0.54–0.87s band) and <b>so are all 6 project pages</b>; only <code>/</code> (1.09s) and <code>/studio</code> (1.06s) exceed the threshold, and the homepage has just set its own lowest figure of the series. <b>Zero pages above 3s</b> for a fourteenth day; July&#39;s 6.5–10.8s <code>/articles/*</code> slowdown remains fully resolved. On basic on-page hygiene: <b>not one</b> of the 80 pages is missing a title, meta description or canonical, and <b>not one</b> has a wrong H1 count — both perfectly clean for a <b>tenth consecutive day</b>. Title lengths run 26–80 characters and meta descriptions 83–189, all within sensible ranges. Schema coverage holds at <b>97.5%</b>. The <code>/articles</code> listing still carries <b>all 57 article links in raw HTML</b>. <code>robots.txt</code> is clean and points at the right sitemap; the 79-URL sitemap matches the 80 crawled pages minus <code>/login</code> exactly. <b>Zero timeouts and zero 4xx/5xx errors for a tenth day.</b>"></p>
    <p class="fix t" data-vi="<b>Giữ nguyên — nhưng đừng chốt vội:</b> mức cải thiện tốc độ quá đều trên cả ba nhóm trang để đến từ thay đổi nội dung, nên khả năng cao là do cache/CDN ấm hoặc cấu hình phục vụ. <b>Theo dõi 15/08 và 16/08</b> trước khi coi 618 ms là mặt bằng mới. Khi sửa lỗi nhân bản schema ở P1, <b>đừng gỡ nhầm schema thật</b> — mục tiêu là còn 4 khối/bài, 1 khối/trang dự án và 1–2 khối/trang gốc, không phải 0." data-en="<b>Maintain — but do not call it settled:</b> the gain is too uniform across all three page groups to come from content changes, so a warm cache, CDN or serving-configuration change is the likely cause. <b>Watch 15 and 16 Aug</b> before treating 618 ms as the new baseline. When fixing the P1 duplication, <b>do not strip the genuine schema</b> — the target is 4 blocks per article, one per project page and 1–2 per core page, not zero."></p>

/b> on most pages, <b>1&#8594;3</b> across the project pages. Only <code>/login</code> and <code>/privacy-policy</code> are clean, exactly as on 13 and 12 Aug. <b>13 of 57 articles still lack <code>FAQPage</code></b> — <b>exactly the thirteen from the past four days, none retrofitted</b>: <code>how-3d-coordination-reduces-design-conflicts…</code>, <code>the-best-home-builders-adelaide</code>, <code>brisbane-custom-home-builders-checklist…</code>, <code>bim-3d-4d-5d-explained</code>, <code>custom-built-homes-melbourne-checklist</code>, <code>how-to-choose-custom-home-builders-in-south-australia</code>, <code>best-practices-for-project-and-quality-management-in-2026</code>, <code>construction-program-management-software</code>, <code>program-for-construction-estimates-explained</code>, <code>what-is-bim-3d-modeling</code>, <code>project-management-and-cost-control</code>, <code>bim-3d-from-design-to-site-in-2026</code>, <code>duplex-house-design-in-australia</code> — identifiable at a glance because they emit 31 JSON-LD blocks rather than 32. Coverage is static at <b>77.2%</b> because no article was published today. <b>11 pages sit under 300 words</b> — still exactly 11, but <b>the thinness has clearly eased</b> with the footer back: the 6 project pages rise from 161–178 to <b>222–238 words</b>, <code>/projects</code> 173 &#8594; <b>255</b>, <code>/contact</code> 187 &#8594; <b>250</b>, <code>/modules</code> 192 &#8594; <b>246</b> — those four now sit only about 45–55 words short of the 300 mark. <code>/start-interactive</code> (61 words) and <code>/login</code> (30) remain the thinnest. <code>/login</code> is correctly outside the sitemap but <code>/start-interactive</code> is still in it, and those two remain the only pages without schema. No <code>hreflang</code> in use — reasonable for an AU-only market."></p>

de>/login</code> &amp; <code>/start-interactive</code>, gỡ <code>/start-interactive</code> khỏi sitemap. <b>10. (THEO DÕI)</b> Xác nhận mức TTFB 618 ms có giữ được qua 15–16/08 hay không trước khi coi là mặt bằng mới." data-en="<b>Change vs 13 Aug:</b> yesterday&#39;s #1 (the footer rollback question) <b>closed itself</b> when the footer was restored, so the whole list <b>moves up one place</b> and the alt/lazy-load work becomes the top priority. <b>1.</b> Ship 7 homepage <code>alt</code>s + 15 project-page <code>alt</code>s + <code>loading=&quot;lazy&quot;</code> — <b>fifteen days late</b>, ~30 minutes, taking On-page 76 &#8594; ~85 and Health to ~<b>90.5</b>. <b>This is the one remaining task that takes Health past 90</b>, and the team has deployed into this exact component layer three times in three days. <b>2.</b> Fix the JSON-LD duplication — <b>the largest technical P1</b>, now on day twelve; the lead was re-verified today: <code>Article</code> and <code>BreadcrumbList</code> repeat exactly <b>15 times</b> while <code>BlogPosting</code> and <code>FAQPage</code> appear once, so inspect the section-level component rather than the root layout. Expect Structured Data 87 &#8594; 95+ and 15–25 KB less HTML per page. <b>3.</b> Wrap the header logo in <code>&lt;a href=&quot;/&quot;&gt;</code> and turn the <code>/login</code> button into an <code>a</code> element — resolving <b>58 pages</b> at once; add a <b>Home</b> entry to the footer while it is already being edited. <b>4. (NEW)</b> Lock the final footer version and add a CI check asserting it contains the phone number and address — the block has changed state three times in three days and needs an automated guard. <b>5.</b> Write 150–200 words of page-specific copy for the 6 project pages — the footer has lifted them to 222–238 words, but with boilerplate; page-specific copy is still only ~60–80 words. <b>6.</b> Add <code>FAQPage</code> to the 13 articles missing it — spot them instantly via the JSON-LD = 31 column function trFmt(d){const p=d.split('-');return LANG==='vi'?p[2]+'/'+p[1]:p[2]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1];}

/* generic multi-series line chart -> inline SVG string */
function trChart(rows, series, opts){
  opts = opts || {};
  const W=520, H=opts.h||210, L=42, R=12, TP=14, BT=30;
  const iw=W-L-R, ih=H-TP-BT;
  let vals=[]; series.forEach(s=>rows.forEach(r=>{const v=r[s.i]; if(v!==null&&v!==0||s.zero)vals.push(v);}));
  let lo = opts.min!==undefined?opts.min:Math.min.apply(null,vals);
  let hi = opts.max!==undefined?opts.max:Math.max.apply(null,vals);
  if(hi===lo){hi=lo+1;}
  const pad=(hi-lo)*0.12; lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=>L+(rows.length<2?iw/2:i*iw/(rows.length-1));
  const Y=v=>TP+ih-(v-lo)/(hi-lo)*ih;
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let g='';
  /* gridlines + y labels */
  const TICKS=4;
  for(let t=0;t<=TICKS;t++){
    const v=lo+(hi-lo)*t/TICKS, y=Y(v);
    g+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" ${t?'stroke-dasharray="3 4"':''}/>`;
    g+=`<text x="${L-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">${Math.round(v).toLocaleString(loc)}</text>`;
  }
  /* x labels: first, last and every other */
  rows.forEach((r,i)=>{
    if(i!==0 && i!==rows.length-1 && i%2) return;
    g+=`<text x="${X(i).toFixed(1)}" y="${H-11}" text-anchor="middle" font-size="9" fill="var(--muted)">${trFmt(r[0])}</text>`;
  });
  /* series */
  series.forEach(s=>{
    const pts=[];
    rows.forEach((r,i)=>{const v=r[s.i]; if(v===null||(v===0&&!s.zero))return; pts.push([X(i),Y(v),v,r[0]]);});
    if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area){
      g+=`<path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${TP+ih} L ${pts[0][0].toFixed(1)} ${TP+ih} Z" fill="${s.c}" opacity=".10"/>`;
    }
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{
      g+=`<circle class="tr-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.w>2?3:2.4}" fill="var(--card)" stroke="${s.c}" stroke-width="1.8"><title>${s.n} · ${trFmt(p[3])}: ${p[2].toLocaleString(loc)}${opts.unit||''}</title></circle>`;
    });
    /* value label on the last point */
    if(s.last!==false){
      const lp=pts[pts.length-1];
      g+=`<text x="${(lp[0]+6).toFixed(1)}" y="${(lp[1]-6).toFixed(1)}" font-size="10.5" font-weight="700" fill="${s.c}">${lp[2].toLocaleString(loc)}</text>`;
    }
  });
  const lg=series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('');
  return `<svg class="tr-svg" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tr-lg">${lg}</div>`;
}

function renderRt(){
  const loaded = [...PAGES].sort((a,b)=>b.rt-a.rt);

  const loc = LANG==='vi'?'vi-VN':'en-US';
  let h='';
  loaded.forEach(p=>{
    const w=Math.max(2,(p.rt/max*100)).toFixed(1);
    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

let sortK='rt', sortDir=1, filt='all';
function render(){

  let rows=[...PAGES];
  if(filt!=='all')rows=rows.filter(p=>p.grp===filt);
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}
    return sortDir*(x-y);
  });
  tbody.innerHTML=rows.map(p=>{
    const st='<span class="badge b200">200</span>';
    const sc=p.schema>0?`<span class="yes">${p.schema}</span>`:'<span class="no">0</span>';

    return `<tr>
      <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.url}">${p.url}</td>
      <td class="num">${st}</td>

}

      dow:['Su','Mo','Tu','We','Th','Fr','Sa'],
      saved:n=>`${n} stored day(s) in this range · dates in Vietnam time (Asia/Ho_Chi_Minh), the time of the crawl`,
      noRep:'This day was not crawled — there is no separate report to open.',
      trendTitle:(a,b)=>`Health Score trend · ${a} → ${b}`,
      open:'open'}
};
const pkL = () => PK_T[LANG];

function pkISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pkD(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function pkFmt(iso){ const [y,m,d]=iso.split('-'); return LANG==='vi'?`${d}/${m}/${y}`:`${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`; }
function pkAdd(iso,n){ const d=pkD(iso); d.setDate(d.getDate()+n); return pkISO(d); }
function pkIn(iso,a,b){ return iso>=a && iso<=b; }
function pkCount(a,b){ return PK_SNAPS.filter(s=>pkIn(s.date,a,b)).length; }

function pkPresets(){
  const T=PK_TODAY, d=pkD(T);
  const monStart=(()=>{const x=pkD(T); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return pkISO(x);})();
  const lastMonStart=pkAdd(monStart,-7), lastMonEnd=pkAdd(monStart,-1);
  const mStart=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
  const pmStart=pkISO(pm), pmEnd=pkISO(new Date(d.getFullYear(),d.getMonth(),0));
  const first=PK_SNAPS.length?PK_SNAPS[0].date:T;
  return [
    {k:'y',   vi:'Hôm qua',   en:'Yesterday',   s:pkAdd(T,-1), e:pkAdd(T,-1)},
    {k:'7',   vi:'7 ngày qua', en:'Last 7 days',  s:pkAdd(T,-6), e:T},
    {k:'28',  vi:'28 ngày qua',en:'Last 28 days', s:pkAdd(T,-27),e:T},
    {k:'90',  vi:'90 ngày qua',en:'Last 90 days', s:pkAdd(T,-89),e:T},
    {k:'tw',  vi:'Tuần này',  en:'This week',   s:monStart, e:T},
    {k:'tm',  vi:'Tháng này', en:'This month',  s:mStart, e:T},
    {k:'ty',  vi:'Năm nay',   en:'This year',   s:`${d.getFullYear()}-01-01`, e:T},
    {k:'lw',  vi:'Tuần trước',en:'Last week',   s:lastMonStart, e:lastMonEnd},
    {k:'lm',  vi:'Tháng trước',en:'Last month', s:pmStart, e:pmEnd},
    {k:'all', vi:'Toàn bộ dữ liệu đã lưu', en:'All stored data', s:first, e:T}
  ];
}

function pkRenderPresets(){
  const box=document.getElementById('dpPresets'); if(!box) return;
  box.innerHTML = pkPresets().map(p=>{
    const n=pkCount(p.s,p.e), off=n===0;
    const on=PK_PRESET===p.k;
    return `<button type="button" class="dp-preset${on?' on':''}" data-k="${p.k}" ${off?'disabled':''}>
      <span class="rd"></span><span class="nm">${LANG==='vi'?p.vi:p.en}</span><span class="ct">${n}</span></button>`;
  }).join('');
  box.querySelectorAll('.dp-preset').forEach(b=>b.addEventListener('click',()=>{
    const p=pkPresets().find(x=>x.k===b.dataset.k);
    PK_PRESET=p.k; PK_DRAFT={s:p.s,e:p.e}; PK_PENDING=false;
    PK_VIEW=pkD(p.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1);
    pkRenderCal(); pkRenderPresets();
  }));
}

function pkMonth(base,off){
  const d=new Date(base.getFullYear(), base.getMonth()+off, 1);
  const y=d.getFullYear(), m=d.getMonth();
  const start=new Date(y,m,1).getDay(); // 0=Sun
  const days=new Date(y,m+1,0).getDate();
  let cells=pkL().dow.map(x=>`<div class="dp-dow">${x}</div>`).join('');
  for(let i=0;i<start;i++) cells+='<button class="dp-d blank" disabled></button>';
  for(let dd=1;dd<=days;dd++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const has=!!PK_MAP[iso];
    const sel=iso===PK_DRAFT.s||iso===PK_DRAFT.e;
    const inr=pkIn(iso,PK_DRAFT.s,PK_DRAFT.e)&&!sel;
    const edge=iso===PK_DRAFT.s&&PK_DRAFT.s!==PK_DRAFT.e?' edge-l':(iso===PK_DRAFT.e&&PK_DRAFT.s!==PK_DRAFT.e?' edge-r':'');
    cells+=`<button type="button" class="dp-d${has?' has':''}${inr?' inrange':''}${sel?' sel'+edge:''}" data-iso="${iso}">${dd}${has?'<span class="dot"></span>':''}</button>`;
  }
  return {title:`${pkL().months[m]} ${y}`, html:`<div class="dp-grid">${cells}</div>`};
}

function pkRenderCal(){
  if(!PK_VIEW){ PK_VIEW=pkD(PK_SEL.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1); }
  const a=pkMonth(PK_VIEW,0), b=pkMonth(PK_VIEW,1);
  document.getElementById('dpM1').textContent=a.title;
  document.getElementById('dpM2').textContent=b.title;
  document.getElementById('dpG1').innerHTML=a.html;
  document.getElementById('dpG2').innerHTML=b.html;
  document.querySelectorAll('#dpG1 .dp-d,#dpG2 .dp-d').forEach(el=>{
    if(el.classList.contains('blank')) return;
    el.addEventListener('click',()=>{
      const iso=el.dataset.iso;
      if(!PK_PENDING){ PK_DRAFT={s:iso,e:iso}; PK_PENDING=true; }
      else { PK_DRAFT = iso<PK_DRAFT.s ? {s:iso,e:PK_DRAFT.s} : {s:PK_DRAFT.s,e:iso}; PK_PENDING=false; }
      PK_PRESET=null; pkRenderCal(); pkRenderPresets();
    });
  });
  const single=PK_DRAFT.s===PK_DRAFT.e;
  document.getElementById('dpSelD').textContent = single?pkFmt(PK_DRAFT.s):`${pkFmt(PK_DRAFT.s)} → ${pkFmt(PK_DRAFT.e)}`;
  const n=pkCount(PK_DRAFT.s,PK_DRAFT.e);
  document.getElementById('dpSelInfo').textContent = n===0 ? pkL().noRep : pkL().saved(n);
}

function pkRenderQuick(){
  const box=document.getElementById('dpQuick'); if(!box) return;
  const chips=PK_SNAPS.slice().reverse().map(s=>{
    const cur=s.date===PK_SEL.s&&PK_SEL.s===PK_SEL.e;
    const lb=LANG==='vi'?(s.label_vi||''):(s.label_en||'');
    return `<button type="button" class="qchip${cur?' cur':''}" data-iso="${s.date}">
      <span class="qd">${pkFmt(s.date)}</span><span class="ql">${lb}</span></button>`;
  }).join('');
  box.innerHTML=`<span class="pk-quick-lbl">${pkL().quick}</span>`+chips;
  box.querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('cur')) return;
    pkGo(b.dataset.iso,b.dataset.iso);
  }));
}

function pkRenderNow(){
  const el=document.getElementById('dpNow'); if(!el) return;
  const single=PK_SEL.s===PK_SEL.e;
  el.textContent = !single ? pkL().trend(pkFmt(PK_SEL.s),pkFmt(PK_SEL.e))
    : (PK_SEL.s===PK_TODAY ? pkL().now(pkFmt(PK_SEL.s)) : pkL().viewing(pkFmt(PK_SEL.s)));
  document.getElementById('dpLabel').textContent = single
    ? `${pkL().day} ${pkFmt(PK_SEL.s)}` : `${pkL().range} ${pkFmt(PK_SEL.s)} → ${pkFmt(PK_SEL.e)}`;
}

function pkGo(s,e){
  if(s===e){
    const snap=PK_MAP[s];
    if(snap && s!==PK_TODAY){ location.href=PK_BASE+snap.report; return; }
    PK_SEL={s,e}; PK_DRAFT={s,e}; PK_PRESET=null;
    document.getElementById('dpTrend').classList.remove('on');
    pkRenderNow(); pkRenderQuick(); pkRenderCal();
    return;
  }
  PK_SEL={s,e}; pkRenderNow(); pkRenderQuick(); pkTrend(s,e);
}

function pkTrend(s,e){
  const box=document.getElementById('dpTrend');
  const days=PK_SNAPS.filter(x=>pkIn(x.date,s,e));
  if(!days.length){ box.classList.remove('on'); box.innerHTML=''; return; }
  Promise.all(days.map(d=>fetch(PK_BASE+d.data,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)))
   .then(js=>{
     const rows=js.map((j,i)=>({date:days[i].date, rep:days[i].report, hs:j&&j.health_score, pg:j&&j.pages_measured}))
                  .filter(r=>r.hs!=null);
     box.innerHTML=`<h4>${pkL().trendTitle(pkFmt(s),pkFmt(e))}</h4>`+rows.map(r=>`
       <div class="trd"><span class="tdate">${pkFmt(r.date)}</span>
         <span class="ttrack"><span class="tfill" style="width:${r.hs}%"></span></span>
         <span class="tval">${r.hs}</span>
         <span class="tlink" data-h="${r.rep}">${pkL().open} &#8594;</span></div>`).join('');
     box.classList.add('on');
     box.querySelectorAll('.tlink').forEach(a=>a.addEventListener('click',()=>{
       const h=a.dataset.h; if(h && h!=='index.html') location.href=PK_BASE+h;
     }));
   });
}

function pkRender(){ pkRenderPresets(); pkRenderCal(); pkRenderQuick(); pkRenderNow(); pkToggleLabel(); }

(function pkInit(){
  const btn=document.getElementById('dpBtn'), pane=document.getElementById('dpPane');
  if(!btn) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=pane.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
    if(open){ PK_DRAFT={...PK_SEL}; PK_PENDING=false; pkRenderCal(); pkRenderPresets(); }
  });
  document.addEventListener('click',e=>{
    if(!pane.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') pane.classList.remove('open'); });
  document.getElementById('dpPrev').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()-1); pkRenderCal(); });
  document.getElementById('dpNext').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()+1); pkRenderCal(); });
  document.getElementById('dpCancel').addEventListener('click',()=>{
    PK_DRAFT={...PK_SEL}; PK_PENDING=false; PK_PRESET=null;
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false'); pkRenderCal();
  });
  document.getElementById('dpApply').addEventListener('click',()=>{
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    pkGo(PK_DRAFT.s,PK_DRAFT.e);
  });
  fetch(PK_BASE+'data/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    PK_SNAPS=(j.snapshots||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s);
    pkRender();
  }).catch(()=>{
    PK_SNAPS=[{date:PK_TODAY,report:'index.html',data:'data/'+PK_TODAY+'.json',label_vi:'Bản hiện tại',label_en:'Current report'}];
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s); pkRender();
  });
})();

setLang('vi');
</script>
</body>
</html>
