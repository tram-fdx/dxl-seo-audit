<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .legend .foot{display:block;line-height:1.55}
  .legend{max-width:520px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}

  /* ---------- date picker v2 (sample-matched) ---------- */
  /* collapsible date picker */
  .pk-toggle{margin-top:24px;width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 20px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);
    text-align:left;transition:border-color .15s,box-shadow .15s}
  .pk-toggle:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(184,147,90,.13)}
  .pk-toggle .lft{display:flex;align-items:center;gap:11px;min-width:0}
  .pk-toggle .bar{display:inline-block;width:3px;height:17px;background:var(--accent);border-radius:2px;flex:none}
  .pk-toggle .cap{font-weight:600}
  .pk-toggle .sel{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
  .pk-toggle .chev{flex:none;transition:transform .2s;color:var(--muted);font-size:12px}
  .pk-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .pk-wrap[hidden]{display:none}
  .pk-wrap .pk-card{margin-top:10px}

  /* trend charts */
  .tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.tr-grid{grid-template-columns:1fr}}
  .tr-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 14px}
  .tr-card h3{margin:0 0 2px;font-size:14.5px;font-weight:700;color:var(--ink)}
  .tr-card .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
  .tr-lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .tr-lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .tr-svg{width:100%;height:auto;display:block;overflow:visible}
  .tr-dot{transition:r .12s}
  .tr-card:hover .tr-dot{r:3.2}
  .pk-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 16px;box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .pk-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;
    letter-spacing:.9px;text-transform:uppercase;color:var(--accent-dk);margin:0 0 8px}
  .pk-title .bar{width:26px;height:3px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  .pk-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;max-width:900px}
  .pk-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dpwrap{position:relative}
  .dpbtn{display:inline-flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid #cfc6b3;border-radius:10px;padding:10px 15px;font-family:inherit;
    font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink);cursor:pointer;transition:.15s}
  .dpbtn:hover{border-color:var(--accent)}
  .dpbtn .car{color:var(--muted);font-size:9px;margin-left:2px}
  .pk-now{display:inline-block;background:var(--accent-soft,#f3e7d3);color:var(--accent-dk);
    border:1px solid #e6d5b8;border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700}

  .dppane{position:absolute;top:calc(100% + 9px);left:0;z-index:80;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 40px rgba(70,55,30,.20);overflow:hidden}
  .dppane.open{display:flex}
  .dp-presets{width:196px;flex:0 0 auto;border-right:1px solid var(--line);
    padding:12px 8px;background:#fdfbf6;max-height:430px;overflow:auto}
  .dp-preset{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;
    font-size:12.5px;color:var(--ink);transition:.12s}
  .dp-preset:hover:not(:disabled){background:var(--cream2)}
  .dp-preset:disabled{color:#bdb4a6;cursor:not-allowed}
  .dp-preset .rd{width:13px;height:13px;border-radius:50%;border:1.5px solid #c3b9a6;flex:0 0 auto;position:relative}
  .dp-preset.on .rd{border-color:var(--accent)}
  .dp-preset.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
  .dp-preset .nm{flex:1}
  .dp-preset .ct{font-size:11.5px;color:var(--faint,#9a9186);font-weight:700}

  .dp-right{padding:14px 16px 12px;min-width:452px}
  .dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .dp-nav button{background:transparent;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
  .dp-nav button:hover:not(:disabled){background:var(--cream2);color:var(--ink)}
  .dp-nav button:disabled{opacity:.3;cursor:not-allowed}
  .dp-nav .mtitle{flex:1;display:flex;justify-content:space-around;font-size:13.5px;font-weight:700}
  .dp-months{display:flex;gap:26px}
  .dp-m{flex:1}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dp-dow{font-size:10.5px;color:var(--muted);text-align:center;padding:5px 0 3px;font-weight:700}
  .dp-d{position:relative;height:29px;border:none;background:transparent;border-radius:7px;
    font-family:inherit;font-size:12.5px;color:#bdb4a6;cursor:pointer;padding:0;transition:.1s}
  .dp-d.blank{cursor:default}
  .dp-d.has{color:var(--ink);font-weight:700}
  .dp-d:hover:not(.blank):not(.sel){background:var(--cream2)}
  .dp-d.inrange{background:var(--accent-soft,#f3e7d3);border-radius:0}
  .dp-d.sel{background:var(--accent);color:#2c2620;font-weight:800}
  .dp-d.sel.edge-l{border-radius:7px 0 0 7px}
  .dp-d.sel.edge-r{border-radius:0 7px 7px 0}
  .dp-d .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:3.5px;height:3.5px;border-radius:50%;background:var(--accent)}
  .dp-d.sel .dot{background:#2c2620}

  .dp-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-selinfo .d1{font-size:13.5px;font-weight:700}
  .dp-selinfo .d2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;max-width:300px}
  .dp-actions{display:flex;gap:9px;flex:0 0 auto}
  .dp-actions button{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:9px;
    padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .dp-actions .go{background:var(--accent);border-color:var(--accent);color:#2c2620}
  .dp-actions .go:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
  .dp-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
  .dp-legend .dotlg{display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-right:4px}

  .pk-quick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;
    padding-top:14px;border-top:1px solid var(--line)}
  .pk-quick-lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);
    text-transform:uppercase;flex:0 0 auto;margin-right:2px}
  .qchip{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--ink);transition:.13s;text-align:left}
  .qchip:hover{border-color:var(--accent);background:#fdfaf3}
  .qchip .qd{font-weight:700;flex:0 0 auto}
  .qchip .ql{font-size:11.5px;color:var(--muted)}
  .qchip.cur{background:var(--accent);border-color:var(--accent);color:#2c2620;cursor:default}
  .qchip.cur .ql{color:#5c4a24}

  .pk-trend{display:none;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .pk-trend.on{display:block}
  .pk-trend h4{margin:0 0 10px;font-size:13px;color:var(--accent-dk)}
  .trd{display:grid;grid-template-columns:88px 1fr 46px 62px;gap:9px;align-items:center;
    margin:6px 0;font-size:12.5px}
  .trd .tdate{font-weight:700}
  .trd .ttrack{background:var(--cream2);border-radius:6px;height:16px;overflow:hidden}
  .trd .tfill{height:100%;background:var(--accent);border-radius:6px}
  .trd .tval{font-weight:800;text-align:right}
  .trd .tlink{font-size:11px;color:var(--accent-dk);text-decoration:underline;cursor:pointer;text-align:right}
  @media(max-width:860px){.dppane.open{flex-direction:column}.dp-right{min-width:0}.dp-months{flex-direction:column;gap:14px}.dp-presets{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:none}}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 17 trang gốc + 58 bài /articles + 6 trang dự án + sitemap" data-en="Source: Chrome live crawl · 17 core pages + 58 /articles + 6 project pages + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>21/08/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>21 Aug 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>81 trang</b> · Sitemap: <b>16 URL</b>" data-en="Directly measured: <b>81 pages</b> · Sitemap: <b>16 URLs</b>"></span><br>
        Method: Chrome fetch tuần tự · AbortController 12–15s
      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <!-- date picker v2 (collapsible) -->
  <button class="pk-toggle" id="pkToggle" type="button" aria-expanded="false" aria-controls="pkWrap" onclick="pkFold()">
    <span class="lft"><span class="bar"></span>
      <span class="cap t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span>
      <span class="sel" id="pkToggleSel"></span></span>
    <span class="chev">&#9660;</span>
  </button>
  <div class="pk-wrap" id="pkWrap" hidden>
  <div class="pk-card">
    <div class="pk-title"><span class="bar"></span><span class="t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span></div>
    <p class="pk-sub t" data-vi="Chọn <b>một ngày</b> rồi bấm <b>Cập nhật</b> để mở đúng bản báo cáo đã lưu của ngày đó. Chọn <b>một khoảng ngày</b> để xem xu hướng trong khoảng. Ngày <b>có dấu chấm</b> là ngày đã quét và có báo cáo lưu; ngày làm mờ vẫn chọn được làm đầu/cuối khoảng, nhưng không có báo cáo riêng để mở." data-en="Pick <b>a single day</b> and press <b>Update</b> to open that day's saved report. Pick <b>a date range</b> to see the trend across it. Days <b>with a dot</b> were crawled and have a stored report; faded days can still anchor a range but have no report of their own."></p>
    <div class="pk-bar">
      <div class="dpwrap">
        <button class="dpbtn" id="dpBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>&#128197;</span><span id="dpLabel">Ngày 19/08/2026</span><span class="car">&#9660;</span>
        </button>
        <div class="dppane" id="dpPane" role="dialog">
          <div class="dp-presets" id="dpPresets"></div>
          <div class="dp-right">
            <div class="dp-nav">
              <button type="button" id="dpPrev" aria-label="prev">&#8249;</button>
              <div class="mtitle"><span id="dpM1"></span><span id="dpM2"></span></div>
              <button type="button" id="dpNext" aria-label="next">&#8250;</button>
            </div>
            <div class="dp-months"><div class="dp-m" id="dpG1"></div><div class="dp-m" id="dpG2"></div></div>
            <div class="dp-foot">
              <div class="dp-selinfo"><div class="d1" id="dpSelD"></div><div class="d2" id="dpSelInfo"></div></div>
              <div class="dp-actions">
                <button type="button" id="dpCancel" class="t" data-vi="Hủy" data-en="Cancel"></button>
                <button type="button" id="dpApply" class="go t" data-vi="Cập nhật" data-en="Update"></button>
              </div>
            </div>
            <div class="dp-legend"><span class="dotlg"></span><span class="t" data-vi="Dấu chấm = ngày đã có dữ liệu lưu. Ngày làm mờ = chưa quét: dùng được làm đầu/cuối khoảng, nhưng không mở được báo cáo riêng." data-en="Dot = a day with stored data. Faded day = not crawled: usable as a range endpoint, but it has no report of its own to open."></span></div>
          </div>
        </div>
      </div>
      <span class="pk-now" id="dpNow"></span>
    </div>
    <div class="pk-quick" id="dpQuick"></div>
    <div class="pk-trend" id="dpTrend"></div>
  </div>

  </div>

  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi">
      <div class="lbl class="t" data-vi="Health Score" data-en="Health Score"></div>
      <div class="score-ring">
        <div class="val" style="color:var(--accent-dk)">84<span style="font-size:15px;color:var(--muted)">/100</span></div>
      </div>

  <div class="foot t" data-vi="<b>Cách đọc:</b> mỗi điểm là một lần quét đầy đủ; các ngày không quét (01–02/08, 06/08, 08–09/08, 15–16/08) <b>không</b> được nội suy mà chỉ nối thẳng giữa hai lần quét gần nhau, nên đoạn dốc dài không có nghĩa là thay đổi diễn ra đột ngột. <b>Ba mốc đáng chú ý:</b> (1) <b>07/08</b> Crawlability nhảy 88 &#8594; <b>96</b> khi listing <code>/articles</code> bắt đầu server-render đủ link bài và 6 trang dự án có schema — bước nhảy lớn nhất trong toàn chuỗi; (2) <b>On-page đứng yên ở 76 suốt từ 31/07 tới nay</b> — đường thẳng tuyệt đối này chính là hai lỗi alt/lazy-load chưa từng được deploy, và nó là lý do duy nhất khiến Health chưa vượt 90; (3) <b>đường Content đã ngừng dao động</b>: sau bốn lần đảo chiều 81 &#8594; 79 &#8594; 81 &#8594; 80 (footer thêm 12/08, gỡ 13/08, khôi phục 14/08, gỡ 17/08), hôm nay nó <b>giữ nguyên 80</b> và số từ từng trang trùng khít 17/08 — khối footer đang ổn định ở trạng thái <b>đã gỡ</b>. Đó là tin tốt về mặt ổn định, nhưng <b>quyết định giữ hay bỏ vẫn chưa được chốt</b>. Đường Performance hôm nay là <b>lần giảm hai ngày liên tiếp đầu tiên của cả chuỗi</b> (95 &#8594; 94 &#8594; 92) — vẫn trong dải dao động lịch sử 490–870 ms, nhưng đáng theo dõi thêm một ngày." data-en="<b>How to read this:</b> each point is one full crawl; days without a crawl (1–2, 6, 8–9, 15–16 Aug) are <b>not</b> interpolated, the line simply joins the two nearest crawls, so a long slope does not mean the change happened abruptly. <b>Three things worth noting:</b> (1) on <b>07 Aug</b> Crawlability jumped 88 &#8594; <b>96</b> when the <code>/articles</code> listing began server-rendering every article link and the 6 project pages gained schema — the largest single step in the series; (2) <b>On-page has been flat at 76 since 31 Jul</b>, and that perfectly straight line is precisely the alt-text and lazy-load work that has never been deployed — it is the sole reason Health has not passed 90; (3) <b>the Content line has stopped swinging</b>: after four reversals of 81 &#8594; 79 &#8594; 81 &#8594; 80 (footer added 12 Aug, removed 13 Aug, restored 14 Aug, removed 17 Aug), today it <b>holds at 80</b> with page-level word counts matching 17 Aug exactly — the footer block is now stable in its <b>removed</b> state. That is good news for stability, but <b>the keep-or-drop decision is still outstanding</b>. The Performance line today marks the <b>first two-crawl consecutive decline in the series</b> (95 &#8594; 94 &#8594; 92) — still inside the historical 490–870 ms band, but worth one more day of watching."></div>

  <!-- Insights -->
  <h2 class="sec class="t" data-vi="Hướng đi &amp; Insight ưu tiên" data-en="Direction &amp; Priority insights"></h2>

  <div class="ins p1">
    <div class="prio class="t" data-vi="P1 · MỚI HÔM NAY · nghiêm trọng nhất cả chuỗi · sitemap mất 80% số URL" data-en="P1 · NEW TODAY · the most serious fault of the series · the sitemap lost 80% of its URLs"></div>
    <h4 class="t" data-vi="sitemap.xml tụt từ 81 URL xuống 16: mất toàn bộ 58 bài viết, cả 6 trang dự án và /faq" data-en="sitemap.xml collapsed from 81 URLs to 16: all 58 articles, all 6 project pages and /faq are gone"></h4>
    <p class="t" data-vi="Hôm qua <code>https://dxliving.com/sitemap.xml</code> khai báo <b>81 URL</b> khớp đúng 81 trang crawl được. Hôm nay nó chỉ còn <b>16 URL</b>, và 16 URL đó đều là trang gốc tĩnh: <code>/</code>, <code>/start-interactive</code>, <code>/about</code>, <code>/modules</code>, <code>/projects</code>, <code>/suppliers</code>, <code>/apply</code>, <code>/articles</code>, <code>/contact</code>, <code>/login</code>, <code>/studio</code>, <code>/interiors</code>, <code>/model</code>, <code>/prestige</code>, <code>/privacy-policy</code>, <code>/terms-of-service</code>. <b>Biến mất hoàn toàn:</b> cả <b>58 URL <code>/articles/*</code></b>, cả <b>6 URL <code>/projects/*</code></b> và <code>/faq</code> — tức <b>65/81 trang, 80% số URL đáng index của site</b>. Bằng chứng nguyên nhân nằm ở thẻ <code>&lt;lastmod&gt;</code>: <b>mọi URL còn lại đều ghi 02/06/2026</b>, một ngày cách đây gần ba tháng. Sitemap sinh động sẽ có lastmod rải rác theo ngày sửa từng trang. Đọc chung với việc <code>/login</code> vẫn nằm trong danh sách còn <code>/faq</code> thì không, đây <b>không phải người ta gỡ từng URL</b> mà là <b>một file <code>sitemap.xml</code> tĩnh cũ đã ghi đè lên bản sinh động</b> — nhiều khả năng do một file trong <code>public/</code> được deploy đè lên route sinh sitemap. <code>robots.txt</code> vẫn trỏ đúng vào file này, nên Google đang đọc bản 16 URL. <b>Hệ quả:</b> bài viết vẫn có thể được tìm thấy qua listing <code>/articles</code> (vẫn render đủ 58 link trong HTML thô) nhưng <b>mất hết tín hiệu ưu tiên và tốc độ tái crawl</b>; bài mới sẽ vào index chậm hơn nhiều; và 5 trang dự án thì <b>không còn đường nào</b> (xem P1 kế tiếp)." data-en="Yesterday <code>https://dxliving.com/sitemap.xml</code> declared <b>81 URLs</b>, matching all 81 crawlable pages exactly. Today it holds just <b>16</b>, and all sixteen are static core pages: <code>/</code>, <code>/start-interactive</code>, <code>/about</code>, <code>/modules</code>, <code>/projects</code>, <code>/suppliers</code>, <code>/apply</code>, <code>/articles</code>, <code>/contact</code>, <code>/login</code>, <code>/studio</code>, <code>/interiors</code>, <code>/model</code>, <code>/prestige</code>, <code>/privacy-policy</code> and <code>/terms-of-service</code>. <b>Entirely absent:</b> all <b>58 <code>/articles/*</code> URLs</b>, all <b>6 <code>/projects/*</code> URLs</b> and <code>/faq</code> — that is <b>65 of 81 pages, 80% of the site&#39;s indexable URLs</b>. The cause shows in the <code>&lt;lastmod&gt;</code> values: <b>every remaining URL reads 2 Jun 2026</b>, nearly three months ago. A generated sitemap would carry lastmods scattered across each page&#39;s edit date. Read together with <code>/login</code> still being listed while <code>/faq</code> is not, this is <b>not a URL-by-URL removal</b> but <b>an old static <code>sitemap.xml</code> overwriting the generated one</b> — most likely a file in <code>public/</code> deployed over the sitemap route. <code>robots.txt</code> still points at this file, so Google is reading the 16-URL version. <b>Consequence:</b> articles remain discoverable through the <code>/articles</code> listing (which still server-renders all 58 links) but <b>lose all priority signal and recrawl velocity</b>; new articles will enter the index far more slowly; and 5 project pages now have <b>no path at all</b> (see the next P1)."></p>
    <p class="fix t" data-vi="<b>Cách sửa — ưu tiên số một, nên làm ngay hôm nay:</b> (1) kiểm tra xem có file <code>sitemap.xml</code> tĩnh nào nằm trong <code>public/</code> (hoặc thư mục static tương đương) không — nếu có, <b>xoá nó</b> để route sinh sitemap được phục vụ trở lại; (2) nếu sitemap vốn được sinh lúc build, kiểm tra xem bước sinh có bị lỗi âm thầm trong lần deploy gần nhất không; (3) sau khi khôi phục, xác nhận file trả về <b>81 URL</b> với <code>lastmod</code> đúng ngày sửa từng trang, rồi <b>submit lại sitemap trong Google Search Console</b> để buộc tái đọc; (4) nhân tiện <b>gỡ <code>/login</code></b> khỏi sitemap và gắn <code>noindex</code> cho nó. Riêng việc này đưa Crawlability <b>67 &#8594; khoảng 92</b> và Health <b>84 &#8594; khoảng 90</b> ngay trong ngày. <b>Nên chốt bằng test hồi quy:</b> một assert trong CI kiểm tra <code>sitemap.xml</code> có ít nhất N URL và có chứa ít nhất một <code>/articles/</code> — lỗi kiểu ghi đè file tĩnh sẽ tái phát nếu không có rào chắn." data-en="<b>The fix — top priority, today:</b> (1) check whether a static <code>sitemap.xml</code> is sitting in <code>public/</code> (or the equivalent static directory) — if so, <b>delete it</b> so the generated sitemap route is served again; (2) if the sitemap is produced at build time, check whether that build step failed silently on the last deploy; (3) once restored, confirm the file returns <b>81 URLs</b> with <code>lastmod</code> values matching each page&#39;s real edit date, then <b>resubmit the sitemap in Google Search Console</b> to force a re-read; (4) while there, <b>remove <code>/login</code></b> from the sitemap and mark it <code>noindex</code>. This item alone moves Crawlability <b>67 &#8594; roughly 92</b> and Health <b>84 &#8594; roughly 90</b> the same day. <b>Lock it with a regression test:</b> a CI assert that <code>sitemap.xml</code> contains at least N URLs and at least one <code>/articles/</code> entry — a static-file overwrite will recur without a guard."></p>
  </div>

  <div class="ins p1">
    <div class="prio class="t" data-vi="P1 · MỚI HÔM NAY · 5/6 trang dự án nay mồ côi hoàn toàn" data-en="P1 · NEW TODAY · 5 of 6 project pages are now fully orphaned"></div>
    <h4 class="t" data-vi="Trang /projects không link tới bất kỳ trang dự án con nào — kể cả trong rendered DOM — và sitemap vừa bỏ nốt cả 6 URL" data-en="The /projects page links to none of its own child pages — not even in the rendered DOM — and the sitemap has just dropped all 6 URLs"></h4>
    <p class="t" data-vi="Đây là lỗi thứ hai sinh ra từ cùng sự cố sitemap, nhưng nặng hơn vì <b>không còn đường dự phòng</b>. Bài viết mất sitemap vẫn còn listing <code>/articles</code> gánh; trang dự án thì <b>không</b>. Kiểm tra hôm nay cho thấy trang <code>/projects</code> chứa <b>0 link tới <code>/projects/*</code></b> trong HTML thô, và quét lại rendered DOM sau khi JavaScript chạy xong cũng vẫn <b>0 link</b> trên tổng số 32 thẻ <code>&lt;a&gt;</code>. Quét toàn bộ 81 trang để tìm href trỏ tới <code>/projects/*</code> cho kết quả: chỉ <b>9 bài viết</b> có link, và <b>cả 9 đều trỏ về cùng một URL</b> — <code>/projects/251-station-st</code>. Nghĩa là <b>5 trang còn lại</b> — <code>20-head-street</code>, <code>85-commodore-drive-surfers-paradise</code>, <code>813-clarendon-street</code>, <code>31-mcilwain-drive</code>, <code>nagambie-project</code> — <b>không nằm trong sitemap và không được trang nào trên site link tới</b>. Với Google chúng hiện <b>không tồn tại</b>: không có đường khám phá, và những URL đã index trước đó sẽ rụng dần khi hết chu kỳ tái crawl. Cả 5 trang vẫn trả <b>HTTP 200</b>, vẫn có schema, title, meta và canonical đầy đủ — công đã bỏ ra nhưng không ai đọc được." data-en="This is the second fault flowing from the same sitemap incident, but a worse one because <b>there is no fallback path</b>. Articles that lost their sitemap entry still have the <code>/articles</code> listing carrying them; project pages do <b>not</b>. Today&#39;s check shows the <code>/projects</code> page contains <b>0 links to <code>/projects/*</code></b> in raw HTML, and re-scanning the rendered DOM after JavaScript has run also returns <b>0</b>, out of 32 anchors on the page. Scanning all 81 pages for hrefs pointing at <code>/projects/*</code> returns just <b>9 articles</b> with such a link, and <b>all 9 point at the same URL</b> — <code>/projects/251-station-st</code>. That leaves <b>5 pages</b> — <code>20-head-street</code>, <code>85-commodore-drive-surfers-paradise</code>, <code>813-clarendon-street</code>, <code>31-mcilwain-drive</code> and <code>nagambie-project</code> — <b>absent from the sitemap and linked from nowhere on the site</b>. To Google they now effectively <b>do not exist</b>: no discovery path, and previously indexed URLs will decay as their recrawl cycle lapses. All 5 still return <b>HTTP 200</b> with full schema, title, meta and canonical — work already paid for that nobody can reach."></p>
    <p class="fix t" data-vi="<b>Cách sửa:</b> (1) <b>khôi phục sitemap</b> (P1 phía trên) đưa cả 6 URL trở lại ngay; (2) độc lập với sitemap, <b>trang <code>/projects</code> phải link tới 6 trang dự án con bằng thẻ <code>&lt;a href&gt;</code> thật</b> — hiện tại thẻ dự án trên trang này nhiều khả năng điều hướng bằng JavaScript (<code>onClick</code> + router push) chứ không phải anchor, đúng kiểu lỗi logo header đã sửa hôm 19/08. Đây là <b>một lần sửa component</b> và nên làm dù sitemap có được khôi phục hay không, vì link nội bộ mới là thứ truyền được PageRank; (3) thêm link chéo từ các bài viết liên quan tới đúng trang dự án của chúng thay vì dồn hết về <code>251-station-st</code>. Sau khi sửa, kiểm lại bằng rendered DOM chứ không chỉ HTML thô — đó là cách duy nhất phát hiện điều hướng giả bằng JavaScript." data-en="<b>The fix:</b> (1) <b>restoring the sitemap</b> (the P1 above) brings all 6 URLs back immediately; (2) independently of the sitemap, <b>the <code>/projects</code> page must link to its 6 child pages with real <code>&lt;a href&gt;</code> elements</b> — the project cards on that page are most likely navigating via JavaScript (<code>onClick</code> plus a router push) rather than anchors, exactly the defect fixed on the header logo on 19 Aug. This is <b>a single component change</b> and is worth doing whether or not the sitemap is restored, because internal links are what actually pass PageRank; (3) add cross-links from related articles to their own project page instead of routing all of them to <code>251-station-st</code>. After the fix, verify in the rendered DOM rather than raw HTML alone — that is the only way to catch JavaScript pseudo-navigation."></p>
  </div>

  <div class="ins p1">
    <div class="prio class="t" data-vi="P1 · TỒN SANG NGÀY THỨ HAI · chưa được xử lý" data-en="P1 · CARRIED INTO A SECOND DAY · still unaddressed"></div>
    <h4 class="t" data-vi="Hai URL đã index bị xoá vẫn trả 404 cứng, vẫn không có 301" data-en="The two deleted indexed URLs still return hard 404s, still with no 301"></h4>
    <p class="t" data-vi="Kiểm tra lại trực tiếp hôm nay: <code>/articles/bathroom-remodel-cost-australia</code> và <code>/articles/timber-flooring-composite-decking</code> <b>vẫn trả HTTP 404</b>, <b>vẫn không redirect</b>. Hai URL này nằm trong sitemap cho tới hết ngày 18/08 nên gần như chắc chắn đã được index. Mỗi ngày trôi qua ở trạng thái 404 là thêm một ngày <b>mất trắng toàn bộ tín hiệu liên kết và thứ hạng</b> mà hai bài đó tích luỹ, và người dùng vào từ Google sẽ gặp trang lỗi. <code>bathroom-remodel-cost-australia</code> là bài <b>3.354 từ</b> khi còn được quét — không phải nội dung mỏng có thể bỏ đi nhẹ nhàng. <b>Bối cảnh mới hôm nay:</b> vì sitemap đã tụt xuống 16 URL, Google sẽ mất nhiều thời gian hơn để phát hiện các thay đổi này, nên việc đặt 301 càng <b>gấp hơn</b> chứ không phải bớt gấp." data-en="Re-checked directly today: <code>/articles/bathroom-remodel-cost-australia</code> and <code>/articles/timber-flooring-composite-decking</code> <b>still return HTTP 404</b> and <b>still do not redirect</b>. Both were in the sitemap through 18 Aug, so they are almost certainly indexed. Every day they stay at 404 is another day of <b>losing the entire link and ranking signal</b> those articles accumulated, and searchers arriving from Google hit an error page. <code>bathroom-remodel-cost-australia</code> was a <b>3,354-word</b> article when last crawled — not thin content that can be dropped lightly. <b>New context today:</b> with the sitemap down to 16 URLs, Google will take longer to notice any of these changes, which makes adding the 301s <b>more</b> urgent rather than less."></p>
    <p class="fix t" data-vi="<b>Cách sửa (không đổi so hôm qua, dưới 30 phút):</b> đặt <b>301</b> từ hai URL đã xoá về trang thay thế gần nhất theo chủ đề — <code>bathroom-remodel-cost-australia</code> &#8594; <code>/articles/kitchen-renovation-cost-melbourne</code> hoặc <code>/articles/interior-finishes</code>; <code>timber-flooring-composite-decking</code> &#8594; <code>/articles/interior-finishes</code>. Nếu việc xoá là nhầm thì <b>khôi phục lại bài</b> là phương án tốt hơn hẳn. Sau đó dùng công cụ Removals/URL Inspection trong Search Console để đẩy nhanh việc Google nhận ra thay đổi." data-en="<b>The fix (unchanged from yesterday, under 30 minutes):</b> add <b>301s</b> from the two deleted URLs to their closest topical replacement — <code>bathroom-remodel-cost-australia</code> &#8594; <code>/articles/kitchen-renovation-cost-melbourne</code> or <code>/articles/interior-finishes</code>; <code>timber-flooring-composite-decking</code> &#8594; <code>/articles/interior-finishes</code>. If the deletion was accidental, <b>restoring the articles</b> is the better option by some margin. Then use Removals / URL Inspection in Search Console to speed up Google noticing the change."></p>
  </div>

  <div class="ins p2">
    <div class="prio class="t" data-vi="P2 · Cần theo dõi · tốc độ lùi ở cả ba nhóm" data-en="P2 · Watch · speed eased across all three groups"></div>
    <h4 class="t" data-vi="TTFB toàn site 755 → 821 ms, nhóm dưới 1 giây lùi 90,1% → 80,2%" data-en="Site-wide TTFB went 755 → 821 ms and the sub-1s band slipped 90.1% → 80.2%"></h4>
    <p class="t" data-vi="Khác với hôm qua khi ba nhóm trang đi ba hướng, hôm nay <b>cả ba cùng chậm lại</b>: trang gốc 808 &#8594; <b>858 ms</b>, bài viết 747 &#8594; <b>823 ms</b>, dự án 682 &#8594; <b>696 ms</b>. Số trang trong dải 1–3 giây tăng <b>8 &#8594; 16</b>, và số bài viết vượt 1 giây tăng <b>3 &#8594; 9</b>. Cần nói rõ để không đọc nhầm: <b>đây chưa phải xu hướng</b>. Mức tăng 66 ms trên toàn site nằm trong biên độ đã thấy nhiều lần ở chuỗi này (13/08 733 ms, 17/08 742 ms, 18/08 793 ms, 19/08 755 ms), và trang chậm nhất hôm qua <code>/studio</code> <b>tự lùi từ 1,49s về 1,17s</b> mà không ai động vào, trong khi <code>/model</code> vọt từ 0,95s lên 1,57s. Kiểu <b>luân phiên trang chậm</b> này là dấu hiệu điển hình của <b>cache/ISR hết hạn ở cấp route</b> chứ không phải server yếu đi. Phương pháp đo không đổi (lấy giá trị tốt nhất của hai lần quét tuần tự), nên số liệu so sánh trực tiếp được. <b>0 trang trên 3 giây sang ngày thứ mười bốn.</b>" data-en="Unlike yesterday, when the three page groups moved in three directions, today <b>all three slowed</b>: core 808 &#8594; <b>858 ms</b>, articles 747 &#8594; <b>823 ms</b> and projects 682 &#8594; <b>696 ms</b>. Pages in the 1–3 second band rose <b>8 &#8594; 16</b>, and articles over 1 second rose <b>3 &#8594; 9</b>. To be clear so this is not over-read: <b>this is not yet a trend</b>. A 66 ms site-wide rise sits inside the range this series has produced repeatedly (733 ms on 13 Aug, 742 on 17 Aug, 793 on 18 Aug, 755 on 19 Aug), and yesterday&#39;s slowest page, <code>/studio</code>, <b>eased on its own from 1.49s to 1.17s</b> with no intervention, while <code>/model</code> jumped from 0.95s to 1.57s. That <b>rotation of which page is slowest</b> is the classic signature of <b>route-level cache/ISR expiry</b> rather than a weakening server. The measurement method is unchanged (better of two sequential passes), so the figures are directly comparable. <b>Zero pages over 3 seconds into a fourteenth day.</b>"></p>
    <p class="fix t" data-vi="<b>Việc cần làm:</b> chưa mở ticket hạ tầng. Theo dõi thêm <b>một đến hai lần quét</b>: nếu TTFB toàn site vượt <b>900 ms</b> hoặc nhóm dưới 1 giây rơi dưới <b>70%</b> thì mới coi là xu hướng và cần soi tới hạ tầng. Trong lúc đó, việc rẻ và có ích là <b>đặt thời gian revalidate cố định cho các route trang gốc</b> (<code>/model</code>, <code>/studio</code>, <code>/prestige</code>, <code>/interiors</code>) để lần render đầu sau khi cache hết hạn không rơi vào người dùng thật — hoặc Googlebot." data-en="<b>Action:</b> do not open an infrastructure ticket yet. Watch it for <b>one or two more crawls</b>: if site-wide TTFB clears <b>900 ms</b> or the sub-1s band falls below <b>70%</b>, treat it as a trend and escalate. In the meantime the cheap, useful change is to <b>set explicit revalidate windows on the core page routes</b> (<code>/model</code>, <code>/studio</code>, <code>/prestige</code>, <code>/interiors</code>) so the first render after a cache expiry does not land on a real user — or on Googlebot."></p>
  </div>

  <div class="ins win">
    <div class="prio class="t" data-vi="✓ GIỮ VỮNG · sang ngày thứ hai · ba bản sửa lớn của 19/08" data-en="✓ HOLDING · into a second day · the three major fixes from 19 Aug"></div>
    <h4 class="t" data-vi="JSON-LD vẫn 1,0×, vẫn 0/896 ảnh thiếu alt, vẫn 81/81 trang link về trang chủ, vẫn 0 lỗi H1" data-en="JSON-LD still at 1.0×, still 0 of 896 images missing alt, still 81 of 81 pages linking home, still 0 H1 faults"></h4>
    <p class="t" data-vi="Điều đáng quan tâm nhất sau một bản release lớn là <b>nó có bền không</b>. Câu trả lời hôm nay: <b>có, không mất một điểm nào</b>. <b>(1) Nhân bản JSON-LD:</b> toàn site phát <b>241 khối cho đúng 241 payload</b>, hệ số <b>1,0&#215;</b> — kiểm bằng cách so <i>nội dung</i> khối qua <code>new Set(blocks).size</code> trên HTML thô của cả 81 trang, không chỉ đếm số khối. <b>(2) Ảnh:</b> <b>0/896 thẻ <code>&lt;img&gt;</code> thiếu <code>alt</code></b>, lazy-load giữ ở <b>489</b> ảnh. Rendered-DOM xác nhận ở cả ba trang mẫu: trang chủ 0/22, <code>/projects/251-station-st</code> 0/19, <code>/articles/glass-pool-fence-compliance</code> 0/15. <b>(3) Link về trang chủ:</b> <b>81/81 trang</b> vẫn có anchor thật trỏ về <code>/</code>. Thêm vào đó: <b>81/81 trang trả 200</b>, 0 timeout, 0 lỗi 4xx/5xx trên các trang đã crawl — <b>ngày sạch thứ mười bốn liên tiếp</b>; đủ title/meta/canonical trên cả 81 trang (title 26–80 ký tự, meta 83–189 ký tự); <b>đúng 1 thẻ H1</b> ở mọi trang. Listing <code>/articles</code> vẫn render đủ <b>58/58 link bài</b> trong HTML thô, và chính điều đó đang <b>cứu 58 bài viết khỏi hậu quả của sự cố sitemap</b>." data-en="The question that matters after a large release is <b>whether it holds</b>. Today&#39;s answer: <b>yes, without losing a single point</b>. <b>(1) JSON-LD duplication:</b> the site emits <b>241 blocks for exactly 241 distinct payloads</b>, a factor of <b>1.0&#215;</b> — verified by comparing block <i>content</i> with <code>new Set(blocks).size</code> across the raw HTML of all 81 pages, not merely counting blocks. <b>(2) Images:</b> <b>0 of 896 <code>&lt;img&gt;</code> tags lack <code>alt</code></b>, and lazy-loading holds at <b>489</b> images. The rendered DOM confirms it on all three sample pages: homepage 0 of 22, <code>/projects/251-station-st</code> 0 of 19, <code>/articles/glass-pool-fence-compliance</code> 0 of 15. <b>(3) The link home:</b> <b>81 of 81 pages</b> still carry a real anchor to <code>/</code>. Alongside that: <b>81 of 81 pages return 200</b>, 0 timeouts, 0 4xx/5xx across crawled pages — a <b>fourteenth consecutive clean day</b>; full title, meta description and canonical on all 81 pages (titles 26–80 characters, metas 83–189); and <b>exactly one H1</b> on every page. The <code>/articles</code> listing still server-renders all <b>58 article links</b> in raw HTML, and that alone is <b>what is currently rescuing 58 articles from the sitemap incident</b>."></p>
    <p class="fix t" data-vi="<b>Giữ nguyên:</b> không cần can thiệp. Bài học rút ra rất cụ thể và nên áp dụng ngay cho lỗi hôm nay: <b>ba lỗi nằm im 16–19 ngày biến mất trong một release, và hôm sau một file cấu hình bị ghi đè đã lấy đi 8 điểm Health</b>. Sự chênh lệch đó cho thấy điều còn thiếu không phải năng lực sửa mà là <b>rào chắn hồi quy</b>: một bộ assert nhỏ trong CI cho sitemap (số URL tối thiểu), JSON-LD (số khối tối đa mỗi trang) và alt ảnh sẽ chặn được cả ba loại sự cố đã gặp trong chuỗi này." data-en="<b>Hold as is:</b> no intervention needed. The lesson is specific and applies directly to today&#39;s fault: <b>three defects that sat for 16 to 19 days were closed in one release, and the next day an overwritten config file took 8 Health points away</b>. That asymmetry says the missing piece is not the ability to fix things but <b>regression guards</b>: a small set of CI asserts for the sitemap (minimum URL count), JSON-LD (maximum blocks per page) and image alt text would have caught all three classes of incident this series has produced."></p>
  </div>

  <div class="ins p3">
    <div class="prio class="t" data-vi="P3 · Còn tồn · không đổi so 19/08" data-en="P3 · Persisting · unchanged from 19 Aug"></div>
    <h4 class="t" data-vi="Heading còn nhảy bậc ở 15/81 trang; 13 bài vẫn chưa có FAQPage; 11 trang dưới 300 từ" data-en="Heading skips remain on 15 of 81 pages; 13 articles still lack FAQPage; 11 pages sit under 300 words"></h4>
    <p class="t" data-vi="Ba mục này <b>y hệt hôm qua</b>, không tốt lên cũng không xấu đi. Heading nhảy bậc ở <b>15 trang</b>: <b>1&#8594;3 ở 9 trang</b> (gồm cả 6 trang dự án và <code>/projects</code>), <b>2&#8594;4 ở 5 trang</b>, <b>1&#8594;4 ở 1 trang</b>. <code>FAQPage</code> có ở <b>45/58 bài (77,6%)</b> — <b>13 bài</b> còn thiếu là đúng danh sách cũ, không đổi kể từ 10/08, và nhận ra ngay trong bảng chi tiết vì cột JSON-LD hiển thị <b>3</b> thay vì 4. Nội dung mỏng ở <b>11 trang dưới 300 từ</b>: 6 trang dự án (220–236 từ), <code>/modules</code> 244, <code>/contact</code> 248, <code>/projects</code> 253, cộng <code>/start-interactive</code> 58 và <code>/login</code> 27 (hai trang chức năng, không tính là lỗi nội dung). Toàn site 141.866 &#8594; <b>140.330 từ</b> (&#8722;1.536) và TB bài 2.244 &#8594; <b>2.220</b> — thay đổi nhỏ do biên tập lặt vặt, <b>không phải mất nội dung theo khối</b> như đợt footer bị gỡ hôm 13/08 và 17/08." data-en="All three are <b>identical to yesterday</b>, neither better nor worse. Heading skips affect <b>15 pages</b>: <b>1&#8594;3 on 9 pages</b> (including all 6 project pages and <code>/projects</code>), <b>2&#8594;4 on 5</b> and <b>1&#8594;4 on 1</b>. <code>FAQPage</code> is present on <b>45 of 58 articles (77.6%)</b> — the <b>13</b> still missing it are the same list, unchanged since 10 Aug, and are spottable in the detail table as the articles showing <b>3</b> rather than 4 in the JSON-LD column. Thin content covers <b>11 pages under 300 words</b>: the 6 project pages (220–236 words), <code>/modules</code> 244, <code>/contact</code> 248, <code>/projects</code> 253, plus <code>/start-interactive</code> 58 and <code>/login</code> 27 (functional pages, not content faults). Site-wide words went 141,866 &#8594; <b>140,330</b> (&#8722;1,536) and the article average 2,244 &#8594; <b>2,220</b> — small editorial churn, <b>not the block content loss</b> seen when the footer was stripped on 13 and 17 Aug."></p>
    <p class="fix t" data-vi="<b>Cách sửa (không đổi):</b> (1) Heading — phần lớn nằm ở <b>một template trang dự án dùng chung</b> (1&#8594;3) và <b>bốn trang gốc cùng layout</b> (2&#8594;4), nên là <b>hai lần sửa template</b> chứ không phải 15 lần sửa trang; (2) <code>FAQPage</code> — thêm khối FAQ 3–5 câu cho 13 bài, quy trình đã chạy sẵn ở 45 bài kia nên chỉ là việc lặp lại; (3) Nội dung mỏng — thêm 60–120 từ cho mỗi trang dự án để vượt mốc 300. Cả ba đều <b>nên xếp sau hai P1 sitemap</b> hôm nay: sửa FAQPage cho một bài Google không tái crawl nổi thì chưa mang lại gì." data-en="<b>The fix (unchanged):</b> (1) Headings — most of it lives in <b>one shared project page template</b> (1&#8594;3) and <b>four core pages sharing a layout</b> (2&#8594;4), so it is <b>two template edits</b> rather than 15 page edits; (2) <code>FAQPage</code> — add a 3–5 question FAQ block to the 13 articles; the pattern already runs on the other 45, so it is repetition rather than design; (3) Thin content — another 60–120 words per project page to clear the 300-word line. All three <b>should queue behind today&#39;s two sitemap P1s</b>: adding FAQPage to an article Google can no longer recrawl promptly buys nothing yet."></p>
  </div>

  <div class="ins p2">
    <div class="prio class="t" data-vi="Roadmap · Next steps ưu tiên" data-en="Roadmap · Prioritised next steps"></div>
    <p class="t" data-vi="<b>Thay đổi lớn so 19/08:</b> hôm qua roadmap ngắn nhất cả chuỗi vì ba lỗi lớn vừa được đóng. Hôm nay nó <b>dài trở lại vì một lý do khác hẳn</b> — không phải nợ kỹ thuật cũ mà là <b>một sự cố cấu hình mới</b>. <b>(1) NGAY HÔM NAY — khôi phục sitemap:</b> tìm và xoá file <code>sitemap.xml</code> tĩnh trong <code>public/</code> (hoặc sửa bước sinh sitemap lúc build), xác nhận file trả về <b>81 URL</b> với <code>lastmod</code> thật, rồi submit lại trong Search Console. <b>Đây là việc có ROI cao nhất trong toàn bộ danh sách: một mình nó đưa Health 84 &#8594; khoảng 90.</b> <b>(2) NGAY HÔM NAY — link nội bộ cho trang dự án:</b> sửa thẻ dự án trên <code>/projects</code> thành <code>&lt;a href&gt;</code> thật để 6 trang dự án có đường đi độc lập với sitemap. Cùng một loại lỗi với logo header đã sửa hôm 19/08, nên nhiều khả năng dùng lại được cách sửa đó. <b>(3) NGAY HÔM NAY — 301 cho hai URL đã xoá:</b> sang ngày thứ hai, dưới 30 phút, và càng để lâu càng mất tín hiệu. <b>(4) Cùng lúc — gỡ <code>/login</code> khỏi sitemap</b> và gắn <code>noindex</code>: hiện <code>/login</code> chiếm <b>1/16</b> toàn bộ sitemap, tức 6,3% ngân sách khai báo dành cho một trang đăng nhập. <b>(5) Trong tuần — rào chắn hồi quy trong CI:</b> assert số URL tối thiểu trong sitemap, số khối JSON-LD tối đa mỗi trang, và chặn <code>&lt;img&gt;</code> thiếu <code>alt</code>. Chuỗi 18 lần quét đã cho thấy <b>sửa thì nhanh nhưng lỗi quay lại cũng nhanh</b>. <b>(6) Trong tuần — 13 khối FAQPage</b> và <b>hai lần sửa template heading</b>. <b>(7) Theo dõi:</b> TTFB toàn site 821 ms — chỉ leo thang nếu vượt 900 ms hoặc nhóm &lt;1s rơi dưới 70%." data-en="<b>The big change from 19 Aug:</b> yesterday produced the shortest roadmap of the series because three large defects had just closed. Today it is <b>long again for an entirely different reason</b> — not old technical debt but <b>a fresh configuration incident</b>. <b>(1) TODAY — restore the sitemap:</b> find and delete the static <code>sitemap.xml</code> in <code>public/</code> (or repair the build-time generation step), confirm the file returns <b>81 URLs</b> with real <code>lastmod</code> values, then resubmit it in Search Console. <b>This is the highest-ROI item on the entire list: on its own it moves Health 84 &#8594; roughly 90.</b> <b>(2) TODAY — internal links for the project pages:</b> convert the project cards on <code>/projects</code> into real <code>&lt;a href&gt;</code> elements so the 6 project pages have a discovery path independent of the sitemap. It is the same class of defect as the header logo fixed on 19 Aug, so that fix can probably be reused. <b>(3) TODAY — 301s for the two deleted URLs:</b> now into a second day, under 30 minutes of work, and the signal loss compounds. <b>(4) At the same time — remove <code>/login</code> from the sitemap</b> and mark it <code>noindex</code>: it currently occupies <b>1 of 16</b> sitemap slots, meaning 6.3% of the declared crawl budget goes to a login page. <b>(5) This week — regression guards in CI:</b> assert a minimum URL count in the sitemap, a maximum JSON-LD block count per page, and block <code>&lt;img&gt;</code> without <code>alt</code>. Eighteen crawls have shown that <b>fixes land quickly but faults return just as quickly</b>. <b>(6) This week — 13 FAQPage blocks</b> and <b>two heading template edits</b>. <b>(7) Watch:</b> site-wide TTFB at 821 ms — escalate only if it clears 900 ms or the sub-1s band falls below 70%."></p>
  </div>

function trFmt(d){const p=d.split('-');return LANG==='vi'?p[2]+'/'+p[1]:p[2]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1];}

/* generic multi-series line chart -> inline SVG string */
function trChart(rows, series, opts){
  opts = opts || {};
  const W=520, H=opts.h||210, L=42, R=12, TP=14, BT=30;
  const iw=W-L-R, ih=H-TP-BT;
  let vals=[]; series.forEach(s=>rows.forEach(r=>{const v=r[s.i]; if(v!==null&&v!==0||s.zero)vals.push(v);}));
  let lo = opts.min!==undefined?opts.min:Math.min.apply(null,vals);
  let hi = opts.max!==undefined?opts.max:Math.max.apply(null,vals);
  if(hi===lo){hi=lo+1;}
  const pad=(hi-lo)*0.12; lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=>L+(rows.length<2?iw/2:i*iw/(rows.length-1));
  const Y=v=>TP+ih-(v-lo)/(hi-lo)*ih;
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let g='';
  /* gridlines + y labels */
  const TICKS=4;
  for(let t=0;t<=TICKS;t++){
    const v=lo+(hi-lo)*t/TICKS, y=Y(v);
    g+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" ${t?'stroke-dasharray="3 4"':''}/>`;
    g+=`<text x="${L-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">${Math.round(v).toLocaleString(loc)}</text>`;
  }
  /* x labels: first, last and every other */
  rows.forEach((r,i)=>{
    if(i!==0 && i!==rows.length-1 && i%2) return;
    g+=`<text x="${X(i).toFixed(1)}" y="${H-11}" text-anchor="middle" font-size="9" fill="var(--muted)">${trFmt(r[0])}</text>`;
  });
  /* series */
  series.forEach(s=>{
    const pts=[];
    rows.forEach((r,i)=>{const v=r[s.i]; if(v===null||(v===0&&!s.zero))return; pts.push([X(i),Y(v),v,r[0]]);});
    if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area){
      g+=`<path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${TP+ih} L ${pts[0][0].toFixed(1)} ${TP+ih} Z" fill="${s.c}" opacity=".10"/>`;
    }
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{
      g+=`<circle class="tr-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.w>2?3:2.4}" fill="var(--card)" stroke="${s.c}" stroke-width="1.8"><title>${s.n} · ${trFmt(p[3])}: ${p[2].toLocaleString(loc)}${opts.unit||''}</title></circle>`;
    });
    /* value label on the last point */
    if(s.last!==false){
      const lp=pts[pts.length-1];
      g+=`<text x="${(lp[0]+6).toFixed(1)}" y="${(lp[1]-6).toFixed(1)}" font-size="10.5" font-weight="700" fill="${s.c}">${lp[2].toLocaleString(loc)}</text>`;
    }
  });
  const lg=series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('');
  return `<svg class="tr-svg" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tr-lg">${lg}</div>`;
}

    h+=`<div class="rt-row"><span class="name" title="${p.url}">${p.url}</span>
      <div class="rt-track"><div class="rt-fill" style="width:${w}%;background:${col(p.rt)}"></div></div>
      <span class="ms" style="color:${col(p.rt)}">${p.rt.toLocaleString(loc)}</span></div>`;
  });
  document.getElementById('rtChart').innerHTML=h;
}

let sortK='rt', sortDir=1, filt='all';
function render(){

  let rows=[...PAGES];
  if(filt!=='all')rows=rows.filter(p=>p.grp===filt);

    let x=a[sortK],y=b[sortK];
    if(typeof x==='string'){return sortDir*x.localeCompare(y);}

  });

    const st='<span class="badge b200">200</span>';

      <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.url}">${p.url}</td>
      <td class="num">${st}</td>

}

const PK_T = {
  vi:{day:'Ngày',range:'Khoảng',now:d=>`Đang xem báo cáo ngày ${d} (mới nhất)`,
      viewing:d=>`Đang xem báo cáo ngày ${d}`,
      trend:(a,b)=>`Đang xem xu hướng ${a} → ${b}`,
      quick:'Mở nhanh', today:'mới nhất',
      months:['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'],
      dow:['CN','T2','T3','T4','T5','T6','T7'],
      saved:n=>`${n} ngày đã lưu trong khoảng này · ngày theo giờ Việt Nam (Asia/Ho_Chi_Minh), là giờ lúc quét`,
      noRep:'Ngày này chưa quét — không có báo cáo riêng để mở.',
      trendTitle:(a,b)=>`Xu hướng Health Score · ${a} → ${b}`,
      open:'mở'},
  en:{day:'Day',range:'Range',now:d=>`Viewing the report for ${d} (latest)`,
      viewing:d=>`Viewing the report for ${d}`,
      trend:(a,b)=>`Viewing the trend ${a} → ${b}`,
      quick:'Quick open', today:'latest',
      months:['January','February','March','April','May','June','July','August','September','October','November','December'],
      dow:['Su','Mo','Tu','We','Th','Fr','Sa'],
      saved:n=>`${n} stored day(s) in this range · dates in Vietnam time (Asia/Ho_Chi_Minh), the time of the crawl`,
      noRep:'This day was not crawled — there is no separate report to open.',
      trendTitle:(a,b)=>`Health Score trend · ${a} → ${b}`,
      open:'open'}
};
const pkL = () => PK_T[LANG];

function pkISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pkD(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function pkFmt(iso){ const [y,m,d]=iso.split('-'); return LANG==='vi'?`${d}/${m}/${y}`:`${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`; }
function pkAdd(iso,n){ const d=pkD(iso); d.setDate(d.getDate()+n); return pkISO(d); }
function pkIn(iso,a,b){ return iso>=a && iso<=b; }
function pkCount(a,b){ return PK_SNAPS.filter(s=>pkIn(s.date,a,b)).length; }

function pkPresets(){
  const T=PK_TODAY, d=pkD(T);
  const monStart=(()=>{const x=pkD(T); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return pkISO(x);})();
  const lastMonStart=pkAdd(monStart,-7), lastMonEnd=pkAdd(monStart,-1);
  const mStart=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
  const pmStart=pkISO(pm), pmEnd=pkISO(new Date(d.getFullYear(),d.getMonth(),0));
  const first=PK_SNAPS.length?PK_SNAPS[0].date:T;
  return [
    {k:'y',   vi:'Hôm qua',   en:'Yesterday',   s:pkAdd(T,-1), e:pkAdd(T,-1)},
    {k:'7',   vi:'7 ngày qua', en:'Last 7 days',  s:pkAdd(T,-6), e:T},
    {k:'28',  vi:'28 ngày qua',en:'Last 28 days', s:pkAdd(T,-27),e:T},
    {k:'90',  vi:'90 ngày qua',en:'Last 90 days', s:pkAdd(T,-89),e:T},
    {k:'tw',  vi:'Tuần này',  en:'This week',   s:monStart, e:T},
    {k:'tm',  vi:'Tháng này', en:'This month',  s:mStart, e:T},
    {k:'ty',  vi:'Năm nay',   en:'This year',   s:`${d.getFullYear()}-01-01`, e:T},
    {k:'lw',  vi:'Tuần trước',en:'Last week',   s:lastMonStart, e:lastMonEnd},
    {k:'lm',  vi:'Tháng trước',en:'Last month', s:pmStart, e:pmEnd},
    {k:'all', vi:'Toàn bộ dữ liệu đã lưu', en:'All stored data', s:first, e:T}
  ];
}

function pkRenderPresets(){
  const box=document.getElementById('dpPresets'); if(!box) return;
  box.innerHTML = pkPresets().map(p=>{
    const n=pkCount(p.s,p.e), off=n===0;
    const on=PK_PRESET===p.k;
    return `<button type="button" class="dp-preset${on?' on':''}" data-k="${p.k}" ${off?'disabled':''}>
      <span class="rd"></span><span class="nm">${LANG==='vi'?p.vi:p.en}</span><span class="ct">${n}</span></button>`;
  }).join('');
  box.querySelectorAll('.dp-preset').forEach(b=>b.addEventListener('click',()=>{
    const p=pkPresets().find(x=>x.k===b.dataset.k);
    PK_PRESET=p.k; PK_DRAFT={s:p.s,e:p.e}; PK_PENDING=false;
    PK_VIEW=pkD(p.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1);
    pkRenderCal(); pkRenderPresets();
  }));
}

function pkMonth(base,off){
  const d=new Date(base.getFullYear(), base.getMonth()+off, 1);
  const y=d.getFullYear(), m=d.getMonth();
  const start=new Date(y,m,1).getDay(); // 0=Sun
  const days=new Date(y,m+1,0).getDate();
  let cells=pkL().dow.map(x=>`<div class="dp-dow">${x}</div>`).join('');
  for(let i=0;i<start;i++) cells+='<button class="dp-d blank" disabled></button>';
  for(let dd=1;dd<=days;dd++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const has=!!PK_MAP[iso];
    const sel=iso===PK_DRAFT.s||iso===PK_DRAFT.e;
    const inr=pkIn(iso,PK_DRAFT.s,PK_DRAFT.e)&&!sel;
    const edge=iso===PK_DRAFT.s&&PK_DRAFT.s!==PK_DRAFT.e?' edge-l':(iso===PK_DRAFT.e&&PK_DRAFT.s!==PK_DRAFT.e?' edge-r':'');
    cells+=`<button type="button" class="dp-d${has?' has':''}${inr?' inrange':''}${sel?' sel'+edge:''}" data-iso="${iso}">${dd}${has?'<span class="dot"></span>':''}</button>`;
  }
  return {title:`${pkL().months[m]} ${y}`, html:`<div class="dp-grid">${cells}</div>`};
}

function pkRenderCal(){
  if(!PK_VIEW){ PK_VIEW=pkD(PK_SEL.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1); }
  const a=pkMonth(PK_VIEW,0), b=pkMonth(PK_VIEW,1);
  document.getElementById('dpM1').textContent=a.title;
  document.getElementById('dpM2').textContent=b.title;
  document.getElementById('dpG1').innerHTML=a.html;
  document.getElementById('dpG2').innerHTML=b.html;
  document.querySelectorAll('#dpG1 .dp-d,#dpG2 .dp-d').forEach(el=>{
    if(el.classList.contains('blank')) return;
    el.addEventListener('click',()=>{
      const iso=el.dataset.iso;
      if(!PK_PENDING){ PK_DRAFT={s:iso,e:iso}; PK_PENDING=true; }
      else { PK_DRAFT = iso<PK_DRAFT.s ? {s:iso,e:PK_DRAFT.s} : {s:PK_DRAFT.s,e:iso}; PK_PENDING=false; }
      PK_PRESET=null; pkRenderCal(); pkRenderPresets();
    });
  });
  const single=PK_DRAFT.s===PK_DRAFT.e;
  document.getElementById('dpSelD').textContent = single?pkFmt(PK_DRAFT.s):`${pkFmt(PK_DRAFT.s)} → ${pkFmt(PK_DRAFT.e)}`;
  const n=pkCount(PK_DRAFT.s,PK_DRAFT.e);
  document.getElementById('dpSelInfo').textContent = n===0 ? pkL().noRep : pkL().saved(n);
}

function pkRenderQuick(){
  const box=document.getElementById('dpQuick'); if(!box) return;
  const chips=PK_SNAPS.slice().reverse().map(s=>{
    const cur=s.date===PK_SEL.s&&PK_SEL.s===PK_SEL.e;
    const lb=LANG==='vi'?(s.label_vi||''):(s.label_en||'');
    return `<button type="button" class="qchip${cur?' cur':''}" data-iso="${s.date}">
      <span class="qd">${pkFmt(s.date)}</span><span class="ql">${lb}</span></button>`;
  }).join('');
  box.innerHTML=`<span class="pk-quick-lbl">${pkL().quick}</span>`+chips;
  box.querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('cur')) return;
    pkGo(b.dataset.iso,b.dataset.iso);
  }));
}

function pkRenderNow(){
  const el=document.getElementById('dpNow'); if(!el) return;
  const single=PK_SEL.s===PK_SEL.e;
  el.textContent = !single ? pkL().trend(pkFmt(PK_SEL.s),pkFmt(PK_SEL.e))
    : (PK_SEL.s===PK_TODAY ? pkL().now(pkFmt(PK_SEL.s)) : pkL().viewing(pkFmt(PK_SEL.s)));
  document.getElementById('dpLabel').textContent = single
    ? `${pkL().day} ${pkFmt(PK_SEL.s)}` : `${pkL().range} ${pkFmt(PK_SEL.s)} → ${pkFmt(PK_SEL.e)}`;
}

function pkGo(s,e){
  if(s===e){
    const snap=PK_MAP[s];
    if(snap && s!==PK_TODAY){ location.href=PK_BASE+snap.report; return; }
    PK_SEL={s,e}; PK_DRAFT={s,e}; PK_PRESET=null;
    document.getElementById('dpTrend').classList.remove('on');
    pkRenderNow(); pkRenderQuick(); pkRenderCal();
    return;
  }
  PK_SEL={s,e}; pkRenderNow(); pkRenderQuick(); pkTrend(s,e);
}

function pkTrend(s,e){
  const box=document.getElementById('dpTrend');
  const days=PK_SNAPS.filter(x=>pkIn(x.date,s,e));
  if(!days.length){ box.classList.remove('on'); box.innerHTML=''; return; }
  Promise.all(days.map(d=>fetch(PK_BASE+d.data,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)))
   .then(js=>{
     const rows=js.map((j,i)=>({date:days[i].date, rep:days[i].report, hs:j&&j.health_score, pg:j&&j.pages_measured}))
                  .filter(r=>r.hs!=null);
     box.innerHTML=`<h4>${pkL().trendTitle(pkFmt(s),pkFmt(e))}</h4>`+rows.map(r=>`
       <div class="trd"><span class="tdate">${pkFmt(r.date)}</span>
         <span class="ttrack"><span class="tfill" style="width:${r.hs}%"></span></span>
         <span class="tval">${r.hs}</span>
         <span class="tlink" data-h="${r.rep}">${pkL().open} &#8594;</span></div>`).join('');
     box.classList.add('on');
     box.querySelectorAll('.tlink').forEach(a=>a.addEventListener('click',()=>{
       const h=a.dataset.h; if(h && h!=='index.html') location.href=PK_BASE+h;
     }));
   });
}

function pkRender(){ pkRenderPresets(); pkRenderCal(); pkRenderQuick(); pkRenderNow(); pkToggleLabel(); }

(function pkInit(){
  const btn=document.getElementById('dpBtn'), pane=document.getElementById('dpPane');
  if(!btn) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=pane.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
    if(open){ PK_DRAFT={...PK_SEL}; PK_PENDING=false; pkRenderCal(); pkRenderPresets(); }
  });
  document.addEventListener('click',e=>{
    if(!pane.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') pane.classList.remove('open'); });
  document.getElementById('dpPrev').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()-1); pkRenderCal(); });
  document.getElementById('dpNext').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()+1); pkRenderCal(); });
  document.getElementById('dpCancel').addEventListener('click',()=>{
    PK_DRAFT={...PK_SEL}; PK_PENDING=false; PK_PRESET=null;
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false'); pkRenderCal();
  });
  document.getElementById('dpApply').addEventListener('click',()=>{
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    pkGo(PK_DRAFT.s,PK_DRAFT.e);
  });
  fetch(PK_BASE+'data/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    PK_SNAPS=(j.snapshots||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s);
    pkRender();
  }).catch(()=>{
    PK_SNAPS=[{date:PK_TODAY,report:'index.html',data:'data/'+PK_TODAY+'.json',label_vi:'Bản hiện tại',label_en:'Current report'}];
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s); pkRender();
  });
})();

setLang('vi');
</script>
</body>
