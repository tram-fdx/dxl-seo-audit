<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Technical SEO Audit Dashboard</title>
<style>
  :root{
    --cream:#f4f1ea; --cream2:#efe9dc; --card:#fffdf8; --ink:#2c2620;
    --muted:#6f665a; --accent:#b8935a; --accent-dk:#96733f; --line:#e3dccd;
    --green:#5a8f5a; --amber:#c99a3f; --red:#c05a4a; --blue:#5a7a9f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:0 0 60px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.top{background:linear-gradient(135deg,#2c2620,#413a2e);color:#f6f1e7;padding:30px 0 26px;border-bottom:4px solid var(--accent)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:23px;letter-spacing:.3px}
  header.top .sub{color:#cfc3ad;font-size:13px;margin-top:6px}
  .crawl-meta{text-align:right;font-size:13px;color:#e5dcc7}
  .crawl-meta b{color:#fff}
  .pill{display:inline-block;background:var(--accent);color:#2c2620;font-weight:700;
    padding:3px 11px;border-radius:20px;font-size:12px;margin-top:6px}
  .langtoggle{display:inline-flex;border:1px solid #6b6152;border-radius:20px;overflow:hidden;margin-bottom:10px}
  .langtoggle button{background:transparent;color:#cfc3ad;border:none;padding:5px 15px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--accent);color:#2c2620}
  .langfix{position:fixed;top:14px;right:14px;z-index:120;display:inline-flex;
    border:1px solid var(--accent);border-radius:20px;overflow:hidden;background:var(--card);
    box-shadow:0 2px 12px rgba(70,55,30,.2)}
  .langfix button{background:transparent;color:var(--muted);border:none;padding:6px 15px;
    font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px;font-family:inherit;line-height:1.5}
  .langfix button.active{background:var(--accent);color:#2c2620}
  .langfix button:not(.active):hover{color:var(--ink)}
  @media(max-width:700px){.langfix{top:8px;right:8px}
    .langfix button{padding:5px 12px;font-size:11px}}
  @media print{.langfix{display:none}}
  h2.sec{font-size:16px;margin:34px 0 14px;color:var(--accent-dk);
    border-left:4px solid var(--accent);padding-left:10px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 15px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .score-ring{display:flex;align-items:center;gap:12px}
  .score-ring .val{font-size:32px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px}
  .tag.red{background:#f6e2dd;color:var(--red)}
  .tag.amber{background:#f6ecd6;color:#a9812c}
  .tag.green{background:#e0efe0;color:var(--green)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .card h3{margin:0 0 14px;font-size:14px;color:var(--ink)}

  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar-row .name{width:180px;color:var(--muted);flex-shrink:0;font-size:12.5px}
  .bar-track{flex:1;background:var(--cream2);border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
  .bar-row .cnt{width:26px;text-align:right;font-weight:700;color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{font-size:13px}
  .legend div{margin:7px 0;display:flex;align-items:center;gap:8px}
  .legend .foot{display:block;line-height:1.55}
  .legend{max-width:520px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  .ins{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:var(--cream2);border-radius:0 8px 8px 0}
  .ins.p1{border-color:var(--red);background:#fbeeeb}
  .ins.p2{border-color:var(--amber);background:#faf2e0}
  .ins.p3{border-color:var(--blue);background:#eef3f8}
  .ins.win{border-color:var(--green);background:#e6f0e6}
  .ins .prio{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .ins.p1 .prio{color:var(--red)} .ins.p2 .prio{color:#a9812c} .ins.p3 .prio{color:var(--blue)} .ins.win .prio{color:var(--green)}
  .ins h4{margin:4px 0 6px;font-size:14.5px}
  .ins p{margin:5px 0;font-size:13px;color:#4a423a}
  .ins .fix{font-size:12.5px;color:var(--muted)}
  .ins .fix b{color:var(--accent-dk)}
  code{background:#efe6d4;padding:1px 5px;border-radius:4px;font-size:12px}

  .rt-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .rt-row .name{width:230px;flex-shrink:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt-track{flex:1;background:var(--cream2);border-radius:5px;height:16px;overflow:hidden}
  .rt-fill{height:100%;border-radius:5px}
  .rt-row .ms{width:66px;text-align:right;font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--cream2);cursor:pointer;user-select:none;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  th:hover{color:var(--accent-dk)}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fbf7ee}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .b200{background:#e0efe0;color:var(--green)}
  .b0{background:#f6e2dd;color:var(--red)}
  .yes{color:var(--green);font-weight:700}
  .no{color:var(--red);font-weight:700}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:10px}
  .filter-btn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:4px 11px;border-radius:14px;cursor:pointer;margin-right:6px}
  .filter-btn.on{background:var(--accent);color:#2c2620;font-weight:700;border-color:var(--accent)}
  [data-lang-hidden]{display:none !important}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rt-row .name{width:150px}}

  /* ---------- date picker v2 (sample-matched) ---------- */
  /* collapsible date picker */
  .pk-toggle{margin-top:24px;width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 20px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);
    text-align:left;transition:border-color .15s,box-shadow .15s}
  .pk-toggle:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(184,147,90,.13)}
  .pk-toggle .lft{display:flex;align-items:center;gap:11px;min-width:0}
  .pk-toggle .bar{display:inline-block;width:3px;height:17px;background:var(--accent);border-radius:2px;flex:none}
  .pk-toggle .cap{font-weight:600}
  .pk-toggle .sel{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
  .pk-toggle .chev{flex:none;transition:transform .2s;color:var(--muted);font-size:12px}
  .pk-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .pk-wrap[hidden]{display:none}
  .pk-wrap .pk-card{margin-top:10px}

  /* trend charts */
  .tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.tr-grid{grid-template-columns:1fr}}
  .tr-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 14px}
  .tr-card h3{margin:0 0 2px;font-size:14.5px;font-weight:700;color:var(--ink)}
  .tr-card .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
  .tr-lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .tr-lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .tr-svg{width:100%;height:auto;display:block;overflow:visible}
  .tr-dot{transition:r .12s}
  .tr-card:hover .tr-dot{r:3.2}
  .pk-card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 16px;box-shadow:0 1px 3px rgba(70,55,30,.05)}
  .pk-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;
    letter-spacing:.9px;text-transform:uppercase;color:var(--accent-dk);margin:0 0 8px}
  .pk-title .bar{width:26px;height:3px;background:var(--accent);border-radius:2px;flex:0 0 auto}
  .pk-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;max-width:900px}
  .pk-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dpwrap{position:relative}
  .dpbtn{display:inline-flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid #cfc6b3;border-radius:10px;padding:10px 15px;font-family:inherit;
    font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink);cursor:pointer;transition:.15s}
  .dpbtn:hover{border-color:var(--accent)}
  .dpbtn .car{color:var(--muted);font-size:9px;margin-left:2px}
  .pk-now{display:inline-block;background:var(--accent-soft,#f3e7d3);color:var(--accent-dk);
    border:1px solid #e6d5b8;border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700}

  .dppane{position:absolute;top:calc(100% + 9px);left:0;z-index:80;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 40px rgba(70,55,30,.20);overflow:hidden}
  .dppane.open{display:flex}
  .dp-presets{width:196px;flex:0 0 auto;border-right:1px solid var(--line);
    padding:12px 8px;background:#fdfbf6;max-height:430px;overflow:auto}
  .dp-preset{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;
    font-size:12.5px;color:var(--ink);transition:.12s}
  .dp-preset:hover:not(:disabled){background:var(--cream2)}
  .dp-preset:disabled{color:#bdb4a6;cursor:not-allowed}
  .dp-preset .rd{width:13px;height:13px;border-radius:50%;border:1.5px solid #c3b9a6;flex:0 0 auto;position:relative}
  .dp-preset.on .rd{border-color:var(--accent)}
  .dp-preset.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
  .dp-preset .nm{flex:1}
  .dp-preset .ct{font-size:11.5px;color:var(--faint,#9a9186);font-weight:700}

  .dp-right{padding:14px 16px 12px;min-width:452px}
  .dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .dp-nav button{background:transparent;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
  .dp-nav button:hover:not(:disabled){background:var(--cream2);color:var(--ink)}
  .dp-nav button:disabled{opacity:.3;cursor:not-allowed}
  .dp-nav .mtitle{flex:1;display:flex;justify-content:space-around;font-size:13.5px;font-weight:700}
  .dp-months{display:flex;gap:26px}
  .dp-m{flex:1}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dp-dow{font-size:10.5px;color:var(--muted);text-align:center;padding:5px 0 3px;font-weight:700}
  .dp-d{position:relative;height:29px;border:none;background:transparent;border-radius:7px;
    font-family:inherit;font-size:12.5px;color:#bdb4a6;cursor:pointer;padding:0;transition:.1s}
  .dp-d.blank{cursor:default}
  .dp-d.has{color:var(--ink);font-weight:700}
  .dp-d:hover:not(.blank):not(.sel){background:var(--cream2)}
  .dp-d.inrange{background:var(--accent-soft,#f3e7d3);border-radius:0}
  .dp-d.sel{background:var(--accent);color:#2c2620;font-weight:800}
  .dp-d.sel.edge-l{border-radius:7px 0 0 7px}
  .dp-d.sel.edge-r{border-radius:0 7px 7px 0}
  .dp-d .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:3.5px;height:3.5px;border-radius:50%;background:var(--accent)}
  .dp-d.sel .dot{background:#2c2620}

  .dp-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-selinfo .d1{font-size:13.5px;font-weight:700}
  .dp-selinfo .d2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;max-width:300px}
  .dp-actions{display:flex;gap:9px;flex:0 0 auto}
  .dp-actions button{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:9px;
    padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .dp-actions .go{background:var(--accent);border-color:var(--accent);color:#2c2620}
  .dp-actions .go:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
  .dp-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
  .dp-legend .dotlg{display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-right:4px}

  .pk-quick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;
    padding-top:14px;border-top:1px solid var(--line)}
  .pk-quick-lbl{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);
    text-transform:uppercase;flex:0 0 auto;margin-right:2px}
  .qchip{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--ink);transition:.13s;text-align:left}
  .qchip:hover{border-color:var(--accent);background:#fdfaf3}
  .qchip .qd{font-weight:700;flex:0 0 auto}
  .qchip .ql{font-size:11.5px;color:var(--muted)}
  .qchip.cur{background:var(--accent);border-color:var(--accent);color:#2c2620;cursor:default}
  .qchip.cur .ql{color:#5c4a24}

  .pk-trend{display:none;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
  .pk-trend.on{display:block}
  .pk-trend h4{margin:0 0 10px;font-size:13px;color:var(--accent-dk)}
  .trd{display:grid;grid-template-columns:88px 1fr 46px 62px;gap:9px;align-items:center;
    margin:6px 0;font-size:12.5px}
  .trd .tdate{font-weight:700}
  .trd .ttrack{background:var(--cream2);border-radius:6px;height:16px;overflow:hidden}
  .trd .tfill{height:100%;background:var(--accent);border-radius:6px}
  .trd .tval{font-weight:800;text-align:right}
  .trd .tlink{font-size:11px;color:var(--accent-dk);text-decoration:underline;cursor:pointer;text-align:right}
  @media(max-width:860px){.dppane.open{flex-direction:column}.dp-right{min-width:0}.dp-months{flex-direction:column;gap:14px}.dp-presets{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:none}}

</style>
</head>
<body>
<div class="langfix" role="group" aria-label="Language">
  <button type="button" data-l="vi" onclick="setLang('vi')">VI</button>
  <button type="button" data-l="en" onclick="setLang('en')">EN</button>
</div>
<header class="top">
  <div class="wrap">
    <div>
      <h1>DX Living — Technical SEO Audit</h1>
      <div class="sub">
        <span class="t" data-vi="dxliving.com · Crawl trực tiếp qua Chrome (fetch same-origin, đo TTFB thật)" data-en="dxliving.com · Live crawl via Chrome (same-origin fetch, real TTFB)"></span>
      </div>
      <span class="pill t" data-vi="Nguồn: Chrome live crawl · 17 trang gốc + 76 bài /articles + 6 trang dự án + sitemap" data-en="Source: Chrome live crawl · 17 core pages + 76 /articles + 6 project pages + sitemap"></span>
    </div>
    <div>
      <div class="langtoggle">
        <button id="btnVI" onclick="setLang('vi')">VI</button>
        <button id="btnEN" onclick="setLang('en')">EN</button>
      </div>
      <div class="crawl-meta">
        <span class="t" data-vi="Ngày crawl: <b>04/09/2026</b> · <b>audit hằng ngày</b>" data-en="Crawl date: <b>4 Sep 2026</b> · <b>daily audit</b>"></span><br>
        <span class="t" data-vi="Đo trực tiếp: <b>99 trang</b> · Sitemap: <b>100 URL</b> · <b>quét lại chiều 04/09</b>" data-en="Directly measured: <b>99 pages</b> · Sitemap: <b>100 URLs</b> · <b>afternoon re-crawl</b>"></span><br>
        Method: Chrome fetch tuần tự · AbortController 12–15s
      </div>
    </div>
  </div>
</header>

<div class="wrap">


  <!-- date picker v2 (collapsible) -->
  <button class="pk-toggle" id="pkToggle" type="button" aria-expanded="false" aria-controls="pkWrap" onclick="pkFold()">
    <span class="lft"><span class="bar"></span>
      <span class="cap t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span>
      <span class="sel" id="pkToggleSel"></span></span>
    <span class="chev">&#9660;</span>
  </button>
  <div class="pk-wrap" id="pkWrap" hidden>
  <div class="pk-card">
    <div class="pk-title"><span class="bar"></span><span class="t" data-vi="Chọn ngày để xem báo cáo" data-en="Choose a day to view its report"></span></div>
    <p class="pk-sub t" data-vi="Chọn <b>một ngày</b> rồi bấm <b>Cập nhật</b> để mở đúng bản báo cáo đã lưu của ngày đó. Chọn <b>một khoảng ngày</b> để xem xu hướng trong khoảng. Ngày <b>có dấu chấm</b> là ngày đã quét và có báo cáo lưu; ngày làm mờ vẫn chọn được làm đầu/cuối khoảng, nhưng không có báo cáo riêng để mở." data-en="Pick <b>a single day</b> and press <b>Update</b> to open that day's saved report. Pick <b>a date range</b> to see the trend across it. Days <b>with a dot</b> were crawled and have a stored report; faded days can still anchor a range but have no report of their own."></p>
    <div class="pk-bar">
      <div class="dpwrap">
        <button class="dpbtn" id="dpBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>&#128197;</span><span id="dpLabel">Ngày 04/09/2026</span><span class="car">&#9660;</span>
        </button>
        <div class="dppane" id="dpPane" role="dialog">
          <div class="dp-presets" id="dpPresets"></div>
          <div class="dp-right">
            <div class="dp-nav">
              <button type="button" id="dpPrev" aria-label="prev">&#8249;</button>
              <div class="mtitle"><span id="dpM1"></span><span id="dpM2"></span></div>
              <button type="button" id="dpNext" aria-label="next">&#8250;</button>
            </div>
            <div class="dp-months"><div class="dp-m" id="dpG1"></div><div class="dp-m" id="dpG2"></div></div>
            <div class="dp-foot">
              <div class="dp-selinfo"><div class="d1" id="dpSelD"></div><div class="d2" id="dpSelInfo"></div></div>
              <div class="dp-actions">
                <button type="button" id="dpCancel" class="t" data-vi="Hủy" data-en="Cancel"></button>
                <button type="button" id="dpApply" class="go t" data-vi="Cập nhật" data-en="Update"></button>

      <div class="note"><span class="tag t" style="background:#eaf4ec;color:#2f6b3c" data-vi="88 &#8594; 87 — quét lại chiều nay bắt được cơ chế sinh bài mồ côi" data-en="88 &#8594; 87 — the afternoon re-crawl caught the mechanism that creates orphans"></span></div>
      <div class="delta t" data-vi="&#9654; <b>Bản này thay cho bản 04/09 phát hành sáng nay.</b> Quét lại lúc chiều 04/09 và <b>phát hiện một điều bản sáng không thể thấy được</b>: Health <b>88 &#8594; 87</b> (thô 87,10), do <b>Crawlability 80 &#8594; 78</b>. Giữa hai lần quét, DX Living đăng một bài mới (<code>3d-virtual-tour-off-the-plan-apartments</code>). Bài mới hoàn toàn đạt chuẩn — 2.963 từ, 4 khối JSON-LD kèm <code>FAQPage</code>, 26 internal link, không nhảy heading. <b>Nhưng số bài mồ côi lại tăng 15 &#8594; 16.</b> <b>Nguyên nhân đã truy được chính xác:</b> trang <code>/articles</code> chỉ hiện <b>7 bài mới nhất</b>. Bài mới chen vào đầu danh sách và <b>đẩy <code>landscape-design-melbourne</code> rơi khỏi danh sách</b>; bài đó <b>không còn bất kỳ link nội bộ nào khác</b> nên lập tức thành mồ côi. Đây không phải suy đoán — hai lần quét cách nhau vài giờ đã chụp được cả trước và sau. <b>Nghĩa là mỗi bài mới đăng lại đẻ thêm một bài mồ côi.</b> Lỗi P1 này <b>không đứng yên, nó đang lớn dần theo nhịp xuất bản</b>. Các mặt khác đều ổn: <b>99/99 trang trả 200</b>, sitemap 99 &#8594; <b>100 URL</b>, tổng số từ 201.814 &#8594; <b>204.862</b>, TTFB trung bình 941 &#8594; <b>932 ms</b>." data-en="&#9654; <b>This replaces the 4 Sep report published this morning.</b> The afternoon re-crawl found <b>something the morning pass could not see</b>: Health <b>88 &#8594; 87</b> (raw 87.10), driven by <b>Crawlability 80 &#8594; 78</b>. Between the two crawls DX Living published a new article (<code>3d-virtual-tour-off-the-plan-apartments</code>). It is fully compliant — 2,963 words, 4 JSON-LD blocks including <code>FAQPage</code>, 26 internal links, no heading skip. <b>Yet the orphan count rose 15 &#8594; 16.</b> <b>The cause has been traced exactly:</b> <code>/articles</code> shows only the <b>7 most recent</b> articles. The new piece entered at the top and <b>pushed <code>landscape-design-melbourne</code> off the list</b>; that article had <b>no other inbound internal link</b>, so it became an orphan the moment it dropped off. This is not inference — two crawls hours apart captured the before and the after. <b>It means every article published creates one more orphan.</b> This P1 <b>is not static; it grows with the publishing cadence</b>. Everything else holds: <b>99 of 99 pages return 200</b>, the sitemap moved 99 &#8594; <b>100 URLs</b>, site-wide words 201,814 &#8594; <b>204,862</b>, and mean TTFB 941 &#8594; <b>932 ms</b>."></div>

      <div class="delta t" data-vi="&#9650; 98 &#8594; <b>99 trang</b> · sitemap 99 &#8594; <b>100 URL</b> — <b>tăng hai lần trong cùng một ngày</b>, và cả hai lần đều là bài viết mới. Bài đăng trong buổi chiều: <code>/articles/3d-virtual-tour-off-the-plan-apartments</code> — <b>2.963 từ</b>, <b>4 khối JSON-LD</b> có <code>FAQPage</code>, <b>26 internal link</b>, heading sạch, TTFB 1.015 ms. <b>Về chất lượng thì đây là bài mẫu mực</b>, không tạo một lỗi kỹ thuật nào. Vấn đề nằm ở chỗ khác: chính việc đăng nó <b>đã đẩy một bài cũ thành mồ côi</b> — xem mục P1. Sức khoẻ crawl vẫn sạch tuyệt đối: <b>99/99 trả 200</b>, <b>0 timeout</b>, <b>0 link nội bộ gãy</b>, <b>99/99 trang có link về trang chủ</b>. Trang duy nhất ngoài sitemap vẫn là <code>/login</code>." data-en="&#9650; 98 &#8594; <b>99 pages</b> · sitemap 99 &#8594; <b>100 URLs</b> — <b>two increases within the same day</b>, both of them new articles. The afternoon publication: <code>/articles/3d-virtual-tour-off-the-plan-apartments</code> — <b>2,963 words</b>, <b>4 JSON-LD blocks</b> including <code>FAQPage</code>, <b>26 internal links</b>, clean headings, TTFB 1,015 ms. <b>On quality this is a model article</b> and introduces no technical defect. The problem sits elsewhere: publishing it <b>pushed an older article into orphan status</b> — see the P1 item. Crawl health remains spotless: <b>99 of 99 return 200</b>, <b>zero timeouts</b>, <b>zero broken internal links</b>, <b>all 99 link home</b>. The only page outside the sitemap is still <code>/login</code>."></div>

      <div class="delta t" data-vi="&#9660; 915 &#8594; <b>883 ms</b> nhóm trang gốc, và <b>đây chính là lý do phải thận trọng với kết luận buổi sáng</b>. Bản sáng ghi nhận trang chủ 1.255 ms và coi đó là dấu hiệu cải thiện; quét lại chiều nay <b>trang chủ trở lại 1.601 ms</b> — chậm hơn cả mức 1.650 ms của hôm qua không đáng kể. <b>Kết luận đúng: cải thiện tốc độ trang chủ sáng nay là nhiễu, không phải xu hướng.</b> Chính vì vậy bản sáng đã ghi rõ &quot;chưa chắc là kết quả tối ưu, cần 2–3 ngày quét nữa&quot; — và chỉ vài giờ sau điều đó đã được xác nhận. Trung bình nhóm gốc vẫn giảm (883 ms) nhưng <b>phần lớn là do các trang nhẹ nhanh lên</b>: <code>/login</code> 360 ms, <code>/start-interactive</code> 508 ms, <code>/suppliers</code> 614 ms, <code>/apply</code> 605 ms. Số trang gốc dưới 1 giây tăng <b>10 &#8594; 11/17</b>. Chậm nhất nhóm gốc: <b>trang chủ 1.601 ms</b>, <code>/model</code> 1.306, <code>/articles</code> 1.232, <code>/prestige</code> 1.131." data-en="&#9660; 915 &#8594; <b>883 ms</b> for core pages — and <b>this is exactly why the morning conclusion needed caution</b>. The morning pass recorded the homepage at 1,255 ms and read it as an improvement; this afternoon <b>the homepage is back at 1,601 ms</b>, barely below yesterday's 1,650 ms. <b>The correct conclusion: this morning's homepage gain was noise, not a trend.</b> That is precisely why the morning report said it was &quot;not necessarily an optimisation, two or three more crawls needed&quot; — and it was confirmed within hours. The core mean still fell (883 ms), but <b>mostly because the light pages got faster</b>: <code>/login</code> 360 ms, <code>/start-interactive</code> 508 ms, <code>/suppliers</code> 614 ms, <code>/apply</code> 605 ms. Core pages under one second rose <b>10 &#8594; 11 of 17</b>. Slowest core pages: the <b>homepage at 1,601 ms</b>, <code>/model</code> 1,306, <code>/articles</code> 1,232, <code>/prestige</code> 1,131."></div>

    <div class="kpi">
      <div class="lbl t" data-vi="TTFB TB — bài viết" data-en="Avg TTFB — articles"></div>
      <div class="val" style="color:var(--accent-dk)">0,94<span style="font-size:15px">s</span></div>
      <div class="note t" data-vi="Toàn bộ 76 bài · 0,74–1,37s · <b>50/76 bài &lt;1s</b>" data-en="All 76 articles · 0.74–1.37s · <b>50 of 76 under 1s</b>"></div>
      <div class="delta t" data-vi="&#9660; 957 &#8594; <b>944 ms</b> nhóm bài viết, nhưng &#9650; 811 &#8594; <b>920 ms</b> nhóm dự án (+13,4%). Toàn site 941 &#8594; <b>932 ms</b>. <b>So hai lần quét trong cùng một ngày cho thấy biên độ nhiễu thật của phép đo này: khoảng ±100 ms ở cấp nhóm.</b> Nhóm dự án chỉ có 6 trang nên rất nhạy — một trang chậm bất thường đủ kéo cả nhóm. Đây là thông tin quan trọng để đọc mọi báo cáo trước: <b>chênh lệch dưới ~100 ms giữa hai ngày không nên diễn giải là xu hướng.</b> Chỉ những thay đổi lớn hơn thế, hoặc lặp lại nhiều lần quét, mới đáng kết luận. Phân bố hôm nay: <b>66 trang &lt;1s</b>, <b>33 trang 1–3s</b>, <b>0 trang &gt;3s</b>. Dải toàn site <b>360–1.601 ms</b>. Chậm nhất nhóm bài: <code>choosing-the-best-home-builder</code> 1.369 ms, <code>what-is-bim-3d-modeling</code> 1.350, <code>interior-finishes</code> 1.242. <b>Chuỗi 0 trang trên 3 giây vẫn được giữ</b> — đây mới là chỉ số ổn định thật sự." data-en="&#9660; 957 &#8594; <b>944 ms</b> for articles, but &#9650; 811 &#8594; <b>920 ms</b> for project pages (+13.4%). Site-wide 941 &#8594; <b>932 ms</b>. <b>Comparing two crawls on the same day reveals the real noise band of this measurement: roughly ±100 ms at group level.</b> The project group holds only 6 pages, so it is highly sensitive — one unusually slow page drags the whole average. This matters for reading every earlier report: <b>a gap under ~100 ms between two days should not be read as a trend.</b> Only larger moves, or ones repeated across several crawls, justify a conclusion. Today's distribution: <b>66 pages &lt;1s</b>, <b>33 in the 1&#8211;3s band</b>, <b>0 above 3s</b>. The site-wide range is <b>360&#8211;1,601 ms</b>. Slowest articles: <code>choosing-the-best-home-builder</code> 1,369 ms, <code>what-is-bim-3d-modeling</code> 1,350, <code>interior-finishes</code> 1,242. <b>The zero-pages-over-3-seconds run continues</b> — that is the genuinely stable metric."></div>

      <div class="delta t" data-vi="<b>97/99 trang có schema</b> (97,98%) và <b>hệ số nhân bản vẫn đúng 1,0&#215;</b>. <b>FAQPage 64/76 bài (84,2%)</b> — bài mới đăng chiều nay đã kèm sẵn <code>FAQPage</code>, nên tỷ lệ nhích lên thay vì giảm. <b>Điều này đáng ghi nhận:</b> template và quy trình xuất bản hiện tại <b>đang sinh ra bài đạt chuẩn schema ngay từ lần đăng đầu</b> — hai bài mới trong ngày hôm nay đều có đủ <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> + <code>FAQPage</code>. Nợ schema vì vậy <b>không còn tăng thêm</b>. <b>12 bài thiếu <code>FAQPage</code> vẫn y nguyên danh sách cũ</b> và vẫn nằm gọn trong cụm project-management/BIM viết cùng đợt — đây là <b>nợ tồn kho cố định, không phải nợ đang lớn</b>, nên xử lý một lô là dứt điểm. Hai trang không phát JSON-LD vẫn là <code>/start-interactive</code> và <code>/login</code>." data-en="<b>97 of 99 pages carry schema</b> (97.98%) and the <b>duplication factor stays at exactly 1.0&#215;</b>. <b>FAQPage 64 of 76 (84.2%)</b> — the article published this afternoon shipped with <code>FAQPage</code> already in place, so coverage edged up rather than down. <b>That is worth recording:</b> the current template and publishing process <b>produce schema-complete articles on first publication</b> — both of today's new articles carry the full <code>Article</code> + <code>BreadcrumbList</code> + <code>BlogPosting</code> + <code>FAQPage</code> set. The schema debt is therefore <b>no longer growing</b>. <b>The 12 articles missing <code>FAQPage</code> are exactly the same list as before</b> and still sit inside the project-management/BIM batch — this is <b>a fixed backlog, not an expanding one</b>, so one batch clears it permanently. The two pages emitting no JSON-LD remain <code>/start-interactive</code> and <code>/login</code>."></div>

          <div class="foot t" style="margin-top:10px" data-vi="<b>Đọc kỹ hơn con số:</b> 33 trang trong dải 1–3 giây, tăng từ 30 hồi sáng, và trang chậm nhất đi từ 1.324 lên <b>1.601 ms</b>. <b>Nhưng đừng đọc đây là site chậm đi trong một buổi chiều.</b> Hai lần quét cách nhau vài giờ trên cùng một site gần như không đổi đã cho thấy <b>biên độ dao động thật của phép đo</b>: trang chủ 1.255 &#8594; 1.601 ms, nhóm dự án 811 &#8594; 920 ms, trong khi <b>trung bình toàn site chỉ nhúc nhích 941 &#8594; 932 ms</b>. <b>Bài học đo lường:</b> con số trung bình toàn site ổn định hơn nhiều so với từng trang hoặc từng nhóm nhỏ. Khi đọc các báo cáo trước, nên tin vào <b>trung bình toàn site và số trang vượt ngưỡng</b>, và <b>bỏ qua chênh lệch dưới ~100 ms ở cấp nhóm</b>. <b>Chỉ số thật sự ổn định và thật sự tốt: 0 trang trên 3 giây</b>, giữ liên tục sang tuần thứ tư." data-en="<b>Reading past the number:</b> 33 pages sit in the 1&#8211;3 second band, up from 30 this morning, and the slowest page moved from 1,324 to <b>1,601 ms</b>. <b>But do not read this as the site slowing down over one afternoon.</b> Two crawls hours apart on a site that barely changed have exposed <b>the true variance of the measurement</b>: the homepage 1,255 &#8594; 1,601 ms, project pages 811 &#8594; 920 ms, while <b>the site-wide mean barely moved, 941 &#8594; 932 ms</b>. <b>The measurement lesson:</b> the site-wide mean is far more stable than any individual page or small group. When reading earlier reports, trust <b>the site-wide mean and the count of pages over a threshold</b>, and <b>disregard group-level gaps under ~100 ms</b>. <b>The genuinely stable and genuinely good metric: zero pages above 3 seconds</b>, now held continuously into a fourth week."></div>
        </div>
      </div>
    </div>

  <!-- Insights -->
  <h2 class="sec t" data-vi="Hướng đi &amp; Insight ưu tiên" data-en="Direction &amp; Priority insights"></h2>

  <div class="ins p1">
    <div class="prio t" data-vi="P1 · ĐÃ TRUY RA CƠ CHẾ · mỗi bài đăng mới đẻ thêm một bài mồ côi" data-en="P1 · MECHANISM PROVEN · every new article creates one more orphan"></div>
    <p class="t" data-vi="<b>Lần quét lại chiều nay đã bắt được lỗi này đang xảy ra trực tiếp.</b> Sáng nay site có 75 bài, 15 bài mồ côi. Chiều nay có 76 bài, <b>16 bài mồ côi</b>. Bài mới <code>3d-virtual-tour-off-the-plan-apartments</code> <b>không</b> phải bài mồ côi đó — nó có 26 internal link và nằm đầu danh sách. <b>Bài vừa thành mồ côi là <code>landscape-design-melbourne</code>.</b> Sáng nay nó nằm trong 7 bài hiển thị trên <code>/articles</code>; chiều nay bài mới chen vào, đẩy nó rơi khỏi danh sách, và <b>nó không còn một link nội bộ nào khác trên toàn site</b>. <b>Cơ chế vì vậy đã rõ ràng, không còn là suy đoán:</b> <code>/articles</code> chỉ render <b>7 bài mới nhất</b>, không phân trang. Danh sách này là <b>nguồn link nội bộ duy nhất</b> của phần lớn bài viết. Nên mỗi lần đăng bài mới, <b>một bài cũ bị đẩy ra và mất toàn bộ link nội bộ</b>. <b>Hệ quả:</b> đây không phải lỗi tĩnh 15–16 bài. Với nhịp đăng hiện tại (2 bài chỉ trong ngày 04/09), <b>số bài mồ côi sẽ tăng gần như một-đổi-một theo số bài xuất bản</b>. Càng sản xuất nội dung tốt, càng nhiều bài cũ bị chôn. <b>Cách sửa vẫn như cũ và vẫn chỉ là một thay đổi:</b> bật phân trang hoặc render đủ 76 link phía server trên <code>/articles</code>. Sửa xong thì <b>toàn bộ 16 bài mồ côi được gỡ cùng lúc</b> và cơ chế sinh mồ côi <b>dừng vĩnh viễn</b>. Đây là việc đáng làm trước mọi việc khác trong báo cáo này." data-en="<b>The afternoon re-crawl caught this defect in the act.</b> This morning the site had 75 articles and 15 orphans. This afternoon it has 76 articles and <b>16 orphans</b>. The new article, <code>3d-virtual-tour-off-the-plan-apartments</code>, is <b>not</b> the orphan — it carries 26 internal links and sits at the top of the list. <b>The newly orphaned article is <code>landscape-design-melbourne</code>.</b> This morning it was one of the 7 shown on <code>/articles</code>; this afternoon the new piece pushed it off the list, and <b>it has no other inbound internal link anywhere on the site</b>. <b>The mechanism is therefore established, not inferred:</b> <code>/articles</code> renders only the <b>7 most recent</b> articles with no pagination. That list is <b>the sole source of internal links</b> for most articles. So each new publication <b>pushes an older article out and strips its internal links entirely</b>. <b>The implication:</b> this is not a static 15-to-16 article problem. At the current cadence (two articles on 4 Sep alone), <b>the orphan count will grow roughly one-for-one with articles published</b>. The better the content output, the more old articles get buried. <b>The fix is unchanged and still a single change:</b> add pagination, or render all 76 links server-side on <code>/articles</code>. Doing so <b>clears all 16 orphans at once</b> and <b>permanently stops</b> the orphan-generating mechanism. This deserves priority over everything else in this report."></p>
  </div>

  <div class="ins win">
    <div class="prio t" data-vi="&#9888; ĐÍNH CHÍNH · &quot;trang chủ nhanh hơn 24%&quot; của bản sáng là nhiễu, không phải cải thiện" data-en="&#9888; CORRECTION · the morning report's &quot;homepage 24% faster&quot; was noise, not an improvement"></div>
    <p class="t" data-vi="<b>Bản 04/09 buổi sáng ghi nhận trang chủ 1.650 &#8594; 1.255 ms (&#8722;23,9%) và trang chậm nhất site giảm còn 1.324 ms.</b> Bản đó đã nêu rõ đây <b>chưa chắc là kết quả tối ưu</b> và cần thêm 2–3 ngày quét để xác nhận. <b>Quét lại chỉ vài giờ sau đã bác bỏ luôn:</b> trang chủ trở lại <b>1.601 ms</b>, trang chậm nhất site cũng chính là nó. Không có ai sửa gì, và cũng không có gì tốt lên — <b>đơn giản là phép đo TTFB một-lần-một-trang dao động mạnh hơn mức nhiều người giả định</b>. <b>Con số nhiễu đo được hôm nay:</b> trang chủ lệch <b>346 ms</b> giữa hai lần quét; nhóm trang dự án lệch <b>109 ms</b>; nhưng <b>trung bình toàn site chỉ lệch 9 ms</b> (941 so 932). <b>Vì vậy quy tắc đọc báo cáo từ nay:</b> tin vào <b>trung bình toàn site</b>, <b>số trang vượt 1 giây</b> và <b>số trang vượt 3 giây</b>; <b>không kết luận từ TTFB của một trang đơn lẻ</b> trừ khi chênh lệch lớn và lặp lại qua nhiều ngày. <b>Đây là điểm cộng cho quy trình:</b> chính vì bản sáng không vội tuyên bố thắng lợi mà ghi rõ giới hạn, nên hôm nay không phải rút lại một kết luận sai." data-en="<b>The morning 4 Sep report recorded the homepage at 1,650 &#8594; 1,255 ms (&#8722;23.9%) and the slowest page on the site down to 1,324 ms.</b> That report explicitly said this was <b>not necessarily an optimisation</b> and needed two or three more crawls to confirm. <b>A re-crawl just hours later refuted it:</b> the homepage is back at <b>1,601 ms</b> and is once again the slowest page on the site. Nobody changed anything, and nothing actually improved — <b>single-shot per-page TTFB simply varies more than is usually assumed</b>. <b>The variance measured today:</b> the homepage differed by <b>346 ms</b> between the two crawls; the project group by <b>109 ms</b>; but <b>the site-wide mean differed by only 9 ms</b> (941 versus 932). <b>So the rule for reading these reports from now on:</b> trust the <b>site-wide mean</b>, the <b>count of pages over one second</b> and the <b>count over three seconds</b>; <b>do not draw conclusions from a single page's TTFB</b> unless the gap is large and repeats across several days. <b>This is a point in the process's favour:</b> because the morning report stated its limits instead of claiming a win, nothing false had to be retracted today."></p>
  </div>

  <div class="ins win">
    <div class="prio t" data-vi="&#10003; THẮNG · 2 bài mới trong một ngày, cả hai đạt chuẩn ngay từ lần đăng đầu" data-en="&#10003; WIN · two articles published in one day, both fully compliant on first publication"></div>
    <p class="t" data-vi="<b>99 trang — mức cao nhất chuỗi, và là ngày đầu tiên site tăng hai bậc trong cùng 24 giờ.</b> Hai bài mới: <code>how-to-choose-a-3d-rendering-company-australia</code> (2.639 từ, 5 khối JSON-LD) và <code>3d-virtual-tour-off-the-plan-apartments</code> (2.963 từ, 4 khối JSON-LD). <b>Điểm quan trọng: cả hai đều sạch hoàn toàn về kỹ thuật ngay từ lần đăng đầu tiên</b> — đủ <code>FAQPage</code>, đúng một <code>h1</code>, đủ title/meta/canonical, không nhảy heading, 25–26 internal link, độ dài trên 2.600 từ. <b>Nghĩa là quy trình xuất bản hiện tại không còn sinh thêm nợ kỹ thuật.</b> Mọi vấn đề còn lại trong báo cáo này đều là <b>tồn kho cũ</b>: 12 bài thiếu FAQPage, 6 trang dự án mỏng, 4 tiêu đề dài. Các con số đó <b>đứng yên</b> chứ không tăng. <b>Nền kỹ thuật vẫn giữ sạch sang tuần thứ tư:</b> JSON-LD nhân bản <b>1,0&#215;</b> trên cả 99 trang; <b>99/99 trang đúng một <code>h1</code></b>; title, meta description, canonical <b>đủ 99/99</b>; <b>99/99 trả 200</b>, 0 timeout, 0 link nội bộ gãy, 99/99 có link về trang chủ; <b>0 trang trên 3 giây</b>. <b>Đối chiếu hai mặt:</b> đội nội dung đang chạy tốt và đúng chuẩn; nút thắt duy nhất nằm ở <b>một template listing chưa được sửa</b> — và chính nó đang làm hỏng giá trị của nội dung mới." data-en="<b>99 pages — a series high, and the first day the site grew twice within 24 hours.</b> Two new articles: <code>how-to-choose-a-3d-rendering-company-australia</code> (2,639 words, 5 JSON-LD blocks) and <code>3d-virtual-tour-off-the-plan-apartments</code> (2,963 words, 4 JSON-LD blocks). <b>The important part: both are technically clean on first publication</b> — <code>FAQPage</code> present, exactly one <code>h1</code>, title/meta/canonical complete, no heading skips, 25&#8211;26 internal links, and over 2,600 words each. <b>That means the current publishing process no longer adds technical debt.</b> Every remaining issue in this report is <b>legacy backlog</b>: 12 articles without FAQPage, 6 thin project pages, 4 long titles. Those numbers are <b>static</b>, not growing. <b>The technical baseline holds clean into a fourth week:</b> JSON-LD duplication at <b>1.0&#215;</b> across all 99 pages; <b>99 of 99 with exactly one <code>h1</code></b>; title, meta description and canonical at <b>99 of 99</b>; <b>99 of 99 returning 200</b>, zero timeouts, zero broken internal links, all 99 linking home; <b>zero pages above 3 seconds</b>. <b>Setting the two sides against each other:</b> the content team is running well and to standard; the single bottleneck is <b>one unfixed listing template</b> — and it is actively destroying the value of that new content."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · TTFB: hạ cấp từ &quot;xu hướng xấu đi&quot; xuống &quot;chưa kết luận được&quot;" data-en="P2 · TTFB: downgraded from &quot;worsening trend&quot; to &quot;not yet conclusive&quot;"></div>
    <p class="t" data-vi="<b>Trung bình toàn site 941 &#8594; 932 ms giữa hai lần quét cùng ngày.</b> Ba lần quét trước đó (27/08, 28/08, 03/09, 04/09 sáng) cho thấy trung bình đi lên liên tục, và bản sáng đã xếp việc này là P2 với ghi chú &quot;tăng thêm hai lần quét nữa thì nâng lên P1&quot;. <b>Lần quét chiều nay buộc phải hạ mức cảnh báo đó xuống.</b> Lý do: khi đo lại cùng một site gần như không đổi chỉ vài giờ sau, <b>trung bình toàn site đi xuống chứ không đi lên</b>, và biên độ dao động ở cấp trang lên tới 346 ms. Với biên độ đó, chuỗi &quot;862 &#8594; 924 &#8594; 941 ms&quot; mà bản sáng coi là xu hướng <b>nằm gọn trong vùng nhiễu</b> và <b>không đủ cơ sở để gọi là xu hướng xấu đi</b>. <b>Cách theo dõi đúng từ nay:</b> chỉ dựa vào <b>trung bình toàn site</b> và <b>số trang vượt 1 giây</b>, và cần <b>ít nhất 4–5 lần quét cùng chiều</b> mới kết luận. Nếu có thể, nên đo mỗi trang <b>2–3 lần và lấy trung vị</b> thay vì một lần như hiện nay. <b>Điều vẫn chắc chắn:</b> <b>0 trang trên 3 giây</b> suốt bốn tuần, và <b>không trang nào chạm 2 giây</b> trong cả hai lần quét hôm nay. Về mặt trải nghiệm thực tế, tốc độ site <b>đang ở mức chấp nhận được và ổn định</b>." data-en="<b>The site-wide mean moved 941 &#8594; 932 ms between two crawls on the same day.</b> The preceding crawls (27 Aug, 28 Aug, 3 Sep, 4 Sep morning) showed the mean rising steadily, and the morning report logged this as a P2 with the note &quot;escalate to P1 if it rises twice more&quot;. <b>This afternoon's crawl forces that warning to be downgraded.</b> The reason: re-measuring an essentially unchanged site a few hours later produced <b>a mean that fell rather than rose</b>, with per-page variance as high as 346 ms. At that level of variance, the &quot;862 &#8594; 924 &#8594; 941 ms&quot; sequence the morning report treated as a trend <b>sits inside the noise band</b> and <b>does not support calling it a worsening trend</b>. <b>The correct way to track it from now on:</b> rely only on the <b>site-wide mean</b> and the <b>count of pages over one second</b>, and require <b>at least four or five crawls moving the same way</b> before concluding. Where possible, measure each page <b>two or three times and take the median</b> rather than once as now. <b>What remains certain:</b> <b>zero pages above 3 seconds</b> for four weeks, and <b>no page reached even 2 seconds</b> in either crawl today. In real user terms the site's speed is <b>acceptable and steady</b>."></p>
  </div>

  <div class="ins p2">
    <div class="prio t" data-vi="P2 · Không đổi · template dự án vẫn nhảy H1 &#8594; H3 và vẫn đúng 248 từ" data-en="P2 · Unchanged · the project template still jumps H1 &#8594; H3 and still sits at exactly 248 words"></div>

    <p class="t" data-vi="<b>Health 88 &#8594; 87/100.</b> Bản này thay bản 04/09 buổi sáng. Một điểm mất đi <b>không phải vì site xấu đi trong buổi chiều</b>, mà vì lần quét lại <b>chứng minh được một cơ chế mà trước đó chỉ nghi ngờ</b>. <b>(1) Sửa <code>/articles</code> để lộ đủ 76 bài — nay là việc GẤP, không còn chỉ là việc quan trọng.</b> Lý do đã đổi: trước đây là &quot;15 bài không có link nội bộ&quot;; nay là &quot;<b>mỗi bài đăng mới lại chôn thêm một bài cũ</b>&quot;. Với nhịp 2 bài/ngày như hôm nay, nợ này tăng nhanh hơn tốc độ sửa thủ công. Một thay đổi template gỡ cả <b>16 bài mồ côi</b> và <b>chặn đứng cơ chế</b>. <b>(2) Đổi <code>h3</code> thành <code>h2</code> trong template trang dự án</b> — dọn 6/15 trang nhảy bậc, <b>dưới 15 phút</b>. <b>(3) Viết nội dung cho 6 trang dự án</b> — 248 lên 600+ từ; ảnh, alt, schema, internal link đã sẵn, chỉ thiếu chữ. Làm chung với (2). <b>(4) Bổ sung <code>FAQPage</code> cho 12 bài</b> — danh sách cố định, không tăng, xử lý một lô là xong. <b>(5) Thêm <code>alt</code> cho ảnh logo trong template</b> (một dòng, sạch 99 trang) và cắt 4 tiêu đề dài. <b>Đã gỡ khỏi danh sách theo dõi:</b> (a) cảnh báo TTFB xấu đi — <b>hạ cấp</b>, vì hai lần quét cùng ngày cho thấy chuỗi tăng nằm trong vùng nhiễu; (b) link nội bộ giảm ~5 — <b>đã ổn định</b>, chỉ cần xác nhận là cố ý. <b>Về quy trình đo:</b> nên chuyển sang <b>đo mỗi trang 2–3 lần lấy trung vị</b> thay vì một lần. Hôm nay cho thấy TTFB một-lần-một-trang lệch tới <b>346 ms</b> giữa hai lần quét, đủ để tạo ra kết luận sai nếu chỉ nhìn một trang." data-en="<b>Health 88 &#8594; 87/100.</b> This replaces the 4 Sep morning report. The lost point is <b>not because the site degraded over the afternoon</b>, but because the re-crawl <b>proved a mechanism that had previously only been suspected</b>. <b>(1) Fix <code>/articles</code> so it exposes all 76 articles — now URGENT rather than merely important.</b> The reason has changed: it used to be &quot;15 articles have no internal links&quot;; it is now &quot;<b>every new publication buries another old article</b>&quot;. At today's rate of two articles a day, this debt grows faster than it can be patched by hand. One template change clears all <b>16 orphans</b> and <b>stops the mechanism</b>. <b>(2) Change <code>h3</code> to <code>h2</code> in the project template</b> — clears 6 of the 15 skip pages, <b>under 15 minutes</b>. <b>(3) Write real content for the 6 project pages</b> — 248 to 600+ words; images, alt text, schema and links are already there, only the prose is missing. Bundle with (2). <b>(4) Backfill <code>FAQPage</code> on the 12 articles</b> — a fixed list that is not growing; one batch closes it. <b>(5) Add <code>alt</code> to the template logo image</b> (one line, clears 99 pages) and trim the 4 long titles. <b>Removed from the watch list:</b> (a) the worsening-TTFB warning is <b>downgraded</b>, because two crawls on one day show the rising sequence sits inside the noise band; (b) the ~5-link drop has <b>stabilised</b> and only needs confirming as intentional. <b>On measurement process:</b> switch to <b>measuring each page two or three times and taking the median</b> rather than once. Today showed single-shot per-page TTFB varying by up to <b>346 ms</b> between crawls — enough to produce a false conclusion from any single page."></p>

/* generic multi-series line chart -> inline SVG string */
function trChart(rows, series, opts){
  opts = opts || {};
  const W=520, H=opts.h||210, L=42, R=12, TP=14, BT=30;
  const iw=W-L-R, ih=H-TP-BT;
  let vals=[]; series.forEach(s=>rows.forEach(r=>{const v=r[s.i]; if(v!==null&&v!==0||s.zero)vals.push(v);}));
  let lo = opts.min!==undefined?opts.min:Math.min.apply(null,vals);
  let hi = opts.max!==undefined?opts.max:Math.max.apply(null,vals);
  if(hi===lo){hi=lo+1;}
  const pad=(hi-lo)*0.12; lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=>L+(rows.length<2?iw/2:i*iw/(rows.length-1));
  const Y=v=>TP+ih-(v-lo)/(hi-lo)*ih;
  const loc = LANG==='vi'?'vi-VN':'en-US';
  let g='';
  /* gridlines + y labels */
  const TICKS=4;
  for(let t=0;t<=TICKS;t++){
    const v=lo+(hi-lo)*t/TICKS, y=Y(v);
    g+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" ${t?'stroke-dasharray="3 4"':''}/>`;
    g+=`<text x="${L-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">${Math.round(v).toLocaleString(loc)}</text>`;
  }
  /* x labels: first, last and every other */
  rows.forEach((r,i)=>{
    if(i!==0 && i!==rows.length-1 && i%2) return;
    g+=`<text x="${X(i).toFixed(1)}" y="${H-11}" text-anchor="middle" font-size="9" fill="var(--muted)">${trFmt(r[0])}</text>`;
  });
  /* series */
  series.forEach(s=>{
    const pts=[];
    rows.forEach((r,i)=>{const v=r[s.i]; if(v===null||(v===0&&!s.zero))return; pts.push([X(i),Y(v),v,r[0]]);});
    if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area){
      g+=`<path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${TP+ih} L ${pts[0][0].toFixed(1)} ${TP+ih} Z" fill="${s.c}" opacity=".10"/>`;
    }
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{
      g+=`<circle class="tr-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.w>2?3:2.4}" fill="var(--card)" stroke="${s.c}" stroke-width="1.8"><title>${s.n} · ${trFmt(p[3])}: ${p[2].toLocaleString(loc)}${opts.unit||''}</title></circle>`;
    });
    /* value label on the last point */
    if(s.last!==false){
      const lp=pts[pts.length-1];
      g+=`<text x="${(lp[0]+6).toFixed(1)}" y="${(lp[1]-6).toFixed(1)}" font-size="10.5" font-weight="700" fill="${s.c}">${lp[2].toLocaleString(loc)}</text>`;
    }
  });
  const lg=series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('');
  return `<svg class="tr-svg" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tr-lg">${lg}</div>`;
}

function pkMonth(base,off){
  const d=new Date(base.getFullYear(), base.getMonth()+off, 1);
  const y=d.getFullYear(), m=d.getMonth();
  const start=new Date(y,m,1).getDay(); // 0=Sun
  const days=new Date(y,m+1,0).getDate();
  let cells=pkL().dow.map(x=>`<div class="dp-dow">${x}</div>`).join('');
  for(let i=0;i<start;i++) cells+='<button class="dp-d blank" disabled></button>';
  for(let dd=1;dd<=days;dd++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const has=!!PK_MAP[iso];
    const sel=iso===PK_DRAFT.s||iso===PK_DRAFT.e;
    const inr=pkIn(iso,PK_DRAFT.s,PK_DRAFT.e)&&!sel;
    const edge=iso===PK_DRAFT.s&&PK_DRAFT.s!==PK_DRAFT.e?' edge-l':(iso===PK_DRAFT.e&&PK_DRAFT.s!==PK_DRAFT.e?' edge-r':'');
    cells+=`<button type="button" class="dp-d${has?' has':''}${inr?' inrange':''}${sel?' sel'+edge:''}" data-iso="${iso}">${dd}${has?'<span class="dot"></span>':''}</button>`;
  }
  return {title:`${pkL().months[m]} ${y}`, html:`<div class="dp-grid">${cells}</div>`};
}

function pkRenderCal(){
  if(!PK_VIEW){ PK_VIEW=pkD(PK_SEL.e); PK_VIEW.setDate(1); PK_VIEW.setMonth(PK_VIEW.getMonth()-1); }
  const a=pkMonth(PK_VIEW,0), b=pkMonth(PK_VIEW,1);
  document.getElementById('dpM1').textContent=a.title;
  document.getElementById('dpM2').textContent=b.title;
  document.getElementById('dpG1').innerHTML=a.html;
  document.getElementById('dpG2').innerHTML=b.html;
  document.querySelectorAll('#dpG1 .dp-d,#dpG2 .dp-d').forEach(el=>{
    if(el.classList.contains('blank')) return;
    el.addEventListener('click',()=>{
      const iso=el.dataset.iso;
      if(!PK_PENDING){ PK_DRAFT={s:iso,e:iso}; PK_PENDING=true; }
      else { PK_DRAFT = iso<PK_DRAFT.s ? {s:iso,e:PK_DRAFT.s} : {s:PK_DRAFT.s,e:iso}; PK_PENDING=false; }
      PK_PRESET=null; pkRenderCal(); pkRenderPresets();
    });
  });
  const single=PK_DRAFT.s===PK_DRAFT.e;
  document.getElementById('dpSelD').textContent = single?pkFmt(PK_DRAFT.s):`${pkFmt(PK_DRAFT.s)} → ${pkFmt(PK_DRAFT.e)}`;
  const n=pkCount(PK_DRAFT.s,PK_DRAFT.e);
  document.getElementById('dpSelInfo').textContent = n===0 ? pkL().noRep : pkL().saved(n);
}

function pkRenderQuick(){
  const box=document.getElementById('dpQuick'); if(!box) return;
  const chips=PK_SNAPS.slice().reverse().map(s=>{
    const cur=s.date===PK_SEL.s&&PK_SEL.s===PK_SEL.e;
    const lb=LANG==='vi'?(s.label_vi||''):(s.label_en||'');
    return `<button type="button" class="qchip${cur?' cur':''}" data-iso="${s.date}">
      <span class="qd">${pkFmt(s.date)}</span><span class="ql">${lb}</span></button>`;
  }).join('');
  box.innerHTML=`<span class="pk-quick-lbl">${pkL().quick}</span>`+chips;
  box.querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('cur')) return;
    pkGo(b.dataset.iso,b.dataset.iso);
  }));
}

function pkRenderNow(){
  const el=document.getElementById('dpNow'); if(!el) return;
  const single=PK_SEL.s===PK_SEL.e;
  el.textContent = !single ? pkL().trend(pkFmt(PK_SEL.s),pkFmt(PK_SEL.e))
    : (PK_SEL.s===PK_TODAY ? pkL().now(pkFmt(PK_SEL.s)) : pkL().viewing(pkFmt(PK_SEL.s)));
  document.getElementById('dpLabel').textContent = single
    ? `${pkL().day} ${pkFmt(PK_SEL.s)}` : `${pkL().range} ${pkFmt(PK_SEL.s)} → ${pkFmt(PK_SEL.e)}`;
}

function pkGo(s,e){
  if(s===e){
    const snap=PK_MAP[s];
    if(snap && s!==PK_TODAY){ location.href=PK_BASE+snap.report; return; }
    PK_SEL={s,e}; PK_DRAFT={s,e}; PK_PRESET=null;
    document.getElementById('dpTrend').classList.remove('on');
    pkRenderNow(); pkRenderQuick(); pkRenderCal();
    return;
  }
  PK_SEL={s,e}; pkRenderNow(); pkRenderQuick(); pkTrend(s,e);
}

function pkTrend(s,e){
  const box=document.getElementById('dpTrend');
  const days=PK_SNAPS.filter(x=>pkIn(x.date,s,e));
  if(!days.length){ box.classList.remove('on'); box.innerHTML=''; return; }
  Promise.all(days.map(d=>fetch(PK_BASE+d.data,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)))
   .then(js=>{
     const rows=js.map((j,i)=>({date:days[i].date, rep:days[i].report, hs:j&&j.health_score, pg:j&&j.pages_measured}))
                  .filter(r=>r.hs!=null);
     box.innerHTML=`<h4>${pkL().trendTitle(pkFmt(s),pkFmt(e))}</h4>`+rows.map(r=>`
       <div class="trd"><span class="tdate">${pkFmt(r.date)}</span>
         <span class="ttrack"><span class="tfill" style="width:${r.hs}%"></span></span>
         <span class="tval">${r.hs}</span>
         <span class="tlink" data-h="${r.rep}">${pkL().open} &#8594;</span></div>`).join('');
     box.classList.add('on');
     box.querySelectorAll('.tlink').forEach(a=>a.addEventListener('click',()=>{
       const h=a.dataset.h; if(h && h!=='index.html') location.href=PK_BASE+h;
     }));
   });
}

function pkRender(){ pkRenderPresets(); pkRenderCal(); pkRenderQuick(); pkRenderNow(); pkToggleLabel(); }

(function pkInit(){
  const btn=document.getElementById('dpBtn'), pane=document.getElementById('dpPane');
  if(!btn) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=pane.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
    if(open){ PK_DRAFT={...PK_SEL}; PK_PENDING=false; pkRenderCal(); pkRenderPresets(); }
  });
  document.addEventListener('click',e=>{
    if(!pane.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') pane.classList.remove('open'); });
  document.getElementById('dpPrev').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()-1); pkRenderCal(); });
  document.getElementById('dpNext').addEventListener('click',()=>{ PK_VIEW.setMonth(PK_VIEW.getMonth()+1); pkRenderCal(); });
  document.getElementById('dpCancel').addEventListener('click',()=>{
    PK_DRAFT={...PK_SEL}; PK_PENDING=false; PK_PRESET=null;
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false'); pkRenderCal();
  });
  document.getElementById('dpApply').addEventListener('click',()=>{
    pane.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    pkGo(PK_DRAFT.s,PK_DRAFT.e);
  });
  fetch(PK_BASE+'data/index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    PK_SNAPS=(j.snapshots||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s);
    pkRender();
  }).catch(()=>{
    PK_SNAPS=[{date:PK_TODAY,report:'index.html',data:'data/'+PK_TODAY+'.json',label_vi:'Bản hiện tại',label_en:'Current report'}];
    PK_SNAPS.forEach(s=>PK_MAP[s.date]=s); pkRender();
  });
})();

setLang('en');
</script>
